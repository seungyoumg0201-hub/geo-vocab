<script type="application/json" id="psg">[{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"[답사 기록] 영월 동강 일대를 답사하였다. 하천은 산지 사이를 깊게 파고들며 구불구불 흐르고 있었고, 하천 양안의 높은 곳에서는 둥근 자갈이 섞인 평탄면이 계단 모양으로 나타났다. 안내자는 이 평탄면이 과거의 하상이었으며 현재는 밭과 취락으로 이용된다고 설명하였다. 이 하천과 같이 산지를 깊게 파고 흐르는 곡류 하천을 ( ㉠ ), 하천 양안의 계단 모양 평탄면을 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["감입 곡류 하천","감입 곡류","감입곡류천"]},{"l":"㉡","a":["하안 단구","하안단구"]}],"task":"㉡의 형성 과정을 지반 운동과 관련지어 서술하시오.","model":"과거 하천 바닥이나 범람원이던 곳이 지반 융기로 하천의 하방 침식이 강화되면서 하상이 낮아져, 과거 하상이 하천 양안에 계단 모양으로 남아 형성되었다. 둥근 자갈은 이곳이 과거 하상이었음을 보여 준다.","rubric":["지반 융기","하방 침식","과거 하상","둥근 자갈"],"wrongs":[{"a":"자유 곡류 하천","why":"자유 곡류는 넓은 충적 평야 위를 흐르며 유로 변경이 잦다. 산지를 깊게 파고 흐르는 것은 감입 곡류."},{"a":"해안 단구","why":"해안 단구는 파식대가 융기한 해안 지형. 하천 양안의 계단 지형은 하안 단구."}],"rel":["감입 곡류 하천","하안 단구"],"id":"p000"},{"subj":"자연지리","cat":"지형학","type":"지도·자료 해석","text":"하천이 산지에서 평지로 나오는 곡구에서 유속이 갑자기 느려지면서 운반 물질이 부채꼴로 쌓인 지형이 있다. 이 지형의 정점부에서 중앙부에 이르는 지역은 하천이 지하로 스며들어 흐르는 ( ㉠ ) 현상이 나타나 밭이나 과수원으로 이용되고, 말단부에서는 지하수가 솟아나 취락이 입지하고 논농사가 이루어진다.","blanks":[{"l":"㉠","a":["복류","복류 현상"]}],"task":"이 지형의 말단부에 취락이 입지하는 이유를 퇴적물의 입자 크기와 관련지어 서술하시오.","model":"선상지는 정점에서 말단으로 갈수록 퇴적물 입자가 작아지는데, 중앙부의 굵은 물질 사이로 스며든 하천수가 입자가 작아 투수성이 낮은 말단부에서 용천으로 솟아나므로, 물을 얻기 쉬운 말단부(선단)에 취락과 논이 입지한다.","rubric":["입자 크기 감소","복류","용천","물 확보"],"wrongs":[{"a":"용천","why":"용천은 말단부(선단)에서 지하수가 솟는 현상으로 중앙부의 특징이 아님."}],"rel":["선상지","선앙","선단"],"id":"p001"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"동해안의 경포호, 화진포 등은 과거 만(灣)이었던 곳의 입구가 ( ㉠ )에 의해 막히면서 형성된 호수이다. 이러한 호수를 ( ㉡ )(이)라고 하며, 시간이 지나면서 점차 면적이 축소되고 있다.","blanks":[{"l":"㉠","a":["사주","연안 사주"]},{"l":"㉡","a":["석호"]}],"task":"㉡의 면적이 점차 축소되는 이유를 서술하시오.","model":"석호로 유입하는 하천이 운반한 토사가 계속 퇴적되어 호수가 메워지기 때문에 면적이 점차 축소된다.","rubric":["하천 유입","토사 퇴적","메워짐"],"wrongs":[{"a":"우각호","why":"우각호는 곡류 하천의 구하도에 물이 고인 호수로, 사주가 만을 막아 생긴 것이 아님."},{"a":"사취","why":"사취는 한쪽 끝이 육지에 붙은 모래톱. 만의 입구를 가로막는 것은 사주."}],"rel":["사주","석호"],"id":"p002"},{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"석회암 지대를 답사하던 학생들은 지표에 깔때기 모양으로 움푹 팬 와지를 여러 개 관찰하였다. 이 와지는 빗물이나 지하수에 의한 ( ㉠ ) 작용으로 형성된 것으로 ( ㉡ )(이)라고 한다. 이 와지들이 여러 개 합쳐지면 더 큰 와지가 된다.","blanks":[{"l":"㉠","a":["용식"]},{"l":"㉡","a":["돌리네"]}],"task":"㉡ 주변 토양이 붉은색을 띠는 이유와 주된 토지 이용을 서술하시오.","model":"석회암이 풍화되면서 남은 철분 등이 산화되어 붉은색의 테라로사가 형성되었기 때문이며, 돌리네는 배수가 양호해 주로 밭으로 이용된다.","rubric":["테라로사","철분 산화","배수 양호","밭"],"wrongs":[{"a":"우발라","why":"우발라는 여러 돌리네가 합쳐진 큰 와지. 단일 깔때기 와지는 돌리네."}],"rel":["돌리네","용식","테라로사"],"id":"p003"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"제주도 한라산 산록에는 ( ㉠ )(이)라 불리는 작은 화산체가 360여 개 분포한다. 이들 중 다수는 화산 쇄설물인 스코리아가 화구 주변에 쌓여 형성된 원추형 화산인 ( ㉡ )이다.","blanks":[{"l":"㉠","a":["오름","기생 화산","측화산"]},{"l":"㉡","a":["분석구"]}],"task":"제주도 대부분 지역에서 하천이 평상시 말라 있는 이유를 기반암 특성과 관련지어 서술하시오.","model":"제주도의 기반암인 현무암은 절리가 발달하고 다공질이어서 빗물이 지하로 쉽게 스며들므로, 대부분의 하천은 평상시 물이 흐르지 않는 건천이다.","rubric":["현무암","절리","투수성","건천"],"wrongs":[{"a":"칼데라","why":"칼데라는 분화구 함몰로 생긴 대형 와지. 산록의 작은 화산체는 오름(기생 화산)."}],"rel":["분석구"],"id":"p004"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"철원·평강 일대에는 유동성이 큰 현무암질 용암이 지각의 갈라진 틈을 따라 분출하는 ( ㉠ ) 분출로 형성된 넓은 평탄 지형인 ( ㉡ )이/가 발달해 있다. 이곳을 흐르는 한탄강 주변에는 수직의 절벽과 기둥 모양 절리가 나타난다.","blanks":[{"l":"㉠","a":["열하","열하 분출"]},{"l":"㉡","a":["용암 대지","용암대지"]}],"task":"한탄강 주변 기둥 모양 절리의 형성 원리를 서술하시오.","model":"용암이 지표에서 냉각될 때 부피가 수축하면서 수직 방향의 다각형 균열이 생겨 기둥 모양의 주상 절리가 형성된다.","rubric":["용암 냉각","수축","다각형 기둥","주상 절리"],"wrongs":[{"a":"판상 절리","why":"판상 절리는 압력 해방으로 지표와 평행하게 생기는 절리. 냉각·수축 기둥은 주상 절리."}],"rel":["용암 대지","주상 절리"],"id":"p005"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"북한산 인수봉처럼 화강암이 지표에 드러난 산지에서는, 지하 깊은 곳에서 형성된 화강암 위의 암석이 제거되며 압력이 줄어 지표와 평행한 ( ㉠ ) 절리가 생기고, 이를 따라 암석이 양파 껍질처럼 벗겨지는 ( ㉡ ) 현상이 나타난다.","blanks":[{"l":"㉠","a":["판상"]},{"l":"㉡","a":["박리"]}],"task":"화강암 지역에 돌산과 침식 분지가 함께 나타나는 이유를 서술하시오.","model":"화강암은 절리가 많고 화학적 풍화(심층 풍화)를 받기 쉬워 주변 변성암보다 빨리 침식되어 침식 분지를 이루며, 풍화층이 제거되어 기반암이 노출된 곳은 돌산이 된다.","rubric":["심층 풍화","차별 침식","침식 분지","기반암 노출"],"wrongs":[],"rel":["판상 절리","박리","침식 분지","돌산"],"id":"p006"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"산지의 사면에 크고 작은 암괴가 골짜기를 따라 흘러내리듯 쌓여 있는 지형을 ( ㉠ )(이)라고 한다. 우리나라의 ㉠은 현재 기후 환경에서는 형성되지 않고 과거 빙기의 환경에서 형성된 ( ㉡ ) 지형이다.","blanks":[{"l":"㉠","a":["암괴류"]},{"l":"㉡","a":["화석","화석 지형"]}],"task":"㉠의 형성 과정을 빙기의 기후 환경과 관련지어 서술하시오.","model":"빙기의 주빙하 환경에서 동결·융해가 반복되며 암석이 기계적으로 파쇄되어 암괴가 만들어지고, 여름철 녹은 활동층이 사면을 따라 흘러내리는 솔리플럭션으로 암괴가 이동·집적되어 형성되었다.","rubric":["주빙하","동결 융해","기계적 풍화","솔리플럭션"],"wrongs":[{"a":"애추","why":"애추는 절벽 아래 떨어진 암설이 쌓인 원추형 퇴적 지형. 골짜기를 따라 흘러내린 형태는 암괴류."}],"rel":["암괴류","화석 지형","솔리플럭션"],"id":"p007"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"빙하가 흐르던 골짜기는 단면이 ( ㉠ )형을 이루며, 해수면 상승으로 이 골짜기가 침수되면 좁고 깊은 만인 ( ㉡ )이/가 형성된다. 노르웨이·칠레 남부 해안에 잘 나타난다.","blanks":[{"l":"㉠","a":["U자","U"]},{"l":"㉡","a":["피오르","피오르드"]}],"task":"㉡과 리아스 해안의 형성 과정 차이를 서술하시오.","model":"피오르는 빙하가 깎은 U자곡이 후빙기 해수면 상승으로 침수된 것이고, 리아스 해안은 하천이 깎은 V자 하곡이 침수된 것이다.","rubric":["빙식곡","하곡","침수","해수면 상승"],"wrongs":[{"a":"리아스 해안","why":"리아스 해안은 하천 침식곡이 침수된 해안. 빙식곡 침수는 피오르."}],"rel":["피오르","U자곡","리아스 해안"],"id":"p008"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"태안 신두리 해안에는 사빈의 모래가 바람에 날려 해안 배후에 쌓인 언덕인 ( ㉠ )이/가 발달해 있다. ㉠은 바닷물의 침입을 막고 ( ㉡ )을/를 저장하는 기능을 한다.","blanks":[{"l":"㉠","a":["해안 사구","해안사구","사구"]},{"l":"㉡","a":["지하수","담수"]}],"task":"㉠이 겨울철에 잘 발달하는 이유를 바람과 관련지어 서술하시오.","model":"겨울철 북서 계절풍이 강하게 불어 사빈의 건조한 모래를 내륙 쪽으로 운반·퇴적시키므로 서해안의 해안 사구는 겨울에 잘 발달한다.","rubric":["북서 계절풍","모래 운반","바람 퇴적"],"wrongs":[],"rel":["해안 사구","사빈"],"id":"p009"},{"subj":"자연지리","cat":"지형학","type":"실험·자료","text":"[하천 실험] 유속을 점차 낮추며 물에 섞인 퇴적물을 관찰하였더니, 자갈이 먼저 가라앉고 그다음 모래, 마지막으로 점토가 가라앉았다. 이처럼 유속 감소에 따라 입자가 크기별로 쌓이는 작용을 ( ㉠ )(이)라고 한다. 반면 침식 실험에서는 모래보다 점토가 더 빠른 유속에서 침식되었다.","blanks":[{"l":"㉠","a":["분급","분급 작용"]}],"task":"점토가 모래보다 높은 유속에서 침식되는 이유를 서술하시오.","model":"점토는 입자가 매우 작아 입자 사이의 응집력이 커서 서로 달라붙어 있으므로, 모래보다 높은 유속이 있어야 침식된다.","rubric":["응집력","미립자","침식 유속"],"wrongs":[],"rel":["휼스트롬 도표","침식 유속","퇴적 유속"],"id":"p010"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"해안의 곶에서는 파랑의 ( ㉠ ) 작용으로 해식애가 형성되고, 해식애가 후퇴하면서 그 앞에 평탄한 암반면인 ( ㉡ )이/가 나타난다. 동해안에서는 ㉡이 융기하여 해안 단구가 된 곳이 많다.","blanks":[{"l":"㉠","a":["침식"]},{"l":"㉡","a":["파식대"]}],"task":"파랑 에너지가 곶에 집중되는 이유를 서술하시오.","model":"파랑이 해안에 가까워지며 수심이 얕은 곶 앞에서 먼저 속도가 느려져 굴절되므로 파향선이 곶 쪽으로 모여 파랑 에너지가 곶에 집중된다.","rubric":["파랑 굴절","수심","에너지 집중"],"wrongs":[],"rel":["해식애","파식대","해안 단구"],"id":"p011"},{"subj":"자연지리","cat":"기후학","type":"자료 해석","text":"늦봄부터 초여름 사이 ( ㉠ ) 기단의 영향으로 북동풍이 태백산맥을 넘어 영서 지방으로 불어 내려가면 고온 건조한 바람이 되는데, 이를 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["오호츠크해","오호츠크"]},{"l":"㉡","a":["높새바람","높새"]}],"task":"㉡이 고온 건조해지는 원리를 단열 변화와 관련지어 서술하시오.","model":"습윤한 공기가 바람받이인 영동 사면을 상승하며 습윤 단열 감률로 냉각되어 비를 뿌리고, 수증기를 잃은 공기가 영서 쪽 사면을 내려가며 건조 단열 감률로 승온하므로 고온 건조해진다(푄 현상).","rubric":["바람받이 상승","습윤 단열 감률","건조 단열 감률","푄"],"wrongs":[{"a":"북태평양","why":"북태평양 기단은 고온 다습한 여름 기단으로 남동·남서 계절풍과 관련."}],"rel":["높새바람","푄 현상","오호츠크해 기단"],"id":"p012"},{"subj":"자연지리","cat":"기후학","type":"자료 해석","text":"맑고 바람이 약한 겨울밤, 분지 바닥에서 고도가 높아질수록 오히려 기온이 높아지는 ( ㉠ ) 현상이 나타났다. 이때 분지에는 안개가 잘 끼고 서리 피해가 발생하기 쉽다.","blanks":[{"l":"㉠","a":["기온 역전","역전"]}],"task":"㉠이 맑고 바람이 약한 밤에 잘 발생하는 이유를 서술하시오.","model":"맑은 밤에는 지표의 복사 냉각이 활발하고 바람이 약해 공기가 섞이지 않으므로, 냉각된 무거운 공기가 분지 바닥으로 흘러내려 쌓여 아래쪽 기온이 위쪽보다 낮아진다.","rubric":["복사 냉각","냉기류","찬 공기 침강","혼합 약함"],"wrongs":[],"rel":["기온 역전","복사냉각","냉기호"],"id":"p013"},{"subj":"자연지리","cat":"기후학","type":"자료 해석","text":"적도 동태평양의 해수면 온도가 평년보다 높아지는 현상을 ( ㉠ )(이)라고 한다. 이 시기에는 적도 태평양의 동서 방향 대기 순환인 ( ㉡ )이/가 약화된다.","blanks":[{"l":"㉠","a":["엘니뇨"]},{"l":"㉡","a":["워커 순환","워커순환"]}],"task":"㉠ 시기 페루 연안 어획량이 감소하는 이유를 서술하시오.","model":"무역풍이 약화되어 페루 연안의 용승이 약해지므로 영양염이 풍부한 찬 심층수가 덜 올라와 플랑크톤이 줄고 어획량이 감소한다.","rubric":["무역풍 약화","용승 약화","영양염 감소"],"wrongs":[{"a":"라니냐","why":"라니냐는 동태평양 해수면 온도가 낮아지고 무역풍이 강해지는 현상."}],"rel":["엘니뇨","워커 순환","용승"],"id":"p014"},{"subj":"자연지리","cat":"기후학","type":"개념 설명","text":"도시 중심부의 기온이 주변 교외보다 높게 나타나는 현상을 ( ㉠ )(이)라고 한다. 이 현상이 심한 도시에서는 밤에 도시 상공에 오염 물질이 갇혀 ( ㉡ )이/가 형성되기도 한다.","blanks":[{"l":"㉠","a":["열섬","열섬 현상","도시 열섬"]},{"l":"㉡","a":["먼지 지붕","먼지지붕"]}],"task":"㉠의 발생 원인을 두 가지 이상 서술하시오.","model":"인공열(냉난  가까이에서 원예 농업·낙농업이 이루어지는 이유를 서술하시오.","model":"신선도가 중요하고 부피가 커 운송비가 많이 드는 작물은 도시에 가까울수록 단위 면적당 지대(수익)가 높으므로, 지대 지불 능력이 큰 원예·낙농이 도시 근처를 차지한다.","rubric":["운송비","신선도","지대 지불 능력"],"wrongs":[],"rel":["튀넨의 고립국 이론","입찰 지대"],"id":"p054"},{"subj":"인문지리","cat":"경제지리","type":"사례 제시","text":"반도체 기업이 연구·개발 기능은 수도권에, 생산 공장은 지방이나 해외에 두는 현상을 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["공간적 분업","공간 분업"]}],"task":"다국적 기업이 생산 공장을 개발 도상국에 두는 이유를 서술하시오.","model":"개발 도상국은 노동비와 지대가 저렴하고, 현지 시장 확보·무역 장벽 회피에 유리하기 때문이다.","rubric":["저렴한 노동비","시장 확보","무역 장벽 회피"],"wrongs":[],"rel":[],"id":"p055"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"개념 설명","text":"영해는 기선으로부터 ( ㉠ )해리까지이며, 기선으로부터 ( ㉡ )해리까지 중 영해를 제외한 수역이 배타적 경제 수역이다.","blanks":[{"l":"㉠","a":["12"]},{"l":"㉡","a":["200"]}],"task":"서해안과 남해안 대부분에서 직선 기선을 적용하는 이유를 서술하시오.","model":"해안선이 복잡하고 섬이 많아 최외곽 섬들을 직선으로 연결한 직선 기선을 적용한다. 단, 대한 해협은 3해리를 적용한다.","rubric":["복잡한 해안선","섬 많음","최외곽 섬 연결"],"wrongs":[{"a":"통상 기선","why":"통상 기선은 해안선이 단조로운 동해안 등에서 썰물 때 해안선을 기준."}],"rel":["영해","배타적 경제 수역","직선 기선"],"id":"p059"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"개념 설명","text":"문화가 한 지역에서 다른 지역으로 퍼져 나가는 현상을 문화 전파라 한다. 사람의 이동 없이 매체를 통해 퍼지는 것을 ( ㉠ ) 전파, 대도시에서 중소 도시로 도시 계층을 따라 퍼지는 것을 ( ㉡ ) 전파라고 한다.","blanks":[{"l":"㉠","a":["간접"]},{"l":"㉡","a":["계층","계층적"]}],"task":"전염 전파와 ㉡ 전파의 차이를 서술하시오.","model":"전염 전파는 거리에 따라 인접한 지역으로 차례로 퍼지는 반면, 계층 전파는 거리와 무관하게 도시 규모 등 계층 순서에 따라 퍼진다.","rubric":["인접 확산","거리","도시 계층"],"wrongs":[],"rel":["문화 전파"],"id":"p060"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"고지도·고문헌","text":"이중환의 『택리지』는 가거지(可居地)의 조건으로 지리(地理), ( ㉠ ), 인심(人心), 산수(山水)를 들었다.","blanks":[{"l":"㉠","a":["생리","生利"]}],"task":"㉠의 의미를 서술하시오.","model":"생리는 땅이 비옥하고 교역이 편리하여 경제적으로 넉넉히 살 수 있는 조건, 즉 경제적 이익을 말한다.","rubric":["경제적 조건","비옥한 땅","교역"],"wrongs":[],"rel":["택리지"],"id":"p061"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"개념 설명","text":"전통적 풍수지리에서 주산을 중심으로 좌측의 ( ㉠ ), 우측의 ( ㉡ )이/가 마을을 감싸는 배산임수 지형을 명당으로 여겼다.","blanks":[{"l":"㉠","a":["좌청룡","청룡"]},{"l":"㉡","a":["우백호","백호"]}],"task":"배산임수 입지의 생활상 이점을 서술하시오.","model":"뒤의 산이 겨울 북서풍을 막고 땔감을 제공하며, 앞의 하천·평야는 생활·농업 용수와 농경지를 제공하고 남향으로 일조가 좋다.","rubric":["북서풍 차단","용수 확보","일조"],"wrongs":[],"rel":["풍수지리","배산임수"],"id":"p062"},{"subj":"지리교육론","cat":"지리교육론","type":"교육과정 문서","text":"[교육과정 해설] 이 과목은 학생들이 지리적 사고력을 바탕으로 지역 문제를 탐구하고 해결 방안을 제시하는 ( ㉠ ) 학습을 강조한다. 학생들은 실제 지역을 방문하여 자료를 수집하는 ( ㉡ ) 조사를 수행한다.","blanks":[{"l":"㉠","a":["탐구","문제 해결","탐구 학습"]},{"l":"㉡","a":["야외","야외 조사","현장"]}],"task":"㉡ 조사의 절차를 단계별로 서술하시오.","model":"조사 주제와 지역 선정 → 사전 조사(문헌·지도) 및 계획 수립 → 현지 관찰·면담·측정 → 자료 정리·분석 → 보고서 작성 및 발표 순서로 진행한다.","rubric":["주제 선정","사전 조사","현지 조사","정리·분석","보고서"],"wrongs":[],"rel":["야외 조사"],"id":"p063"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 오늘은 학생들이 직접 우리 동네의 문제를 찾아 지역 주민에게 제안서를 써 볼 거예요.\n학생: 학교 밖 실제 문제를 다루는 거네요?\n교사: 맞아요. 이렇게 학생이 사회 참여를 통해 지역 변화를 이끄는 시민성을 기르는 교육을 ( ㉠ ) 교육이라고 해요.","blanks":[{"l":"㉠","a":["참여","시민 참여","사회 참여"]}],"task":"이 수업에서 교사가 유의할 점을 한 가지 서술하시오.","model":"학생이 문제를 선정하고 해결안을 스스로 만들도록 자율성을 보장하되, 지역 주민과의 소통 방식과 실현 가능성을 점검하도록 안내해야 한다.","rubric":["학생 자율성","실현 가능성","지역 소통"],"wrongs":[],"rel":[],"id":"p064"},{"subj":"지리교육론","cat":"지리교육론","type":"평가 자료","text":"[평가 계획] 학생이 지리 답사 보고서를 작성하는 과정을 지속적으로 관찰하고 피드백하여 학습을 개선하는 평가를 ( ㉠ ) 평가, 학기 말에 성취 수준을 판정하는 평가를 ( ㉡ ) 평가라고 한다.","blanks":[{"l":"㉠","a":["형성","형성 평가","과정 중심"]},{"l":"㉡","a":["총괄","총괄 평가"]}],"task":"과정 중심 평가의 의미와 장점을 서술하시오.","model":"학습 과정에서 학생의 수행을 지속적으로 관찰·평가하고 피드백을 제공하는 평가로, 결과뿐 아니라 사고 과정과 성장을 확인해 학습 개선에 활용할 수 있다.","rubric":["지속 관찰","피드백","학습 개선"],"wrongs":[],"rel":["형성평가","총괄평가"],"id":"p065"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 지도에서 등고선 간격이 좁은 곳은 어떤 곳일까요?\n학생: 경사가 급한 곳이요!\n교사: 맞아요. 이처럼 지도를 읽고 해석하며 공간 정보를 활용하는 능력을 ( ㉠ ) 능력이라고 해요.","blanks":[{"l":"㉠","a":["도해력","그래피시","지도 해독","그라피시"]}],"task":"초등 저학년에게 지도 학습을 도입할 때의 순서를 서술하시오.","model":"교실·학교처럼 가까운 공간에서 시작해 그림지도 → 약도 → 축척과 기호가 있는 지도 순으로, 구체적에서 추상적으로 점진적으로 확대한다.","rubric":["가까운 공간","그림지도","구체→추상"],"wrongs":[],"rel":["지리 도해력"],"id":"p066"},{"subj":"지리교육론","cat":"지리교육론","type":"교육과정  우리의 관계를 생각해 봅시다.\n이처럼 세계의 상호 의존성과 불평등을 이해하고 책임 있는 행동을 강조하는 교육을 ( ㉠ ) 교육이라고 한다.","blanks":[{"l":"㉠","a":["세계 시민","세계시민"]}],"task":"이 수업에서 공정 무역을 다룰 때의 학습 목표를 서술하시오.","model":"생산자에게 정당한 대가를 지불하는 공정 무역의 의미를 이해하고, 소비 선택이 다른 지역 사람들의 삶에 영향을 준다는 점을 인식하여 윤리적 소비를 실천하는 태도를 기른다.","rubric":["상호 의존","정당한 대가","윤리적 소비"],"wrongs":[],"rel":["공정 무역"],"id":"p084"},{"subj":"지리교육론","cat":"지리교육론","type":"개념 설명","text":"피아제 이론에 따르면 대략 7~11세의 ( ㉠ ) 단계 아동은 구체물을 통한 논리적 사고는 가능하지만 추상적인 가설 사고는 어렵다.","blanks":[{"l":"㉠","a":["구체적 조작기","구체적 조작"]}],"task":"이 단계 학생에게 축척 개념을 지도할 때의 방법을 서술하시오.","model":"교실을 직접 재어 모눈종이에 줄여 그리는 등 구체물·직접 경험을 활용해 실제 거리와 지도상 거리의 관계를 체험하게 한다.","rubric":["구체물","직접 측정","실제-지도 거리"],"wrongs":[],"rel":[],"id":"p085"},{"subj":"지리교육론","cat":"지리교육론","type":"평가 자료","text":"[평가 문항 검토] 같은 학생이 같은 문항에 다시 응답했을 때 비슷한 결과가 나오는 정도를 ( ㉠ ), 평가하려는 목표를 실제로 측정하는 정도를 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["신뢰도"]},{"l":"㉡","a":["타당도"]}],"task":"서술형 평가에서 ㉠을 높이는 방법을 서술하시오.","model":"명확한 채점 기준표(루브릭)를 마련하고, 복수의 채점자가 채점하거나 채점자 협의를 통해 채점자 간 일관성을 높인다.","rubric":["채점 기준","복수 채점","일관성"],"wrongs":[],"rel":["타당도"],"id":"p086"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 지난 시간 우리 학교 주변 지도를 그려 보았죠. 사람마다 같은 동네를 다르게 그렸는데, 왜 그럴까요?\n학생: 자주 다니는 길은 크게, 모르는 곳은 빠뜨렸어요.\n이처럼 개인이 머릿속에 가지고 있는 주관적 공간 이미지를 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["정신 지도","심상 지도","멘탈맵","인지 지도"]}],"task":"㉠ 활동을 지리 수업에 활용하는 의의를 서술하시오.","model":"학생의 공간 인식과 경험을 드러내 학습의 출발점으로 삼을 수 있고, 장소에 대한 개인적 의미와 인식 차이를 성찰하게 한다.","rubric":["공간 인식 진단","개인 경험","인식 차이"],"wrongs":[],"rel":[],"id":"p087"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 지구 온난화 해결을 위해 \"탄소세 도입은 바람직한가?\"를 두고 찬반으로 나누어 근거를 들어 토론해 봅시다.\n이처럼 사회적 쟁점을 다루어 합리적 판단력을 기르는 수업을 ( ㉠ ) 중심 수업이라고 한다.","blanks":[{"l":"㉠","a":["쟁점","논쟁 문제","이슈"]}],"task":"㉠ 중심 수업에서 교사가 지켜야 할 태도를 서술하시오.","model":"교사는 자신의 견해를 강요하지 않고 다양한 관점과 자료를 균형 있게 제시하며, 학생이 근거에 기반해 스스로 판단하도록 중립적 촉진자 역할을 해야 한다.","rubric":["중립","균형 자료","근거 기반 판단"],"wrongs":[],"rel":[],"id":"p088"},{"subj":"지리교육론","cat":"지리교육론","type":"교육과정 문서","text":"[수업 계획] 1차시: 교사는 지형도의 등고선 읽기를 시범 보인다. 2차시: 학생은 교사의 안내를 받으며 연습한다. 3차시: 학생 스스로 지형 단면도를 그린다.\n이처럼 교사의 지원을 점차 줄여 학습자의 독립 수행으로 이끄는 것을 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["비계 설정","비계","스캐폴딩"]}],"task":"㉠과 근접 발달 영역의 관계를 서술하시오.","model":"비계 설정은 학생이 혼자서는 못하지만 도움을 받으면 할 수 있는 근접 발달 영역에서 교사나 동료가 지원을 제공하고, 능력이 향상되면 지원을 점차 줄이는 것이다.","rubric":["근접 발달 영역","도움","점진적 철회"],"wrongs":[],"rel":["근접발달영역"],"id":"p089"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 이번 프로젝트에서는 모둠별로 \"우리 지역 하천을 살리려면?\"이라는 실제 문제를 정하고, 몇 주에 걸쳐 조사·해결안을 만든 뒤 발표합니다.\n이 학습 방법을 ( ㉠ ) 학습이라고 한다.","blanks":[{"l":"㉠","a":["프로젝트","프로젝트 기반","문제 기반","PBL"]}],"task":"이 학습에서 교사의 역할을 서술하시오.","model":"교사는 지식 전달자가 아니라 학생이 문제를 정의하고 탐구하도록 돕는 안내자·촉진자로서 자원을 제공하고 과정을 점검하며 피드백한다.","rubric":["촉진자","안내자","피드백"],"wrongs":[],"rel":[],"id":"p090"},{"subj":"지리교육론","cat":"지리교육론","type":"개념 설명","text":"장소에 대한 인간의 주관적 경험과 애착을 강조한 투안은 장소에 대한 정서적 유대를 ( ㉠ )(이)라고 하였다.","blanks":[{"l":"㉠","a":["토포필리아","장소애"]}],"task":"렐프가 말한 무장소성의 의미를 서술하시오.","model":"무장소성은 대량 생산·대중문화 등으로 장소들이 획일화되어 장소 고유의 정체성과 의미가 사라지는 현상을 말한다.","rubric":["획일화","정체성 상실"],"wrongs":[],"rel":["무장소성"],"id":"p091"},{"subj":"지리교육론","cat":"지리교육론","type":"평가 자료","text":"[문항 분석] 이 문항은 상위 집단 학생은 대부분 맞히고 하위 집단 학생은 대부분 틀렸다. 이처럼 학생의 능력 차이를 구별해 주는 정도를 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["변별도"]}],"task":"문항 난이도와 ㉠의 차이를 서술하시오.","model":"문항 난이도는 전체 응답자 중 정답자의 비율로 문항의 쉽고 어려움을 나타내고, 변별도는 상위 집단과 하위 집단을 구별하는 정도를 나타낸다.","rubric":["정답 비율","상·하위 구별"],"wrongs":[],"rel":["변별도"],"id":"p092"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 오늘은 지역 축제의 경제적 효과를 조사하기 위해 시장 상인들을 직접 인터뷰하고, 설문지를 만들어 방문객에게 배포할 거예요.\n이처럼 연구자가 현장에서 직접 수집한 자료를 ( ㉠ ) 자료라고 한다.","blanks":[{"l":"㉠","a":["1차","1차 자료","일차"]}],"task":"2차 자료와 비교한 ㉠ 자료의 장단점을 서술하시오.","model":"연구 목적에 꼭 맞는 최신 자료를 직접 얻을 수 있지만, 수집에 시간과 비용이 많이 들고 표본이 작아 일반화에 한계가 있다.","rubric":["목적 적합","시간·비용","일반화 한계"],"wrongs":[],"rel":["야외 조사"],"id":"p093"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 이 지 anks":[{"l":"㉠","a":["정보 기술","IT","소프트웨어","ICT"]}],"task":"인도에서 ㉠ 산업이 발달한 요인을 미국과의 시차와 관련지어 서술하시오.","model":"영어를 구사하는 저렴한 고급 인력이 풍부하고, 미국과 약 10~12시간의 시차가 있어 미국 업무 시간 이후 작업을 이어받아 24시간 업무가 가능하기 때문이다.","rubric":["영어 인력","저렴한 인건비","시차","24시간 업무"],"wrongs":[],"rel":[],"id":"p099"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"오스트레일리아 내륙의 건조 지역에서는 넓은 초원에서 대규모로 양이나 소를 사육하는 ( ㉠ ) 방목이 이루어진다. 내륙 동부의 대찬정(그레이트아테지안) 분지에서는 피압 지하수를 이용한다.","blanks":[{"l":"㉠","a":["기업적","기업적 방목"]}],"task":"오스트레일리아의 주요 무역 상대국이 영국에서 아시아로 바뀐 이유를 서술하시오.","model":"영국의 유럽 공동체 가입으로 영연방 특혜가 줄었고, 지리적으로 가까운 아시아 국가들의 경제 성장으로 자원 수요가 크게 늘었기 때문이다.","rubric":["영국 EC 가입","아시아 성장","지리적 근접","자원 수요"],"wrongs":[],"rel":[],"id":"p100"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"캐나다 북부와 러시아 시베리아에는 ( ㉠ ) 기후가 나타나 침엽수림인 타이가가 넓게 분포한다.","blanks":[{"l":"㉠","a":["냉대","냉대 습윤","아한대"]}],"task":"이 지역에서 임업이 발달한 이유를 서술하시오.","model":"수종이 단순한 침엽수림이 넓게 분포하여 같은 종류의 목재를 대량으로 벌목·가공하기 유리하고, 목질이 부드러워 펄프·건축재로 이용하기 좋기 때문이다.","rubric":["단순 수종","대량 벌목","펄프"],"wrongs":[],"rel":["타이가"],"id":"p101"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"안데스 산지의 저위도 고산 지역에는 연중 봄과 같은 기후인 ( ㉠ ) 기후가 나타나 키토·라파스 같은 고산 도시가 발달하였다.","blanks":[{"l":"㉠","a":["고산","고산 기후","상춘"]}],"task":"저위도 지역에서 고산 지역에 도시가 발달한 이유를 서술하시오.","model":"저위도 저지대는 고온 다습하여 생활하기 어렵지만, 고도가 높아지면 기온이 낮아져 연중 온화하므로 일찍부터 사람이 거주하고 도시가 발달하였다.","rubric":["기온 감률","연중 온화","저지대 고온 다습"],"wrongs":[],"rel":["열대 고산기후"],"id":"p102"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"라틴 아메리카의 대도시에서는 농촌에서 이주한 사람들이 도시 주변의 경사지 등에 불량 주거지를 형성하였는데, 브라질에서는 이를 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["파벨라"]}],"task":"라틴 아메리카에서 종주 도시화가 나타나는 이유를 서술하시오.","model":"식민 시기부터 정치·경제 기능이 수도나 항구 도시에 집중되었고, 농촌에서 일자리를 찾아 대도시로 인구가 대량 유입되어 1위 도시 인구가 2위 도시보다 훨씬 많아졌다.","rubric":["기능 집중","이촌 향도","과도시화"],"wrongs":[],"rel":["종주 도시"],"id":"p103"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"아프리카의 국경선 중 상당수는 식민 시기 유럽 열강이 경선과 위선을 따라 그은 ( ㉠ ) 국경이다.","blanks":[{"l":"㉠","a":["인위적","수리적","기하학적"]}],"task":"이러한 국경이 아프리카 분쟁의 원인이 된 이유를 서술하시오.","model":"민족·부족의 분포와 무관하게 국경이 그어져 같은 민족이 여러 국가로 나뉘거나 적대적인 여러 민족이 한 국가에 묶여 민족 간 갈등과 분쟁이 발생하였다.","rubric":["민족 분포 무시","분리·통합","민족 갈등"],"wrongs":[],"rel":[],"id":"p104"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"북극해 주변 툰드라 지역의 원주민 이누이트는 전통적으로 바다표범·순록(카리부) 사냥과 어로에 의존했으며, 이 지역 지표 아래에는 연중 얼어 있는 ( ㉠ )이/가 분포한다.","blanks":[{"l":"㉠","a":["영구 동토층","영구동토층","영구 동토"]}],"task":"이 지역에서 건물을 고상식으로 짓는 이유를 서술하시오.","model":"건물의 열이 땅으로 전달되면 영구 동토층의 상부가 녹아 지반이 침하하므로, 바닥을 띄워 열 전달을 막기 위해서이다.","rubric":["열 차단","동토층 융해","지반 침하"],"wrongs":[],"rel":[],"id":"p105"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"서부 유럽은 북대서양 해류와 ( ㉠ )의 영향으로 고위도임에도 겨울이 온화한 서안 해양성 기후가 나타난다.","blanks":[{"l":"㉠","a":["편서풍"]}],"task":"서안 해양성 기후 지역에서 혼합 농업과 낙농업이 발달한 이유를 서술하시오.","model":"연중 강수가 고르고 여름이 서늘하여 목초 재배에 유리하며, 대도시 시장이 가까워 가축 사육과 사료 작물 재배를 결합한 혼합 농업과 낙농업이 발달하였다.","rubric":["고른 강수","서늘한 여름","목초","도시 시장"],"wrongs":[],"rel":["서안 해양성 기후","혼합 농업"],"id":"p106"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"라인강은 여러 국가를 지나 흐르며 국제 조약에 따라 모든 국가 선박이 자유롭게 항행할 수 있는 ( ㉠ ) 하천이다.","blanks":[{"l":"㉠","a":["국제","국제 하천"]}],"task":"라인강 수운이 발달한 자연적 조건을 서술하시오.","model":"연중 강수가 고르고 알프스 빙하 융빙수가 공급되어 유량이 비교적 일정하며, 하천 경사가 완만해 대형 선박의 항행이 가능하다.","rubric":["유량 일정","고른 강수","완만한 경사"],"wrongs":[],"rel":["국제하천"],"id":"p107"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"미국 대평원 지역에서는 대규모 농장에서 기계를 이용하여 밀·옥수수 등을 재배하는 ( ㉠ ) 곡물 농업이 이루어진다.","blanks":[{"l":"㉠","a":["기업적"]}],"task":"곡물 메이저가 국제 곡물 시장에 미치는 영향을 서술하시오.","model":"소수의 거대 다국적 곡물 기업이 생산·저장·유통을 장악하여 국제 곡물 가격과 공급에 큰 영향력을 행사하므로, 곡물 수입국의 식량 안보가 위협받을 수 있다.","rubric":["유통 장악","가격 영향력","식량 안보"],"wrongs":[],"rel":[],"id":"p108"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"동남아시아 국가들은 경제·사회·문화 협력을 위해 1967년 ( ㉠ )을/를 결성하였다.","blanks":[{"l":"㉠","a":["아세안","ASEAN","동남아시아 국가 연합"]}],"task":"동남아시아에 다양한 종교가 분포하는 이유를 서술하시오.","model":"해상 교통의 요지에 위치하여 인도·서남아시아·중국·유럽과 교류하면서 불교, 이슬람교, 크리스트교 등이 전파되었기 때문이다.","rubric":["교통 요지","교역","종교 전파"],"wrongs":[],"rel":[],"id":"p109"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"중앙아시아의 아랄해는 유입 하천의 물을 ( ㉠ ) 재배를 위한 관개용수로 과도하게 이용하면서 면적이 크게 줄어들었다.","blanks":[{"l":"㉠","a":["목화","면화"]}],"task":"아랄해 축소로 나타난 환경 문제를 서술하시오.","model":"호수가 말라 드러난 호저에서 소금과 농약 성분이 섞인 먼지가 날려 주민 건강과 농업에 피해를 주고, 염도 상승으로 어업이 붕괴되었다.","rubric":["소금 먼지","농약","염도 상승","어업 붕괴"],"wrongs":[],"rel":[],"id":"p110"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"하천 상류의 좁은 골짜기에서는 하천의 ( ㉠ ) 침식이 우세하여 V자곡이 발달하고, 하류로 갈수록 ( ㉡ ) 침식과 퇴적이 활발해진다.","blanks":[{"l":"㉠","a":["하방","하각"]},{"l":"㉡","a":["측방"]}],"task":"하천 중·하류에 범람원이 형성되는 과정을 서술하시오.","model":"홍수 때 하천이 범람하면 하도 가까이에는 유속이 급감해 굵은 모래가 쌓여 자연 제방이 되고, 멀리에는 미립질 점토가 쌓여 배후 습지가 형성되어 범람원을 이룬다.","rubric":["범람","자연 제방","배후 습지","입자 크기"],"wrongs":[],"rel":["범람원","자연 제방","배후 습지"],"id":"p111"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"조류의 영향이 큰 서해안에서는 밀물과 썰물이 운반한 점토가 쌓여 넓은 ( ㉠ )이/가 발달한다.","blanks":[{"l":"㉠","a":["갯벌","간석지"]}],"task":"서해안에 ㉠이 넓게 발달하는 이유를 서술하시오.","model":"조차가 크고 해안선이 복잡하며 수심이 얕아 조류에 의한 퇴적이 활발하고, 하천이 운반한 미립 물질이 많이 공급되기 때문이다.","rubric":["조차 큼","얕은 수심","미립 물질 공급"],"wrongs":[],"rel":["갯벌"],"id":"p112"},{"subj":"자연지리","cat":"기후학","type":"자료 해석","text":"우리나라의 장마는 북쪽의 차가운 기단과 남쪽의 ( ㉠ ) 기단 사이에 형성된 ( ㉡ ) 전선이 정체하면서 나타난다.","blanks":[{"l":"㉠","a":["북태평양"]},{"l":"㉡","a":["정체","장마"]}],"task":"장마 이후 한여름에 무더위가 나타나는 이유를 서술하시오.","model":"북태평양 기단이 확장하여 장마 전선이 북상하면 한반도가 고온 다습한 북태평양 기단의 영향권에 들어 무덥고 열대야가 나타난다.","rubric":["기단 확장","전선 북상","고온 다습"],"wrongs":[],"rel":["장마 전선","북태평양 기단"],"id":"p113"},{"subj":"자연지리","cat":"토양·식생·수문","type":"개념 설명","text":"토양 단면에서 유기물이 풍부한 표토층 아래에는 위에서 용탈된 물질이 쌓이는 ( ㉠ )층이 있다.","blanks":[{"l":"㉠","a":["집적","B","B층"]}],"task":"건조 기후 지역 토양에 염류가 집적되는 이유를 서술하시오.","model":"증발량이 강수량보다 많아 토양 속 수분이 모세관 현상으로 상승하며 증발할 때 녹아 있던 염류가 지표 근처에 남아 쌓이기 때문이다.","rubric":["증발 > 강수","모세관 상승","염류 집적"],"wrongs":[],"rel":[],"id":"p114"},{"subj":"자연지리","cat":"지도학·GIS","type":"개념 설명","text":"지형도에서 축척이 1:25,000일 때 주곡선은 ( ㉠ )m 간격, 1:50,000일 때는 ( ㉡ )m 간격으로 그린다.","blanks":[{"l":"㉠","a":["10"]},{"l":"㉡","a":["20"]}],"task":"지형도에서 실제 거리를 구하는 방법을 서술하시오.","model":"지도상 거리에 축척의 분모를 곱하면 실제 거리이다. 예를 들어 1:50,000 지도에서 2cm는 100,000cm, 즉 1km이다.","rubric":["지도상 거리","축척 분모 곱"],"wrongs":[],"rel":["축척 계수"],"id":"p115"},{"subj":"인문지리","cat":"도시지리","type":"개념 설명","text":"대도시의 영향이 주변 지역까지 확대되어 통근권을 중심으로 하나의 생활권이 형성된 범위를 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["대도시권","메트로폴리탄"]}],"task":"대도시권 형성의 배경을 교통과 관련지어 서술하시오.","model":"교통이 발달해 통근 시간이 줄어들면서 주거 기능이 교외로 확산되고, 대도시와 주변 지역 간 기능적 연계가 강화되었기 때문이다.","rubric":["교통 발달","교외화","기능적 연계"],"wrongs":[],"rel":[],"id":"p116"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"서비스업 중 기업의 생산 활동을 지원하는 금융·광고·법률 등은 ( ㉠ ) 서비스업, 개인 소비자에게 제공하는 음식·숙박 등은 ( ㉡ ) 서비스업이다.","blanks":[{"l":"㉠","a":["생산자"]},{"l":"㉡","a":["소비자"]}],"task":"㉠ 서비스업이 대도시 도심에 집중하는 이유를 서술하시오.","model":"관련 기업과 정보가 집중되어 대면 접촉과 정보 획득이 유리하고, 고급 전문 인력을 확보하기 쉬우며 접근성이 높기 때문이다.","rubric":["대면 접촉","정보","전문 인력"],"wrongs":[],"rel":[],"id":"p117"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"개념 설명","text":"한 지역의 서로 다른 문화가 만나 새로운 제3의 문화가 만들어지는 현상을 문화 ( ㉠ ), 기존 문화가 다른 문화에 흡수되어 사라지는 현상을 문화 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["융합"]},{"l":"㉡","a":["동화"]}],"task":"문화 공존의 의미를 서술하시오.","model":"서로 다른 문화가 각각의 정체성을 유지하면서 한 지역에 함께 나란히 존재하는 현상이다.","rubric":["정체성 유지","함께 존재"],"wrongs":[],"rel":["문화 융합","문화 동화"],"id":"p118"},{"subj":"인문지리","cat":"인구지리","type":"개념 설명","text":"인구 변천 모형에서 출생률은 높지만 의료 발달로 사망률이 급격히 낮아져 인구가 급증하는 단계는 ( ㉠ )단계이다.","blanks":[{"l":"㉠","a":["2","제2","초기 확장"]}],"task":"4단계에서 인구 증가율이 낮은 이유를 서술하시오.","model":"출생률과 사망률이 모두 낮아져 자연 증가율이 매우 낮아지기 때문이다. 여성의 사회 진출과 자녀 양육비 증가가 출생률을 낮춘다.","rubric":["저출생","저사망","자연 증가율 낮음"],"wrongs":[],"rel":["인구 변천 모형"],"id":"p119"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"우리나라 관북 지방의 개마고원은 해발 고도가 높은 ( ㉠ ) 지형으로, 기온이 낮아 감자·귀리 등 밭작물 재배가 이루어진다.","blanks":[{"l":"㉠","a":["고원"]}],"task":"개마고원이 높은 고도에도 평탄한 이유를 서술하시오.","model":"오랜 침식으로 평탄해진 지표가 신생대 경동성 요곡 운동으로 융기하여, 높은 곳에 평탄면이 남은 고위 평탄면이기 때문이다.","rubric":["침식 평탄면","경동성 요곡 운동","융기"],"wrongs":[],"rel":["고위 평탄면"],"id":"p120"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 이 단원이 끝나면 학생들이 무엇을 할 수 있어야 할지 먼저 정하고, 그것을 확인할 평가를 설계한 다음 수업 활동을 계획했어요.\n이처럼 목표와 평가를 먼저 설계하는 교육과정 설계 방식을 ( ㉠ ) 설계라고 한다.","blanks":[{"l":"㉠","a":["백워드","역방향","이해 중심"]}],"task":"㉠ 설계의 3단계를 서술하시오.","model":"1단계 바라는 결과(영속적 이해) 확인 → 2단계 수용 가능한 증거(평가) 결정 → 3단계 학습 경험과 수업 계획 순으로 설계한다.","rubric":["바라는 결과","평가 증거","학습 경험"],"wrongs":[],"rel":[],"id":"p121"},{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"[답사 기록] 동해안의 해안 단구를 답사하였다. 단구면 위에는 둥근 자갈과 모래가 쌓여 있었고, 단구면이 뒤쪽 급사면(단구애)과 만나는 경사 급변점에서 옛 해안선을 확인하였다. 이 옛 해안선의 해발 고도를 ( ㉠ )(이)라고 하며, 현재 해수면과의 고도 차를 이용하면 단구 형성 이후의 ( ㉡ ) 양을 추정할 수 있다.","blanks":[{"l":"㉠","a":["구정선 고도","구정선의 고도","구정선"]},{"l":"㉡","a":["지반 융기","융기"]}],"task":"단구면 고도보다 ㉠이 해수면 변동이나 융기량 추정에 더 적합한 이유를 서술하시오.","model":"단구면은 형성 후 퇴적물이 덮이거나 개석·침식되어 고도가 변하기 쉽지만, 구정선은 단구 형성 당시 해수면 위치를 직접 나타내는 지점이므로 융기량·해수면 변동을 더 정확히 추정할 수 있다.","rubric":["형성 당시 해수면","단구면 퇴적·침식 변형","정확한 추정"],"wrongs":[{"a":"파식대","why":"파식대는 해식애 앞 평탄 암반 자체. 옛 해안선 고도는 구정선 고도."}],"rel":["구정선 고도","해안 단구"],"id":"p122"},{"subj":"자연지리","cat":"지형학","type":"지도·자료 해석","text":"지질도에서 A 단층은 단층선을 경계로 하천 유로가 같은 방향으로 수백 m씩 어긋나 있고, 능선이 끊겨 맞은편 골짜기와 마주 보는 셔터 릿지가 나타난다. 이처럼 단층면을 따라 지괴가 수평 방향으로 이동한 단층을 ( ㉠ )(이)라고 한다. 또한 A 단층은 제4기 퇴적층을 자르고 있어 ( ㉡ )(으)로 분류된다.","blanks":[{"l":"㉠","a":["주향이동단층","주향 이동 단층"]},{"l":"㉡","a":["활성단층","활성 단층"]}],"task":"㉡으로 판단한 근거를 지층의 형성 시기와 관련지어 서술하시오.","model":"활성단층은 제4기에 활동한 적이 있는 단층으로 정의되는데, A 단층이 제4기 퇴적층을 절단·변위시켰으므로 제4기 이후 활동한 것으로 판단된다.","rubric":["제4기 퇴적층","절단·변위","최근 활동"],"wrongs":[{"a":"역단층","why":"역단층은 압축력으로 상반이 위로 올라간 수직 방향 이동. 하천 유로가 수평으로 어긋난 것은 주향이동단층."}],"rel":["주향이동단층","활성단층"],"id":"p123"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"빙하가 녹은 물에 운반된 세립 물질이 하천 주변에 쌓인 뒤, 다시 ( ㉠ )에 의해 운반되어 넓게 퇴적된 실트질 퇴적물을 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["바람","편서풍"]},{"l":"㉡","a":["뢰스","황토"]}],"task":"㉡이 빙하가 직접 퇴적한 빙력토보다 분급이 양호한 이유를 서술하시오.","model":"빙력토는 빙하가 크기에 관계없이 물질을 운반·퇴적해 분급이 불량하지만, 뢰스는 바람이 운반 가능한 실트 크기 입자만 선택적으로 날려 퇴적했기 때문에 분급이 양호하다.","rubric":["빙하 직접 퇴적=분급 불량","바람의 선택적 운반","실트"],"wrongs":[{"a":"모레인","why":"모레인은 빙하가 직접 쌓은 빙퇴석으로 분급이 불량."}],"rel":["뢰스","빙력토"],"id":"p124"},{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"[카르스트 답사] 석회암 분지를 흐르던 하천이 바닥의 구멍으로 빨려 들어가 갑자기 사라졌다. 이처럼 지표수가 지하 동굴계로 흘러드는 흡입구를 ( ㉠ ), 이렇게 지표에서 지하로 사라지는 하천을 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["포노르","싱크홀"]},{"l":"㉡","a":["싱킹 크리크","소멸 하천"]}],"task":"석회동굴 바닥에서 계단식 웅덩이(림스톤 풀)가 형성되는 과정을 서술하시오.","model":"동굴 바닥을 흐르는 지하수에서 이산화탄소가 방출되면 탄산칼슘이 침전되는데, 물이 고인 부분의 가장자리에 침전물이 둑처럼 쌓여 계단식 웅덩이를 이룬다.","rubric":["이산화탄소 방출","탄산칼슘 침전","가장자리 둑"],"wrongs":[{"a":"돌리네","why":"돌리네는 지표의 깔때기형 용식 와지. 물이 빨려 드는 흡입구는 포노르."}],"rel":["포노르","싱킹 크리크","림스톤 풀"],"id":"p125"},{"subj":"자연지리","cat":"기후학","type":"자료 해석","text":"겨울철 북태평양 북부에는 반영구적인 ( ㉠ ) 저기압이, 아시아 대륙에는 시베리아 고기압이 발달하여 우리나라는 서고동저형 기압 배치가 나타난다. 이때 등압선 간격이 좁을수록 ( ㉡ )이/가 커져 북서 계절풍이 강하게 분다.","blanks":[{"l":"㉠","a":["알류샨"]},{"l":"㉡","a":["기압경도력","기압 경도력"]}],"task":"고기압 중심부에서 바람이 약한 이유를 ㉡과 관련지어 서술하시오.","model":"고기압 중심부는 등압선 간격이 넓어 기압 차(기압 경도)가 작으므로 기압경도력이 약해 바람이 약하다.","rubric":["등압선 간격 넓음","기압 차 작음","기압경도력 약함"],"wrongs":[{"a":"전향력","why":"전향력은 바람 방향을 편향시킬 뿐 속도의 크기를 결정하지 않는다."}],"rel":["알류샨 저기압","기압경도력"],"id":"p126"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"A사는 고객 대면 업무는 대도시 본사에 두고, 회계·자료 처리·콜센터 같은 ( ㉠ ) 기능을 임금이 낮은 해외로 이전하였다. 이때 해외 자회사를 세워 직접 수행하는 방식은 ( ㉡ )에 해당하며, 외부 기업에 위탁하는 아웃소싱과 구분된다.","blanks":[{"l":"㉠","a":["백오피스","백 오피스"]},{"l":"㉡","a":["오프쇼어링","역외 이전"]}],"task":"㉡과 아웃소싱의 차이를 기업 경계(소유 관계)의 관점에서 서술하시오.","model":"아웃소싱은 생산·업무를 기업 외부의 비계열사에 위탁하는 외부화이고, 오프쇼어링은 입지를 해외로 옮기는 것으로 해외 계열사와 내부 거래를 하는 내부화 방식이 가능하다.","rubric":["아웃소싱=외부화","오프쇼어링=해외 입지","계열사 내부 거래"],"wrongs":[{"a":"아웃소싱","why":"아웃소싱은 외부 위탁. 해외 자회사를 통한 직접 수행은 오프쇼어링."}],"rel":["백오피스","오프쇼어링","아웃소싱"],"id":"p127"},{"subj":"인문지리","cat":"경제지리","type":"자료 해석","text":"B 지역의 다국적 기업들은 다기능 교육훈련으로 노동자가 여러 직무를 수행하게 하는 ( ㉠ ) 대신, 해고와 임시직·시간제 확대로 고용 규모를 조절하는 ( ㉡ )에 초점을 두어 노동시장 유연성을 추구하였다.","blanks":[{"l":"㉠","a":["기능적 유연성"]},{"l":"㉡","a":["수량적 유연성"]}],"task":"㉡ 중심의 전략이 지역 제조업 경쟁력 회복에 불리했던 이유를 서술하시오.","model":"수량적 유연성은 고용 불안과 저숙련 노동을 늘려 숙련 축적과 혁신을 어렵게 하므로, 다기능 숙련에 기반한 생산성 향상이 이루어지지 못해 경쟁력 회복에 불리하다.","rubric":["고용 불안","숙련 축적 저해","혁신·생산성 저하"],"wrongs":[],"rel":["기능적 유연성","수량적 유연성"],"id":"p128"},{"subj":"인문지리","cat":"도시지리","type":"개념 설명","text":"크리스탈러의 중심지 체계에서 하위 중심지가 상위 중심지를 잇는 교통로 위, 즉 정육각형 변의 중점에 위치하는 원리를 ( ㉠ ) 원리라 하며 K값은 ( ㉡ )이다.","blanks":[{"l":"㉠","a":["교통"]},{"l":"㉡","a":["4","K=4"]}],"task":"행정 원리(K=7)가 적용될 때 하위 중심지의 배치 특징을 서술하시오.","model":"행정 원리에서는 상위 중심지의 배후지 안에 하위 중심지 6개가 온전히 포함되도록 배치되어, 하위 중심지의 배후지가 여러 상위 중심지 관할로 나뉘지 않는다.","rubric":["배후지 내 6개 포함","관할 분할 없음"],"wrongs":[{"a":"3","why":"K=3은 시장 원리로 하위 중심지가 정육각형 꼭짓점에 위치."}],"rel":["교통 원리","행정 원리","시장 원리"],"id":"p129"},{"subj":"인문지리","cat":"도시지리","type":"자료 해석","text":"머디는 사회 지역 분석 결과를 종합하여 사회경제적 지위는 ( ㉠ ) 패턴, 가족 지위는 ( ㉡ ) 패턴, 민족 지위는 특정 지역에 군집하는 다핵 패턴을 보인다고 정리하였다.","blanks":[{"l":"㉠","a":["선형","부채꼴","선형(부채꼴)"]},{"l":"㉡","a":["동심원"]}],"task":"가족 지위가 ㉡ 패턴을 보이는 이유를 생애 주기와 관련지어 서술하시오.","model":"자녀가 있는 가구는 넓은 주택과 쾌적한 환경을 찾아 도심에서 먼 교외에 거주하고, 독신·노인 가구는 도심 가까이에 거주하는 등 생애 주기에 따라 도심으로부터 거리별로 분화되기 때문이다.","rubric":["생애 주기","자녀 가구 교외","도심 거리별 분화"],"wrongs":[],"rel":["머디 모델","사회 지역 분석"],"id":"p130"},{"subj":"인문지리","cat":"도시지리","type":"개념 설명","text":"실제 시가지가 법률상 도시 경계보다 넓게 확장되어 있는 도시를 ( ㉠ ), 반대로 법률상 경계가 시가지보다 넓어 농촌 지역까지 포함하는 도시를 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["과소경계도시","과소 경계 도시"]},{"l":"㉡","a":["과대경계도시","과대 경계 도시"]}],"task":"㉠에서 나타날 수 있는 행정상의 문제를 서술하시오.","model":"시가지가 행정 경계 밖으로 넘어가 실제 도시 인구·기능이 통계에 과소 반영되고, 경계 밖 주민이 도시 서비스를 이용하지만 세금은 다른 지자체에 내는 등 재정·서비스 공급의 불일치가 생긴다.","rubric":["통계 과소 반영","서비스·재정 불일치"],"wrongs":[],"rel":["과소경계도시","과대경계도시"],"id":"p131"},{"subj":"지리교육론","cat":"지리교육론","type":"교수·학습","text":"오수벨은 가장 일반적·포괄적인 개념을 먼저 제시하고 점차 세분화하는 ( ㉠ )의 원리와, 새 개념과 기존 개념의 유사점·차이점을 명시해 인지 구조 속에 통합하는 ( ㉡ )의 원리를 제시하였다.","blanks":[{"l":"㉠","a":["점진적 분화"]},{"l":"㉡","a":["통합적 조정"]}],"task":"선행 조직자가 유의미 학습을 돕는 원리를 서술하시오.","model":"선행 조직자는 학습 전에 제시되는 포괄적·추상적 개념으로, 학습자의 기존 인지 구조와 새 학습 내용을 연결하는 정착지(포섭자) 역할을 하여 새 지식이 의미 있게 포섭되도록 돕는다.","rubric":["포괄적 개념","기존 인지 구조 연결","포섭"],"wrongs":[],"rel":["점진적 분화","통합적 조정","선행 조직자"],"id":"p132"},{"subj":"지리교육론","cat":"지리교육론","type":"평가","text":"이 교사는 단원 시작 전에 학생들의 선수 학습 정도와 선개념·오개념을 파악하기 위해 ( ㉠ )을/를 실시하고, 단원 종료 후 학습 목표 성취 정도를 종합 판정하기 위해 ( ㉡ )을/를 실시하였다.","blanks":[{"l":"㉠","a":["진단평가","진단 평가"]},{"l":"㉡","a":["총괄평가","총괄 평가"]}],"task":"평가 도구의 타당도가 낮아지는 사례를 들어 서술하시오.","model":"타당도는 평가 도구가 측정하려는 것을 실제로 측정하는 정도로, 예컨대 지도 해석 능력을 평가하려면서 단순 지명 암기 문항만 출제하면 측정 목적과 내용이 일치하지 않아 타당도가 낮아진다.","rubric":["측정 목적 일치","사례 제시"],"wrongs":[{"a":"형성평가","why":"형성평가는 수업 중 학습 진행 상황을 확인하고 피드백하는 평가."}],"rel":["진단평가","총괄평가","타당도"],"id":"p133"},{"subj":"지리교육론","cat":"지리교육론","type":"교수·학습","text":"논쟁 문제 수업에서 교사는 다양한 관점을 공정하게 제시하되 자신의 의견은 밝히지 않는 ( ㉠ ) 입장을 취하거나, 관점을 공정하게 다룬 뒤 자신의 견해도 공개하는 ( ㉡ ) 입장을 취할 수 있다(켈리).","blanks":[{"l":"㉠","a":["중립적 공평","중립적 공평성"]},{"l":"㉡","a":["신념을 가진 공평","신념을 가진 공평성"]}],"task":"㉡ 입장이 학생의 가치 판단 학습에 주는 장점을 서술하시오.","model":"교사가 공정한 절차를 지키면서도 근거를 갖춘 자신의 견해를 공개함으로써, 학생이 가치 판단을 정당화하는 방식을 모델로 삼고 교사 의견도 비판적으로 검토할 수 있게 한다.","rubric":["공정한 관점 제시","근거 있는 견해 공개","정당화 모델"],"wrongs":[{"a":"악마옹호형","why":"악마옹호형은 하우드의 역할로 의도적으로 반대 입장을 취해 토론을 촉진한다."}],"rel":["켈리의 교사 입장"],"id":"p134"},{"subj":"지리교육론","cat":"지리교육론","type":"교수·학습","text":"가네는 개념을 직접 관찰을 통해 학습되는 ( ㉠ ) 개념과, 정의를 통해서만 학습되는 ( ㉡ ) 개념으로 구분하였다. 예를 들어 산·강은 ㉠, 인구 밀도는 ㉡에 해당한다.","blanks":[{"l":"㉠","a":["구체적","관찰된","구체적(관찰된)"]},{"l":"㉡","a":["정의된"]}],"task":"속성 모형과 원형 모형의 차이를 결정적 속성과 관련지어 서술하시오.","model":"속성 모형은 개념의 결정적 속성을 정의하고 사례·비사례를 구분해 학습하며, 원형 모형은 결정적 속성이 분명하지 않을 때 가장 전형적인 사례(원형)를 중심으로 유사성에 따라 개념을 학습한다.","rubric":["결정적 속성","전형적 사례","유사성"],"wrongs":[],"rel":["가네의 개념 분류","속성 모형과 원형 모형"],"id":"p135"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"펙과 티켈에 따르면 신자유주의는 복지·규제를 축소하고 국가 역할을 줄이는 ( ㉠ ) 단계와, 시장 친화적 제도와 규제를 새로 구축하는 ( ㉡ ) 단계로 구분된다.","blanks":[{"l":"㉠","a":["롤백","roll-back"]},{"l":"㉡","a":["롤아웃","roll-out"]}],"task":"케인스주의 복지국가 시기 도시 정부의 성격을 관리주의 관점에서 서술하시오.","model":"케인스주의 복지국가 시기 도시 정부는 중앙 정부의 재정 지원을 바탕으로 주택·복지 등 집합적 소비 수단을 공급·관리하는 관리주의적 성격을 지녔다.","rubric":["집합적 소비 공급","중앙 정부 재정","관리주의"],"wrongs":[],"rel":["롤백·롤아웃 신자유주의","케인스주의 복지국가"],"id":"p136"},{"subj":"자연지리","cat":"지도학·GIS","type":"지도·자료 해석","text":"지형도에서 지도 좌표 격자의 세로선이 가리키는 북쪽을 ( ㉠ )(이)라 하며, 진북과 ㉠ 사이의 각을 ( ㉡ )(이)라고 한다. 진북과 자북 사이의 각은 자편각, ㉠과 자북 사이의 각은 도자각이다.","blanks":[{"l":"㉠","a":["도북"]},{"l":"㉡","a":["도편각"]}],"task":"1:50,000 지형도 한 도엽(도곽)의 경위도 범위를 쓰고, 막대 축척이 지도를 확대·축소해도 유효한 이유를 서술하시오.","model":"1:50,000 지형도 한 도엽은 경위도 15′×15′ 범위이며, 막대 축척은 지도와 함께 같은 비율로 확대·축소되므로 막대 길이가 나타내는 실제 거리가 그대로 유지된다.","rubric":["15′×15′","지도와 함께 확대·축소"],"wrongs":[{"a":"자편각","why":"자편각은 진북과 자북 사이의 각."}],"rel":["도북","도편각","도곽","막대 축척"],"id":"p137"},{"subj":"인문지리","cat":"인구지리","type":"이론 적용","text":"( ㉠ )의 이동 전환 모델에 따르면 근대화 이전 사회에서는 인구 이동이 제한적이지만, 인구 변천의 초기 확장기에는 농촌에서 도시로의 이동과 해외 이민이 급증한다. 후기 확장기를 지나 선진 사회에 이르면 농촌→도시 이동은 줄고 ( ㉡ ) 이동과 통근 같은 순환 이동이 주를 이루며, 초선진 사회에서는 통신 발달이 일부 이동을 대체한다.","blanks":[{"l":"㉠","a":["젤린스키"]},{"l":"㉡","a":["도시 간","도시간"]}],"task":"이 모델이 인구 변천 모형과 어떤 관계에 있는지 서술하고, 우리나라 1960~70년대 이동 양상을 모델의 단계에 대응시키시오.","model":"이동 전환 모델은 인구 변천 단계(사망률·출생률 변화)와 근대화 단계에 대응해 이동 유형이 바뀐다고 본다. 1960~70년대 우리나라는 산업화로 이촌향도(농촌→도시) 이동이 급증한 초기·후기 확장 단계에 해당한다.","rubric":["인구 변천 단계 대응","이촌향도 급증 = 확장 단계"],"wrongs":[{"a":"라벤스타인","why":"라벤스타인은 이동 법칙(단거리·단계·역류)을 제시했다."}],"rel":["젤린스키 이동 전환 모델","인구 변천 모형"],"src":"r14 고전(장기 휴면 개념)","id":"p138"},{"subj":"인문지리","cat":"인구지리","type":"이론 적용","text":"리(Lee)는 인구 이동을 출발지의 ( ㉠ ) 요인과 도착지의 ( ㉡ ) 요인, 그리고 두 지역 사이에 놓인 거리·비용·이민 법규 같은 ( ㉢ ) 요인과 개인적 요인으로 설명하였다.","blanks":[{"l":"㉠","a":["배출"]},{"l":"㉡","a":["흡인"]},{"l":"㉢","a":["중간 장애","중간장애"]}],"task":"국제 노동 이주 사례를 들어 ㉢ 요인이 이동을 억제하는 방식을 서술하시오.","model":"출신국의 저임금(배출)과 목적국의 고임금(흡인)이 있어도 원거리 이동 비용·비자 규제·언어 장벽 같은 중간 장애 요인이 크면 이동이 억제되고, 이를 극복할 자원을 가진 사람만 선택적으로 이동한다.","rubric":["배출/흡인 구분","중간 장애 예시","선택적 이동"],"wrongs":[{"a":"개입 기회","why":"개입 기회는 스토우퍼의 개념이다."}],"rel":["리의 인구 이동 모델"],"src":"r14 고전","id":"p139"},{"subj":"인문지리","cat":"도시지리","type":"계산·이론 적용","text":"( ㉠ ) 모델에 따르면 두 도시 간 상호작용은 두 도시 인구의 곱에 비례하고 거리의 제곱에 반비례한다. 한편 스토우퍼는 이동량이 거리 자체보다 그 사이에 놓인 ( ㉡ )의 수에 의해 좌우된다고 보았다.","blanks":[{"l":"㉠","a":["중력"]},{"l":"㉡","a":["개입 기회","중간 기회"]}],"task":"인구가 각각 100만·50만인 A·B 두 도시 거리가 50km에서 고속철도로 시간거리가 절반이 되었을 때, 시간거리를 거리로 쓰면 상호작용 지수가 몇 배가 되는지 쓰고 그 의미를 서술하시오.","model":"거리가 1/2이 되면 거리 제곱이 1/4이 되어 상호작용은 4배가 된다. 교통 발달로 시간거리가 줄면 거리 조락이 약해져 상호작용이 크게 늘어난다(시공간 수렴).","rubric":["4배","거리 제곱 반비례","시공간 수렴/거리 조락 약화"],"wrongs":[{"a":"2배","why":"거리의 제곱에 반비례하므로 4배."}],"rel":["중력 모형","개입 기회","거리 조락"],"src":"r14 고전","id":"p140"},{"subj":"자연지리","cat":"지형학","type":"형성 과정 서술","text":"우리나라 산지 사면이나 골짜기에 크고 작은 각진 암괴가 쌓인 ( ㉠ )은/는 현재 기후에서는 거의 움직이지 않는 화석 지형이다. 기반암 절리를 따라 ( ㉡ ) 작용으로 암괴가 떨어져 나오고, 세립 물질이 제거된 뒤 ( ㉢ ) 같은 사면 이동으로 암괴가 집적된 것으로 해석된다.","blanks":[{"l":"㉠","a":["암괴류"]},{"l":"㉡","a":["동결 풍화","동결파쇄","서릿발"]},{"l":"㉢","a":["솔리플럭션","유상 포행"]}],"task":"㉠의 형성 과정을 기후 환경(시기)과 함께 순서대로 서술하시오.","model":"최종 빙기의 주빙하 기후에서 절리가 발달한 기반암이 동결 풍화로 암괴화되고, 솔리플럭션으로 사면 아래로 이동·집적되었다. 후빙기 기온 상승 후 세립 물질이 유수로 씻겨 나가 암괴만 남아 현재는 화석 지형이 되었다.","rubric":["최종 빙기 주빙하","동결 풍화","솔리플럭션","세립물질 제거·화석 지형"],"wrongs":[{"a":"애추","why":"애추는 절벽 아래 낙석이 쌓인 원추형 퇴적 사면."}],"rel":["암괴류","솔리플럭션"],"src":"r14 형성과정","id":"p141"},{"subj":"자연지리","cat":"지형학","type":"형성 과정 서술","text":"동해안의 석호는 후빙기 해수면 상승으로 하곡이 침수되어 형성된 ( ㉠ )의 입구를 연안류가 운반한 모래가 ( ㉡ )로 막으면서 만들어졌다. 석호는 유입 하천의 퇴적으로 점차 ( ㉢ )된다.","blanks":[{"l":"㉠","a":["만","익곡"]},{"l":"㉡","a":["사주"]},{"l":"㉢","a":["축소","매립","소멸"]}],"task":"석호의 형성 과정을 해수면 변동과 함께 순서대로 서술하고, 석호가 시간이 지나며 축소되는 이유를 쓰시오.","model":"최종 빙기 하곡이 후빙기 해수면 상승으로 침수되어 만이 되고, 연안류·파랑이 운반한 모래가 사주로 만 입구를 막아 석호가 되었다. 이후 하천이 운반한 토사가 퇴적되어 석호는 점차 메워지며 축소된다.","rubric":["후빙기 해수면 상승","하곡 침수(만)","사주 발달","하천 퇴적으로 축소"],"wrongs":[{"a":"육계사주","why":"육계사주는 섬과 육지를 잇는 사주."}],"rel":["석호","사주"],"src":"r14 형성과정","id":"p142"},{"subj":"자연지리","cat":"지형학","type":"형성 과정 서술","text":"석회암 지대에서는 이산화탄소가 녹은 빗물이 탄산칼슘을 녹이는 ( ㉠ ) 작용으로 지표에 깔때기 모양의 ( ㉡ )이/가 생기고, 이들이 합쳐져 ( ㉢ )이/가 된다. 지하에서는 석회동굴이 발달하며, 잔류 불순물은 붉은 ( ㉣ ) 토양이 된다.","blanks":[{"l":"㉠","a":["용식"]},{"l":"㉡","a":["돌리네"]},{"l":"㉢","a":["우발라"]},{"l":"㉣","a":["테라로사"]}],"task":"돌리네에서 우발라로 발달하는 과정과 석회동굴 내 종유석·석순의 형성 과정을 서술하시오.","model":"빗물(탄산)에 의한 용식이 절리 교차점에 집중되어 돌리네가 생기고, 돌리네가 확대·연결되어 우발라가 된다. 동굴에서는 탄산칼슘이 녹은 물이 떨어지며 이산화탄소가 빠져나가 탄산칼슘이 재침전되어 천장에 종유석, 바닥에 석순이 자란다.","rubric":["탄산에 의한 용식","돌리네 연결 → 우발라","CO2 방출로 재침전"],"wrongs":[{"a":"폴리에","why":"폴리에는 대규모 용식 분지로 우발라보다 크다."}],"rel":["돌리네","우발라","테라로사"],"src":"r14 형성과정","id":"p143"},{"bp":"BP04","subj":"인문지리","cat":"도시지리","type":"모식도 판독","text":"버제스의 동심원 모델에서 도심(CBD) 바로 바깥의 A 지대는 상업·공업 기능이 침입하며 노후 주택이 밀집한 ( ㉠ )(이)다. 그 바깥 B 지대는 공장 노동자 주거 지대, C 지대는 중산층 주거 지대, 가장 바깥은 ( ㉡ ) 지대이다.","blanks":[{"l":"㉠","a":["점이 지대","점이지대","천이 지대"]},{"l":"㉡","a":["통근자","통근"]}],"task":"A~C 지대를 따라 주거 환경의 질적 수준이 어떻게 달라지는지 쓰고, 이를 만든 과정을 생태학적 용어 2개를 사용해 서술하시오.","model":"도심에서 멀어질수록(A→C) 주거 환경의 질이 높아진다. 도심 기능 확장에 따른 침입(invasion)과 천이(succession)로 고소득층이 바깥으로 이동하고, 내부 지대는 저소득층·이민자가 차지하며 노후화된다.","rubric":["외곽일수록 질 향상","침입","천이"],"wrongs":[{"a":"선형 모델","why":"호이트 선형 모델은 교통축을 따라 부채꼴로 확장."}],"rel":["점이 지대"],"id":"p144","src":"r14 blueprint BP04"},{"bp":"BP05","subj":"인문지리","cat":"경제지리","type":"계산+해석","text":"어떤 산업의 지역 내 고용 비중을 전국의 해당 산업 고용 비중으로 나눈 값을 ( ㉠ )(이)라 한다. A시의 제조업 고용 비중은 40%, 전국은 20%이고, B시의 제조업 고용 비중은 10%이다.","blanks":[{"l":"㉠","a":["입지계수","입지 계수","LQ"]}],"task":"A·B시의 ㉠ 값을 계산하고, 값의 크기 측면에서 두 도시의 제조업 성격을 비교 서술하시오.","model":"A시 = 40/20 = 2.0, B시 = 10/20 = 0.5이다. A시는 1보다 커 제조업이 특화된 기반(수출) 산업이며, B시는 1보다 작아 제조업이 전국 평균보다 덜 집중되어 역외 의존적이다.","rubric":["A 2.0","B 0.5","1 기준 특화/비특화"],"wrongs":[{"a":"승수 효과","why":"승수는 기반 고용 증가에 따른 총고용 증가 배수."}],"rel":["입지 계수"],"id":"p145","src":"r14 blueprint BP05"},{"bp":"BP06","subj":"자연지리","cat":"기후학","type":"메커니즘 서술","text":"여름철 습윤한 공기가 산맥을 넘을 때 바람받이 사면에서는 상승 공기가 ( ㉠ ) 단열 감률로 냉각되다가 응결 고도 이후 ( ㉡ ) 단열 감률로 냉각되며 비를 내린다. 바람그늘 사면에서 하강하면서 공기는 고온 건조해지는데 이를 푄 현상이라 한다.","blanks":[{"l":"㉠","a":["건조"]},{"l":"㉡","a":["습윤"]}],"task":"바람그늘 사면의 기온이 같은 고도의 바람받이 사면보다 높아지는 이유를 숨은열(잠열)과 단열 감률 측면에서 서술하시오.","model":"바람받이 사면에서 응결 이후에는 숨은열이 방출되어 습윤 단열 감률(약 0.5℃/100m)로 천천히 냉각되지만, 수증기를 잃은 공기는 바람그늘 사면을 하강할 때 건조 단열 감률(약 1℃/100m)로 빠르게 승온하므로 같은 고도에서 더 고온 건조해진다.","rubric":["응결 시 잠열 방출","습윤 감률 < 건조 감률","하강 시 건조 단열 승온"],"wrongs":[{"a":"기온 역전","why":"역전은 고도가 높을수록 기온이 높아지는 현상."}],"rel":["푄 현상"],"id":"p146","src":"r14 blueprint BP06"},{"bp":"BP08","subj":"지리교육론","cat":"지리교육론","type":"오류 찾기","text":"[수업 설계 메모] ㉠ 오수벨의 선행 조직자는 학습 후에 제시하여 배운 내용을 정리하게 한다. ㉡ 비교 선행 조직자는 익숙한 개념과 새 개념의 공통점·차이점을 대비시킨다. ㉢ 유의미 학습이 일어나려면 학습 과제가 학습자의 ( ㉣ )와 관련지어질 수 있어야 한다.","blanks":[{"l":"㉣","a":["인지 구조","인지구조"]}],"task":"㉠~㉢ 중 틀린 진술을 찾아 기호를 쓰고 바르게 고쳐 쓰시오.","model":"㉠이 틀렸다. 선행 조직자는 학습 과제 제시 이전에 제공되는, 더 높은 추상성·포괄성을 가진 도입 자료로 학습자의 인지 구조에 새 내용을 정착시킬 발판을 마련한다.","rubric":["㉠ 선택","학습 전 제시","포괄적·추상적 도입 자료"],"wrongs":[{"a":"㉡","why":"비교 조직자 설명은 옳다."}],"rel":["선행 조직자","인지구조"],"id":"p147","src":"r14 blueprint BP08"},{"bp":"BP08","subj":"자연지리","cat":"지형학","type":"오류 찾기","text":"[답사 보고서] ㉠ 감입 곡류 하천은 하방 침식이 우세하여 곡류가 단단한 기반암을 깊게 파고든다. ㉡ 하안 단구의 단구면에는 둥근 자갈이 나타나 과거 하상이었음을 알려 준다. ㉢ 자유 곡류 하천의 공격 사면에서는 퇴적이, 보호 사면에서는 침식이 활발하다. 곡류 안쪽 보호 사면에 쌓인 반달 모양 퇴적 지형은 ( ㉣ )(이)다.","blanks":[{"l":"㉣","a":["포인트 바","포인트바","활주 사면 퇴적"]}],"task":"㉠~㉢ 중 틀린 진술의 기호를 쓰고 바르게 고쳐 쓰시오.","model":"㉢이 틀렸다. 곡류의 공격 사면(바깥쪽)에서는 유속이 빨라 침식이 활발해 하식애가 생기고, 보호 사면(안쪽)에서는 유속이 느려 퇴적이 일어나 포인트바(활주 사면)가 생긴다.","rubric":["㉢ 선택","공격 사면 침식","보호 사면 퇴적"],"wrongs":[{"a":"㉡","why":"단구면 원력은 과거 하상 증거로 옳은 진술."}],"rel":["하안 단구"],"id":"p148","src":"r14 blueprint BP08"},{"bp":"BP09","subj":"지역지리 및 기타","cat":"문화·역사·정치지리","type":"고지도 세계관","text":"조선 후기 민간에서 유행한 ( ㉠ )은/는 중국을 중심에 둔 내대륙과 이를 둘러싼 내해·외대륙·외해의 원형 구성으로, 실재 지역과 『산해경』 속 상상의 나라를 함께 담았다. 반면 중세 유럽의 TO 지도는 ( ㉡ )을/를 지도 중앙에, 동쪽을 위쪽에 두었다.","blanks":[{"l":"㉠","a":["천하도"]},{"l":"㉡","a":["예루살렘"]}],"task":"두 지도에 공통으로 나타나는 세계관의 특징을 서술하시오.","model":"두 지도 모두 실측보다 관념을 우선한 종교적·문화적 세계관을 반영한다. 천하도는 중화적·도교적 세계관에서 중국을 중심에, TO 지도는 기독교 세계관에서 예루살렘을 중심에 두어 자기 문화 중심적 세계 인식을 드러낸다.","rubric":["관념적·종교적 세계관","자기 중심(중국/예루살렘)"],"wrongs":[{"a":"혼일강리역대국도지도","why":"혼일강리도는 실제 지역을 담은 조선 초기 관찬 세계지도."}],"rel":["천하도"],"id":"p149","src":"r14 blueprint BP09"},{"bp":"BP10","subj":"지역지리 및 기타","cat":"지역지리","type":"분쟁 지명+종교","text":"남아시아의 ( ㉠ ) 지역은 1947년 인도·파키스탄 분리 독립 이후 영유권 분쟁이 이어졌다. 주민 다수는 ( ㉡ )을/를 믿지만 지역 지배층이 인도 편입을 선택한 것이 갈등의 발단이 되었다.","blanks":[{"l":"㉠","a":["카슈미르"]},{"l":"㉡","a":["이슬람교","이슬람"]}],"task":"이 분쟁이 종교 분포와 정치적 경계가 어긋날 때 나타나는 갈등의 사례인 이유를 서술하시오.","model":"카슈미르는 주민 다수가 이슬람교도이나 힌두교도 번왕이 인도 편입을 택해, 종교·문화 경계와 국가 경계가 불일치하면서 인도(힌두교 다수)와 파키스탄(이슬람교) 간 영유권 분쟁이 지속되었다.","rubric":["주민 이슬람 다수","인도 편입 결정","종교 경계-국경 불일치"],"wrongs":[{"a":"펀자브","why":"펀자브는 분리 때 인도·파키스탄으로 분할된 지역."}],"rel":["카슈미르 분쟁"],"id":"p150","src":"r14 blueprint BP10"},{"bp":"BP03","subj":"인문지리","cat":"인구지리","type":"작성 방법 서술","text":"출생아 수를 연앙 인구로 나눈 값인 ( ㉠ )은/는 연령 구조의 영향을 받는다. 그래서 고령 인구 비중이 높은 도시는 ( ㉡ )이/가 높게 나타날 수 있어, 연령 구조를 보정한 지표로 비교해야 한다.","blanks":[{"l":"㉠","a":["조출생률"]},{"l":"㉡","a":["조사망률"]}],"task":"공업 도시 A가 관광·은퇴 도시 B에 비해 조사망률이 낮은 이유를 인구 구조 측면에서 서술하시오.","model":"공업 도시 A는 청장년층 노동력 유입으로 생산가능인구 비중이 높고 노년층 비중이 낮아 조사망률이 낮다. 은퇴 도시 B는 노년층 비중이 높아 사망률 수준이 같아도 조사망률이 높게 나타난다.","rubric":["청장년층 유입","노년 비중 차이","연령 구조 효과"],"wrongs":[{"a":"영아 사망률","why":"영아 사망률은 출생아 1,000명당 1세 미만 사망."}],"rel":["조출생률","조사망률"],"id":"p151","src":"r14 blueprint BP03"}]</script>
<script type="application/json" id="wbd">{"wb":[{"id":"2023A-02","y":2023,"link":[],"text":"( ㄱ ) 사막은 ( A )의 영향으로 발달한다. 특히 앙골라의 중앙 산지로부터 발원하여 이곳으로 유입한 오카방고 강은 사막의 평원에 퍼져 흐르며 사라져서 오카방고 삼각주를 형성한다. ( ㄴ ) 사막은 ( A )와/과 한류의 영향으로 발달한다.","bl":[["ㄱ","칼라하리",""],["ㄴ","나미브",""],["A","아열대 고기압",""]],"ex":"ㄷ-모하비, ㄹ-소노란, ㅁ-아타카마, ㅂ-파타고니아","cat":"문화·역사·정치지리","rel":["","",""]},{"id":"2023A-03","y":2023,"link":[],"text":"( ㄱ )어는 서로 다른 언어 집단들이 접촉하는 과정에서 형성된 언어이다. 간단한 의사소통을 위한 실용적인 언어이고, 문법과 어휘가 간략한 것이 특징이다. 이러한 ( ㄱ )이/가 정교한 문법 체계를 확립하고 고유한 어휘를 생성하면서 ( ㄴ )어로 발전하는데, 이는 ( ㄱ )과 달리 사람들 사이에서 전해져 그 사회에 모국어가 된다. 한편, ( ㄴ )의 명칭은 아메리카 대륙에서 태어난 ( ㄷ )인의 자손을 일컫는 말에서 비롯되었다.","bl":[["ㄱ","피진",""],["ㄴ","크리올",""],["ㄷ","에스파냐",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","",""]},{"id":"2023A-05","y":2023,"link":[],"text":"머디의 이론에 따르면, 만약 경제 상태가 유일한 도시의 구성요소라면 도시 공간은 ( ㄱ ) 패턴 으로, 가족 상태가 지배적 요소라면 도시 공간은 ( ㄴ ) 패턴으로, 인종 상태가 주요 요소라면 도시 공간은 ( ㄷ ) 패턴으로 나타난다. 이와 같은 도시의 사회적 공간을 구성하는 3가지 차원 을 도시의 물리적 공간과 중첩 시키면 3가지 패턴이 서로 얽혀 격자가 마치 거미줄 모양을 띠 는데, 이렇게 형성된 각각의 셀이 바로 사회적 동질성을 지니는 ( ㄹ )(이)다.","bl":[["ㄱ","선형",""],["ㄴ","동심원",""],["ㄷ","다핵",""],["ㄹ","사회지역",""]],"ex":"","cat":"도시지리","rel":["","","",""]},{"id":"2023A-06","y":2023,"link":[],"text":"( ㄱ ) : 개인의 경험과 사회적 상호 작용이 어우러져 의미가 부여된 공간 ( ㄴ ) : 사람들이 장소에 대해 느끼는 다양한 감정 ( ㄷ ) : 각 장소에서만 나타나는 특별한 성격","bl":[["ㄱ","장소",""],["ㄴ","장소감",""],["ㄷ","장소 정체성",""]],"ex":"","cat":"문화·역사·정치지리","rel":["장소","장소감",""]},{"id":"2023A-06","y":2023,"link":[],"text":"자본주의의 특징 중 하나인 불균등발전은 닐 스미스에 의해 ( ㄱ )와/과 ( ㄴ )의 변증법적 관계 로 설명된다. ( ㄱ )은/는 새로운 공간적 조정을 통해 사람, 자원, 공간을 자본주의 궤도로 통합 하는 과정이고, ( ㄴ )은/는 선호 지역을 발전시키고 수익성이 낮은 지역을 평가절하하며 포기하 는 과정을 의미한다.","bl":[["ㄱ","균등화",""],["ㄴ","차별화",""]],"ex":"","cat":"지리교육론","rel":["",""]},{"id":"2023A-10","y":2023,"link":[],"text":"암석이 풍화를 받아 형성되는 풍화산물은 크기에 따라 암석, 자갈, 모래, ( ㄱ ), ( ㄴ )(으)로 구 분된다. 이 중 모래는 주로 ( 기계적 / 화학적 ) 풍화에 의한 산물이다. 한편 사막은 구성물질에 따라 암석사막, 자갈사막, 모래사막으로 구분한다. 모래사막은 아라비아어로 사구 평원이라는 뜻을 지닌 ( ㄷ )(으)로도 불린다. 자갈사막은 사하라 사막 서부에서 사막포도가 발달한 사막이 라는 뜻을 지닌 ( ㄹ )(으)로도 불린다. 암석사막은 ( ㅁ )(으)로도 불린다.","bl":[["ㄱ","니토(실트)",""],["ㄴ","점토","기계적"],["ㄷ","에르그",""],["ㄹ","레그",""],["ㅁ","하마다",""]],"ex":"","cat":"지형학","rel":["","","에르그","",""]},{"id":"2023B-01","y":2023,"link":[],"text":"( ㄱ )은/는 빙하 상부에서 운반되던 퇴적 물질이 융빙과 함께 퇴적물이 원래 있던 곳의 아래에 집적된 지형으로, 분급은 ( 양호 / 불량 )한 편이다. 이들 가운데 ( ㄴ )은/는 융빙수 하천이 빙 하의 말단이나 측면으로부터 흘러나와 호수로 유입되는 지점에서 형성되는 지형이다. 한편 ( ㄷ )은/는 빙하가 활동하던 시기에 땅속에 묻혔던 얼음이 녹아 없어져 형성된 와지이다.","bl":[["ㄱ","케임","불량"],["ㄴ","케임 삼각주",""],["ㄷ","케틀",""]],"ex":"","cat":"지형학","rel":["","",""]},{"id":"2023B-05","y":2023,"link":[],"text":"( ㄱ )은/는 융기한 지형이 하천 침식을 받으면 경사가 급한 상부 사면이 완만한 하부 사면보다 빠르게 침식되어 산지의 고도가 낮아진다는 주장으로, ( 습윤 / 건조 )지역에서 잘 나타난다. ( ㄴ )은/는 경사가 급한 상부 사면이 완만한 하부 사면으로 대체되면서 사면이 발달한다는 주장 이다. 단애면으로부터 ( 기계적 / 화학적 ) 풍화에 의한 암설 공급이 활발해지면서 ( ㄷ )(이)가 형성되고, 단애면이 후퇴함에 따라 ( ㄷ )(이)가 상부 쪽으로 확대되는 것이 대표적이다. 셋째, ( ㄹ )은 상부의 단애면과 하부의 완사면이 그 형태를 유지하면서 후퇴한다는 주장으로, ( 습윤 / 건조 )지역에서 잘 나타난다.","bl":[["ㄱ","사면감쇠설","습윤"],["ㄴ","사면대체설",""],["ㄷ","애추",""],["ㄹ","사면평행후퇴설","건조"]],"ex":"","cat":"지형학","rel":["","사면 대체설","애추","사면 평행 후퇴설"]},{"id":"2023B-08","y":2023,"link":[],"text":"지형과 수륙분포 특성의 영향을 받는 지역에서는 유입되는 바람의 방향이나 성격이 ( ㄱ ) 변동 에 큰 영향을 준다. 서아프리카 기니만 일대에서는 ( ㄴ )의 영향으로 인해 여름과 겨울의 계절 변화에 따라 풍향과 성질이 완전히 바뀌는 바람인 ( ㄷ )이/가 나타나는데, 1월에는 ( ㄹ ), 7월 에는 ( ㅁ )이 우세하다. 1월에 서아프리카 지역에서는 사하라 사막의 모래 먼지를 동반한 건조 한 열풍인 ( ㅂ ) 바람이 발생하기도 한다. *ㄹ, ㅁ은 북풍, 남풍, 서풍, 동풍, 북동풍, 북서풍, 남동풍, 남서풍 중 각각 하나","bl":[["ㄱ","강수량",""],["ㄴ","열대수렴대",""],["ㄷ","몬순(계절풍)",""],["ㄹ","북동풍",""],["ㅁ","남서풍",""],["ㅂ","하르마탄",""]],"ex":"","cat":"기후학","rel":["","열대 수렴대","","","",""]},{"id":"2022A-01","y":2022,"link":[],"text":"( a )(이)라는 말은 장풍득수를 의미하며, 기운으로써 바람을 갈무리하고 생계를 위하여 물을 얻 는다는 뜻이다. ( a )에서 생기를 잘 갈무리할 곳을 ( b )(이)라고 하며, 이곳을 둘러싼 ( c )인 청룡, 백호, 현무, 주작을 가려서 밝히는 것을 ( d )(이)라고 한다. 대부분 유력한 종족촌락들은 ( b )에 입지하고 있다. 촌락의 배후에는 ( 청룡 / 백호 / 현무 / 주작 )에 해당하는 주산이 위치하 고, 주산으로부터 좌청룡과 우백호라 불리는 두 산줄기가 마을을 감싸고 있다.","bl":[["a","풍수",""],["b","명당",""],["c","사신사",""],["d","장풍법","현무"]],"ex":"","cat":"문화·역사·정치지리","rel":["","","사신사",""]},{"id":"2022A-02","y":2022,"link":[],"text":"고기후 분석에서 가장 중요한 것은 ( a )이다. 그리고 ( b )은/는 과거의 기후 조건에 따라 형성 된 특정한 상태가 현재까지 남겨져 있는 물질이나 현상을 통해 당시의 기후를 간접적으로 추정 할 수 있는 증거이다. 그 사례로 대륙 빙하에 파이프를 박아 시추한 시료인 ( c )를 들 수 있다. 또한 ( d )은/는 나무의 줄기를 가로로 잘랐을 때 나타나는 고리 모양의 구조인데, 가을에서 겨 울의 시기보다 봄에서 여름까지의 시기가 더욱 ( 두껍고 / 얇고 ), 색이 (진하다 / 옅다 ).","bl":[["a","기온",""],["b","프록시",""],["c","얼음 코어",""],["d","나이테(연륜)","두껍고, 진하다"]],"ex":"","cat":"기후학","rel":["","","얼음코어",""]},{"id":"2022B-05","y":2022,"link":[],"text":"학습자가 일상적인 경험을 통해 이미 형성된 개념인 ( a )이/가 그 시대의 과학적 지식과 다를 경우, 이를 ( b )(이)라고 한다. 즉, ( b )은/는 학습자가 특정 개념에 대해 개념화를 잘못한 것으 로, 이것의 형성 원인에는 ( c ) 요인, ( d ) 요인, ( e ) 요인이 있다. ( c ) 요인으로는 일상생활 및 학문에서 사용되는 언어의 의미 차이, 한자어의 음에 의존하여 뜻을 이해하려는 경향 등이 있다. ( d ) 요인으로는 수업 내용의 재조직, 언어를 통한 의미 전달 등이 있다. ( e ) 요인으로 는 개념 설명의 오류 및 생략, 용어의 잘못된 선택 및 문장의 문법적 구조에 따른 의미 차이 등이 있다.","bl":[["a","선개념",""],["b","오개념",""],["c","학습자",""],["d","교사",""],["e","교과서",""]],"ex":"","cat":"지리교육론","rel":["선개념","오개념","","",""]},{"id":"2022B-05","y":2022,"link":[],"text":"다음의 오개념 사례에 맞는 오개념의 유형을 쓰시오. Ÿ 풍화는 바람에 의해서 일어나는 지형 형성 작용이다. → ( a )와/과 관련된 오개념 Ÿ 삼각주는 삼각형 모양의 퇴적지형만을 의미한다. → ( b )와/과 관련된 오개념 Ÿ 공업도시는 2차 산업 종사자 비율이 가장 높다. → ( c )와/과 관련된 오개념 Ÿ 간석지와 간척지는 같다. → ( d )와/과 관련된 오개념 Ÿ 북극이 남극보다 더 춥다. → ( e )와/과 관련된 오개념","bl":[["a","개념",""],["b","개념",""],["c","일반화",""],["d","개념",""],["e","사실",""]],"ex":"","cat":"기후학","rel":["","","","",""]},{"id":"2022A-09","y":2022,"link":[],"text":"기반-비기반 분석은 제조업과 같이 도시 외부로부터 소득을 유발하여 경제 성장을 촉진하는 분 야는 ( a ) 활동, 도시 내부에서 발생하는 수요만을 충족하거나 도시 외부로 자본을 유출하는 ( b ) 활동으로 구분한다. 이 분석은 ( c )을/를 통해 도시경제의 성장을 예측할 수 있는데, ( c )      활동 고용 는 ‘   ’로 계산된다. *분모와 분자 각각 a, b 중 무엇일지 고르기      활동 고용 한편, ( d )은/는 지역의 산업 전문화(특화) 수준을 측정하는 지표이며, 이 값이 1보다 ( 크면 / 작으면 ) 해당 도시가 전문화(특화)되었다는 뜻이다.","bl":[["a","기반",""],["b","비기반",""],["c","승수효과",""],["d","입지계수","크면"]],"ex":"","cat":"경제지리","rel":["","","","입지 계수"]},{"id":"2022B-03","y":2022,"link":[],"text":"( a )은/는 교사가 스스로 실천적 지식을 개발해 온 방법이다. 즉, ( a )을/를 통한 실천이자 실 천을 수반한 ( a )(으)로부터 형성되는 실천적 지식은 교사의 전문성 개발에서 핵심적 개념으로 이해된다. ( a )적 실천은 ( b ), ( c ), ( d )로 구성된다. ( b )은/는 실제 활동 속에서 드러나는 노하우이고, ( c )은/는 언어화되거나 이론화되지 않은 지 식이다. 쇤은 일상적 행위를 이끄는 ( c )이/가 방해받을 때 ( a )이/가 일어난다고 보았다. ( d ) 은/는 ‘놀람’에서 시작하여, 진행 중인 행위의 기저 지식을 표면화·비판·재구성하고, 이를 후속 행위에 적용하여 검증하는 과정이다.","bl":[["a","반성",""],["b","행위 중 앎",""],["c","암묵적 지식",""],["d","행위 중 반성",""]],"ex":"","cat":"지리교육론","rel":["","","암묵적 지식",""]},{"id":"2022B-08","y":2022,"link":[],"text":"( a )은/는 구조주의 철학에서 나온 용어로 지식을 생산하는 일련의 개념, 진술, 실천의 네트워 크를 총칭한다. 어떤 ( a )은/는 의미를 생산하고 확산시키는 역할을 수행한다. 그 과정에서 ( a )은/는 단순히 현실의 반영에 그치는 것이 아니라, 적극적 확산과 능동적 실천조건을 형성해서 새로운 현실을 창출하기도 한다. 한편, ( b )은/는 1980년대 이후 인문지리학과 기타 사회과학의 주요 관심이 경제적 문제에서 문화적 문제로 변동한 것을 지칭한다.","bl":[["a","담론",""],["b","문화적 전환 *이나영 교수님이 엄청 강조했던거라",""]],"ex":"","cat":"경제지리","rel":["",""]},{"id":"2022B-09","y":2022,"link":[],"text":"월러스틴의 세계체제론은 세계도시 계층체계를 ( a )체계가 발생하는 과정을 통해 설명한다. 세 계 경제는 ( b ), ( c ), 주변 지대로 계층화되며, ( b ) 지대가 세계 경제 전체의 잉여분을 수탈 하는 형식으로 세계적 ( a )(이)가 이루어진다. 이 이론은 ( d )의 세계도시체계에 영향을 주었 다. 한편 녹스와 애그뉴의 이론은 1960년대만 해도 ( d )이/가 세계 경제의 중심이었지만, 이후 세계 경제가 ( e ) 체제로 나뉘게 되었다고 주장한다.","bl":[["a","분업",""],["b","중핵",""],["c","반주변",""],["d","프리드먼",""],["e","3극",""]],"ex":"","cat":"도시지리","rel":["","","","",""]},{"id":"2022B-10","y":2022,"link":[],"text":"공간 데이터는 ( a )와/과 ( b )(으)로 구분한다. 이 중 ( b )의 해상도는 4가지로 살펴볼 수 있 다. 첫째, 공간해상도는 영상자료의 최소 단위격자인 ( c )의 크기이다. 둘째, ( d ) 해상도는 같은 지역을 얼마만의 주기로 관측할 수 있는지 나타내는 주기성으로, 이것이 높을수록 변화를 탐지하기에 유리하다. ( e ) 해상도는 센서가 전자기파 스펙트럼을 얼마나 세분화하여 탐지할 수 있는지 나타내는 것으로, 이것이 높을수록 특정한 밴드의 더 좁은 파장영역을 정밀하게 구 분하여 물체나 현상의 미세한 분광 특성을 탐지할 수 있다. ( f ) 해상도는 센서가 밝기를 얼마 나 세밀하게 구분할 수 있는지를 나타내며, 보통 비트 단위로 표현된다.","bl":[["a","벡터 데이터",""],["b","래스터 데이터",""],["c","화소(픽셀)",""],["d","시간",""],["e","분광",""],["f","방사",""]],"ex":"","cat":"지도학·GIS","rel":["벡터 데이터","래스터 데이터","","","",""]},{"id":"2021A-01","y":2021,"link":[],"text":"종족 촌락의 안팎에는 다양한 경관이 나타난다. ( a )은/는 마을의 높은 곳에 위치하여 공간적· 정치적·사회적으로 권력의 핵심에 해당한다. 풍수지리적 측면에서 이른바 기가 용출하는 지점 에 자리하게 된다. 선조 묘역은 ( a )보다 고도가 ( 높은 / 낮은 ) 곳에 위치하며, 마을의 기원과 관련된 의미 있는 장소나 촌락 주변의 명당에 조성된다. ( b )와/과 ( c )은/는 마을의 정신적 지주를 모시는 경관이다. ( b )은/는 종족 집단의 중시조나 파시조를 제사지내기 위한 건물로, 보통 그의 묘소 앞 근처에 건립된다. ( c )은/는 학문적·정 치적으로 현달한 조상에 대해 촌락민과 지역 사회 차원에서 제사지내기 위해 그 위패를 모셔 놓은 건물이다. 이는 후에 서원으로 발전하기도 한다.","bl":[["a","종가","높은"],["b","재실",""],["c","사우 (인문지리학의 시선)",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","",""]},{"id":"2021A-02","y":2021,"link":[],"text":"일반적으로 기반암이 석회암으로 이루어진 지역에서는 지표수에 의한 하계 발달이 미약하여 독 특한 수계를 보인다. ( a )은/는 지표를 흐르던 하천이 도중에 싱크홀을 통해 동굴·지하로 들어 가는 소멸 하천으로, ( b )을/를 통해 다시 지표로 용출되어 흐를 수 있다. ( b )은/는 카르스트 지역에서 지하에 형성된 수로를 따라 흐르던 유수가 지하수면이 지표면과 만나는 사면의 하부 에서 다시 지표로 배출되는 것이다. ( c )은/는 석회암 지역에서 외부에서 발원한 하천의 침식으 로 인해 형성된 계곡으로, 강우 시에 일시적으로 유수가 흐른다. 한편 ( d )을/를 흐르던 물은 절벽 하단부의 싱크홀이나 석회동굴로 유입된다.","bl":[["a","싱킹크리크",""],["b","카르스트 용천",""],["c","건천",""],["d","맹곡",""]],"ex":"","cat":"지형학","rel":["싱킹 크리크","","","맹곡"]},{"id":"2021A-06","y":2021,"link":[],"text":"겨울철에는 대륙이 강하게 냉각되어 기온이 낮아지고, 해양은 상대적으로 완만히 냉각되므로 대륙과 해양 간 ( a )이/가 커진다. 이에 따라 유라시아 대륙은 겨울에 ( b ) 고기압, 여름에는 ( c ) 저기압이/가 형성된다. 겨울철 북반구의 대표적 기압 세포로는 ( b ) 고기압, 북태평양의 ( d ) 저기압, 북대서양의 ( e ) 고기압과 아이슬란드 저기압이 있다. 한편 여름철에는 북태평양의 하와이 고기압, ( e ) 고기압, 유라시아 대륙의 ( c ) 저기압이 발달한다.","bl":[["a","기압경도력",""],["b","시베리아",""],["c","티베트",""],["d","알류샨",""],["e","아조레스",""]],"ex":"","cat":"기후학","rel":["기압경도력","","","",""]},{"id":"2021A-08","y":2021,"link":[],"text":"이슬람교는 ( a )을/를 유일신으로 섬기고 교리를 설파한 ( b )을/를 성인으로 공경한다. 또한 경 전인 ( c )에 담겨 있는 이슬람 율법에 따라 생활하고, 다섯 가지 의무를 지켜야 한다. 서남아시 아의 아라비아반도에서 기원한 이슬람교는 ( b )의 ( 메카 / 메디나 ) 정복 이후 주요 종교로 자 리 잡았다. 한편 이슬람교의 종파는 ( d )파와 ( e )파로 구분하는데, ( d )파는 이란과 이라크에 많이 분포한다.","bl":[["a","알라",""],["b","무함마드","메카"],["c","쿠란",""],["d","시아",""],["e","수니",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","","","",""]},{"id":"2021A-09","y":2021,"link":[],"text":"탐구학습의 순서는 ‘문제 제시 → ( a ) 설정 → ( b ) → ( c ) → 결론 도출(일반화)’로 진행 된다. 그러나 교과와 학습 문제의 성격, 학습 상황에 따라 수업 절차와 단계는 다양할 수 있다. 한편 탐구학습에서는 사회과학자들이 객관적으로 조사하여 증명할 수 있는 과학적 문제를 다루 는데, ( a )은/는 객관적 자료에 의해 확인할 수 있는 사실문제에 해당한다. 또한 탐구학습에서 가장 중요한 것은 ( d )(으)로, 보통 하나의 정답으로 수렴하는 폐쇄적 ( d )와 다양한 답변으로 확산되는 개방적 ( d )(으)로 구분할 수 있다. 한편 교실 탐구수업에서는 ( 1 / 2 )차 자료보다 ( 1 / 2 )차 자료가 더 많이 사용된다.","bl":[["a","가설",""],["b","자료 수집 및 분석",""],["c","검증",""],["d","질문","1, 2"]],"ex":"","cat":"지리교육론","rel":["","","",""]},{"id":"2021A-10","y":2021,"link":[],"text":"T-O 지도에는 3개의 대륙이 표현되었는데, 이중 ( 아시아 / 유럽 / 아프리카 )은/는 지도 상단을 가장 크게 차지하는 대륙이다. T-O 지도의 ‘O’는 대양(바다), ‘T’는 육지를 나누는 세 개 의 수로를 상징한다. 세 개의 수로는 각각 아시아와 아프리카를 구분하는 ( a ), 유럽과 아프리 카를 구분하는 ( b ), 아시아와 유럽을 구분하는 ( c )에 해당한다. 한편 크리스트교의 관점에서 해석되는 부분은 지도의 동쪽 끝에 지상낙원인 ( d )을/를 표현한 것과 세계를 3개의 대륙으로 나누어 표현한 것이다. 3개의 대륙은 노아의 세 아들을 나타낸다. 한편 천하도는 조선 후기에 널리 유포되었던 목판본 ( e )에 수록된 지도로, 중화사상과 천원지 방 사상, ( f )을/를 보여준다. ( f )은/는 하늘, 땅, 인간 세계를 의미한다.","bl":[["a","홍해(나일강)",""],["b","지중해",""],["c","돈강",""],["d","에덴",""],["f","천지인",""]],"ex":"아시아","cat":"지도학·GIS","rel":["","","","",""]},{"id":"2021B-03","y":2021,"link":[],"text":"플랜더스의 ( a ) 모형은 수업 과정에서 교사와 학생 간 ( a )을/를 분석하여 수업의 형태 및 질 을 분석한다. 교사의 발언은 ( b )와/과 ( c ), 학생의 발언은 ( d )와/과 ( e )(으)로 구분한다. 이 상적인 수업을 위해서는 교사의 ( b )을/를 줄이고, ( c )을/를 늘려야 한다. 한편, 직소Ⅱ 모형은 학습 내용을 4~6개의 하위주제로 나누어서 학생들이 한 주제를 집중적으 로 학습하여 전문가가 된 후에 서로 가르치고 배우는 형태의 협동학습이다. 이때, 직소Ⅱ 모형 에서는 ( f ) 모형의 평가방식을 도입하여 개인별 향상점수에 의한 집단 보상이 이루어진다는 점에서 직소Ⅰ 모형과 구별된다.","bl":[["a","언어적 상호작용",""],["b","지시적 발언",""],["c","비지시적 발언",""],["d","반응",""],["e","주도",""],["f","STAD",""]],"ex":"","cat":"지리교육론","rel":["","","","","","STAD(슬래빈)"]},{"id":"2021B-07","y":2021,"link":[],"text":"브루소는 극단적인 교수 현상을 크게 4가지로 제시하였다. 첫째, ( a )은/는 개인화를 지나치게 강조한다. 둘째, ( b )은/는 학습자의 개인화 과정을 간과한다. 셋째, ( c )은/는 명백한 힌트를 제공하여 학생이 스스로 지식을 구성하는 과정을 방해하는 현상으로, ( 개인화 / 탈개인화 ) 과 정을 간과한다. 넷째, ( d )은/는 학생의 우연한 행동에 대해 교사가 판단 오류를 행하는 것으 로, ( 개인화 / 탈개인화 ) 과정을 과대평가한다. 김민정은 이에 더하여 2가지의 극단적 교수 현 상을 제시하였는데, 이중 ( e )은/는 지식을 절대적인 것으로 표현하여 학생들이 더 깊이 생각하 는 것을 방해한다. 9 2021B-08 ( a ) 도법에서 ( 위선 / 경선 )은 서로 평행하며 일정한 간격으로 나타나지만, ( 위선 / 경선 ) 은 투영법마다 간격이 다르게 나타난다. ( b ) 도법에서는 ( 위선 / 경선 )이 중심점에서 방사형 으로 뻗는 직선으로 나타나고, ( 위선 / 경선 )은 중심점 주변의 동심원 호로 표현된다. ( c ) 도 법에서는 지도상의 두 점을 연결했을 때 직선의 방향이 진방위지만, 두 지점 간 거리는 최단 거리가 아니라는 특징을 지닌다. 또한 중심점을 통과하는 대권은 중심으로부터 발산하는 직선 으로 나타난다. ( a ) 도법을 이용한 메르카토르 도법은 정각도법으로, 두 점을 연결한 직선은 항정선이 된다. 그러나 두 지점의 거리가 최단 거리, 즉 ( d )이/가 아니라는 단점을 지닌다. 한편 ( b ) 도법을 이용한 람베르트 정각 원추 도법은 표준위선이 ( e(숫자) )개라는 특징을 가진다.","bl":[["a","메타인지적 이동",""],["b","형식적 고착",""],["c","토파즈 효과","탈개인화"],["d","주르댕 효과","탈개인화"],["e","도",""]],"ex":"","cat":"지리교육론","rel":["","형식적 고착","토파즈 효과","",""]},{"id":"2021B-09","y":2021,"link":[],"text":"( a ) 유연성은 임금, 고용조건, 노동자의 태도 등이 경쟁 압력과 기업 필요에 민감해지는 고용 체제를 의미한다. 이 체제에서 노동자는 변동적인 시급·노동시간을 수용하고, 새로운 기술 습 득과 업무 전환에 적응해야 한다. 노동시장 유연성은 1980년대 이후 ( b ) 정책의 핵심 목표였 다. ( b ) 정책 도입으로 정부의 규제 완화가 확대되고 고용주의 권한이 강화되어 노동력 관리 가 수월해졌다. ( a ) 유연성은 네 가지로 구분된다. ① ( c ) 유연성 : 필요에 따라 노동량을 조정하는 것 ② ( d ) 유연성 : 노동자의 업무 배치를 유연하게 변화시키는 것으로, 기업 내부와 공급사슬 전 반에서 노동 분업을 재조직하는 것 ③ ( e ) 유연성 : 임금·보수를 낮추거나 지급조건을 기업에 유리하게 바꾸는 것 ④ ( f ) 유연성 : 노동시간을 통제·조정하는 능력","bl":[["a","노동시장",""],["b","신자유주의",""],["c","산술적",""],["d","기능적",""],["e","임금",""],["f","시간적",""]],"ex":"","cat":"경제지리","rel":["","신자유주의","","","",""]},{"id":"2020A-01","y":2020,"link":[],"text":"온대 저기압의 형성 과정에 대한 다양한 입장 중 노르웨이 학파의 한대전선 이론에 따르면 성 질이 다른 두 기단이 만나 ( a )이/가 형성되고 그 ( a )이/가 점차 성장하여 ( b )이/가 발달한 다. 이 이론에서는 북반구에서는 시계 방향, 남반구에서는 시계 반대 방향으로 공기가 회전하면 서 모여드는 ( b )성 순환 구조가 생성되는 과정인 ( b ) 발생의 개념을 설명하기 위해 한대전 선 발달 단계를 설명한다. 온대 저기압은 한대전선을 수반하는 전선성 저기압이자 편서풍에 의 한 ( c )에 해당한다.","bl":[["a","파동",""],["b","저기압",""],["c","이동성 저기압",""]],"ex":"","cat":"기후학","rel":["","",""]},{"id":"2020A-05","y":2020,"link":[],"text":"개념학습 모형에는 ( a ) 모형과 ( b ) 모형이 있다. ( a ) 모형은 개념의 정의와 고유한 특징을 설명한 뒤 관련 사례를 제시하는 모형이다. 이 모형에서는 ( c )와/과 ( d )을/를 사용할 수 있 다. ( c )은/는 개념의 결정적 속성을 잘 보여주는 사례, ( d )은/는 학습하고자 하는 개념에 근 접하되 결정적 속성 중 몇 가지를 포함하지 않는 사례이다. ( b ) 모형은 대표적인 사례나 이상적인 형상을 먼저 제시한 후 개념의 특징을 설명하고 다른 사례를 제시하는 모형이다. ( b )은/는 어떤 대상이나 사례의 속성을 가장 잘 드러내 주는 이상 적인 현상 또는 대표적 사례이다.","bl":[["a","속성",""],["b","원형",""],["c","실례",""],["d","비실례",""]],"ex":"","cat":"지리교육론","rel":["","원형","",""]},{"id":"2020A-06","y":2020,"link":[],"text":"서안 해양성 기후는 중위도 대륙 서안에 나타나는 대표적인 기후형으로 주로 남·북위 40~65° 사이에 분포한다. 이 지역은 ( a )와/과 ( b )의 영향을 받아 같은 위도대의 다른 지역에 비해 연교차와 일교차가 작으며, 위도 50° 이상에서도 기온이 쉽게 영하로 내려가지 않는다. ( a )은 /는 이 지역을 따라 흐르는 난류의 이름이다. 한편 이 지역에서는 해양에서 수증기를 다량 포함 한 ( b )이/가 연중 유입되면서 여름에는 냉량습윤하고 겨울에는 온난다우한 해양성 기후가 형 성된다. 또한 겨울철에는 ( a )을/를 지나면서 발달한 ( c )이/가 폭풍을 동반해 많은 강수를 내 리게 한다.","bl":[["a","북대서양 해류",""],["b","편서풍",""],["c","온대 저기압",""]],"ex":"","cat":"기후학","rel":["","편서풍","온대 저기압"]},{"id":"2020A-09","y":2020,"link":[],"text":"1) 다음의 문장에 어울리는 시민성을 고르시오. Ÿ ( a ) 시민성 : 가장 능동적인 참여가 강조되므로 적극적(능동적) 시민성이라고 할 수 있다. Ÿ ( b ) 시민성 : 세계화와 지역화 시대에 여러 스케일에서 중첩적으로 갖게 되는 시민성이다. Ÿ ( c ) 시민성 : 비영역성, 권리보다 책임과 의무에 대한 강조, 공적 영역뿐 아니라 사적 영역 에서 발생하는 환경 문제를 중시한다는 특징을 지닌다. Ÿ ( d ) 시민성 : 민주사회에서는 민족집단들과 이민자 집단들이 국가의 시민 문화에 참여할 권 리뿐만 아니라 자기 고유의 문화와 언어를 유지할 권리를 지닌다. 또한 다양성과 통일성 간 에 정교한 균형을 이루는 것이 민주국가의 핵심 목표이다. Ÿ ( e ) 시민성 : 인류애, 인권, 환경과 기후에 관한 시민성이다. 2) 2022 개정 교육과정 지리과 4대 영역을 모두 쓰시오.","bl":[["a","지역",""],["b","다중",""],["c","생태",""],["d","다문화",""],["e","세계 2) 지리 인식","자연환경과 인간생활, 인문환경과 인간생활, 지속가능한 세계"]],"ex":"1)","cat":"지리교육론","rel":["","","","",""]},{"id":"2020A-10","y":2020,"link":[],"text":"이중환의 ‘택리지’에서는 살기 좋은 곳의 조건과 우리나라 각 지역의 특성을 체계적·종합적 으로 설명하며, ( a ), 팔도총론, ( b ), ( c )(으)로 구성된다. ( a )은/는 사회계층의 성립 배경과 역할을 다루며, 팔도총론은 조선 팔도의 위치, 역사, 지리, 산물을 설명한다. ( b )은/는 가거지 의 조건을 설명하며, ( c )은/는 결론에 해당한다. 한편 가거지의 조건 중 땅이 비옥하거나 물자 교류가 편리하여 경제적으로 유리한 특성을 가지는 곳은 ( d )에 해당한다. 또한 가거지의 조건 중 산과 물이 조화를 이루며 경치가 좋아 풍류를 즐길 수 있는 곳은 ( e )에 해당한다.","bl":[["a","사민총론",""],["b","복거총론",""],["c","총론",""],["d","생리",""],["e","산수",""]],"ex":"","cat":"지역지리","rel":["","복거총론","","",""]},{"id":"2020A-11","y":2020,"link":[],"text":"해수면 변동은 다양한 원인에 의해 발생한다. ( a ) 해수면 변동은 빙기와 간빙기의 반복에 따 라 해수의 총량이 변화하여 지구 전체에서 발생하는 해수면 변화로, 빙하성 해수면 변동이라고 도 부른다. ( a )는 ( 절대적 / 상대적 ) 해수면 변화이다. ( b ) 해수면 변동은 대양분지의 부피 변화에 따라 해수면이 변화하는 현상이다. ( c ) 해수면 변동은 얼음으로 변환되는 물 이외에 해양에서 불의 부가와 추출에 의한 소규모 해수면 변화이다. 한편, ( d )은/는 빙상이나 빙모와 같은 대규모 빙하의 확대 또는 소실에 따라 동반되는 지각의 평형적인 승강운동을 의미하는데, 이에 따라 빙하 중심에서는 ( 해진 / 해퇴 ), 빙하 주변에서는 ( 해진 / 해퇴 )이/가 발생한다.","bl":[["a","전지구적","절대적"],["b","구조성",""],["c","하이드로 유스타시",""],["d","빙하성 아이소스타시","해퇴, 해진"]],"ex":"","cat":"지형학","rel":["","","",""]},{"id":"2020B-06","y":2020,"link":[],"text":"슐뤼터가 최초로 ( a ) 개념을 정의한 이후, 사우어가 이를 계승하면서 ( a ) 개념은 한층 더 발 전하게 되었다. 사우어는 라첼의 ( b )이/가 인간 문화에 대한 환경의 영향을 일방적으로 강조 했다고 비판하며, 인간의 능동성과 자연-인간 상호작용을 강조하였다. 이를 바탕으로 그는 문화 생태학의 ( c ) 개념을 도입하였다. 한편, ( d )은/는 사우어의 문화 이해 방식으로, 문화가 개별 인간의 삶을 초월하는 실체라는 점에서 인간으로부터 독립적이며, 문화 자체의 동력과 내적 법 칙에 의해 형성·유지된다는 의미를 지닌다.","bl":[["a","경관",""],["b","환경결정론",""],["c","적응",""],["d","초유기체주의",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","환경 결정론","",""]},{"id":"2020B-07","y":2020,"link":["2025A-02"],"text":"( a )은/는 도시의 여러 기능을 합리적으로 배치하기 위한 계획을 수립하고 실행하는 것이다. 한 편 도시재개발의 방법에는 3가지가 있다. ( b ) 재개발은 노후화된 지역의 건물을 전면 철거하 여 새로운 시가지를 조성하는 재개발 방식이다. ( c ) 재개발은 역사·문화적으로 보존할 가치 가 있는 지역의 환경 악화를 예방하고 유지·관리하는 방법이다. ( d ) 재개발은 기존의 건물과 환경을 최대한 살리면서 필요한 부분만 수리하고 개조하는 재개발 방식이다.","bl":[["a","도시계획",""],["b","철거",""],["c","보존",""],["d","수복",""]],"ex":"","cat":"도시지리","rel":["","","",""]},{"id":"2020B-08","y":2020,"link":[],"text":"GIS 데이터 모델 중 ( a ) 데이터 모델은 ( b ) 데이터 모델에 비해 ( c ) 분석에 용이하다는 장 점을 지닌다. 한편 지형분석은 수치표고자료를 이용하여 지형의 형태, 경사도, 주향, 기복 등을 분석하는 것으로, ( d )와/과/ ( e )로 나눈다. ( d )은/는 규칙적인 간격으로 표본지점이 추출된 데이터 모델이고, ( a / b ) 데이터 구조와 동일하여 ( c ) 분석에 유리하지만, 복잡한 지형의 상 태는 정확하게 나타낼 수 없다. 각 지점의 사이는 ( f )를 사용하여 근사치를 구한다. 반면에 ( e )은/는 표본 추출된 표고점들을 선택적으로 연결하여 형성된 겹치지 않는 부정형 삼각 모자이 크로, ( a / b ) 데이터 모델로 나타내므로 복잡한 지형 표현에 유리하다.","bl":[["a","래스터",""],["b","벡터",""],["c","중첩",""],["d","DEM(수치표고모델)",""],["e","TIN(부정형 삼각 네트워크)",""],["f","보간법",""]],"ex":"","cat":"지형학","rel":["","","","","",""]},{"id":"2020B-11","y":2020,"link":[],"text":"( a )은/는 여러 대안 중 적합한 하나를 선택하는 능력이다. 사회과 의사결정모형의 필요요소는 다음과 같다. 첫째, 사실의 진위를 파악하기 위한 ( b )(이)다. 둘째, 의사결정에 가치가 개입되 는 ( c )(이)다. 셋째, 최적의 대안을 선택하기 위한 대안의 검토와 결과의 예측이다. 사회과 의 사결정모형 중 뱅크스 모형은 ‘의사결정 문제 인식 → ( b )와/과 ( c ) → 의사결정(대안 확인, 대안의 결과 예측, 대안의 평가) → 행동’의 순서로 진행된다. 또한 올리버와 스콧의 모형은 ‘문제 인식 → 문제 정의(문제 진술 및 용어 정의, ( b ), ( c ) → 대안 개발 → 대안 평가 → 사회적 행위 → 결과 평가’의 순서로 진행된다.","bl":[["a","의사결정력",""],["b","사회탐구(사실탐구)",""],["c","가치탐구",""]],"ex":"","cat":"지리교육론","rel":["의사결정력","",""]},{"id":"2019A-02","y":2019,"link":[],"text":"A : 최한월 평균 기온 ( a )℃ 이상 C : 최한월 평균 기온 ( a )℃ 이상 ( b )℃ 미만이면서 최난월 평균 기온 ( c )℃ 이상 - w : 여름 최다우월 강수량이 겨울 최소우월 강수량의 ( d )배 이상 - s : 겨울 최다우월 강수량이 여름 최소우월 강수량의 ( e )배 이상이면서 강수량 30mm 이하 인 달이 최소 1개월 이상 - f : s와 w 어디에도 해당하지 않음 - a : 최난월 평균 기온 22℃ 이상 - b : 최난월 평균 기온 22℃ 미만, 월평균 기온 ( f )℃ 이상인 달이 4개월 이상 - c : 최난월 평균 기온 22℃ 미만, 월평균 기온 ( f )℃ 이상인 달이 4개월 미만 D : 최한월 평균 기온 ( a )℃ 미만이면서 최난월 평균기온 ( c )℃ 이상 E : 최난월 평균 기온 ( c )℃ 미만 - T : 최난월 평균 기온 0℃ 이상 ( c )℃ 미만 - F : 최난월 평균 기온 0℃ 미만","bl":[["a","18",""],["b","-3",""],["c","10",""],["d","10",""],["e","3",""],["f","10",""]],"ex":"","cat":"기후학","rel":["","","","","",""]},{"id":"2019A-04","y":2019,"link":[],"text":"( a )은/는 로스앤젤레스의 도시 구조가 무작위적인 요소들의 집합으로 구성되어 있음을 지칭하 는 용어이다. 한편 에드워드 소자는 로스앤젤레스의 구조를 새로운 도시 형태의 원형으로 기술 하면서 ( b )(이)라는 용어를 사용하였다. 또한 에지시티를 특징으로 하는 ‘안과 밖이 뒤집힌’ 대도시를 ( c )(이)라고 지칭하였다.","bl":[["a","키노자본주의",""],["b","포스트모던 글로벌 메트로폴리스",""],["c","외부도시",""]],"ex":"","cat":"도시지리","rel":["","","외부도시"]},{"id":"2019A-05","y":2019,"link":[],"text":"뮈르달은 지역격차를 ( a )(으)로 설명하는데, 이는 어떤 지역이 선도지역으로 등장해 오랜 기간 우월적 지위를 유지하는 자기강화과정이다. ( b )은/는 한 국가의 발전 초기에는 지역격차가 증가하다가 어느 정도 발전이 성숙되면 지역격 차가 완화된다는 가설이다. 초기에는 ( c ) 효과가 우세하지만, 전환점을 유도하는 ‘강력한 힘’이 존재하여 지역격차가 완화된다. 그러나 이 힘이 무엇인지를 명확히 밝히지는 못하였다. 이후 Amos는 선진국에서 다시 지역격차가 커지는 현상을 발견하였다. 따라서 산업구조의 변화 와 기술의 발전에 의한 ( d )이/가 그동안 성장이 집적된 공간을 중심으로 일어나 새로운 중심 부-주변부 형태의 공간구조가 형성된다고 주장하였다.","bl":[["a","누적적 인과과정",""],["b","역U가설",""],["c","극화",""],["d","혁신",""]],"ex":"","cat":"경제지리","rel":["","","",""]},{"id":"2019A-06","y":2019,"link":[],"text":"지도의 정치는 다음과 같은 순서로 진행된다. 첫째, 나침반으로 ( a ) 방향을 알아내고, 지도상 에 나타난 경선(방위표가 없는 경우 도북)과 이를 일치시킨다. 둘째, ( a )과 ( b ) 사이의 편차 각을 수정한다. 셋째, ( b )과 ( c )을 일치시킨다. 한편, 편차각은 3개의 북쪽 간에 생기는 각도 의 차이를 의미한다. 이중 ( d )은/는 ( a )와 ( c ) 간 차이이다. (단, a, b, c는 진북, 자북, 도북 중 각각 하나에 해당함)","bl":[["a","자북",""],["b","진북",""],["c","도북",""],["d","도자각",""]],"ex":"","cat":"지도학·GIS","rel":["","","도북",""]},{"id":"2019A-08","y":2019,"link":[],"text":"단계구분도는 ( a )을/를 기초로 서로 다른 색상이나 패턴으로 속성값을 표현한 주제도이다. 사 용자들은 이를 통해 지역별로 지리적 속성값의 정도나 분포 패턴을 인지할 수 있다. 단계구분 도의 계급 구간을 분류하는 방법에는 여러 가지가 있다. 그중 ( b ) 분류법은 계급 구간은 일정 하지만 계급당 포함되는 사례 수는 일정하지 않다. ( c ) 분류법은 실세계에서 분포하는 현상을 분류하는데 가장 적합하다. 단계구분도와 반대로 ( d )은/는 계급구간별 경계가 ( a )와 무관하 게 설정되어 주어진 단위지역 내에서의 내부적 분포를 나타낼 수 있다는 특징을 지닌다. 한편 왜상통계지도는 ( a )의 면적을 해당 구역의 속성값의 크기에 비례하여 표현하는 것으로, ( e ) (으)로도 표현할 수 있다. ( e )은/는 특정 지점에 걸쳐 나타나는 현상의 양적 크기를 표현한다.","bl":[["a","행정구역",""],["b","등간격",""],["c","자연",""],["d","등면도(밀도구분도)",""],["e","도형표현도",""]],"ex":"","cat":"지도학·GIS","rel":["","","","",""]},{"id":"2019A-09","y":2019,"link":[],"text":"교사에 의한 설명식 교수를 체계화한 오수벨의 ( a ) 이론은 브루너가 ( b )에 의해 지식을 습 득한다고 주장한 것과는 달리 수용을 통해 지식을 습득한다고 보았다. 설명을 위해 가장 중요 한 기능 중 하나는 ( c )을/를 제공하는 것이다. ( c )은/는 이후에 제시될 모든 정보를 포괄할 수 있을 만큼 충분히 광범위한 진술문으로, 제시될 자료에서 중요한 부분에 집중하게 하거나 앞으로 제시될 개념 간 관계를 보여주고, 이미 가진 정보를 일깨우는 역할을 한다. 한편 ( a )은 /는 새로운 정보가 학습자의 인지구조에 있는 기존의 관련 ( d )로 동화되는 것을 의미한다.","bl":[["a","유의미 학습",""],["b","발견",""],["c","선행조직자",""],["d","포섭자",""]],"ex":"","cat":"지리교육론","rel":["","","선행 조직자",""]},{"id":"2019A-10","y":2019,"link":[],"text":"탄산칼슘의 용식 작용은 ( a )에 비례하고 ( b )에 반비례한다. 한편 토양 내의 탄산가스 농도는 대기보다 높기 때문에 토양층을 통과한 물은 지표에서보다 석회암을 많이 용식할 수 있다. ( c )은/는 석회동굴 내 탄산염 침전 지형으로, ( d )와/과 ( e )(으)로 구분하여 설명할 수 있다. ( d )은/는 동굴 천정에서 떨어지는 물에 용해된 탄산칼슘이 침전되어 형성되며, 종유석과 석순이 대표적이다. ( e )은/는 지하수가 동굴 벽이나 바닥을 따라 넓게 퍼져 흘러내리거나 얇은 수막을 형성하는 과정에서 공기 중으로 이산화탄소가 방출되고 탄산칼슘이 침전 및 집적되어 형성된 다. 유석의 한 종류인 ( f )은/는 림스톤의 뒷부분이 물 대신 ( g ) 침전물로 채워져 계단 모양 을 이룬 것이다.","bl":[["a","탄산가스압",""],["b","수온",""],["c","스펠레오뎀",""],["d","점적석",""],["e","유석",""],["f","석회화단구",""],["g","탄산칼슘",""]],"ex":"","cat":"지형학","rel":["","","","","","석회화 단구",""]},{"id":"2019B-02","y":2019,"link":[],"text":"한반도에서는 신생대 제4기 ( 플라이스토세 / 홀로세 )에도 화산활동이 일어났다. 백두산은 ( a ) 위에 솟아 있는 화산이다. 하부는 ( a )은/는 지각의 틈에서 분출한 다량의 ( b )질 용암이 굳 어 이루어졌으며, 그 위의 상부는 ( b )에 해당한다. 산정부는 회백색의 다공질 화산쇄설물인 ( c )(으)로 두껍게 덮여 있다. 한라산은 조면암으로 이루어진 산정부를 제외하면 ( d )에 해당한 다. 한라산 산정부는 폭발 분화로 파괴되어 일부만 남았으며, 그 자리에는 ( e )에 해당하는 백 록담이 형성되었다. 한라산 산록을 중심으로는 많은 오름이 곳곳에 발달해 있는데, 오름의 대부 분은 적색 또는 흑색의 다공질 화산쇄설물로 이루어진 ( f )(이)다. *a, d, e는 지형 이름 (주상절리, 시스택 이런 느낌으로...)","bl":[["a","(백두)용암대지",""],["b","성층화산",""],["c","경석",""],["d","순상화산",""],["e","화구호",""],["f","스코리아",""]],"ex":"","cat":"지형학","rel":["백두 용암대지","성층화산","","","",""]},{"id":"2022B-08","y":2022,"link":[],"text":"페이비오의 ( a )은/는 텍스트와 그림이 함께 제시될 때 개념을 잘 이해할 수 있다는 이론이다. 두 가지로 서로 다르게 부호화된 정보는 둘 중 하나를 놓치더라도 다른 하나를 통해 기억할 수 있으며, 장기기억에 효과적이다. 한편 ( b )은/는 외적인 표상이 둘 이상 제공되는 학습으로, 여 러 표상들이 각각 다른 정보를 제공함으로써 개념의 이해를 돕는다. ( c )은/는 칸이라는 구조를 지니고 있기 때문에 칸 단위로 내용이 분산되어 있으며, 그 칸 안에서 글과 그림이 연계되어 제시된다. 따라서 ( c )은/는 언어정보와 그림정보를 둘다 지니므로 학생들의 회상률을 높일 수 있다.","bl":[["a","이중부호화이론",""],["b","다중표상학습",""],["c","만화",""]],"ex":"","cat":"지리교육론","rel":["이중 부호화 이론","",""]},{"id":"2018A-01,","y":2018,"link":[],"text":"가치 탐구 모형 중 ( a )은/는 가장 전통적인 방법으로, 바람직한 태도나 가치관을 주입하는 것 이다. ( b )은/는 학생들이 논리적 사고를 통해 합리적인 가치 판단을 하도록 하는 것으로 최종 적으로 어떤 가치를 선택할지는 학생의 몫에 달려 있다. 가치 추론은 토론을 통해 가치 판단을 할 수 있는 도덕적 능력을 길러주는 것으로, 교사는 도덕적 딜레마를 제시하여 학생이 고차 수 준의 ( c )을/를 할 수 있도록 한다. 이 모형에서는 도덕성 발달 이론을 제시한 콜버그의 ( c ) 모형이 사용된다. ( d )은/는 가치 상대주의를 전제로 하여 학생이 스스로 가치를 선택하고 이에 따라 행동하도록 하는 것이다. 의사결정(선택)을 먼저 하는 것은 ( b / d ), 선택을 마지막으로 하는 것은 ( b / d )이다.","bl":[["a","가치 주입",""],["b","가치 분석",""],["c","도덕적 추론",""],["d","가치 명료화","d, b"]],"ex":"","cat":"지리교육론","rel":["가치주입","","","가치명료화(래스·하민·사이먼)"]},{"id":"2018A-04","y":2018,"link":[],"text":"쿠바는 1898년 ( a )(으)로부터 독립하여 ( a )어가 주요 언어로 사용된다. 식민지 시기로 인해 아프리카에서 강제로 이주한 흑인과 백인의 혼혈인인 ( b )의 비중이 높게 나타난다. 한편 ( c ) 은/는 백인과 원주민의 혼혈인, ( d )은/는 흑인과 원주민의 혼혈인이다. 한편 브라질은 ( e ), 수 리남은 ( f ), 가이아나는 ( g )의 식민지였던 역사가 있다.","bl":[["a","에스파냐",""],["b","물라토",""],["c","메스티소",""],["d","삼보",""],["e","포르투갈",""],["f","네덜란드",""],["g","영국",""]],"ex":"","cat":"지역지리","rel":["","물라토","메스티소","","","",""]},{"id":"2018A-07","y":2018,"link":[],"text":"남부아시아 북부 지역은 대체로 ( a ) 어족, 남부 지역은 대체로 ( b ) 어족에 속한다. 인종 측 면에서 인도 북부의 아리안족은 ( 백 / 흑 )인에 해당하는 코카서스, 남부의 ( b )족은 ( 백 / 흑 )인에 해당하는 니그로이다. ( a ) 어족은 유럽에서 사용되는 대부분 언어와 힌디어, 이란어, 쿠 르드어 등을 포함하며 전 세계적으로 가장 많이 사용된다. ( a ) 중 ( c )어는 파키스탄 제1 언 어로, 아랍문자를 사용한다. 한편 인도 남부의 타밀어는 ( d ) 어족에 포함되며, 히브리어 역시 이에 속한다.","bl":[["a","인도-유럽",""],["b","드라비다","백, 흑"],["c","우르드",""],["d","아프로-아시안",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","","",""]},{"id":"2018A-13","y":2018,"link":[],"text":"디킨의 다국적 기업이 글로벌 차원에서 생산 단위를 조직하는 방식(또는 지리적 유형)에서 본사 의 통제를 강하게 받는 방식은 ( a )와/과 ( b ), 본사의 통제로부터 비교적 자유로운 방식은 ( c )와/과 ( d )(이)다. ( b )은/는 무역장벽을 극복하기 위한 방식이며, ( c )은/는 ( 규모 / 범위 )의 경제를 지향한다.","bl":[["a","글로벌하게 집중된 생산",""],["b","투자 대상국 시장을 위한 생산",""],["c","글로벌 혹은 지역시장을 위 한 제품 전문화",""],["d","다국적인 수직통합",""]],"ex":"","cat":"경제지리","rel":["","","",""]},{"id":"2018B-01","y":2018,"link":[],"text":"2022 개정 교육과정 총론 핵심역량 중 ( a )은/는 다른 사람의 관점을 존중하고 경청하는 가운 데 자신의 생각과 감정을 효과적으로 표현하며 상호 협력적인 관계에서 공동의 목적을 구현하 는 역량이다. ( b )은/는 지역⋅국가⋅세계 공동체의 구성원에게 요구되는 개방적⋅포용적 가치 와 태도로 지속가능한 인류 공동체 발전에 적극적이고 책임감 있게 참여하는 역량이다. 사회과 교과 역량 중 ( c )은/는 사태를 분석적으로 평가하는 능력이다. ( d )은/는 다양한 사회 적 문제를 해결하기 위해 합리적으로 결정하는 능력이다. ( e )은/는 자신의 견해를 분명하게 표 현하고 타인과 효과적으로 상호작용하는 능력이다.","bl":[["a","협력적 소통 역량",""],["b","공동체 역량",""],["c","비판적 사고력",""],["d","문제해결력 및 의사결정력",""],["e","의사",""]],"ex":"","cat":"지리교육론","rel":["","","","",""]},{"id":"2018B-03","y":2018,"link":[],"text":"과거의 국제이주는 기원지와의 사회·문화적 단절을 의미하였으나, ( a )은/는 기원국과의 관계 를 이어가면서 여러 생활공간에 동시에 소속되는 과정을 의미한다. 이와 관련하여 ( b )은/는 본토를 떠나 타지에서 자신들의 규범과 관습을 유지하며 살아가는 민족 집단 혹은 그 거주지를 의미한다. ( c )족은 튀르키예, 이란, 이라크, 시리아 등지에 흩어져 있는 민족으로, 약 3~4천만 명의 단일 민족이 고유한 문화·언어·사회 구조를 유지하고 있으나, 국가 없이 산악 지대에 흩어져 산다. 종교는 대부분 ( d )교이고, 언어는 ( a )어와 독자적인 언어를 사용한다. 각 국가 에서 독립·자치 요구 운동을 지속하고 있다. 한편 ( a )어의 언어는 ( e ) 어족에 해당한다.","bl":[["a","트랜스이주",""],["b","디아스포라",""],["c","쿠르드족",""],["d","이슬람교(수니파)",""],["e","인도-유럽",""]],"ex":"","cat":"인구지리","rel":["트랜스이주","디아스포라","쿠르드족","",""]},{"id":"2018B-05","y":2018,"link":[],"text":"( a ) : 사람이 덥거나 춥다고 느끼는 체감의 정도를 나타낸 온도 → ( b )과 반비례 관계 ( c ) : 기온과 상대습도에 따라 사람이 실제로 느낀 더위를 결합한 지수 ( d ) : 여름철 실내의 무더위를 알아보는 지표로 사용되며 ( a )와/과 유사함 ( e ) : 한랭한 지역에서 실외 작업 조건을 확인하기 위해 기온과 ( b )을/를 조합한 지수","bl":[["a","체감온도",""],["b","풍속",""],["c","열지수",""],["d","불쾌지수",""],["e","바람 냉각 지수",""]],"ex":"","cat":"기후학","rel":["","","열지수","",""]},{"id":"2018B-06","y":2018,"link":[],"text":"( a )은/는 지표면의 5~10% 정도를 덮고 있으며, 구성 물질은 공극이 많고 결합이 느슨하여 ( 가로 / 세로 )로 쉽게 쪼개지는 성질이 있다. 대륙빙하 주변에 분포하는 ( a )은/는 빙하의 ( b ) 작용과 동결·융해에 의한 풍화작용으로 형성된 암분이 ( c )에 의해 대륙빙하 밖으로 이동한 후 대륙빙하로부터 불어오는 ( d )에 의해 대륙빙하 주변에 퇴적되어 형성된다. 이 사례로 빙기 에 유럽을 덮었던 빙상의 남쪽 가장자리에 위치한 ( b ) 하천이었던 라인 강과 다뉴브 강의 범 람원에 퇴적된 물질이 ( d )와/과 ( e )에 의해 주변 지역으로 운반 및 퇴적되어 ( a )이/가 형성 되기도 하였다. + 보너스(2025B-10) 겨울철 눈이 쌓인 고원이나 산지에서는 ( f )이/가 높아져 공기가 심하게 냉각되면서 밀도가 높 아져 중력에 의해 사면을 이동하는데, 이를 사면하강풍이라고 한다. 남극 대륙의 내륙 지역에서 는 고기압이 형성되어 대륙 외곽으로 불어나가는데, 이때 강한 활강풍이 나타난다.","bl":[["a","뢰스","세로"],["b","마식",""],["c","융빙수(융빙수 하천)",""],["d","중력풍(사면하강풍)",""],["e","편서풍",""],["f","알베도",""]],"ex":"","cat":"기후학","rel":["뢰스","","","","편서풍","알베도"]},{"id":"2018B-07","y":2018,"link":[],"text":"위성영상 자료의 처리 순서는 ‘위성영상 자료 수집 → 전처리(( a )보정)→ ( b ) → 영상 강조 처리 → 토지피복 분류 → ( c ) 평가’이다. 전처리 과정에서 ( a ) 보정은 지표면 물체의 실제 좌표와 영상에서의 좌표를 관계식으로 설정 한 후, 나머지 영상 좌표를 추정하는 공간정보 처리 기법이다. ( b )은/는 영상자료의 단위격자 크기를 조정하여 공간해상도를 변경하는 것이다. 후처리 과정에서 ( d )은/는 각 화소마다 주어 진 반사도 값을 분류하여 토지피복 분류에 이용하는 방법으로, 단순히 컴퓨터 자체의 데이터 분석에만 의존하는 것은 ( f ) 분류이다.","bl":[["a","기하",""],["b","재배열(리샘플링)",""],["c","정확도",""],["d","분광 패턴 인식 기법",""]],"ex":"e-무감독","cat":"지리교육론","rel":["","","",""]},{"id":"2017A-02","y":2017,"link":[],"text":"( a )은/는 과거의 해면과 관련하여 형성된 해안의 평평한 땅이다. 지반의 ( 융기 / 침강 )와/과 해수면 ( 상승 / 하강 )이 동시에 작용하여 형성되었다. 과거 해수의 영향을 직접 받았던 곳이기 때문에 ( b )이/가 발견되기도 한다. 우리나라의 ( a )은/는 ( 빙기 / 간빙기 )에 형성되었는데 그 증거는 ( c )이/가 발견된다는 점이며, 이때 형성된 ( a )는 지반 융기량이 해수면 상승량보다 ( 크다 / 작다 )는 것을 의미한다. ( d )은/는 현재 지형에서 확인되는 과거의 해수면 고도로, ( a )의 융기량은 ‘( d – 형성 당시의 해수면 고도 )/형성 시기’로 구한다.","bl":[["a","해안단구","융기, 하강"],["b","원력","간빙기"],["c","고토양 또는 카올리나이트","작다"],["d","구정선고도",""]],"ex":"","cat":"지형학","rel":["해안 단구","","","구정선 고도"]},{"id":"2017A-05","y":2017,"link":[],"text":"중위도 상층에서는 ( a )와/과 ( b )이/가 균형을 이루면서 지균풍이 분다. 지균풍은 저위도와 고 위도 간 에너지 교환을 차단하는 역할을 하면서도 위도별 열적 불균형을 해소하기 위해서 남북 으로 파동을 형성하는데, 이를 ( c )(이)라고 한다. ( c )이/가 크게 성장하면 따뜻한 공기가 떨어 져 나와 고위도 지역에 머물게 되는데, 이를 ( d )(이)라고 한다. ( d )이/가 더욱 발달하여 정체 된 상태를 ( e )(이)라고 하며, 이는 정상적인 저기압의 동진을 막는다. 이와 같이 특정 지역에 서 고기압이 오래 머무르면서 저기압의 정상적인 경로를 방해하는 현상을 ( f )(이)라고 한다.","bl":[["a","기압경도력",""],["b","전향력",""],["c","편서풍 파동(로스비파)",""],["d","분리 고기압",""],["e","저지 고기압",""],["f","블로킹",""]],"ex":"","cat":"기후학","rel":["기압경도력","전향력","","","",""]},{"id":"2017A-07","y":2017,"link":[],"text":"생산자서비스업 중 FIRE 산업을 제외한 나머지 서비스업을 ( a )(이)라고 한다. 사업서비스업이 발달하는 이유는 시장과 기술 환경의 변화에 대응하기 위해 기업들이 ( b ) 분업 체계를 강화하 고 있기 때문이다. 사업서비스업의 입지가 대도시 지향적인 이유는 고급 인력 확보와 ( 국지화 / 도시화 ) 경제의 혜택 때문이다. 이에 따라 사업서비스 중 ( c ) 기능은 대도시, ( d ) 기능은 집적 불이익에 민감하여 저임금 지역에 입지한다. 또한 전·후방 연계는 사업서비스업의 입지 에 큰 영향을 주는데, 관련 지원 기관과는 ( 전 / 후 )방 연계, 직접 수요자인 기업과는 ( 전 / 후 )방 연계를 형성한다. + ( e ) : ICT 발달로 정보와 화폐를 전달하는 비용과 시간이 줄어드는 현상 (데이비드 하비)","bl":[["a","사업서비스업",""],["b","사회적","도시화"],["c","프론트오피스",""],["d","백오피스","후, 전"],["e","시공간 압축",""]],"ex":"","cat":"경제지리","rel":["","","","백오피스",""]},{"id":"2017A-12","y":2017,"link":[],"text":"우리나라 주요 하천의 중상류 유역에는 감입곡류가 발달하며 ( a ) 사례도 나타난다. ( a )은/는 하천에 의해 곡류 목이 끊기게 되는 현상이다. 곡류 목이 침식을 받아 절단되면 새로운 하도와 구하도 사이에는 ( b )이/가 남게 된다. 본류의 절단된 지점에는 ( c )이/가 형성되며, 하도의 직 선화로 인해 하방침식력이 증대하여 본류의 하상고도는 점차 낮아진다. 따라서 평수 시에는 새 로운 하도로만 물이 흐르며 홍수 시에만 일시적으로 구하도로 물이 흐른다. 이러한 현상은 주 로 ( 굴삭 / 생육 )곡류천에서 잘 발생한다. 굴삭곡류천은 생육곡류천보다 융기 속도가 ( 빨라 / 느려 ) ( 하방 / 측방 ) 침식이 활발하다.","bl":[["a","곡류절단",""],["b","미앤더핵",""],["c","천이점(폭포)","생육, 빨라, 하방"]],"ex":"","cat":"지형학","rel":["","",""]},{"id":"2017A-14","y":2017,"link":[],"text":"적도 주변의 안데스산맥 동쪽 아마존 분지에는 열대 우림이 무성하게 덮여 있지만, 태평양 연 안 페루 북부 해안에는 남북으로 긴 ( a ) 사막이 나타난다. 그 원인은 크게 세 가지로 살펴볼 수 있다. 첫째, 대기대순환 측면에서 ( b )의 영향으로 ( 상승 / 하강 )기류가 우세하다. 둘째, 해 류 측면에서 ( c ) 한류가 흐르고 있어 낮은 수온에 의해 하층 대기가 안정 상태를 이루고 있 다. 셋째, 지형의 ( d ) 효과로 인해 ( 무역풍 / 편서풍 )이 차단된다. 이와 같이 한류와 지형의 ( d ) 효과의 영향을 동시에 받는 것을 ( e )현상이라고 한다. *a는 사막 이름(고비 사막, 타클라마칸 사막 같은 느낌), c는 한류 이름(쿠로시오 해류 느낌)","bl":[["a","아타카마",""],["b","아열대 고압대","하강"],["c","페루(훔볼트)",""],["d","장벽","무역풍"],["e","이중 비그늘",""]],"ex":"","cat":"기후학","rel":["","아열대 고압대","","",""]},{"id":"2017B-01","y":2017,"link":[],"text":"과학적 탐구학습의 절차 : 문제제기 → ( a ) → ( b ) → 자료 분석 → ( c ) → ( d ) ( e )은/는 아동의 실제적 발달수준과 성인의 지도나 더 유능한 또래들과의 협력에 의해 도달할 수 있는 잠재적 발달수준 사이의 영역이다. 학습 과제는 ( e )의 ( 내부 / 외부 )에 있는 수준으 로 제공되어야 한다. ( f )은/는 학습을 위한 약간의 도움으로, 이것의 궁극적인 목적은 학습자 들이 ( f )에 대한 요구 없이 독립적으로 학습하도록 하는 것이다.","bl":[["a","가설 설정",""],["b","자료 수집",""],["c","가설 검증",""],["d","결론 도출(일반화)",""],["e","근접발달영역","내부"],["f","비계",""]],"ex":"","cat":"지리교육론","rel":["","","","","근접발달영역","비계"]},{"id":"2017B-02","y":2017,"link":[],"text":"( a )은/는 두 개의 서로 다른 문화 요소가 만나 새로운 문화를 만들어내는 것이다. 그 사례 중 하나인 리듬 앤 블루스는 블루스 음악에 1940년대 이후 ( b )의 영향을 받아 리듬이 가미된 것 이다. 이는 문화의 ( c )에 속하는데, ( c )은/는 문화를 다양한 문화 요소가 뒤섞인 결과물로 이 해하며, 어떤 문화가 다른 문화보다 우월하다는 주장에 동의하지 않는다. 또한 이러한 관점에서 는 ( d )(이)라는 개념, 즉 근원적이고 순수한 문화가 있다는 생각에 반대한다. 한편 렐프의 장 소이론의 핵심 용어인 ( d )은/는 하이데거의 ( e ) 개념이 발전된 것이다.","bl":[["a","문화 융합",""],["b","재즈(헷...)",""],["c","혼성성",""],["d","진정성",""],["e","거주",""]],"ex":"","cat":"문화·역사·정치지리","rel":["문화 융합","","혼성성","진정성",""]},{"id":"2017B-03","y":2017,"link":[],"text":"단층은 두 지괴의 변위가 수직 방향으로 일어나는 ( a ) 이동 단층, 수평 방향의 ( b ) 이동 단 층으로 구분된다. ( a ) 이동 단층은 수직 방향 이동을 발생시킨 ( c ) 성분에 따라 ( d )에 의한 정단층과 ( e )에 의한 역단층으로 구분한다. 정단층에서 단층애가 개석을 받으면 골짜기와 골 짜기 사이에 삼각형의 ( f )이/가 형성된다. 역단층에서는 오래된 지층이 젊은 지층보다 위에 분 포하는 지층의 ( g ) 현상이 발생하기도 한다. 한편, 우리나라의 활성단층 중 양산단층은 ( 역 / 주향이동 )단층, 울산단층은 ( 역 / 주향이동 )단층에 해당한다.","bl":[["a","경사",""],["b","주향",""],["c","응력",""],["d","장력",""],["e","횡압력",""],["f","삼각말단면",""],["g","역전","주향이동, 역"]],"ex":"","cat":"문화·역사·정치지리","rel":["","","","","","",""]},{"id":"2017B-04","y":2017,"link":[],"text":"( a )은/는 세게 경제의 중심지이자 전 세계의 지역과 국가의 경제를 세계 경제로 통합하는 결 절지이다. ( a )에는 초국적기업의 본사 및 관련 업무 기능, 세계적 금융기관들이 집중된다. ( a )에서 산업구조의 변화와 관련하여 제조업이 차지하는 비율이 급감함에 따라 ( b )의 비율은 감 소한 반면에 사업서비스업 및 FIRE 산업이 성장함에 따라 고소득 전문직 계층의 비율은 증가하 였다. 고소득 전문직 계층의 증가는 공간적인 측면에서 ( c )을/를 발생시키는 요인이 되었다. 이처럼 사회계층의 양극화로 인해 주거지가 분리되는 현상을 ( d )(이)라고 한다. 또한 고소득 전문직 계층에게 서비스를 제공하는 저소득층과 제3세계 이민자가 주를 이루는 극빈층의 비율 도 증가함에 따라 ( e ) 부문이 성장하였다.","bl":[["a","세계도시",""],["b","중산층",""],["c","젠트리피케이션",""],["d","이중도시",""],["e","비공식",""]],"ex":"","cat":"도시지리","rel":["세계 도시","","젠트리피케이션","이중 도시",""]},{"id":"2016A-02","y":2016,"link":[],"text":"( a )은/는 장소의 이미지를 반영하는 지리학적 언어이다. 지역사회에서 구전되는 ( a )은/는 지 도나 문서에 기록됨으로써 시간적인 지속성을 갖는다. 한자 문화권에 속하는 한국에서는 우리 말로 된 고유 ( a )을/를 표기하는 데에 한자를 사용하였다. 이러한 ( a ) 표기법에는 크게 보아 음차법, 훈차법, 그리고 이 둘을 결합한 방식으로 구분된다. 음차법은 고유 ( a )와/과 동일하거 나 유사한 음가의 한자로 표기하는 방식이다. 훈차법은 한자의 뜻을 빌려 표현하는 것으로, 한 밭을 대전, ( b )을/를 마포, 새재를 ( c )(으)로 표현하는 것이 이에 해당한다. 음차와 훈차를 결 합한 방식으로는 광나루를 ( d ), 독섬을 ( e )(으)로 표현하는 것 등이 있다.","bl":[["a","지명",""],["b","삼개",""],["c","조령",""],["d","광진",""],["e","독도",""]],"ex":"","cat":"지역지리","rel":["","","","","독도"]},{"id":"2016A-04","y":2016,"link":[],"text":"( a )주의는 공간 형성에 영향을 미치는 인간의 의사결정과정과 이러한 의사결정과정에 영향을 미치는 요인들에 대해서 고찰한다. 신고전 입지이론은 인간을 ( b )(으)로 전제하지만, ( a )주의 에서는 ( c )(으)로 보았다. 이와 관련하여 사이먼에 의해서 개발된 ( d )은/는 복잡한 문제를 해 결하고 조직하는 데 개인의 능력은 한계가 있어서 현실에서의 결정이 합리적인 행동에 미치지 못함을 의미한다. 스미스는 경제행위의 인간 행태 유형을 ( e ), ( f ), ( g )(으)로 구분하였다. *e, f, g의 순서는 무관함 3, 2016A-05 해빈의 단면은 파랑의 특성이나 계절에 따라 변화한다. ( 여름 / 겨울 )에는 사빈 침식이 활발하 여 범 전면의 모래가 침식되어 사빈의 규모가 축소되며, 사빈에서 제거된 모래는 연안의 해저 에 퇴적되어 ( a )을/를 형성한다. 반면에 ( 여름 / 겨울 )에는 ( 여름 / 겨울 )에 연안의 해저로 이동했던 모래들이 다시 사빈으로 이동하여 퇴적됨에 따라 사빈의 규모가 확대된다. 한편 상대 적으로 파랑이 약한 지점에서는 ( 사빈 / 역빈 ), 파랑이 강한 지점에서는 ( 사빈 / 역빈 )이 분 포한다.","bl":[["a","행태",""],["b","최적자",""],["c","만족자",""],["d","제한된 합리성","e, f"],["g","제한된 합리적 행태","비경제적 목적을 추구하는 합리적 행태, 우연적 행태"]],"ex":"","cat":"지형학","rel":["","","","",""]},{"id":"2016A-06","y":2016,"link":[],"text":"( a )방위는 두 지점 간 방위가 둥근 지표면 상의 방위와 일치하는 것이다. 이를 충족하기 위해 서는 투영점과 임의의 점 사이에 그려진 점이 ( b )이어야 하고, 모든 경선의 방향이 ( c )이어 야 한다. ( d )방위는 두 지점 간 경로가 각각의 경선과 같은 각도로 교차하도록 한 방위이다. 지도상에서 두 지점 간에 나침반의 방향을 일정하게 유지할 수 있는 ( d )선이 직선으로 나타나 도록 고안한 도법이 ( e ) 도법이다. ( e ) 도법은 ( 정각 / 정적 ) 도법에 해당하는데, 이러한 ( 정각 / 정적 )성을 만족하기 위해서는 경위선의 교차 각도가 지구본과 동일하고 한 지점에서부 터 모든 방향으로의 ( f )이/가 같아야 한다.","bl":[["a","정",""],["b","대권",""],["c","진북",""],["d","항정",""],["e","메르카토르","정각, 정각"],["f","축척",""]],"ex":"","cat":"지도학·GIS","rel":["","대권","","","",""]},{"id":"2016A-07","y":2016,"link":[],"text":"영해와 ( a ) 설정으로 해양의 중요성이 높아지면서 바다를 둘러싼 분쟁도 발생하고 있다. ( a ) 은/는 영해기선으로부터 200해리까지의 수역 중 ( b )을/를 제외한 수역으로, 연안국은 이 수역 의 어업과 광물 자원에 대한 독점적 권리를 가진다. 중국은 남중국해에서 이루어지는 영유권 분쟁으로 자원 및 해상 수송로를 확보하려 하고 있다. (천재-세계시민과 지리) Ÿ ( c ) : 중국, 베트남, 대만, 필리핀, 브루나이, 말레이시아 등이 영유권 분쟁을 벌이고 있음 Ÿ ( d ) : 1970년 이전 중국은 이곳의 동쪽, ( e )은/는 서쪽을 점유하고 있었으나, 중국이 서쪽 을 무력으로 점령하여 현재까지도 실효 지배하고 있음 *f는 국가 이름 Ÿ ( f ) : 청일전쟁을 통해 일본 영토로 편입되었으나, 천연가스와 석유의 매장이 알려진 이후 중국과 대만이 영유권을 주장하고 있음","bl":[["a","배타적 경제수역",""],["b","영해",""],["c","난사군도",""],["d","시사 군도",""],["e","베트남",""],["f","센카쿠 열도",""]],"ex":"","cat":"문화·역사·정치지리","rel":["배타적 경제 수역","영해","","","","센카쿠 열도(댜오이다오)"]},{"id":"2016A-08","y":2016,"link":[],"text":"열대저기압은 풍속을 기준으로 열대 저압부, 열대 폭풍, ( a ), ( b ) 또는 ( c ) 등의 유형으로 구분한다. 북서태평양에서 ( a )은/는 거의 1년 내내 발생하지만, 북동태평양과 북대서양의 ( b ) 은/는 주로 5~11월에 발생한다. ( a ) : 열대 저기압 중 풍속이 가장 빠른 것, 북태평양 서부에서 발달 ( b ) : 북대서양의 카리브해 및 멕시코만과 북태평양 동부 해상에서 발생 ( c ) : 인도양과 남반구 해상에서 발생한 것","bl":[["a","태풍",""],["b","허리케인",""],["c","사이클론",""]],"ex":"","cat":"기후학","rel":["","",""]},{"id":"2016A-09","y":2016,"link":[],"text":"잡은 교사 주도와 학생 주도, ( a ) 접근과 ( b ) 접근에 따라 야외조사를 분류하고 각 유형에 맞는 교사의 역할을 제시하였다. ( e ) 학생 중심 가설 검증 ( d ) 세상에 대한 교육 교사 중심 ( c ) ( a ) 접근 ( b ) 접근 ( c )에서 교사의 역할 : ( d )에서 교사의 역할 : ( e )에서 교사의 역할 :","bl":[["a","인지적",""],["b","정의적",""],["c","현지 수학여행",""],["d","탐구식 야외조사",""],["e","발견식 야외조사 교사의 역할 :",""],["c","인솔자 또는 해설자",""],["d","자료제공자",""],["e","활동장려자",""]],"ex":"","cat":"지리교육론","rel":["","","","","","","",""]},{"id":"2016A-10","y":2016,"link":[],"text":"( a )은/는 학습 전에 제시하는 포괄적·추상적인 자료이며, 인지구조를 강화하고 파지를 촉진하 는 효과가 있다. 이는 기존 인지구조와 새로운 학습 과제 간 유사성이 없는 ( b )와/과 유사성 이 있는 ( c )(으)로 구분된다. 한편 ( d )은/는 개념체계 또는 지식의 구성요소를 관련성에 따라 위계적으로 또는 수평적으로 보여주는 그림이다. 이는 학생들이 지닌 오개념을 드러내어 피아 제가 주장한 ( e )을/를 유발하는 역할을 한다. + 오개념의 유형 Ÿ 삼각형 모양의 퇴적지형만이 삼각주가 된다고 알고 있다 → ( f )와/과 관련된 오개념 Ÿ 강하구 어디든지 삼각주가 형성된다고 알고 있다 → ( g )와/과 관련된 오개념","bl":[["a","선행조직자",""],["b","설명조직자",""],["c","비교조직자",""],["d","개념도",""],["e","인지적 갈등",""],["f","개념",""],["g","일반화",""]],"ex":"","cat":"지리교육론","rel":["선행 조직자","설명조직자","비교조직자","개념도","","",""]},{"id":"2016A-11","y":2016,"link":[],"text":"크리스트교 세계관을 담고 있는 T-O지도의 ( T / O )은/는 육지를 나누는 세 개의 수로, ( T / O )은/는 대양(바다)을 의미한다. 세 개의 수로는 각각 유럽과 아시아를 구분하는 ( a ), 유럽과 아프리카를 구분하는 ( b ), 아시아와 아프리카를 구분하는 ( c )에 해당한다. ( d )은/는 우리나 라에서 현존하는 가장 오래된 세계지도이다. 이 지도를 자세히 살펴보면 다음과 같다.","bl":[["a","돈강",""],["b","지중해",""],["c","홍해",""],["d","혼일강리역대국도지도",""]],"ex":"T, O, e-아라비아, f-중국, g-조선","cat":"문화·역사·정치지리","rel":["","","","혼일강리역대국도지도"]},{"id":"2016B-05","y":2016,"link":[],"text":"다음은 라틴아메리카의 도시 구조이다. 1) ㉠~㉤이 각각 무엇인지 쓰시오. 2) 라틴아메리카의 도시 경관은 20세기 초반 부터 형성되었지만, 본격적인 확장은 높은 출생률과 급속한 ( a )이/가 시작된 1940년대 후반부터이다. 이곳에서는 도시가 인구 증가 를 수용할 준비가 충분하지 않은 상태에서 지나치게 빠르게 인구가 증가하는 ( b )이/가 심각한 상황이다.","bl":[["a","이촌향도",""],["b","가도시화",""]],"ex":"1) ㉠-엘리트 주거지구, ㉡-슬럼, ㉢-공업지구, ㉣-상업지구, ㉤-젠트리피케이션 2)","cat":"도시지리","rel":["",""]},{"id":"2015A-기입형02","y":2015,"link":[],"text":"발친이 제시한 지리적 의사소통 능력 4가지는 ( a ) 의사소통, ( b ) 의사소통, ( c ) 의사소통, ( d ) 의사소통이다. 또한 언어나 숫자로 전달할 수 없는 공간적 정보와 아이디어를 기록하고 전 달하는 하나의 의사소통을 ( e )(이)라고 정의하였다. *a~d의 순서는 무관함 ( f )은/는 공간적 패턴을 정확하게 지각하고 비교하여 방향을 잘 설정하며 대상을 공간 속에서 배열시키는 능력을 의미한다. 이중 ( g )은/는 패턴을 지각하고 비교하는 능력이다.","bl":[["a","언어적",""],["b","그래픽",""],["c","수리적",""],["d","구술적",""],["e","지리도해력",""],["f","공간능력",""],["g","조망 능력",""]],"ex":"","cat":"지리교육론","rel":["","","","","지리 도해력","","조망능력"]},{"id":"2015A-기입형04","y":2015,"link":[],"text":"북대서양에는 유럽의 기후에 영향을 주는 2개의 구조적 기압 시스템이 있는데, 이는 각각 ( a ) 와/과 ( b )이다. 그린란드 남동쪽에 ( a )이/가 자리 잡고 있으며, 북서 아프리카 연안에 ( b )이 /가 자리 잡고 있다. 일반적으로 여름에 비해 겨울에 ( a / b )는 세력이 약화되고, ( a / b )은/ 는 강화되어 폭풍우의 이동 경로가 달라진다. 특히 겨울철에 유럽으로 접근하는 폭풍우의 강도 와 이동 경로는 ( c ) 진동에 의해 해마다 달라진다. (
