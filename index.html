"사태"], "exam": ["2019 B", "2011 M16", "2011-1차16*", "2008 D15"], "core": true, "keys": "주빙하, 활동층 융해, 토양 포화, 완만한 사면 이동", "vs": "포행"}, {"term": "활동층", "en": "Active layer", "def": "영구동토 위에서 여름에 녹고 겨울에 다시 어는 층. 두께 증가 시 지반 불안정.", "cat": "지형학", "distractors": ["영구동토층", "지하빙", "열카르스트"], "exam": ["2024 B9"], "core": true, "keys": "영구 동토층 위, 여름 융해, 솔리플럭션"}, {"term": "선상지", "en": "Alluvial fan", "def": "산지 하천이 평지로 나오는 곡구에서 유속 감소로 퇴적된 부채꼴 지형. 선정-선앙-선단으로 구분되며 선앙은 복류로 건천이 많다.", "cat": "지형학", "distractors": ["삼각주", "범람원", "바하다"], "exam": ["2022 A12", "2015 B5", "2012-1차39*", "2011 M18", "2010 M19", "2006 D10", "2006 D24"], "core": true, "keys": "곡구, 유속 감소, 선정·선앙·선단, 선앙 복류(건천)", "vs": "삼각주"}, {"term": "삼각주", "en": "Delta", "def": "하천이 바다·호수로 유입하는 하구에서 유속 감소로 토사가 퇴적된 지형. 조차가 작고 유입 토사가 많은 곳에서 발달.", "cat": "지형학", "distractors": ["선상지", "하구언", "사주"], "exam": ["2022 B", "2020 B", "2009-1차24*", "2008 D7"], "core": true, "keys": "하구, 유속 감소, 조차 작음, 하천·파랑·조석 영향", "vs": "선상지", "ex": "나일강"}, {"term": "범람원", "en": "Floodplain", "def": "하천 범람으로 형성된 충적 평야. 자연 제방(조립질, 밭·취락)과 배후 습지(세립질, 논)로 구성.", "cat": "지형학", "distractors": ["하안 단구", "선상지", "삼각주"], "exam": ["2026 A"], "core": true, "keys": "홍수 퇴적, 자연 제방, 배후 습지, 하류 충적 평야"}, {"term": "자연 제방", "en": "Natural levee", "def": "범람 시 하도 부근에 조립질 물질이 쌓여 형성된 미고지. 배수가 양호해 취락·밭으로 이용.", "cat": "지형학", "distractors": ["배후 습지", "인공 제방", "하안 단구"], "exam": ["2024 B", "2014 B4", "2010 M20", "2009 M4"], "core": true, "keys": "하천 양안, 조립 물질(모래), 상대적 고지, 취락·밭", "vs": "배후 습지"}, {"term": "하안 단구", "en": "River terrace", "def": "과거 하천 바닥·범람원이 지반 융기나 해수면 하강으로 하천 양안에 계단 모양으로 남은 지형. 둥근 자갈이 발견됨.", "cat": "지형학", "distractors": ["해안 단구", "범람원", "구조 평야"], "exam": ["2020 B", "2003 D5"], "core": true, "keys": "과거 하상, 지반 융기, 하방 침식, 둥근 자갈", "vs": "해안 단구"}, {"term": "해안 단구", "en": "Marine terrace", "def": "과거의 파식대·해안이 지반 융기로 해안을 따라 계단 모양으로 남은 지형. 둥근 자갈·모래 퇴적층 발견.", "cat": "지형학", "distractors": ["하안 단구", "파식대", "해식애"], "exam": ["2017 A2", "2011 M15"], "core": true, "keys": "과거 파식대, 지반 융기, 둥근 자갈·모래, 계단 모양", "vs": "하안 단구"}, {"term": "감입 곡류 하천", "en": "Incised meander", "def": "지반 융기로 하방 침식이 강화되어 산지 사이를 깊게 파고 흐르는 곡류 하천. 하천 중·상류에 분포.", "cat": "지형학", "distractors": ["자유 곡류 하천", "망류 하천", "우각호"], "exam": ["2020 B", "2017 A"], "core": true, "keys": "지반 융기, 하방 침식, 산지 사이 곡류, 하안 단구", "vs": "자유 곡류", "ex": "동강"}, {"term": "자유 곡류 하천", "en": "Free meander", "def": "넓은 충적 평야 위를 자유롭게 유로를 바꾸며 흐르는 곡류 하천. 주로 하류에 발달하며 우각호 형성.", "cat": "지형학", "distractors": ["감입 곡류 하천", "망류 하천", "하안 단구"], "exam": ["2020 B", "2019 B"], "core": true, "keys": "충적 평야, 측방 침식, 유로 변경, 우각호", "vs": "감입 곡류"}, {"term": "우각호", "en": "Oxbow lake", "def": "곡류 하천의 유로 변경으로 떨어져 나간 구하도가 쇠뿔 모양의 호수로 남은 것.", "cat": "지형학", "distractors": ["석호", "배후 습지", "구하도"], "exam": ["2019 B"], "core": true, "keys": "곡류 절단, 자유 곡류, 구하도, 범람원 호수"}, {"term": "석호", "en": "Lagoon", "def": "만의 입구가 사주로 막혀 형성된 호수. 동해안에 발달, 하천 퇴적으로 점차 축소.", "cat": "지형학", "distractors": ["우각호", "해안 사구", "사주"], "exam": ["2025 A4", "2015 A6*", "2013 M19"], "core": true, "keys": "사주, 만 입구 폐색, 동해안, 하천 퇴적으로 축소", "ex": "경포호"}, {"term": "갯벌", "en": "Tidal flat", "def": "조차가 큰 해안에서 조류에 의해 점토·모래가 퇴적된 평탄 지형. 서·남해안에 발달.", "cat": "지형학", "distractors": ["사빈", "사주", "염습지"], "exam": ["2026 A5", "2007 D18", "2003 D6"], "core": true, "keys": "조차 큼, 조류 퇴적, 점토·모래, 서·남해안"}, {"term": "해식애", "en": "Sea cliff", "def": "파랑의 침식으로 형성된 해안 절벽. 곶에 발달.", "cat": "지형학", "distractors": ["파식대", "해안 단구", "시스택"], "exam": ["2020 A", "2010 P2"], "core": true, "keys": "파랑 침식, 곶, 해안 절벽, 파식대", "vs": "파식대"}, {"term": "파식대", "en": "Wave-cut platform", "def": "해식애가 후퇴하며 그 앞에 형성된 평탄한 암반 면.", "cat": "지형학", "distractors": ["해안 단구", "해식애", "사빈"], "exam": ["2026 B", "2010 P2"], "core": true, "keys": "해식애 후퇴, 평탄 암반, 파랑 침식, 해안 단구 기원"}, {"term": "피오르", "en": "Fjord", "def": "빙식곡(U자곡)이 해수면 상승으로 침수되어 형성된 좁고 깊은 만. 노르웨이·칠레 남부.", "cat": "지형학", "distractors": ["리아스 해안", "에스추어리", "빙하호"], "exam": ["2017 A", "2016 B7", "2002 D8"], "core": true, "keys": "빙식곡, 해수면 상승, 침수, 좁고 깊은 만", "vs": "리아스 해안", "ex": "노르웨이"}, {"term": "카르스트 지형", "en": "Karst", "def": "석회암이 빗물·지하수에 용식되어 형성된 지형. 돌리네·우발라·석회동굴 등.", "cat": "지형학", "distractors": ["화산 지형", "빙하 지형", "건조 지형"], "exam": ["2021 A", "2019 A"], "core": true, "keys": "석회암, 용식(탄산칼슘 용해), 돌리네, 석회동굴"}, {"term": "용암 대지", "en": "Lava plateau", "def": "유동성이 큰 현무암질 용암이 열하 분출하여 형성된 평탄한 대지. 예: 철원·평강.", "cat": "지형학", "distractors": ["순상 화산", "종상 화산", "칼데라"], "exam": ["2019 B", "2010-1차16*"], "core": true, "keys": "열하 분출, 현무암질, 유동성 큼, 철원·평강", "ex": "철원"}, {"term": "기생 화산", "en": "Parasitic cone", "def": "큰 화산의 산록에 생긴 작은 화산. 제주의 오름.", "cat": "지형학", "distractors": ["종상 화산", "칼데라", "순상 화산"], "exam": ["2019 B"], "core": true, "keys": "큰 화산 산록, 소규모 분화, 오름(제주)"}, {"term": "주상 절리", "en": "Columnar joint", "def": "용암이 냉각·수축하며 형성된 다각형 기둥 모양의 절리.", "cat": "지형학", "distractors": ["판상 절리", "시스택", "풍화혈"], "exam": ["2020 A", "2018 A", "2013 M11", "2009 M22", "2009-1차22*"], "core": true, "keys": "용암 냉각, 수축, 다각형 기둥", "ex": "지삿개"}, {"term": "고위 평탄면", "en": "High-level erosion surface", "def": "오랜 침식으로 평탄해진 지형이 융기하여 높은 곳에 남은 평탄면. 대관령 일대, 고랭지 농업.", "cat": "지형학", "distractors": ["하안 단구", "용암 대지", "구조 평야"], "exam": ["2003-13*"], "core": true, "keys": "융기 이전 평탄면, 산지 정상부, 고랭지 농업, 경동성 요곡", "ex": "대관령"}, {"term": "도약", "en": "Saltation", "def": "모래 입자가 바람·물에 의해 튀어 오르며 이동하는 운반 형태.", "cat": "지형학", "distractors": ["포행", "부유", "견인"], "core": true, "keys": "모래 입자, 튀어 이동, 바람·물 운반", "vs": "부유"}, {"term": "애추", "en": "Talus", "def": "절벽에서 떨어진 암설이 사면 아래 쌓인 퇴적 지형. 아래쪽일수록 큰 암설(낙하 분급).", "cat": "지형학", "distractors": ["암괴류", "선상지", "모레인"], "core": true, "keys": "낙석, 절벽 아래 퇴적, 각진 암설, 동결 풍화"}, {"term": "포행", "en": "Creep", "def": "토양·암설이 매우 느리게 사면 아래로 이동하는 매스무브먼트.", "cat": "지형학", "distractors": ["솔리플럭션", "유동", "활동"], "core": true, "keys": "매우 느린 사면 이동, 토양 크리프, 기울어진 나무·전신주", "vs": "솔리플럭션"}, {"term": "야르당", "en": "Yardang", "def": "바람의 침식으로 탁월풍 방향으로 길게 깎인 유선형 언덕.", "cat": "지형학", "distractors": ["버섯바위", "사막 포도", "바르한"], "core": true, "keys": "풍식, 탁월풍 방향, 유선형 언덕, 건조 지역"}, {"term": "케임 단구", "en": "Kame terrace", "def": "빙하와 골짜기 사면 사이에 융빙수 퇴적물이 쌓여 형성된 단구 모양 지형.", "cat": "지형학", "distractors": ["에스커", "하안 단구", "모레인"], "core": true, "keys": "융빙수 퇴적, 빙하와 골짜기 사면 사이, 단구 모양"}, {"term": "드럼린", "en": "Drumlin", "def": "빙하 진행 방향으로 길쭉한 숟가락을 엎은 모양의 빙퇴석 언덕. 완경사 쪽이 빙하 하류.", "cat": "지형학", "distractors": ["에스커", "양배암", "모레인"], "core": true, "keys": "빙퇴석 언덕, 숟가락 엎은 모양, 완경사 쪽이 하류, 빙하 이동 방향", "vs": "양배암", "exam": ["2013 M17"]}, {"term": "빙식 계단", "en": "Glacial stairway", "def": "빙식곡 바닥이 계단 모양으로 굴곡을 이룬 지형.", "cat": "지형학", "distractors": ["빙식곡", "현곡", "카르"], "core": true, "keys": "빙식곡 바닥, 계단 모양 굴곡, 차별 침식"}, {"term": "우발라", "en": "Uvala", "def": "여러 돌리네가 합쳐져 형성된 복합 돌리네.", "cat": "지형학", "distractors": ["돌리네", "폴리에", "싱크홀"], "core": true, "keys": "돌리네 결합, 복합 돌리네, 카르스트"}, {"term": "맹곡", "en": "Blind valley", "def": "카르스트 지역에서 하천이 지하로 스며들어 끝이 막힌 골짜기.", "cat": "지형학", "distractors": ["건곡", "우발라", "싱킹 크리크"], "core": true, "keys": "카르스트, 하천 지하 유입, 끝이 막힌 골짜기"}, {"term": "풍극", "en": "Wind gap", "def": "하천 쟁탈로 물이 흐르지 않게 된 골짜기의 안부(말라버린 옛 유로).", "cat": "지형학", "distractors": ["수극", "천이점", "안부"], "core": true, "keys": "하천 쟁탈, 말라버린 옛 유로, 골짜기 안부"}, {"term": "침식 기준면", "en": "Base level", "def": "하천이 그 이하로 침식할 수 없는 기준 높이. 궁극적 기준면은 해수면.", "cat": "지형학", "distractors": ["천이점", "평형 하천", "지하수면"], "core": true, "keys": "하방 침식 한계, 해수면(궁극적), 국지적 기준면"}, {"term": "열카르스트", "en": "Thermokarst", "def": "영구동토의 지하빙이 녹아 지표가 함몰되며 생긴 불규칙한 와지 지형.", "cat": "지형학", "distractors": ["카르스트", "활동층", "핑고"], "core": true, "keys": "지하빙 융해, 지표 함몰, 영구 동토, 불규칙 와지", "exam": ["2013 M13"]}, {"term": "배후 습지", "en": "Backswamp", "def": "자연 제방 뒤쪽의 세립질 물질이 쌓인 저습지. 배수가 불량해 주로 논으로 이용.", "cat": "지형학", "distractors": ["자연 제방", "석호", "우각호"], "core": true, "keys": "자연 제방 뒤, 세립 물질(점토), 배수 불량, 논", "vs": "자연 제방", "exam": ["2014 B4"]}, {"term": "사주", "en": "Sand bar", "def": "연안류에 의해 운반된 모래가 해안을 따라 길게 쌓인 퇴적 지형.", "cat": "지형학", "distractors": ["사빈", "사구", "육계사주"], "core": true, "keys": "연안류, 모래 퇴적, 해안과 나란한 띠, 석호 형성"}, {"term": "사빈", "en": "Sandy beach", "def": "파랑·연안류에 의해 모래가 해안에 퇴적된 해수욕장 지형. 만(灣)에 주로 발달.", "cat": "지형학", "distractors": ["해안 사구", "갯벌", "사주"], "core": true, "keys": "파랑·연안류 퇴적, 모래 해안, 해수욕장", "exam": ["2010 P2", "2004 D5"]}, {"term": "해안 사구", "en": "Coastal dune", "def": "사빈의 모래가 바람에 날려 해안 배후에 쌓인 언덕. 지하수 저장·해일 피해 완화 기능.", "cat": "지형학", "distractors": ["사빈", "사주", "석호"], "core": true, "keys": "사빈 모래, 바람 운반, 해안 방풍림, 지하수 저장", "ex": "신두리"}, {"term": "시스택", "en": "Sea stack", "def": "해식애가 후퇴하며 단단한 부분이 촛대 모양으로 남은 바위섬.", "cat": "지형학", "distractors": ["해식동", "육계도", "파식대"], "core": true, "keys": "해식애 후퇴, 경암 잔류, 촛대 바위섬"}, {"term": "리아스 해안", "en": "Ria coast", "def": "하천 침식곡이 후빙기 해수면 상승으로 침수되어 형성된 복잡한 해안. 한국 남·서해안.", "cat": "지형학", "distractors": ["피오르", "에스추어리", "이수 해안"], "core": true, "keys": "침강·해수면 상승, 하곡 침수, 복잡한 해안선, 남·서해안", "vs": "피오르"}, {"term": "돌리네", "en": "Doline", "def": "석회암 지대의 용식으로 생긴 깔때기 모양의 와지. 여러 개가 합쳐지면 우발라.", "cat": "지형학", "distractors": ["우발라", "칼데라", "폴리에"], "core": true, "keys": "석회암 용식, 깔때기 모양 와지, 빗물 배수구, 밭", "exam": ["2004 D19"]}, {"term": "칼데라", "en": "Caldera", "def": "화산 폭발이나 분화구 함몰로 형성된 대형 와지. 예: 백두산 천지, 울릉도 나리 분지.", "cat": "지형학", "distractors": ["화구호", "돌리네", "기생 화산"], "core": true, "keys": "화산 정상부 함몰, 대규모 분화 후, 칼데라호(백두산 천지)", "ex": "천지", "exam": ["2013 M12", "2011 P3"]}, {"term": "토르", "en": "Tor", "def": "화강암이 심층 풍화된 후 풍화층이 제거되며 지표에 드러난 핵석 바위.", "cat": "지형학", "distractors": ["돌산", "시스택", "버트"], "core": true, "keys": "기반암 탑 모양 노출, 풍화층 제거, 화강암, 차별 풍화"}, {"term": "U자곡", "en": "U-shaped valley", "def": "빙하의 침식으로 형성된 단면이 U자형인 골짜기.", "cat": "지형학", "distractors": ["V자곡", "피오르", "카르"], "core": true, "keys": "빙식곡, U자 단면, 빙하 침식, 피오르", "vs": "V자곡"}, {"term": "모레인", "en": "Moraine", "def": "빙하가 운반한 물질이 분급 없이 퇴적된 지형(빙퇴석).", "cat": "지형학", "distractors": ["에스커", "드럼린", "선상지"], "core": true, "keys": "빙퇴석, 분급 불량, 빙하 말단·측면, 빙력토", "vs": "에스커: 분급"}, {"term": "메사", "en": "Mesa", "def": "건조 지역에서 수평 지층의 차별 침식으로 남은 탁자 모양의 대지. 더 작아지면 뷰트.", "cat": "지형학", "distractors": ["뷰트", "와디", "페디먼트"], "c  "core": true, "keys": "정체 전선, 북태평양·오호츠크해 기단, 초여름 집중 강수, 남북 이동"}, {"term": "열섬 현상", "en": "Urban heat island", "def": "도시 중심부 기온이 주변 교외보다 높게 나타나는 현상. 인공열·포장 면적 증가 원인.", "cat": "기후학", "distractors": ["기온 역전", "푄 현상", "열대야"], "exam": ["2024 B"], "core": true, "keys": "도시 기온 상승, 인공 열, 불투수면, 야간 뚜렷"}, {"term": "기온 역전", "en": "Temperature inversion", "def": "고도가 높아질수록 기온이 높아지는 현상. 맑고 바람 없는 밤 분지에서 잘 발생, 안개·대기오염.", "cat": "기후학", "distractors": ["열섬 현상", "푄 현상", "복사 냉각"], "exam": ["2019 B", "2014 A20", "2004 D7", "2004-7*"], "core": true, "keys": "상층이 더 따뜻함, 복사 냉각(맑고 바람 약한 밤), 분지, 안개·대기 오염"}, {"term": "대륙도", "en": "Continentality", "def": "대륙의 영향을 받는 정도. 대륙 동안이 서안보다 연교차가 크다.", "cat": "기후학", "distractors": ["해양도", "연교차", "위도"], "exam": ["2026 B", "2012 M17", "2002 D9"], "core": true, "keys": "대륙 영향 정도, 연교차, 대륙 동안이 큼"}, {"term": "지형성 강수", "en": "Orographic precipitation", "def": "습윤한 공기가 산지를 타고 상승하며 내리는 비. 바람받이 사면에 다우지 형성.", "cat": "기후학", "distractors": ["대류성 강수", "전선성 강수", "저기압성 강수"], "exam": ["2018 A", "2002 D5"], "core": true, "keys": "습윤 공기 상승, 바람받이 사면, 단열 냉각, 다우지"}, {"term": "편서풍", "en": "Westerlies", "def": "아열대 고압대에서 고위도 저압대로 부는 서풍 계열 바람. 중위도 대륙 서안 기후에 영향.", "cat": "기후학", "distractors": ["무역풍", "극동풍", "제트 기류"], "exam": ["2026 B", "2025 B", "2024 B", "2022 A", "2020 A", "2020 B", "2018 A", "2017 A", "2016 A14", "2016 B2", "2015 A4", "2015 A5", "2010 M14", "2008 D22", "2005 D16", "2002 D8"], "core": true, "keys": "중위도, 서→동, 아열대 고압대→한대 전선, 대륙 서안 해양성"}, {"term": "건조 단열 감률", "en": "Dry adiabatic lapse rate", "def": "불포화 공기가 상승할 때 약 10℃/km로 냉각되는 비율. 포화 시 습윤 단열 감률(약 5℃/km).", "cat": "기후학", "distractors": ["습윤 단열 감률", "환경 감률", "기온 역전"], "core": true, "keys": "불포화 공기, 약 1℃/100m, 습윤 단열 감률보다 큼", "vs": "습윤 단열 감률"}, {"term": "비그늘", "en": "Rain shadow", "def": "산맥의 바람그늘 사면에서 강수가 적은 지역. 예: 파타고니아 사막.", "cat": "기후학", "distractors": ["바람받이 사면", "지형성 강수", "열대 수렴대"], "core": true, "keys": "바람그늘 사면, 강수 적음, 하강 기류, 파타고니아", "ex": "파타고니아", "exam": ["2015 A5", "2002 D8"]}, {"term": "온실 효과", "en": "Greenhouse effect", "def": "대기 중 CO2·메탄·수증기 등이 지구 복사(장파)를 흡수·재복사해 지표를 따뜻하게 하는 현상.", "cat": "기후학", "distractors": ["알베도 효과", "오존층 파괴", "열섬"], "core": true, "keys": "장파 복사 흡수, 온실 기체(CO2·CH4), 지구 기온 유지·상승", "exam": ["2011 M19"]}, {"term": "알베도", "en": "Albedo", "def": "입사한 태양 복사 중 반사되는 비율. 눈·얼음이 높고 숲·바다가 낮음.", "cat": "기후학", "distractors": ["복사 평형", "온실 효과", "증발산"], "core": true, "keys": "반사율, 눈·얼음 높음, 숲·바다 낮음, 되먹임"}, {"term": "사바나 기후", "en": "Aw", "def": "열대 기후 중 건기와 우기가 뚜렷한 기후. 긴 풀과 관목이 자람.", "cat": "기후학", "distractors": ["열대 우림 기후", "스텝 기후", "지중해성 기후"], "core": true, "keys": "Aw, 건기·우기, 열대 초원, ITCZ 이동"}, {"term": "서안 해양성 기후", "en": "Cfb", "def": "편서풍과 난류의 영향으로 연교차가 작고 연중 강수가 고른 기후. 혼합 농업·낙농.", "cat": "기후학", "distractors": ["지중해성 기후", "온난 습윤 기후", "냉대 습윤 기후"], "core": true, "keys": "Cfb, 편서풍·난류, 연교차 작음, 연중 고른 강수", "vs": "지중해성", "exam": ["2004 D20"]}, {"term": "툰드라 기후", "en": "ET", "def": "최난월 평균 기온 0~10℃. 여름에 지표 활동층이 녹고 이끼·지의류가 자람.", "cat": "기후학", "distractors": ["빙설 기후", "냉대 기후", "고산 기후"], "core": true, "keys": "ET, 최난월 0~10℃, 수목 한계 밖, 영구 동토"}, {"term": "기단", "en": "Air mass", "def": "넓은 지역에서 기온·습도 등 성질이 비슷한 거대한 공기 덩어리. 발원지 성질을 지님.", "cat": "기후학", "distractors": ["전선", "고기압", "편서풍"], "core": true, "keys": "넓은 지역 동질 성질, 발원지 성질, 기온·습도"}, {"term": "오호츠크해 기단", "en": "Maritime polar", "def": "한랭 습윤한 해양성 기단. 늦봄~초여름 영동 지방에 저온 현상(높새바람의 원인).", "cat": "기후학", "distractors": ["시베리아 기단", "북태평양 기단", "적도 기단"], "core": true, "keys": "한랭 습윤, 초여름, 높새바람, 장마 전선"}, {"term": "북태평양 기단", "en": "Maritime tropical", "def": "고온 다습한 해양성 기단. 한국 여름 무더위·남동(남서) 계절풍.", "cat": "기후학", "distractors": ["오호츠크해 기단", "시베리아 기단", "적도 기단"], "core": true, "keys": "고온 다습, 여름, 남동·남서 계절풍, 무더위·열대야"}, {"term": "엘니뇨", "en": "El Niño", "def": "적도 동태평양 해수면 온도가 평년보다 높아지는 현상. 페루 연안 어획량 감소·홍수.", "cat": "기후학", "distractors": ["라니냐", "몬순", "무역풍"], "core": true, "keys": "동태평양 고수온, 무역풍 약화, 용승 약화, 페루 어획 감소", "vs": "라니냐", "exam": ["2011 M21"]}, {"term": "몬순", "en": "Monsoon", "def": "계절에 따라 풍향이 바뀌는 바람(계절풍). 대륙과 해양의 비열 차이가 원인 <script type="application/json" id="mcqs">[{"src": "2024 A1", "q": "용암의 성질에 대한 설명으로 옳은 것은?", "a": "규산(SiO2) 함량이 많을수록 점성이 크고 폭발적 분화가 잘 일어난다.", "wrong": ["규산 함량이 많을수록 유동성이 커 순상 화산을 만든다.", "현무암질 용암은 규산 함량이 66% 이상이다.", "주상 절리는 용암이 급격히 팽창하며 형성된다.", "유문암질 용암은 가장 어두운 색을 띤다."], "exp": "규산 함량↑ → 점성↑(유문암질, 밝은 색, 종상 화산). 현무암질은 45~52%로 유동성이 크다. 주상 절리는 냉각·수축으로 형성.", "core": true, "subj": "자연지리", "why": {"규산 함량이 많을수록 유동성이 커 순상 화산을 만든다.": "규산이 많으면 점성이 커져 유동성은 작다. 순상 화산은 규산이 적은 현무암질 용암이 만든다.", "현무암질 용암은 규산 함량이 66% 이상이다.": "현무암질은 규산 약 52% 이하인 염기성. 66% 이상은 유문암질(산성).", "주상 절리는 용암이 급격히 팽창하며 형성된다.": "주상 절리는 팽창이 아니라 냉각·수축으로 생긴다.", "유문암질 용암은 가장 어두운 색을 띤다.": "유문암질은 규산이 많아 밝은색. 가장 어두운 것은 현무암질."}}, {"src": "2025 B6", "q": "카르스트 지형에 대한 설명으로 옳은 것은?", "a": "여러 돌리네가 합쳐진 것을 우발라라 한다.", "wrong": ["폴리에는 돌리네보다 규모가 작은 와지이다.", "맹곡은 지하수가 솟아나는 샘이다.", "테라로사는 화강암의 풍화로 형성된다.", "석회동굴은 주로 기계적 풍화로 형성된다."], "exp": "돌리네 < 우발라 < 폴리에. 맹곡은 하천이 지하로 스며드는 막힌 골짜기. 테라로사는 석회암 풍화토, 동굴은 용식(화학적 풍화).", "core": true, "subj": "자연지리", "why": {"폴리에는 돌리네보다 규모가 작은 와지이다.": "폴리에는 돌리네·우발라보다 큰 대형 용식 분지. 크기 순서를 뒤집었다.", "맹곡은 지하수가 솟아나는 샘이다.": "맹곡은 하천이 싱크홀로 사라져 끝이 막힌 골짜기. 솟는 샘은 용천.", "테라로사는 화강암의 풍화로 형성된다.": "테라로사는 석회암 풍화 잔류물(붉은 흙). 화강암 풍화는 마사(그루스).", "석회동굴은 주로 기계적 풍화로 형성된다.": "석회동굴은 탄산칼슘의 화학적 용식으로 형성된다."}}, {"src": "2025 B9", "q": "하천 쟁탈에 대한 설명으로 옳은 것은?", "a": "쟁탈 지점 부근에 물이 흐르지 않는 풍극이 남는다.", "wrong": ["쟁탈하는 하천은 침식력이 더 약하다.", "쟁탈당한 하천의 유량은 증가한다.", "천이점은 시간이 지나면 하류로 이동한다.", "하천 쟁탈은 침식 기준면이 높고 하방 침식력이 강한 하천이 낮은 하천의 상류를 빼앗는 현상이다."], "exp": "침식력 강한 하천이 이웃 하천 상류를 빼앗음 → 쟁탈당한 하천 유량 감소, 풍극 형성. 천이점은 상류로 후퇴.", "core": true, "subj": "자연지리", "why": {"쟁탈하는 하천은 침식력이 더 약하다.": "쟁탈하는 하천은 하방·두부 침식력이 더 강하다(낮은 침식 기준면, 급경사).", "쟁탈당한 하천의 유량은 증가한다.": "쟁탈당한 하천은 상류를 빼앗겨 유량이 감소한다.", "천이점은 시간이 지나면 하류로 이동한다.": "천이점은 두부 침식으로 상류 쪽으로 후퇴한다.", "하천 쟁탈은 침식 기준면이 높고 하방 침식력이 강한 하천이 낮은 하천의 상류를 빼앗는 현상이다.": "반대. 침식 기준면이 낮고 두부 침식이 활발한 하천이 상류를 빼앗는다."}}, {"src": "2026 B7", "q": "침식 기준면과 지각 평형에 대한 설명으로 옳은 것은?", "a": "빙상이 녹아 하중이 제거되면 지각이 반발 융기한다.", "wrong": ["궁극적 침식 기준면은 지하수면이다.", "해수면이 하강하면 하천의 하방 침식은 약해진다.", "해안 단구는 지반 침강으로 형성된다.", "지각 평형은 판의 수평 이동을 설명하는 개념이다."], "exp": "궁극적 기준면=해수면. 해수면 하강 → 하방 침식 강화. 해안 단구는 융기로 형성. 지각 평형은 수직적 균형.", "core": true, "subj": "자연지리", "why": {"궁극적 침식 기준면은 지하수면이다.": "궁극적 침식 기준면은 해수면이다.", "해수면이 하강하면 하천의 하방 침식은 약해진다.": "해수면 하강 → 침식 기준면 하강 → 하방 침식 강화(회춘).", "해안 단구는 지반 침강으로 형성된다.": "해안 단구는 지반 융기(또는 해수면 하강)로 파식대가 높아져 형성.", "지각 평형은 판의 수평 이동을 설명하는 개념이다.": "지각 평형은 하중에 따른 지각의 수직 운동(뜨고 가라앉음) 개념이다."}}, {"src": "2023 B1", "q": "빙하 퇴적 지형에 대한 설명으로 옳은 것은?", "a": "에스커는 빙하 밑 융빙수 하천 퇴적물로 분급이 비교적 양호하다.", "wrong": ["에스커는 빙하가 직접 퇴적해 분급이 불량하다.", "드럼린은 빙하 침식으로 형성된 암반 언덕이다.", "양배암의 급경사 쪽은 빙하 상류 방향이다.", "모레인은 분급이 양호한 층리를 가진다."], "exp": "에스커·케임=융빙수 퇴적(분급 양호). 모레인=빙하 직접 퇴적(분급 불량). 양배암은 하류 쪽이 굴식으로 급경사.", "core": true, "subj": "자연지리", "why": {"에스커는 빙하가 직접 퇴적해 분급이 불량하다.": "직접 퇴적해 분급 불량인 것은 모레인(빙력토). 에스커는 융빙수 퇴적이라 분급 양호.", "드럼린은 빙하 침식으로 형성된 암반 언덕이다.": "드럼린은 빙력토가 유선형으로 쌓인 퇴적 언덕. 암반 침식 언덕은 양배암.", "양배암의 급경사 쪽은 빙하 상류 방향이다.": "양배암은 상류 쪽이 완경사(마모), 하류 쪽이 급경사(뜯김). 방향을 뒤집었다.", "모레인은 분급이 양호한 층리를 가진다.": "모레인은 빙하 직접 퇴적이라 분급·층리가 불량하다."}}, {"src": "2024 B9", "q": "영구동토 지역에 대한 설명으로 옳은 것은?", "a": "활동층이 두꺼워지면 지반이 불안정해지고 열카르스트가 발달할 수 있다.", "wrong": ["활동층은 연중 얼어 있는 층이다.", "열카르스트는 석회암 용식으로 형성된다.", "지하빙이 녹으면 지표가 융기한다.", "영구동토층 위에서는 매스무브먼트가 일어나지 않는다."], "exp": "활동층=여름에 녹는 층. 지하빙 융해 → 지표 함몰(열카르스트). 솔리플럭션 등 매스무브먼트가 활발.", "core": true, "subj": "자연지리", "why": {"활동층은 연중 얼어 있는 층이다.": "활동층은 여름에 녹고 겨울에 어는 층. 연중 언 층은 영구 동토층.", "열카르스트는 석회암 용식으로 형성된다.": "열카르스트는 지하빙 융해로 생긴 와지. 석회암 용식은 카르스트.", "지하빙이 녹으면 지표가 융기한다.": "지하빙이 녹으면 부피가 줄어 지표가 침하한다.", "영구동토층 위에서는 매스무브먼트가 일어나지 않는다.": "활동층이 녹으면 솔리플럭션 같은 매스무브먼트가 활발하다."}}, {"src": "2024 B6", "q": "매스무브먼트와 관련 지형에 대한 설명으로 옳은 것은?", "a": "애추는 낙하한 암설이 쌓여 아래쪽에 큰 암설이 분포하는 낙하 분급을 보인다.", "wrong": ["애추에서는 위쪽에 큰 암설이 분포한다.", "포행은 토양이 수분 포화로 순간 탄력을 잃어 빠르게 흘러내리는 이동이다.", "활동(slide)은 물질 내부가 뒤섞이며 흐르는 이동이다.", "솔리플럭션은 건조 지역에서 주로 발생한다."], "exp": "낙하 시 큰 암설이 더 멀리(아래로) 굴러감. 포행은 매우 느림. 활동은 미끄럼면을 따라 덩어리째, 유동은 내부가 흐름. 솔리플럭션은 주빙하.", "core": true, "subj": "자연지리", "why": {"애추에서는 위쪽에 큰 암설이 분포한다.": "낙하 분급으로 큰 암설이 더 멀리 굴러 아래쪽에 쌓인다. 위쪽이 아님.", "활동(slide)은 물질 내부가 뒤섞이며 흐르는 이동이다.": "활동(slide)은 미끄럼면을 따라 덩어리째 이동. 내부가 뒤섞이며 흐르는 것은 유동(flow).", "솔리플럭션은 건조 지역에서 주로 발생한다.": "솔리플럭션은 주빙하 지역 활동층 융해와 관련.", "포행은 토양이 수분 포화로 순간 탄력을 잃어 빠르게 흘러내리는 이동이다.": "그것은 토류·이류. 포행은 눈에 띄지 않을 만큼 매우 느린 이동."}}, {"src": "2023 A10", "q": "건조 지형에 대한 설명으로 옳은 것은?", "a": "사막 포도는 바람이 세립질을 날려 보내 자갈만 남은 지표이다.", "wrong": ["야르당은 하천 침식으로 형성된다.", "바르한의 뿔은 바람이 불어오는 쪽을 향한다.", "플라야는 산지 사면의 침식면이다.", "와디는 연중 물이 흐르는 하천이다."], "exp": "디플레이션 → 사막 포도. 야르당은 풍식. 바르한의 뿔은 바람 불어가는 쪽. 플라야=분지 바닥 염호 흔적, 와디=건천.", "core": true, "subj": "자연지리", "why": {"야르당은 하천 침식으로 형성된다.": "야르당은 바람 침식(마식) 지형.", "바르한의 뿔은 바람이 불어오는 쪽을 향한다.": "바르한의 뿔은 바람이 불어가는 쪽을 향한다.", "플라야는 산지 사면의 침식면이다.": "플라야는 분지 바닥의 일시적 염호. 산록 침식면은 페디먼트.", "와디는 연중 물이 흐르는 하천이다.": "와디는 비가 올 때만 흐르는 간헐 하천."}}, {"src": "2022 A12", "q": "건조 지역 산록 지형에 대한 설명으로 옳은 것은?", "a": "페디먼트는 기반암이 깎인 침식면으로 얇은 퇴적층에 덮여 있다.", "wrong": ["페디먼트는 두꺼운 충적층으로 이루어진 퇴적 지형이다.", "바하다는 하나의 선상지를 말한다.", "플라야는 바하다보다 고도가 높다.", "선상지의 선앙은 지표수가 풍부하다."], "exp": "페디먼트=침식면, 바하다=복합 선상지(퇴적), 플라야는 분지 최저부. 선앙은 복류로 건천.", "core": true, "subj": "자연지리", "why": {"페디먼트는 두꺼운 충적층으로 이루어진 퇴적 지형이다.": "페디먼트는 기반암 침식면이며 퇴적층은 얇다.", "바하다는 하나의 선상지를 말한다.": "바하다는 여러 선상지가 합쳐진 것.", "플라야는 바하다보다 고도가 높다.": "플라야는 분지 가장 낮은 곳으로 바하다보다 낮다.", "선상지의 선앙은 지표수가 풍부하다.": "선앙은 복류로 지표수가 부족하다."}}, {"src": "2023 B4", "q": "하도 유형에 대한 설명으로 옳은 것은?", "a": "망류 하도는 하중 공급이 많고 유량 변동이 큰 곳에서 발달한다.", "wrong": ["망류 하도는 하중 공급이 적은 곳에서 발달한다.", "망류 하도는 하나의 깊은 수로로 흐른다.", "곡류 하도는 사력 하중이 압도적으로 많다.", "망류 하도는 하안 식생이 조밀할수록 잘 발달한다."], "exp": "많은 조립 하중·유량 변동·약한 하안 → 망류. 곡류는 부유 하중·점착성 하안.", "core": true, "subj": "자연지리", "why": {"망류 하도는 하중 공급이 적은 곳에서 발달한다.": "망류 하도는 하중 공급이 많은 곳에서 발달.", "망류 하도는 하나의 깊은 수로로 흐른다.": "망류 하도는 여러 갈래 얕은 수로로 나뉘어 흐른다.", "곡류 하도는 사력 하중이 압도적으로 많다.": "곡류 하도는 세립(부유) 하중 비중이 크다. 사력 우세는 망류.", "망류 하도는 하안 식생이 조밀할수록 잘 발달한다.": "하안 식생이 조밀하면 하안이 안정돼 단일 수로가 되기 쉽다."}}, {"src": "2025 A4", "q": "동해안 석호와 사주에 대한 설명으로 옳은 것은?", "a": "석호는 후빙기 해수면 상승으로 형성된 만이 사주로 막혀 (확대 왜곡).", "TM 도법은 면적이 보존되는 정적 원통 도법이다.": "TM은 정각 도법. 형태(각)를 보존하고 면적은 왜곡."}}, {"src": "2024 A4", "q": "우리나라 평면 직각 좌표에 대한 설명으로 옳은 것은?", "a": "좌표가 음수가 되지 않도록 원점에 X(N) 600,000m를 가산한다.", "wrong": ["원점 가산값은 X(N) 200,000m이다.", "평면 직각 좌표는 정적 원추 도법에 기초한다.", "원점은 모두 북위 38°, 동경 135°이다.", "좌표 원점은 하나만 사용한다."], "exp": "TM 기반. 원점 가산값 X(N) 600,000m, Y(E) 200,000m. 서부·중부·동부·동해 원점(북위 38°, 동경 125·127·129·131°).", "core": true, "subj": "자연지리", "why": {"원점 가산값은 X(N) 200,000m이다.": "X(N) 가산값은 600,000m(현행). 200,000m는 Y(E) 가산값.", "평면 직각 좌표는 정적 원추 도법에 기초한다.": "평면 직각 좌표는 TM(횡축 메르카토르) 투영 기반.", "원점은 모두 북위 38°, 동경 135°이다.": "원점은 북위 38°, 동경 125°·127°·129°·131° 등. 135°가 아님.", "좌표 원점은 하나만 사용한다.": "원점은 여러 개(서부·중부·동부·동해 등)."}}, {"src": "2023 B3", "q": "통계 지도 계급 구분에 대한 설명으로 옳은 것은?", "a": "분위수 분류는 각 계급에 포함되는 단위 지역 수가 같다.", "wrong": ["등간격 분류는 각 계급의 지역 수가 같다.", "분위수 분류는 계급 구간 폭이 같고 사례 수는 다를 수 있다.", "단계 구분도는 인구수 같은 절대값을 표현하는 데 적합하다.", "등간격 분류는 치우친 분포 자료에서 계급별 개수가 고르다."], "exp": "분위수=개수 동일, 간격 불균등. 등간격=간격 동일, 치우친 분포에서 빈 계급 발생. 단계 구분도는 비율 자료에 적합.", "core": true, "subj": "자연지리", "why": {"등간격 분류는 각 계급의 지역 수가 같다.": "계급별 지역 수가 같은 것은 분위수 분류.", "등간격 분류는 치우친 분포 자료에서 계급별 개수가 고르다.": "치우친 자료를 등간격으로 나누면 계급별 개수가 크게 불균등해진다.", "분위수 분류는 계급 구간 폭이 같고 사례 수는 다를 수 있다.": "그것은 등간격 분류. 분위수는 사례 수 동일, 구간 폭 불균등.", "단계 구분도는 인구수 같은 절대값을 표현하는 데 적합하다.": "절대값은 도형 표현도(비례 원)가 적합. 단계 구분도는 밀도·비율 같은 상대값."}}, {"src": "2024 B4", "q": "원격 탐사 영상에 대한 설명으로 옳은 것은?", "a": "건강한 식생은 근적외선 반사가 커서 NDVI 값이 높다.", "wrong": ["NDVI는 열적외선과 가시광선으로 계산한다.", "식생은 적색광을 강하게 반사한다.", "열적외선 영상은 지표 반사광을 기록한다.", "공간 해상도 값이 클수록 세밀한 영상이다."], "exp": "NDVI=(NIR−R)/(NIR+R). 엽록소는 적색광 흡수. 열적외선은 방출 에너지. 화소 크기 작을수록 고해상도.", "core": true, "subj": "자연지리", "why": {"NDVI는 열적외선과 가시광선으로 계산한다.": "NDVI는 근적외선과 적색광으로 계산.", "식생은 적색광을 강하게 반사한다.": "식생은 적색광을 흡수(엽록소)하고 근적외선을 반사.", "열적외선 영상은 지표 반사광을 기록한다.": "열적외선 영상은 지표가 방출하는 열에너지를 기록.", "공간 해상도 값이 클수록 세밀한 영상이다.": "해상도 값(셀 크기)이 작을수록 세밀하다."}}, {"src": "2026 B11", "q": "공간 데이터 모델에 대한 설명으로 옳은 것은?", "a": "래스터 데이터는 격자 셀로 연속 현상을 표현하는 데 유리하다.", "wrong": ["벡터 데이터는 셀 단위로 공간을 표현한다.", "지오이드는 지구를 근사한 수학적 타원체이다.", "보간은 좌표를 주소로 바꾸는 작업이다.", "래스터는 위상 관계 표현이 벡터보다 유리하다."], "exp": "래스터=격자, 벡터=점·선·면(위상 유리). 지오이드=평균 해수면 등중력면, 타원체는 수학적 모델. 보간=미관측 값 추정.", "core": true, "subj": "자연지리", "why": {"벡터 데이터는 셀 단위로 공간을 표현한다.": "셀 단위 표현은 래스터. 벡터는 점·선·면.", "지오이드는 지구를 근사한 수학적 타원체이다.": "수학적 타원체는 기준 타원체. 지오이드는 평균 해수면을 연장한 등중력면.", "보간은 좌표를 주소로 바꾸는 작업이다.": "좌표↔주소 변환은 지오코딩. 보간은 미관측 지점 값을 추정.", "래스터는 위상 관계 표현이 벡터보다 유리하다.": "위상 관계 표현은 벡터가 유리."}}, {"src": "2026 A2", "q": "출산력 지표에 대한 설명으로 옳은 것은?", "a": "합계 출산율이 대체 출산율(약 2.1)보다 낮게 지속되면 장기적으로 인구가 감소한다.", "wrong": ["대체 출산율은 약 1.0이다.", "합계 출산율은 인구 1,000명당 출생아 수이다.", "총재생산율은 남아 수를 기준으로 한다.", "합계 출산율은 연령 구조의 영향을 크게 받는다."], "exp": "인구 1,000명당 출생아 수는 조출생률. 합계 출산율은 연령별 출산율 합으로 연령 구조 영향이 작음. 총재생산율은 여아 기준.", "core": true, "subj": "인문지리", "why": {"대체 출산율은 약 1.0이다.": "대체 출산율은 약 2.1.", "합계 출산율은 인구 1,000명당 출생아 수이다.": "1,000명당 출생아 수는 조출생률.", "총재생산율은 남아 수를 기준으로 한다.": "총재생산율은 여아 수 기준.", "합계 출산율은 연령 구조의 영향을 크게 받는다.": "합계 출산율은 연령별 출산율 합이라 연령 구조 영향을 받지 않는다. 받는 것은 조출생률."}}, {"src": "2025 B4", "q": "인구 지표에 대한 설명으로 옳은 것은?", "a": "노령화 지수는 유소년 인구 100명당 노년 인구이다.", "wrong": ["노령화 지수는 생산 가능 인구 100명당 노년 인구이다.", "총부양비는 노년 인구만으로 계산한다.", "현주주의는 평소 거주지 기준으로 집계한다.", "노년 부양비는 유소년 인구를 분모로 한다."], "exp": "노년 부양비=노년/생산가능×100, 노령화 지수=노년/유소년×100. 상주주의=평소 거주지, 현주주의=조사 시점 소재지.", "core": true, "subj": "인문지리", "why": {"노령화 지수는 생산 가능 인구 100명당 노년 인구이다.": "분모는 유소년 인구(0~14세). 생산 가능 인구가 분모인 것은 노년 부양비.", "총부양비는 노년 인구만으로 계산한다.": "총부양비는 (유소년+노년)/생산 가능 인구.", "현주주의는 평소 거주지 기준으로 집계한다.": "평소 거주지 기준은 상주주의. 현주주의는 조사 시점 소재지.", "노년 부양비는 유소년 인구를 분모로 한다.": "노년 부양비 분모는 생산 가능 인구."}}, {"src": "2023 A7", "q": "젠트리피케이션(닐 스미스)에 대한 설명으로 옳은 것은?", "a": "잠재적 지대와 실제 지대의 차이인 지대 격차가 커지면 재투자가 일어난다.", "wrong": ["지대 격차는 교외 신규 개발지에서 가장 크다.", "젠트리피케이션은 저소득층이 도심으로 유입되는 현상이다.", "지대 격차가 작을수록 재개발 압력이 크다.", "닐 스미스는 소비자 선호만으로 설명했다."], "exp": "스미스는 생산(자본) 측면 설명: 투자 철수 → 실제 지대 하락 → 지대 격차 확대 → 재투자. 소비 측면은 레이(Ley).", "core": true, "subj": "인문지리", "why": {"지대 격차는 교외 신규 개발지에서 가장 크다.": "지대 격차  A8", "q": "안개에 대한 설명으로 옳은 것은?", "a": "한류가 흐르는 해안(예: 샌프란시스코)에서는 이류 안개가 잘 발생한다.", "wrong": ["이류 안개는 내륙 분지에서 주로 생긴다.", "복사 안개는 흐리고 바람 강한 밤에 잘 생긴다.", "증기 안개는 따뜻하고 습한 공기가 차가운 수면 위로 이동할 때 생긴다.", "안개는 기온이 이슬점보다 높을 때 생긴다."], "exp": "난습한 공기 + 찬 해면 → 이류무. 복사무=맑고 바람 약한 밤. 증기무=찬 공기가 따뜻한 수면 위.", "core": false, "subj": "자연지리", "why": {"이류 안개는 내륙 분지에서 주로 생긴다.": "내륙 분지는 복사 안개. 이류 안개는 해안·해상.", "복사 안개는 흐리고 바람 강한 밤에 잘 생긴다.": "복사 안개는 맑고 바람 약한 밤에 생긴다.", "증기 안개는 따뜻하고 습한 공기가 차가운 수면 위로 이동할 때 생긴다.": "따뜻한 공기가 찬 수면 위로 가는 것은 이류 안개. 증기 안개는 찬 공기가 따뜻한 수면 위로 갈 때.", "안개는 기온이 이슬점보다 높을 때 생긴다.": "안개는 기온이 이슬점까지 낮아질 때 생긴다."}}, {"src": "2014 A9", "q": "기후 인자에 대한 설명으로 옳은 것은?", "a": "같은 위도라도 대륙 동안은 서안보다 연교차가 크다.", "wrong": ["해양의 비열은 육지보다 작다.", "대륙 서안은 동안보다 겨울이 춥다.", "수륙 분포는 기온에 영향을 주지 않는다.", "고도가 높아지면 기온이 상승한다."], "exp": "대륙 동안: 대륙풍 영향 → 연교차 큼. 서안: 편서풍·해양 영향 → 온화.", "core": false, "subj": "자연지리", "why": {"해양의 비열은 육지보다 작다.": "해양 비열이 육지보다 크다.", "대륙 서안은 동안보다 겨울이 춥다.": "대륙 동안이 서안보다 겨울이 춥다.", "수륙 분포는 기온에 영향을 주지 않는다.": "수륙 분포는 연교차 등 기온에 큰 영향.", "고도가 높아지면 기온이 상승한다.": "고도가 높아지면 기온은 낮아진다(약 0.6℃/100m)."}}, {"src": "2019 A2", "q": "쾨펜 기후 구분에 대한 설명으로 옳은 것은?", "a": "C 기후는 최한월 평균 기온이 −3℃ 이상 18℃ 미만이다.", "wrong": ["A 기후는 최한월 평균 기온이 10℃ 이상이다.", "D 기후는 최한월 평균 기온 −3℃ 이상이다.", "E 기후는 최한월 평균 기온 10℃ 미만이다.", "B 기후는 기온으로 구분한다."], "exp": "A: 최한월 18℃ 이상, D: 최한월 −3℃ 미만·최난월 10℃ 이상, E: 최난월 10℃ 미만, B: 강수량(건조 한계).", "core": false, "subj": "자연지리", "why": {"A 기후는 최한월 평균 기온이 10℃ 이상이다.": "A 기후는 최한월 18℃ 이상. 10℃는 C·D와 E를 가르는 최난월 기준.", "D 기후는 최한월 평균 기온 −3℃ 이상이다.": "D 기후는 최한월 −3℃ 미만.", "E 기후는 최한월 평균 기온 10℃ 미만이다.": "E 기후는 최난월 10℃ 미만.", "B 기후는 기온으로 구분한다.": "B 기후는 강수량(건조 한계)으로 구분."}}, {"src": "2023 A2", "q": "건조 기후에 대한 설명으로 옳은 것은?", "a": "BWh는 연중 아열대 고압대의 하강 기류 영향을 받는 저위도 사막 기후이다.", "wrong": ["BWh는 고위도 한랭 사막이다.", "비그늘 사막은 산맥의 바람받이 쪽에 생긴다.", "한류 연안 사막은 강수가 많다.", "건조 기후는 증발량보다 강수량이 많다."], "exp": "h=hot(연평균 18℃ 이상). 비그늘=바람의지. 한류 → 대기 안정 → 사막(아타카마).", "core": false, "subj": "자연지리", "why": {"BWh는 고위도 한랭 사막이다.": "BWh는 저위도 고온 사막. 고위도 한랭 사막은 BWk.", "비그늘 사막은 산맥의 바람받이 쪽에 생긴다.": "비그늘 사막은 바람그늘 쪽.", "한류 연안 사막은 강수가 많다.": "한류 연안 사막은 대기가 안정돼 강수가 매우 적다.", "건조 기후는 증발량보다 강수량이 많다.": "건조 기후는 증발량이 강수량보다 많다."}}, {"src": "2023 B8", "q": "남아시아 몬순에 대한 설명으로 옳은 것은?", "a": "7월에는 남서 몬순이 습윤한 공기를 운반해 우기가 된다.", "wrong": ["1월에는 남서 몬순이 습윤한 공기를 운반해 우기가 된다.", "7월에는 북동 몬순으로 건조하다.", "몬순 우기에는 운량이 적어 최고 기온이 7월에 나타난다.", "우기에는 운량이 감소해 알베도가 낮아진다."], "exp": "1월 북동(건기), 7월 남서(우기). 우기 운량 증가 → 행성 알베도 증가.", "core": false, "subj": "자연지리", "why": {"7월에는 북동 몬순으로 건조하다.": "7월에는 남서 몬순으로 습윤.", "우기에는 운량이 감소해 알베도가 낮아진다.": "우기에는 운량이 증가해 알베도가 높아진다.", "1월에는 남서 몬순이 습윤한 공기를 운반해 우기가 된다.": "1월은 대륙에서 부는 북동 몬순으로 건기. 남서 몬순은 7월.", "몬순 우기에는 운량이 적어 최고 기온이 7월에 나타난다.": "우기에는 운량 증가로 일사가 줄어 최고 기온이 우기 직전(5월)에 나타난다."}}, {"src": "2024 A11", "q": "인간 활동에 의한 기후 변화에 대한 설명으로 옳은 것은?", "a": "열대림을 목초지로 바꾸면 증발산이 줄어 지표가 건조·고온화될 수 있다.", "wrong": ["열대림을 목초지로 바꾸면 광합성 흡수가 늘어 대기 CO2가 감소한다.", "열대림 제거는 증발산을 증가시킨다.", "온실 효과는 단파 복사 흡수가 핵심이다.", "숲을 초지로 바꾸면 지표 알베도가 낮아져 흡수 일사가 증가한다."], "exp": "온실 기체는 지구 장파 복사 흡수. 초지는 숲보다 알베도↑, 증발산↓ → 잠열 감소로 지표 가열.", "core": false, "subj": "자연지리", "why": {"열대림 제거는 증발산을 증가시킨다.": "열대림 제거는 증발산을 감소시킨다.", "온실 효과는 단파 복사 흡수가 핵심이다.": "온실 효과는 지표 장파 복사 흡수가 핵심.", "열대림을 목초지로 바꾸면 광합성 흡수가 늘어 대기 CO2가 감소한다.": "반대. 산림 제거로 광합성 CO2 흡수가 줄어 대기 CO2 증가.", "숲을 초지로 바꾸면 지표 알베도가 낮아져 흡수 일사가 증가한다.": "초지는 숲보다 밝아 알베도가 높아진다. 증발산 감소로 고온·건조화."}}, {"src": "2018 A3", "q": "국지풍에 대한 설명으로 옳은 것은?", "a": "낮에는 해풍, 밤에는 육풍이 분다.", "wrong": ["낮에는 산풍, 밤에는 곡풍이 분다.", "낮에는 육풍, 밤에는 해풍이 분다.", "밤에는 해양 쪽이 고기압이 된다.", "낮에는 육지 쪽이 고기압이 된다."], "exp": "낮: 육지 가열 → 저압 → 해풍. 밤: 육지 냉각 → 고압 → 육풍. 낮 곡풍, 밤 산풍.", "core": false, "subj": "자연지리", "why": {"낮에는 산풍, 밤에는 곡풍이 분다.": "낮에는 곡풍(골짜기→산), 밤에는 산풍.", "밤에는 해양 쪽이 고기압이 된다.": "밤에는 육지가 빨리 식어 육지 쪽이 고기압.", "낮에는 육지 쪽이 고기압이 된다.": "낮에는 육지가 가열돼 육지 쪽이 저기압.", "낮에는 육풍, 밤에는 해풍이 분다.": "낮에 육지가 빨리 가열되어 해풍, 밤에는 육지가 빨리 냉각되어 육풍."}}, {"src": "2024 B4", "q": "원격 탐사 파장대에 대한 설명으로 옳은 것은?", "a": "열적외선 영상은 도시 열섬 분석에 활용된다.", "wrong": ["가시광선 영상은 야간에 가장 유용하다.", "열적외선 센서는 반사된 태양광을 기록한다.", "식생은 근적외선을 거의 반사하지 않는다.", "물은 근적외 <script type="application/json" id="psg">[{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"[답사 기록] 영월 동강 일대를 답사하였다. 하천은 산지 사이를 깊게 파고들며 구불구불 흐르고 있었고, 하천 양안의 높은 곳에서는 둥근 자갈이 섞인 평탄면이 계단 모양으로 나타났다. 안내자는 이 평탄면이 과거의 하상이었으며 현재는 밭과 취락으로 이용된다고 설명하였다. 이 하천과 같이 산지를 깊게 파고 흐르는 곡류 하천을 ( ㉠ ), 하천 양안의 계단 모양 평탄면을 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["감입 곡류 하천","감입 곡류","감입곡류천"]},{"l":"㉡","a":["하안 단구","하안단구"]}],"task":"㉡의 형성 과정을 지반 운동과 관련지어 서술하시오.","model":"과거 하천 바닥이나 범람원이던 곳이 지반 융기로 하천의 하방 침식이 강화되면서 하상이 낮아져, 과거 하상이 하천 양안에 계단 모양으로 남아 형성되었다. 둥근 자갈은 이곳이 과거 하상이었음을 보여 준다.","rubric":["지반 융기","하방 침식","과거 하상","둥근 자갈"],"wrongs":[{"a":"자유 곡류 하천","why":"자유 곡류는 넓은 충적 평야 위를 흐르며 유로 변경이 잦다. 산지를 깊게 파고 흐르는 것은 감입 곡류."},{"a":"해안 단구","why":"해안 단구는 파식대가 융기한 해안 지형. 하천 양안의 계단 지형은 하안 단구."}],"rel":["감입 곡류 하천","하안 단구"],"id":"p000"},{"subj":"자연지리","cat":"지형학","type":"지도·자료 해석","text":"하천이 산지에서 평지로 나오는 곡구에서 유속이 갑자기 느려지면서 운반 물질이 부채꼴로 쌓인 지형이 있다. 이 지형의 정점부에서 중앙부에 이르는 지역은 하천이 지하로 스며들어 흐르는 ( ㉠ ) 현상이 나타나 밭이나 과수원으로 이용되고, 말단부에서는 지하수가 솟아나 취락이 입지하고 논농사가 이루어진다.","blanks":[{"l":"㉠","a":["복류","복류 현상"]}],"task":"이 지형의 말단부에 취락이 입지하는 이유를 퇴적물의 입자 크기와 관련지어 서술하시오.","model":"선상지는 정점에서 말단으로 갈수록 퇴적물 입자가 작아지는데, 중앙부의 굵은 물질 사이로 스며든 하천수가 입자가 작아 투수성이 낮은 말단부에서 용천으로 솟아나므로, 물을 얻기 쉬운 말단부(선단)에 취락과 논이 입지한다.","rubric":["입자 크기 감소","복류","용천","물 확보"],"wrongs":[{"a":"용천","why":"용천은 말단부(선단)에서 지하수가 솟는 현상으로 중앙부의 특징이 아님."}],"rel":["선상지","선앙","선단"],"id":"p001"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"동해안의 경포호, 화진포 등은 과거 만(灣)이었던 곳의 입구가 ( ㉠ )에 의해 막히면서 형성된 호수이다. 이러한 호수를 ( ㉡ )(이)라고 하며, 시간이 지나면서 점차 면적이 축소되고 있다.","blanks":[{"l":"㉠","a":["사주","연안 사주"]},{"l":"㉡","a":["석호"]}],"task":"㉡의 면적이 점차 축소되는 이유를 서술하시오.","model":"석호로 유입하는 하천이 운반한 토사가 계속 퇴적되어 호수가 메워지기 때문에 면적이 점차 축소된다.","rubric":["하천 유입","토사 퇴적","메워짐"],"wrongs":[{"a":"우각호","why":"우각호는 곡류 하천의 구하도에 물이 고인 호수로, 사주가 만을 막아 생긴 것이 아님."},{"a":"사취","why":"사취는 한쪽 끝이 육지에 붙은 모래톱. 만의 입구를 가로막는 것은 사주."}],"rel":["사주","석호"],"id":"p002"},{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"석회암 지대를 답사하던 학생들은 지표에 깔때기 모양으로 움푹 팬 와지를 여러 개 관찰하였다. 이 와지는 빗물이나 지하수에 의한 ( ㉠ ) 작용으로 형성된 것으로 ( ㉡ )(이)라고 한다. 이 와지들이 여러 개 합쳐지면 더 큰 와지가 된다.","blanks":[{"l":"㉠","a":["용식"]},{"l":"㉡","a":["돌리네"]}],"task":"㉡ 주변 토양이 붉은색을 띠는 이유와 주된 토지 이용을 서술하시오.","model":"석회암이 풍화되면서 남은 철분 등이 산화되어 붉은색의 테라로사가 형성되었기 때문이며, 돌리네는 배수가 양호해 주로 밭으로 이용된다.","rubric":["테라로사","철분 산화","배수 양호","밭"],"wrongs":[{"a":"우발라","why":"우발라는 여러 돌리네가 합쳐진 큰 와지. 단일 깔때기 와지는 돌리네."}],"rel":["돌리네","용식","테라로사"],"id":"p003"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"제주도 한라산 산록에는 ( ㉠ )(이)라 불리는 작은 화산체가 360여 개 분포한다. 이들 중 다수는 화산 쇄설물인 스코리아가 화구 주변에 쌓여 형성된 원추형 화산인 ( ㉡ )이다.","blanks":[{"l":"㉠","a":["오름","기생 화산","측화산"]},{"l":"㉡","a":["분석구"]}],"task":"제주도 대부분 지역에서 하천이 평상시 말라 있는 이유를 기반암 특성과 관련지어 서술하시오.","model":"제주도의 기반암인 현무암은 절리가 발달하고 다공질이어서 빗물이 지하로 쉽게 스며들므로, 대부분의 하천은 평상시 물이 흐르지 않는 건천이다.","rubric":["현무암","절리","투수성","건천"],"wrongs":[{"a":"칼데라","why":"칼데라는 분화구 함몰로 생긴 대형 와지. 산록의 작은 화산체는 오름(기생 화산)."}],"rel":["오름","분석구"],"id":"p004"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"철원·평강 일대에는 유동성이 큰 현무암질 용암이 지각의 갈라진 틈을 따라 분출하는 ( ㉠ ) 분출로 형성된 넓은 평탄 지형인 ( ㉡ )이/가 발달해 있다. 이곳을 흐르는 한탄강 주변에는 수직의 절벽과 기둥 모양 절리가 나타난다.","blanks":[{"l":"㉠","a":["열하","열하 분출"]},{"l":"㉡","a":["용암 대지","용암대지"]}],"task":"한탄강 주변 기둥 모양 절리의 형성 원리를 서술하시오.","model":"용암이 지표에서 냉각될 때 부피가 수축하면서 수직 방향의 다각형 균열이 생겨 기둥 모양의 주상 절리가 형성된다.","rubric":["용암 냉각","수축","다각형 기둥","주상 절리"],"wrongs":[{"a":"판상 절리","why":"판상 절리는 압력 해방으로 지표와 평행하게 생기는 절리. 냉각·수축 기둥은 주상 절리."}],"rel":["용암 대지","주상 절리"],"id":"p005"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"북한산 인수봉처럼 화강암이 지표에 드러난 산지에서는, 지하 깊은 곳에서 형성된 화강암 위의 암석이 제거되며 압력이 줄어 지표와 평행한 ( ㉠ ) 절리가 생기고, 이를 따라 암석이 양파 껍질처럼 벗겨지는 ( ㉡ ) 현상이 나타난다.","blanks":[{"l":"㉠","a":["판상"]},{"l":"㉡","a":["박리"]}],"task":"화강암 지역에 돌산과 침식 분지가 함께 나타나는 이유를 서술하시오.","model":"화강암은 절리가 많고 화학적 풍화(심층 풍화)를 받기 쉬워 주변 변성암보다 빨리 침식되어 침식 분지를 이루며, 풍화층이 제거되어 기반암이 노출된 곳은 돌산이 된다.","rubric":["심층 풍화","차별 침식","침식 분지","기반암 노출"],"wrongs":[],"rel":["판상 절리","박리","침식 분지","돌산"],"id":"p006"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"산지의 사면에 크고 작은 암괴가 골짜기를 따라 흘러내리듯 쌓여 있는 지형을 ( ㉠ )(이)라고 한다. 우리나라의 ㉠은 현재 기후 환경에서는 형성되지 않고 과거 빙기의 환경에서 형성된 ( ㉡ ) 지형이다.","blanks":[{"l":"㉠","a":["암괴류"]},{"l":"㉡","a":["화석","화석 지형"]}],"task":"㉠의 형성 과정을 빙기의 기후 환경과 관련지어 서술하시오.","model":"빙기의 주빙하 환경에서 동결·융해가 반복되며 암석이 기계적으로 파쇄되어 암괴가 만들어지고, 여름철 녹은 활동층이 사면을 따라 흘러내리는 솔리플럭션으로 암괴가 이동·집적되어 형성되었다.","rubric":["주빙하","동결 융해","기계적 풍화","솔리플럭션"],"wrongs":[{"a":"애추","why":"애추는 절벽 아래 떨어진 암설이 쌓인 원추형 퇴적 지형. 골짜기를 따라 흘러내린 형태는 암괴류."}],"rel":["암괴류","화석 지형","솔리플럭션"],"id":"p007"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"빙하가 흐르던 골짜기는 단면이 ( ㉠ )형을 이루며, 해수면 상승으로 이 골짜기가 침수되면 좁고 깊은 만인 ( ㉡ )이/가 형성된다. 노르웨이·칠레 남부 해안에 잘 나타난다.","blanks":[{"l":"㉠","a":["U자","U"]},{"l":"㉡","a":["피오르","피오르드"]}],"task":"㉡과 리아스 해안의 형성 과정 차이를 서술하시오.","model":"피오르는 빙하가 깎은 U자곡이 후빙기 해수면 상승으로 침수된 것이고, 리아스 해안은 하천이 깎은 V자 하곡이 침수된 것이다.","rubric":["빙식곡","하곡","침수","해수면 상승"],"wrongs":[{"a":"리아스 해안","why":"리아스 해안은 하천 침식곡이 침수된 해안. 빙식곡 침수는 피오르."}],"rel":["피오르","U자곡","리아스 해안"],"id":"p008"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"태안 신두리 해안에는 사빈의 모래가 바람에 날려 해안 배후에 쌓인 언덕인 ( ㉠ )이/가 발달해 있다. ㉠은 바닷물의 침입을 막고 ( ㉡ )을/를 저장하는 기능을 한다.","blanks":[{"l":"㉠","a":["해안 사구","해안사구","사구"]},{"l":"㉡","a":["지하수","담수"]}],"task":"㉠이 겨울철에 잘 발달하는 이유를 바람과 관련지어 서술하시오.","model":"겨울철 북서 계절풍이 강하게 불어 사빈의 건조한 모래를 내륙 쪽으로 운반·퇴적시키므로 서해안의 해안 사구는 겨울에 잘 발달한다.","rubric":["북서 계절풍","모래 운반","바람 퇴적"],"wrongs":[],"rel":["해안 사구","사빈"],"id":"p009"},{"subj":"자연지리","cat":"지형학","type":"실험·자료","text":"[하천 실험] 유속을 점차 낮추며 물에 섞인 퇴적물을 관찰하였더니, 자갈이 먼저 가라앉고 그다음 모래, 마지막으로 점토가 가라앉았다. 이처럼 유속 감소에 따라 입자가 크기별로 쌓이는 작용을 ( ㉠ )(이)라고 한다. 반면 침식 실험에서는 모래보다 점토가 더 빠른 유속에서 침식되었다.","blanks":[{"l":"㉠","a":["분급","분급 작용"]}],"task":"점토가 모래보다 높은 유속에서 침식되는 이유를 서술하시오.","model":"점토는 입자가 매우 작아 입자 사이의 응집력이 커서 서로 달라붙어 있으므로, 모래보다 높은 유속이 있어야 침식된다.","rubric":["응집력","미립자","침식 유속"],"wrongs":[],"rel":["휼스트롬 도표","침식 유속","퇴적 유속"],"id":"p010"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"해안의 곶에서는 파랑의 ( ㉠ ) 작용으로 해식애가 형성되고, 해식애가 후퇴하면서 그 앞에 평탄한 암반면인 ( ㉡ )이/가 나타난다. 동 "blanks":[{"l":"㉠","a":["동심원","동심원 이론"]},{"l":"㉡","a":["선형","선형 이론"]}],"task":"해리스와 울만의 다핵심 모델이 앞의 두 모델과 다른 점을 서술하시오.","model":"다핵심 모델은 도시가 하나의 중심이 아닌 여러 개의 핵심(부도심 등)을 중심으로 성장하며, 기능별 입지 요구와 집적·분산 경향에 따라 다양한 기능 지역이 형성된다고 보았다.","rubric":["여러 핵심","부도심","기능별 집적"],"wrongs":[],"rel":["동심원 모델","선형 모델","다핵심 모델"],"id":"p052"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"베버의 공업 입지론에서 원료 산지에서 제품 무게가 크게 줄어드는 공업은 ( ㉠ ) 지향 공업, 제조 과정에서 무게나 부피가 늘어나는 공업은 ( ㉡ ) 지향 공업이 된다.","blanks":[{"l":"㉠","a":["원료","원료 지향"]},{"l":"㉡","a":["시장","시장 지향"]}],"task":"원료 지수를 이용해 ㉠ 지향 공업이 되는 조건을 서술하시오.","model":"원료 지수(국지 원료 무게/제품 무게)가 1보다 크면 원료 산지에서 가공해 무게를 줄인 뒤 운송하는 것이 총운송비를 줄이므로 원료 지향형이 된다.","rubric":["원료 지수 > 1","무게 감소","운송비 최소"],"wrongs":[{"a":"노동비","why":"노동비 지향은 노동비 절감이 운송비 증가보다 클 때의 입지 이동."}],"rel":["원료 지향 공업","시장 지향 공업","원료 지수"],"id":"p053"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"튀넨의 고립국 이론에서 도시로부터의 거리에 따라 농업적 토지 이용이 동심원으로 분화하는 이유는 거리에 따라 ( ㉠ )이/가 달라지기 때문이다.","blanks":[{"l":"㉠","a":["운송비","지대","입찰 지대"]}],"task":"도시 가까이에서 원예 농업·낙농업이 이루어지는 이유를 서술하시오.","model":"신선도가 중요하고 부피가 커 운송비가 많이 드는 작물은 도시에 가까울수록 단위 면적당 지대(수익)가 높으므로, 지대 지불 능력이 큰 원예·낙농이 도시 근처를 차지한다.","rubric":["운송비","신선도","지대 지불 능력"],"wrongs":[],"rel":["튀넨의 고립국 이론","입찰 지대"],"id":"p054"},{"subj":"인문지리","cat":"경제지리","type":"사례 제시","text":"반도체 기업이 연구·개발 기능은 수도권에, 생산 공장은 지방이나 해외에 두는 현상을 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["공간적 분업","공간 분업"]}],"task":"다국적 기업이 생산 공장을 개발 도상국에 두는 이유를 서술하시오.","model":"개발 도상국은 노동비와 지대가 저렴하고, 현지 시장 확보·무역 장벽 회피에 유리하기 때문이다.","rubric":["저렴한 노동비","시장 확보","무역 장벽 회피"],"wrongs":[],"rel":["공간적 분업","다국적 기업"],"id":"p055"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"관련 기업과 연구소, 대학 등이 한 지역에 모여 지식 교류와 협력을 통해 혁신을 창출하는 산업 집적지를 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["클러스터","산업 클러스터"]}],"task":"㉠이 형성되면 얻을 수 있는 집적 이익을 두 가지 서술하시오.","model":"기업 간 정보와 기술 교류로 혁신이 촉진되고, 부품·서비스 공급과 숙련 노동력 확보가 쉬워져 생산비가 절감된다.","rubric":["지식 교류","혁신","생산비 절감","숙련 노동력"],"wrongs":[],"rel":["클러스터","집적 이익"],"id":"p056"},{"subj":"인문지리","cat":"인구지리","type":"자료 해석","text":"어느 국가의 인구 피라미드가 저출산·고령화로 아래쪽이 좁고 위쪽이 넓은 ( ㉠ )형을 이루고 있다. 이 국가는 65세 이상 인구 비율이 20% 이상인 ( ㉡ )에 해당한다.","blanks":[{"l":"㉠","a":["방추","항아리","방추형"]},{"l":"㉡","a":["초고령 사회","초고령사회"]}],"task":"㉡에서 나타나는 사회·경제적 문제를 서술하시오.","model":"생산 가능 인구가 감소하여 노동력이 부족해지고, 노년 부양비가 증가하며 연금·의료 등 사회 보장 비용이 늘어난다.","rubric":["생산 가능 인구 감소","노년 부양비 증가","사회 보장 비용"],"wrongs":[{"a":"고령 사회","why":"고령 사회는 14% 이상, 20% 이상은 초고령 사회."}],"rel":["초고령 사회","노년 부양비"],"id":"p057"},{"subj":"인문지리","cat":"인구지리","type":"개념 설명","text":"리의 인구 이동 모형에서 이동을 일으키는 요인은 출발지의 ( ㉠ ) 요인과 목적지의 ( ㉡ ) 요인, 그리고 거리·비용 등 중간 장애 요인이다.","blanks":[{"l":"㉠","a":["배출"]},{"l":"㉡","a":["흡인"]}],"task":"1960~70년대 우리나라 이촌 향도의 원인을 ㉠·㉡ 요인으로 서술하시오.","model":"농촌은 낮은 소득과 부족한 일자리가 배출 요인이었고, 도시는 공업화로 인한 풍부한 일자리와 교육·문화 시설이 흡인 요인이었다.","rubric":["농촌 저소득","도시 일자리","교육·문화 시설"],"wrongs":[],"rel":["배출 요인","흡인 요인","이촌 향도"],"id":"p058"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"개념 설명","text":"영해는 기선으로부터 ( ㉠ )해리까지이며, 기선으로부터 ( ㉡ )해리까지 중 영해를 제외한 수역이 배타적 경제 수역이다.","blanks":[{"l":"㉠","a":["12"]},{"l":"㉡","a":["200"]}],"task":"서해안과 남해안 대부분에서 직선 기선을 적용하는 이유를 서술하시오.","model":"해안선이 복잡하고 섬이 많아 최외곽 섬들을 직선으로 연결한 직선 기선을 적용한다. 단, 대한 해협은 3해리를 적용한다.","rubric":["복잡한 해안선","섬 많음","최외곽 섬 연결"],"wrongs":[{"a":"통상 기선","why":"통상 기선은 해안선이 단조로운 동해안 등에서 썰물 때 해안선을 기준."}],"rel":["영해","배타적 경제 수역","직선 기선"],"id":"p059"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"개념 설명","text":"문화가 한 지역에서 다른 지역으로 퍼져 나가는 현상을 문화 전파라 한다. 사람의 이동 없이 매체를 통해 퍼지는 것을 ( ㉠ ) 전파, 대도시에서 중소 도시로 도시 계층을 따라 퍼지는 것을 ( ㉡ ) 전파라고 한다.","blanks":[{"l":"㉠","a":["간접"]},{"l":"㉡","a":["계층","계층적"]}],"task":"전염 전파와 ㉡ 전파의 차이를 서술하시오.","model":"전염 전파는 거리에 따라 인접한 지역으로 차례로 퍼지는 반면, 계층 전파는 거리와 무관하게 도시 규모 등 계층 순서에 따라 퍼진다.","rubric":["인접 확산","거리","도시 계층"],"wrongs":[],"rel":["문화 전파","계층 확산"],"id":"p060"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"고지도·고문헌","text":"이중환의 『택리지』는 가거지(可居地)의 조건으로 지리(地理), ( ㉠ ), 인심(人心), 산수(山水)를 들었다.","blanks":[{"l":"㉠","a":["생리","生利"]}],"task":"㉠의 의미를 서술하시오.","model":"생리는 땅이 비옥하고 교역이 편리하여 경제적으로 넉넉히 ],"id":"p115"},{"subj":"인문지리","cat":"도시지리","type":"개념 설명","text":"대도시의 영향이 주변 지역까지 확대되어 통근권을 중심으로 하나의 생활권이 형성된 범위를 ( ㉠ )(이)라고 한다.","blanks":[{"l":"㉠","a":["대도시권","메트로폴리탄"]}],"task":"대도시권 형성의 배경을 교통과 관련지어 서술하시오.","model":"교통이 발달해 통근 시간이 줄어들면서 주거 기능이 교외로 확산되고, 대도시와 주변 지역 간 기능적 연계가 강화되었기 때문이다.","rubric":["교통 발달","교외화","기능적 연계"],"wrongs":[],"rel":["대도시권"],"id":"p116"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"서비스업 중 기업의 생산 활동을 지원하는 금융·광고·법률 등은 ( ㉠ ) 서비스업, 개인 소비자에게 제공하는 음식·숙박 등은 ( ㉡ ) 서비스업이다.","blanks":[{"l":"㉠","a":["생산자"]},{"l":"㉡","a":["소비자"]}],"task":"㉠ 서비스업이 대도시 도심에 집중하는 이유를 서술하시오.","model":"관련 기업과 정보가 집중되어 대면 접촉과 정보 획득이 유리하고, 고급 전문 인력을 확보하기 쉬우며 접근성이 높기 때문이다.","rubric":["대면 접촉","정보","전문 인력"],"wrongs":[],"rel":["생산자 서비스업"],"id":"p117"},{"subj":"인문지리","cat":"문화·역사·정치지리","type":"개념 설명","text":"한 지역의 서로 다른 문화가 만나 새로운 제3의 문화가 만들어지는 현상을 문화 ( ㉠ ), 기존 문화가 다른 문화에 흡수되어 사라지는 현상을 문화 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["융합"]},{"l":"㉡","a":["동화"]}],"task":"문화 공존의 의미를 서술하시오.","model":"서로 다른 문화가 각각의 정체성을 유지하면서 한 지역에 함께 나란히 존재하는 현상이다.","rubric":["정체성 유지","함께 존재"],"wrongs":[],"rel":["문화 융합","문화 동화"],"id":"p118"},{"subj":"인문지리","cat":"인구지리","type":"개념 설명","text":"인구 변천 모형에서 출생률은 높지만 의료 발달로 사망률이 급격히 낮아져 인구가 급증하는 단계는 ( ㉠ )단계이다.","blanks":[{"l":"㉠","a":["2","제2","초기 확장"]}],"task":"4단계에서 인구 증가율이 낮은 이유를 서술하시오.","model":"출생률과 사망률이 모두 낮아져 자연 증가율이 매우 낮아지기 때문이다. 여성의 사회 진출과 자녀 양육비 증가가 출생률을 낮춘다.","rubric":["저출생","저사망","자연 증가율 낮음"],"wrongs":[],"rel":["인구 변천 모형"],"id":"p119"},{"subj":"지역지리 및 기타","cat":"지역지리","type":"개념 설명","text":"우리나라 관북 지방의 개마고원은 해발 고도가 높은 ( ㉠ ) 지형으로, 기온이 낮아 감자·귀리 등 밭작물 재배가 이루어진다.","blanks":[{"l":"㉠","a":["고원"]}],"task":"개마고원이 높은 고도에도 평탄한 이유를 서술하시오.","model":"오랜 침식으로 평탄해진 지표가 신생대 경동성 요곡 운동으로 융기하여, 높은 곳에 평탄면이 남은 고위 평탄면이기 때문이다.","rubric":["침식 평탄면","경동성 요곡 운동","융기"],"wrongs":[],"rel":["고위 평탄면"],"id":"p120"},{"subj":"지리교육론","cat":"지리교육론","type":"교사-학생 대화","text":"교사: 이 단원이 끝나면 학생들이 무엇을 할 수 있어야 할지 먼저 정하고, 그것을 확인할 평가를 설계한 다음 수업 활동을 계획했어요.\n이처럼 목표와 평가를 먼저 설계하는 교육과정 설계 방식을 ( ㉠ ) 설계라고 한다.","blanks":[{"l":"㉠","a":["백워드","역방향","이해 중심"]}],"task":"㉠ 설계의 3단계를 서술하시오.","model":"1단계 바라는 결과(영속적 이해) 확인 → 2단계 수용 가능한 증거(평가) 결정 → 3단계 학습 경험과 수업 계획 순으로 설계한다.","rubric":["바라는 결과","평가 증거","학습 경험"],"wrongs":[],"rel":["백워드 설계"],"id":"p121"},{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"[답사 기록] 동해안의 해안 단구를 답사하였다. 단구면 위에는 둥근 자갈과 모래가 쌓여 있었고, 단구면이 뒤쪽 급사면(단구애)과 만나는 경사 급변점에서 옛 해안선을 확인하였다. 이 옛 해안선의 해발 고도를 ( ㉠ )(이)라고 하며, 현재 해수면과의 고도 차를 이용하면 단구 형성 이후의 ( ㉡ ) 양을 추정할 수 있다.","blanks":[{"l":"㉠","a":["구정선 고도","구정선의 고도","구정선"]},{"l":"㉡","a":["지반 융기","융기"]}],"task":"단구면 고도보다 ㉠이 해수면 변동이나 융기량 추정에 더 적합한 이유를 서술하시오.","model":"단구면은 형성 후 퇴적물이 덮이거나 개석·침식되어 고도가 변하기 쉽지만, 구정선은 단구 형성 당시 해수면 위치를 직접 나타내는 지점이므로 융기량·해수면 변동을 더 정확히 추정할 수 있다.","rubric":["형성 당시 해수면","단구면 퇴적·침식 변형","정확한 추정"],"wrongs":[{"a":"파식대","why":"파식대는 해식애 앞 평탄 암반 자체. 옛 해안선 고도는 구정선 고도."}],"rel":["구정선 고도","해안 단구"],"id":"p122"},{"subj":"자연지리","cat":"지형학","type":"지도·자료 해석","text":"지질도에서 A 단층은 단층선을 경계로 하천 유로가 같은 방향으로 수백 m씩 어긋나 있고, 능선이 끊겨 맞은편 골짜기와 마주 보는 셔터 릿지가 나타난다. 이처럼 단층면을 따라 지괴가 수평 방향으로 이동한 단층을 ( ㉠ )(이)라고 한다. 또한 A 단층은 제4기 퇴적층을 자르고 있어 ( ㉡ )(으)로 분류된다.","blanks":[{"l":"㉠","a":["주향이동단층","주향 이동 단층"]},{"l":"㉡","a":["활성단층","활성 단층"]}],"task":"㉡으로 판단한 근거를 지층의 형성 시기와 관련지어 서술하시오.","model":"활성단층은 제4기에 활동한 적이 있는 단층으로 정의되는데, A 단층이 제4기 퇴적층을 절단·변위시켰으므로 제4기 이후 활동한 것으로 판단된다.","rubric":["제4기 퇴적층","절단·변위","최근 활동"],"wrongs":[{"a":"역단층","why":"역단층은 압축력으로 상반이 위로 올라간 수직 방향 이동. 하천 유로가 수평으로 어긋난 것은 주향이동단층."}],"rel":["주향이동단층","활성단층"],"id":"p123"},{"subj":"자연지리","cat":"지형학","type":"개념 설명","text":"빙하가 녹은 물에 운반된 세립 물질이 하천 주변에 쌓인 뒤, 다시 ( ㉠ )에 의해 운반되어 넓게 퇴적된 실트질 퇴적물을 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["바람","편서풍"]},{"l":"㉡","a":["뢰스","황토"]}],"task":"㉡이 빙하가 직접 퇴적한 빙력토보다 분급이 양호한 이유를 서술하시오.","model":"빙력토는 빙하가 크기에 관계없이 물질을 운반·퇴적해 분급이 불량하지만, 뢰스는 바람이 운반 가능한 실트 크기 입자만 선택적으로 날려 퇴적했기 때문에 분급이 양호하다.","rubric":["빙하 직접 퇴적=분급 불량","바람의 선택적 운반","실트"],"wrongs":[{"a":"모레인","why":"모레인은 빙하가 직접 쌓은 빙퇴석으로 분급이 불량."}],"rel":["뢰스","빙력토"],"id":"p124"},{"subj":"자연지리","cat":"지형학","type":"야외 답사","text":"[카르스트 답사] 석회암 분지를 흐르던 하천이 바닥의 구멍으로 빨려 들어가 갑자기 사라졌다. 이처럼 지표수가 지하 동굴계로 흘러드는 흡입구를 ( ㉠ ), 이렇게 지표에서 지하로 사라지는 하천을 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["포노르","싱크홀"]},{"l":"㉡","a":["싱킹 크리크","소멸 하천"]}],"task":"석회동굴 바닥에서 계단식 웅덩이(림스톤 풀)가 형성되는 과정을 서술하시오.","model":"동굴 바닥을 흐르는 지하수에서 이산화탄소가 방출되면 탄산칼슘이 침전되는데, 물이 고인 부분의 가장자리에 침전물이 둑처럼 쌓여 계단식 웅덩이를 이룬다.","rubric":["이산화탄소 방출","탄산칼슘 침전","가장자리 둑"],"wrongs":[{"a":"돌리네","why":"돌리네는 지표의 깔때기형 용식 와지. 물이 빨려 드는 흡입구는 포노르."}],"rel":["포노르","싱킹 크리크","림스톤 풀"],"id":"p125"},{"subj":"자연지리","cat":"기후학","type":"자료 해석","text":"겨울철 북태평양 북부에는 반영구적인 ( ㉠ ) 저기압이, 아시아 대륙에는 시베리아 고기압이 발달하여 우리나라는 서고동저형 기압 배치가 나타난다. 이때 등압선 간격이 좁을수록 ( ㉡ )이/가 커져 북서 계절풍이 강하게 분다.","blanks":[{"l":"㉠","a":["알류샨"]},{"l":"㉡","a":["기압경도력","기압 경도력"]}],"task":"고기압 중심부에서 바람이 약한 이유를 ㉡과 관련지어 서술하시오.","model":"고기압 중심부는 등압선 간격이 넓어 기압 차(기압 경도)가 작으므로 기압경도력이 약해 바람이 약하다.","rubric":["등압선 간격 넓음","기압 차 작음","기압경도력 약함"],"wrongs":[{"a":"전향력","why":"전향력은 바람 방향을 편향시킬 뿐 속도의 크기를 결정하지 않는다."}],"rel":["알류샨 저기압","기압경도력"],"id":"p126"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"A사는 고객 대면 업무는 대도시 본사에 두고, 회계·자료 처리·콜센터 같은 ( ㉠ ) 기능을 임금이 낮은 해외로 이전하였다. 이때 해외 자회사를 세워 직접 수행하는 방식은 ( ㉡ )에 해당하며, 외부 기업에 위탁하는 아웃소싱과 구분된다.","blanks":[{"l":"㉠","a":["백오피스","백 오피스"]},{"l":"㉡","a":["오프쇼어링","역외 이전"]}],"task":"㉡과 아웃소싱의 차이를 기업 경계(소유 관계)의 관점에서 서술하시오.","model":"아웃소싱은 생산·업무를 기업 외부의 비계열사에 위탁하는 외부화이고, 오프쇼어링은 입지를 해외로 옮기는 것으로 해외 계열사와 내부 거래를 하는 내부화 방식이 가능하다.","rubric":["아웃소싱=외부화","오프쇼어링=해외 입지","계열사 내부 거래"],"wrongs":[{"a":"아웃소싱","why":"아웃소싱은 외부 위탁. 해외 자회사를 통한 직접 수행은 오프쇼어링."}],"rel":["백오피스","오프쇼어링","아웃소싱"],"id":"p127"},{"subj":"인문지리","cat":"경제지리","type":"자료 해석","text":"B 지역의 다국적 기업들은 다기능 교육훈련으로 노동자가 여러 직무를 수행하게 하는 ( ㉠ ) 대신, 해고와 임시직·시간제 확대로 고용 규모를 조절하는 ( ㉡ )에 초점을 두어 노동시장 유연성을 추구하였다.","blanks":[{"l":"㉠","a":["기능적 유연성"]},{"l":"㉡","a":["수량적 유연성"]}],"task":"㉡ 중심의 전략이 지역 제조업 경쟁력 회복에 불리했던 이유를 서술하시오.","model":"수량적 유연성은 고용 불안과 저숙련 노동을 늘려 숙련 축적과 혁신을 어렵게 하므로, 다기능 숙련에 기반한 생산성 향상이 이루어지지 못해 경쟁력 회복에 불리하다.","rubric":["고용 불안","숙련 축적 저해","혁신·생산성 저하"],"wrongs":[],"rel":["기능적 유연성","수량적 유연성"],"id":"p128"},{"subj":"인문지리","cat":"도시지리","type":"개념 설명","text":"크리스탈러의 중심지 체계에서 하위 중심지가 상위 중심지를 잇는 교통로 위, 즉 정육각형 변의 중점에 위치하는 원리를 ( ㉠ ) 원리라 하며 K값은 ( ㉡ )이다.","blanks":[{"l":"㉠","a":["교통"]},{"l":"㉡","a":["4","K=4"]}],"task":"행정 원리(K=7)가 적용될 때 하위 중심지의 배치 특징을 서술하시오.","model":"행정 원리에서는 상위 중심지의 배후지 안에 하위 중심지 6개가 온전히 포함되도록 배치되어, 하위 중심지의 배후지가 여러 상위 중심지 관할로 나뉘지 않는다.","rubric":["배후지 내 6개 포함","관할 분할 없음"],"wrongs":[{"a":"3","why":"K=3은 시장 원리로 하위 중심지가 정육각형 꼭짓점에 위치."}],"rel":["교통 원리","행정 원리","시장 원리"],"id":"p129"},{"subj":"인문지리","cat":"도시지리","type":"자료 해석","text":"머디는 사회 지역 분석 결과를 종합하여 사회경제적 지위는 ( ㉠ ) 패턴, 가족 지위는 ( ㉡ ) 패턴, 민족 지위는 특정 지역에 군집하는 다핵 패턴을 보인다고 정리하였다.","blanks":[{"l":"㉠","a":["선형","부채꼴","선형(부채꼴)"]},{"l":"㉡","a":["동심원"]}],"task":"가족 지위가 ㉡ 패턴을 보이는 이유를 생애 주기와 관련지어 서술하시오.","model":"자녀가 있는 가구는 넓은 주택과 쾌적한 환경을 찾아 도심에서 먼 교외에 거주하고, 독신·노인 가구는 도심 가까이에 거주하는 등 생애 주기에 따라 도심으로부터 거리별로 분화되기 때문이다.","rubric":["생애 주기","자녀 가구 교외","도심 거리별 분화"],"wrongs":[],"rel":["머디 모델","사회 지역 분석"],"id":"p130"},{"subj":"인문지리","cat":"도시지리","type":"개념 설명","text":"실제 시가지가 법률상 도시 경계보다 넓게 확장되어 있는 도시를 ( ㉠ ), 반대로 법률상 경계가 시가지보다 넓어 농촌 지역까지 포함하는 도시를 ( ㉡ )(이)라고 한다.","blanks":[{"l":"㉠","a":["과소경계도시","과소 경계 도시"]},{"l":"㉡","a":["과대경계도시","과대 경계 도시"]}],"task":"㉠에서 나타날 수 있는 행정상의 문제를 서술하시오.","model":"시가지가 행정 경계 밖으로 넘어가 실제 도시 인구·기능이 통계에 과소 반영되고, 경계 밖 주민이 도시 서비스를 이용하지만 세금은 다른 지자체에 내는 등 재정·서비스 공급의 불일치가 생긴다.","rubric":["통계 과소 반영","서비스·재정 불일치"],"wrongs":[],"rel":["과소경계도시","과대경계도시"],"id":"p131"},{"subj":"지리교육론","cat":"지리교육론","type":"교수·학습","text":"오수벨은 가장 일반적·포괄적인 개념을 먼저 제시하고 점차 세분화하는 ( ㉠ )의 원리와, 새 개념과 기존 개념의 유사점·차이점을 명시해 인지 구조 속에 통합하는 ( ㉡ )의 원리를 제시하였다.","blanks":[{"l":"㉠","a":["점진적 분화"]},{"l":"㉡","a":["통합적 조정"]}],"task":"선행 조직자가 유의미 학습을 돕는 원리를 서술하시오.","model":"선행 조직자는 학습 전에 제시되는 포괄적·추상적 개념으로, 학습자의 기존 인지 구조와 새 학습 내용을 연결하는 정착지(포섭자) 역할을 하여 새 지식이 의미 있게 포섭되도록 돕는다.","rubric":["포괄적 개념","기존 인지 구조 연결","포섭"],"wrongs":[],"rel":["점진적 분화","통합적 조정","선행 조직자"],"id":"p132"},{"subj":"지리교육론","cat":"지리교육론","type":"평가","text":"이 교사는 단원 시작 전에 학생들의 선수 학습 정도와 선개념·오개념을 파악하기 위해 ( ㉠ )을/를 실시하고, 단원 종료 후 학습 목표 성취 정도를 종합 판정하기 위해 ( ㉡ )을/를 실시하였다.","blanks":[{"l":"㉠","a":["진단평가","진단 평가"]},{"l":"㉡","a":["총괄평가","총괄 평가"]}],"task":"평가 도구의 타당도가 낮아지는 사례를 들어 서술하시오.","model":"타당도는 평가 도구가 측정하려는 것을 실제로 측정하는 정도로, 예컨대 지도 해석 능력을 평가하려면서 단순 지명 암기 문항만 출제하면 측정 목적과 내용이 일치하지 않아 타당도가 낮아진다.","rubric":["측정 목적 일치","사례 제시"],"wrongs":[{"a":"형성평가","why":"형성평가는 수업 중 학습 진행 상황을 확인하고 피드백하는 평가."}],"rel":["진단평가","총괄평가","타당도"],"id":"p133"},{"subj":"지리교육론","cat":"지리교육론","type":"교수·학습","text":"논쟁 문제 수업에서 교사는 다양한 관점을 공정하게 제시하되 자신의 의견은 밝히지 않는 ( ㉠ ) 입장을 취하거나, 관점을 공정하게 다룬 뒤 자신의 견해도 공개하는 ( ㉡ ) 입장을 취할 수 있다(켈리).","blanks":[{"l":"㉠","a":["중립적 공평","중립적 공평성"]},{"l":"㉡","a":["신념을 가진 공평","신념을 가진 공평성"]}],"task":"㉡ 입장이 학생의 가치 판단 학습에 주는 장점을 서술하시오.","model":"교사가 공정한 절차를 지키면서도 근거를 갖춘 자신의 견해를 공개함으로써, 학생이 가치 판단을 정당화하는 방식을 모델로 삼고 교사 의견도 비판적으로 검토할 수 있게 한다.","rubric":["공정한 관점 제시","근거 있는 견해 공개","정당화 모델"],"wrongs":[{"a":"악마옹호형","why":"악마옹호형은 하우드의 역할로 의도적으로 반대 입장을 취해 토론을 촉진한다."}],"rel":["켈리의 교사 입장"],"id":"p134"},{"subj":"지리교육론","cat":"지리교육론","type":"교수·학습","text":"가네는 개념을 직접 관찰을 통해 학습되는 ( ㉠ ) 개념과, 정의를 통해서만 학습되는 ( ㉡ ) 개념으로 구분하였다. 예를 들어 산·강은 ㉠, 인구 밀도는 ㉡에 해당한다.","blanks":[{"l":"㉠","a":["구체적","관찰된","구체적(관찰된)"]},{"l":"㉡","a":["정의된"]}],"task":"속성 모형과 원형 모형의 차이를 결정적 속성과 관련지어 서술하시오.","model":"속성 모형은 개념의 결정적 속성을 정의하고 사례·비사례를 구분해 학습하며, 원형 모형은 결정적 속성이 분명하지 않을 때 가장 전형적인 사례(원형)를 중심으로 유사성에 따라 개념을 학습한다.","rubric":["결정적 속성","전형적 사례","유사성"],"wrongs":[],"rel":["가네의 개념 분류","속성 모형과 원형 모형"],"id":"p135"},{"subj":"인문지리","cat":"경제지리","type":"개념 설명","text":"펙과 티켈에 따르면 신자유주의는 복지·규제를 축소하고 국가 역할을 줄이는 ( ㉠ ) 단계와, 시장 친화적 제도와 규제를 새로 구축하는 ( ㉡ ) 단계로 구분된다.","blanks":[{"l":"㉠","a":["롤백","roll-back"]},{"l":"㉡","a":["롤아웃","roll-out"]}],"task":"케인스주의 복지국가 시기 도시 정부의 성격을 관리주의 관점에서 서술하시오.","model":"케인스주의 복지국가 시기 도시 정부는 중앙 정부의 재정 지원을 바탕으로 주택·복지 등 집합적 소비 수단을 공급·관리하는 관리주의적 성격을 지녔다.","rubric":["집합적 소비 공급","중앙 정부 재정","관리주의"],"wrongs":[],"rel":["롤백·롤아웃 신자유주의","케인스주의 복지국가"],"id":"p136"},{"subj":"자연지리","cat":"지도학·GIS","type":"지도·자료 해석","text":"지형도에서 지도 좌표 격자의 세로선이 가리키는 북쪽을 ( ㉠ )(이)라 하며, 진북과 ㉠ 사이의 각을 ( ㉡ )(이)라고 한다. 진북과 자북 사이의 각은 자편각, ㉠과 자북 사이의 각은 도자각이다.","blanks":[{"l":"㉠","a":["도북"]},{"l":"㉡","a":["도편각"]}],"task":"1:50,000 지형도 한 도엽(도곽)의 경위도 범위를 쓰고, 막대 축척이 지도를 확대·축소해도 유효한 이유를 서술하시오.","model":"1:50,000 지형도 한 도엽은 경위도 15′×15′ 범위이며, 막대 축척은 지도와 함께 같은 비율로 확대·축소되므로 막대 길이가 나타내는 실제 거리가 그대로 유지된다.","rubric":["15′×15′","지도와 함께 확대·축소"],"wrongs":[{"a":"자편각","why":"자편각은 진북과 자북 사이의 각."}],"rel":["도북","도편각","도곽","막대 축척"],"id":"p137"}]</script>

function kstAdd(ymd,n){const d=new Date(ymd+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function plItems(){// every term + MCQ + 지문형, grouped by subject, sorted by 기출 빈도
 const by={};Object.keys(GROUPS).forEach(g=>by[g]=[]);
 T.forEach(t=>by[grpOf(t.cat)].push({k:'t:'+t.term,w:(t.exam?t.exam.length:0)*2+(t.core?1:0)}));
 MCQ0.forEach(q=>{const g=q.subj&&by[q.subj]?q.subj:grpOf(q.cat||'');by[g].push({k:'q:'+q.id,w:1})});
 PSG.forEach(p=>{const g=by[p.subj]?p.subj:grpOf(p.cat);by[g].push({k:'p:'+p.id,w:3})});
 for(const g in by)by[g].sort((a,b)=>b.w-a.w);return by}
function plSchedule(L){// day i (0..L-2) content; day L-1 = cumulative miss review
 const by=plItems(),D=L-1,days=Array.from({length:L},()=>[]);
 for(const g in by){const a=by[g];a.forEach((x,i)=>{days[Math.floor(i*D/a.length)].push(x.k)});
  // 기출 2회 이상 → cycle 중간에 한 번 더(반복 노출)
  a.filter(x=>x.w>=4&&x.k[0]=='t').forEach((x,i)=>{const d0=Math.floor(a.indexOf(x)*D/a.length),d1=Math.min(D-1,d0+Math.ceil(D/2));if(d1!=d0)days[d1].push('r'+x.k)})}
 return days}
function plState(){const p=plGet();if(!p)return null;const n=dayDiff(p.start);const el=-n;if(el<0)return {p,before:-el};

 if(p.cyc!==cyc){p.cyc=cyc;p.done={};p.miss={};plSet(p)}
 const days=plSchedule(p.len);const left=Math.max(0,dayDiff(examTarget()));
 return {p,cyc,di,cs,days,left,cyclesLeft:Math.ceil((left+1)/p.len)}}
function plMisses(p){const s=new Set(Object.keys(p.miss||{}));Object.keys(wrong).forEach(k=>s.add('t:'+k));Object.keys(marks).forEach(k=>marks[k]=='bad'&&s.add('t:'+k));Object.keys(wrongq).forEach(k=>s.add((k[0]=='p'?'p:':'q:')+k));return [...s].filter(k=>plObj(k))}
function plObj(k){k=k.replace(/^r/,'');const id=k.slice(2);return k[0]=='t'?TM.get(id):k[0]=='q'?MCQ0.find(q=>q.id==id):PSG.find(p=>p.id==id)}

 const behind=[];if(!isRev)for(let i=0;i<di;i++)days[i].forEach(k=>{if(!p.done[k])behind.push(k)});

 function clrM(v,l){const n=Object.values(marks).filter(x=>x==v).length;if(!n){$('#dmsg').textContent=l+' 표시가 없어요';return}conf(l+' '+n+'개를 모두 해제할까요?',()=>{for(const k in marks)if(marks[k]==v)delete marks[k];$('#dmsg').textContent=l+' '+n+'개 해제됨'})}
 $('#clrbad').onclick=()=>clrM('bad','헷갈려요');$('#clrok').onclick=()=>clrM('ok','외웠어요');$('#rst').onclick=()=>conf('외웠어요/헷갈려요 표시를 모두 지울까요?',()=>{marks={};$('#dmsg').textContent='모든 표시 초기화'});
 $('#rsrs').onclick=()=>conf('간격 반복 일정을 모두 초기화할까요? (되돌릴 수 없어요)',()=>{srs={};$('#dmsg').textContent='복습 일정 초기화됨'});$('#rwr').onclick=()=>conf('오답노트를 비울까요?',()=>{wrong={};wrongq={};$('#dmsg').textContent='오답노트 비움'});
 $('#impb').onclick=()=>{try{const a=JSON.parse($('#imp').value);if(!Array.isArray(a))throw 0;const ok=a.filter(x=>x.term&&x.def).map(x=>({term:x.term,en:x.en||'',def:x.def,cat:x.cat||'지역지리',keys:x.keys||'',vs:x.vs||'',ex:x.ex||'',distractors:x.distractors||[],exam:x.exam||[]}));const m=new Map(user.map(t=>[t.term.replace(/\s/g,''),t]));ok.forEach(t=>m.set(t.term.replace(/\s/g,''),t));user=[...m.values()];LS.set('gv_user',user);T=all();TM=new Map(T.map(t=>[t.term,t]));catsUI();$('#dmsg').textContent=ok.length+'개 추가됨'}catch(e){$('#dmsg').textContent='JSON 형식 오류'}};
 $('#expb').onclick=()=>{const b=new Blob([JSON.stringify(T,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='geo-terms.json';a.click()};
 $('#clr').onclick=()=>conf('추가한 단어를 삭제할까요?',()=>{user=[];localStorage.removeItem('gv_user');T=all();TM=new Map(T.map(t=>[t.term,t]));catsUI()})}
// ---- routing
function navBadge(){const n=dueList().length;const b=$('#navdue');b.textContent=n>99?'99+':n;b.classList.toggle('hide',!n)}
function go(m){mode=m;if(m!='home'&&m!='stats'&&m!='data')S.last=m;$$('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.m==m));render();window.scrollTo({top:0})}
function render(){const showList=mode=='card'&&listView;['home','review','card','list','quiz','stats','data'].forEach(m=>$('#v-'+m).classList.toggle('hide',!(m==mode&&!(m=='card'&&listView))&&!(m=='list'&&showList)));
 const filt=['review','card','quiz'].includes(mode)&&!(mode=='quiz'&&mock&&mock.active);$('#filters').classList.toggle('hide',!filt);$('#subs').classList.toggle('hide',mode=='quiz'&&['concept','passage','mock','wrong'].includes(qmode));$('#tools').classList.toggle('hide',mode!='card');
 if(mode!='quiz')clearInterval(mockT);
 ({home:renderHome,review:renderReview,card:()=>showList?renderList():renderCard(),quiz:renderQuiz,stats:renderStats,data:renderData})[mode]();navBadge()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m=='card')listView=false;go(b.dataset.m)};
$('#lst').onclick=()=>{listView=!listView;render()};
$('#q').oninput=()=>{idx=0;render()};$('#filt').onchange=()=>{idx=0;render()};
$('#shuf').onclick=()=>{order=shuffle(T.map(t=>t.term));idx=0;render();toast('🔀 섞었어요')};
function deckUI(){$$('#deck button').forEach(b=>b.classList.toggle('on',b.dataset.d==deck));$('#dc1').textContent='('+T.filter(t=>t.core).length+')';$('#dc2').textContent='('+T.length+')'}
$('#deck').onclick=e=>{const b=e.target.closest('button');if(!b)return;deck=b.dataset.d;LS.set('gv_deck',deck);idx=0;rq=null;deckUI();catsUI();render()};
const thSet=d=>{document.documentElement.dataset.theme=d;localStorage.setItem('gv_theme',d);$('#theme').textContent=d=='dark'?'☀️':'🌙';document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.content=d=='dark'?'#0f1217':'#f5f6f8')};
$('#theme').onclick=()=>thSet(document.documentElement.dataset.theme=='dark'?'light':'dark');if(localStorage.getItem('gv_theme')=='dark')thSet('dark');
document.addEventListener('keydown',e=>{const tg=e.target.tagName;if(e.metaKey||e.ctrlKey&&e.key!='z'||e.altKey)return;const typing=tg=='INPUT'||tg=='TEXTAREA'||tg=='SELECT';
 if(!typing&&(e.key=='z'||e.key=='Z'||(e.ctrlKey&&e.key=='z'))){e.preventDefault();undo();return}if(typing)return;
 if(e.key=='g'){go('home');return}
 if(mode=='card'&&!listView){if(e.key=='ArrowRight')$('#next').click();else if(e.key=='ArrowLeft')$('#prev').click();else if(e.key==' '){e.preventDefault();flipCard()}else if(e.key=='1')markCur('bad');else if(e.key=='2')markCur('ok')}
 else if(mode=='review'){const g=$('#rctl .grades');if(g){if(/^[1-4]$/.test(e.key))g.querySelector(`[data-g="${e.key}"]`).click();else if(e.key=='Enter'||e.key==' '){e.preventDefault();g.querySelector(`[data-g="${$('#rctl').dataset.auto}"]`).click()}}}
 else if(mode=='quiz'){const n=$('#qn');if(n&&(e.key=='Enter'||e.key==' ')){e.preventDefault();n.click();return}const o=$$('#qbox .opt');if(/^[1-5]$/.test(e.key)&&o[+e.key-1])o[+e.key-1].click()}});
// ---- PWA
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(reg=>{
 const ask=w=>toast('새 버전이 준비됐어요','업데이트',()=>w.postMessage('SKIP_WAITING'),15000);
 if(reg.waiting)ask(reg.waiting);reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state=='installed'&&navigator.serviceWorker.controller)ask(w)})});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')reg.update().catch(()=>{})});
 try{if('periodicSync' in reg)navigator.permissions.query({name:'periodic-background-sync'}).then(p=>{if(p.state=='granted')reg.periodicSync.register('gv-due',{minInterval:12*36e5}).catch(()=>{})})}catch(e){}
}).catch(()=>{});let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=true;location.reload()}})}
// ---- init
const startMode=new URLSearchParams(location.search).get('m');
deckUI();catsUI();go(['review','card','quiz','stats','data'].includes(startMode)?startMode:'home');pushDueToSW();
