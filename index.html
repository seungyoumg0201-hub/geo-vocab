 c ) 진동은 ( a )와/과 ( b ) 간 기압 차이 에 의해 발생하는 진동으로, 양의 진동일 때는 ( e )가 더 커져 폭풍우가 평년보다 강해진다. 또 한 북부 유럽은 평소보다 ( 건조한 / 습한 ) 겨울철, 남부 유럽 지역은 ( 건조한 / 습한 ) 겨울철 이 나타난다. *a, b는 시베리아 고기압 같은 기압의 명칭이고, e는 힘의 종류 중 하나","bl":[["a","아이슬란드 저기압",""],["b","아조레스 고기압","b, a"],["c","북대서양",""],["e","기압경도력","습한, 건조한"]],"ex":"","cat":"기후학","rel":["","","","기압경도력"]},{"id":"2015A-기입형05","y":2015,"link":[],"text":"( a )은/는 남아메리카 중위도의 저지대에 있는 초원으로,‘평원’을 뜻하는 아메리카 원주민의 언어에서 유래하였다. 대서양 연안에 가까운 동부는 습윤 ( a ), 서부는 건조 ( a )(이)라고 한다. 습윤 ( a )은/는 상업적 혼합농업과 육류 생산이 많고, 건조 ( a )은/는 밀 재배와 양의 방목이 이루어진다. 아타카마 사막은 페루 한류와 ( b )풍의 바람그늘에 위치하여 ( c ) 현상이 발생함에 따라 형성 되었지만, 파타고니아 사막은 ( d )풍의 바람그늘에 위치하여 ( e ）현상이 발생함에 따라 형성 되었다.","bl":[["a","팜파스","밀"],["b","무역",""],["c","이중 비그늘",""],["d","편서풍",""]],"ex":"e-푄","cat":"기후학","rel":["","","","편서풍"]},{"id":"2015A-기입형06","y":2015,"link":["2018A-10"],"text":"석호의 형성 과정 : 후빙기 해면 ( 상승 / 하강 ) → 하류부 하곡에 물이 들어와 ( a ) 형성 → 사취나 ( b ) → 석호 형성 → 유수에 의한 퇴적으로 규모 ( 확대 / 축소 ) → 현재 지형 경관","bl":[["a","익곡",""],["b","사주","축소"]],"ex":"상승","cat":"지형학","rel":["","사주"]},{"id":"2015A-기입형10","y":2015,"link":[],"text":"러시아-우크라이나 전쟁은 2014년 러시아가 ( a )을/를 합병하면서 시작되었다. ( a )에는 과거 ( b )족이 자치공화국을 형성하기도 하였으나, 현재는 러시아인이 다수를 이루는 자치공화국이 형 성되었다. 우크라이나는 한때 비옥한 토지를 기반으로 한 농업국이었으나, 구소련 시절 대규모 산업 단지가 동부에 조성되면서 공업국으로 성장하였다. 서부와 동부를 가르는 기준은 ( c ) 강 이다. 동부에서는 분리 독립을 선언하기도 하였으며, 친러 세력이 많은 우크라이나 내 ( d ) 지 역을 중심으로 서쪽과 동쪽 간 ( d ) 내전이 발생하기도 하였다. 한편, 우크라이나 지역의 비옥 한 흑색토를 ( e )(이)라고 하며, 이는 토양의 신분류체계에서 ( f )에 해당한다.","bl":[["a","크림반도",""],["b","타타르",""],["c","드네프르",""],["d","돈바스",""],["e","체르노젬",""],["f","몰리졸",""]],"ex":"","cat":"지역지리","rel":["크림반도","","","","체르노젬",""]},{"id":"2015A-서술형01","y":2015,"link":[],"text":"( a ) : 문항이 어려운 정도 ( b ) : 문항이 검사를 통해 측정하고자 하는 능력이 높은 사람과 낮은 사람을 구별하는 정도 ( c ) : 능력이 전혀 없는 피검자가 추측으로 답을 맞힐 정도 ( d ) : 특정 문항에 대해서 모형에서 예측한 응답 유형과 실제 자료 상의 응답 유형의 차이를 통해 해당 문항이 일반적인 응답 유형에 얼마나 어울리는지 보여주는 것 ( e ) : 문항의 수행 정도가 피검자나 문항 특성에 따라 불리하거나 유리한 정도 ( a / b )이/가 높은 문항일수록 ( a / b )이/가 높아지는 경향은 있지만, ( a / b )(이)가 높다고 해서 반드시 ( a / b )이/가 높은 것은 아니다. ( c )이/가 높을수록 ( a / b )이/가 떨어지기 때 문에 좋지 않은 문항이다. + ( f ) : 지도에 사용된 기호와 색상의 의미를 설명하며, ‘지도의 언어’라고도 한다.","bl":[["a","문항곤란도(난이도)",""],["b","문항변별도",""],["c","문항추측도",""],["d","문항적합도",""],["e","문항편파성","a, b, a, b, +)"],["f","범례",""]],"ex":"","cat":"지리교육론","rel":["","","","","",""]},{"id":"2015A-서술형02","y":2015,"link":[],"text":"학문적 지식을 교육적 목적으로 변형하는 것이다. ( a ) 교수학적 변환은 학문적 지식이 전문가 에 의해 교육과정과 교과서로 변환되는 것이다. ( b ) 교수학적 변환은 학문적 지식이 교사에 의해 전달하기 쉬운 ‘학생의 지리’로 변환되는 것이다. 이러한 교수학적 변환 과정에 따르면, 교사는 학문적 지식을 ( c )하여 학습한 후 가르치기 위 한 지식으로 바꾸기 위해 ( d )하는데, 학생들이 ( c )하기에 용이하도록 ( e )이/가 필요하다. ( e )은/는 가상적인 학습자를 염두에 두고 그들이 지식을 쉽게 이해하도록 교수학적 변환을 하는 것이다. 학생들은 교사로부터 습득한 지식을 다시 ( c )하여 자신의 지식으로 만들고, 이를 다시 ( d )하여 학문적 지식에 대한 이해까지 이른다.","bl":[["a","1차",""],["b","2차",""],["c","개인화",""],["d","탈개인화",""],["e","가개인화",""]],"ex":"","cat":"지리교육론","rel":["","","","",""]},{"id":"2015B-서술형03","y":2015,"link":[],"text":"여름철 맑은 날 A 지역은 B 지역에 비해 기온이 ( 높고 / 낮고 ), 습도가 ( 높고 / 낮다 ). 그 이 유는 지표 상태와 식생 밀도 차이로 인해 교외에서 ( a ) 작용이 활발하기 때문이다. 이와 같은 원리로 증발량은 A 지역이 B 지역보다 ( 많다 / 적다 ). 또한 강수량과 안개일수는 A 지역이 B 지역보다 ( 많다 / 적다 ). 이는 고온으로 인한 ( b )성 강수와 대기 중 에어로졸이 ( c ) 역할을 하기 때문이다. ( a ) 작용은 증산은 식물이 잎의 기공을 통해 수분을 수증기 형태로 대기 중으로 내보내는 것 이다. 반대로 ( d )은/는 주변으로부터 잠열을 흡수하여 수면에서 수분이 수증기로 변화하는 현 상이다. 이 둘을 합쳐 ( e )은/는 지면이나 수면으로부터 수분이 대기로 유입되는 현상이다.","bl":[["a","증산","많다, 많다"],["b","대류",""],["c","응결핵",""],["d","증발",""],["e","증발산",""]],"ex":"낮고, 높다","cat":"기후학","rel":["","","","","증발산"]},{"id":"2015B-서술형04","y":2015,"link":[],"text":"심장 지역 이론은 ( 육상 / 해상 ) 세력의 중요성을 강조한다. 이 이론에서 매킨더는 “( a )을/ 를 지배하는 자는 심장 지역을 지배하고, 심장 지역을 지배하는 자는 ( b )(유럽, 아시아, 아프 리카)을/를 지배한다.”고 말했다. ( a )은/는 풍부한 식량자원, 온화한 기후, 비옥한 토지와 천연 자원을 보유하고 있기 때문이다. 매킨더는 심장지역을 흐르는 대하천들의 유입 지역이 지닌 자 연지리적 특징으로 인해 ( 육상 / 해상 )세력이 하구를 통해 이 지역 내부에 도달할 수 없다는 점을 설명하였는데, 그 이유는 카스피해로 흐르는 하천은 ( c ) 하천이고, ( d )(으)로 흐르는 하 천은 결빙되어 있기 때문이다. 한편 추축 지역을 점유하는 세력이 ( e )에서 전개하는 해양 진 출 운동은 추축 지역에는 없는 ( f )을/를 확보하기 위한 것이다.","bl":[["a","동유럽",""],["b","세계의 섬","해상"],["c","내륙",""],["d","북극해",""],["e","내측 초승달 지역",""],["f","부동항",""]],"ex":"육상","cat":"기후학","rel":["","","","","",""]},{"id":"2015B-논술형02","y":2015,"link":[],"text":"( a ) : 원래 코즈 등이 기업의 존재 이유를 설명하기 위해 도입한 개념이지만, 스콧에 의해 신 산업공간론의 핵심 개념 중 하나로 사용되었다. 스콧은 ( b ) 요인을 강조한 베버의 입지론과는 달리 ( a )을/를 중요한 집적 요인으로 설명한다. 반면에 산업지구론이나 클러스터론에서는 지식 기반경제에서 경쟁력의 원천으로 등장한 ( c )을/를 집적 요인으로 강조한다. ( d ) : 공식 거래를 통한 비용 절감 효과 ( e ) : 비공식적 거래의 대면접촉을 통해 암묵적 지식을 교환 및 집단 학습 창출을 통해 비용 을 절감하는 효과","bl":[["a","거래비용",""],["b","운송비",""],["c","기술혁신",""],["d","시장적 상호의존성",""],["e","비시장적 상호의존성",""]],"ex":"","cat":"경제지리","rel":["","","","시장적 상호의존성","비시장적 상호의존성"]},{"id":"2014A-기입형01","y":2014,"link":[],"text":"( a )은/는 전통적 평가가 아닌 다른 평가 방법들을 포괄적으로 의미한다. 교사가 학생의 학습 과제를 수행하는 과정 및 결과를 보고 학생의 지식, 기능, 가치와 태도 등에 대해 직접적·전문 적으로 판단하므로 학생이 스스로 답을 작성하거나 발표, 산출물 제작, 행동하는 것을 요구한 다. 따라서 전통적 평가에서 ( b )을/를 중시한 것과 달리 ( c )을/를 중시한다. ( d )은/는 ( a ) 중에서도 실제적 과제에 초점을 둔 평가 방식이다. 즉, 교실 밖의 실생활에서 수행한 능력만을 평가 대상으로 하는 평가 방식이다. 독도 모형 만들기와 야외조사 과제에 대한 평가는 모두 ( a )에 해당하지만, 야외조사는 엄밀히 말하면 ( d )(이)라고도 할 수 있다. *b, c는 평가 양호도의 유형 중 각각 하나","bl":[["a","수행평가",""],["b","신뢰도",""],["c","타당도",""],["d","참평가",""]],"ex":"","cat":"지리교육론","rel":["수행평가","","타당도","참평가"]},{"id":"2014A-기입형02","y":2014,"link":[],"text":"( a )은/는 여러 관념 속에서 공통된 요소를 뽑아 종합하여 얻은 하나의 보편적인 관념 또는 어 떤 사물에 대한 대강의 뜻이나 내용을 말한다. 이것의 하위 개념으로 ( b )은/는 가장 위계가 높고 교과의 본질과 관련한 가치 있는 통찰을 제공하는 핵심 아이디어이고, ( c )은/는 개념 간 의 위계를 나타내는 개념이다. 지리교육에서는 지리적 개념에 대한 다양한 접근과 분류를 하고 있는데, 가네는 하천, 공장, 백화점과 같은 ( d )와/과 인구밀도, 입지계수 등의 ( e )(으)로 구분 하였다. 또한 네이쉬는 개념의 위계적 특성을 강조하여 관찰 가능한 개념보다 조직 개념을 보 다 ( 상위 / 하위 )의 개념으로 설명하였다.","bl":[["a","개념",""],["b","핵심개념",""],["c","조직개념",""],["d","관찰에 의한 개념",""],["e","정의에 의한 개념","상위"]],"ex":"","cat":"지형학","rel":["","","","",""]},{"id":"2014A-기입형04","y":2014,"link":[],"text":"( a )은/는 영토 확장 또는 강대국 간 충돌을 피하기 위해 형성된다. 팽창을 목적으로 하는 ( b )와 팬핸들, 강대국 간 완충지대인 ( c )이/가 있다. 카프리비 ( b )은/는 ( d )이/가 팽창 목적으 로 나미비아 동부로부터 잼베지강 유역에 만들었다. 아프가니스탄의 와칸 ( e )은/는 아프가니스 탄이 ( f )와/과 ( g )의 충돌을 피하려고 만든 완충지대이다. ( f )은/는 최근 우크라이나와 전쟁 중인 국가이다. *d, f, g는 국가 이름","bl":[["a","촉수지대",""],["b","휭거",""],["c","협장지",""],["d","독일",""],["e","협장지",""],["f","러시아",""],["g","영국",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","","","","","",""]},{"id":"2014A-기입형05","y":2014,"link":[],"text":"( a ) : 특정 기간 출생아 수 / 연앙인구 × 1000 ( b ) : 여성 1명이 평생 출산할 수 있는 평균 자녀의 수 = ( c )의 합계 ( d ) : 현재의 인구 규모를 유지하기 위해 필요한 출산율 수준 ( e ) : 연령별 여아 출산율의 합계 ( f ) : 연령별 여아 출산율 × 여성의 생존확률","bl":[["a","조출생률",""],["b","합계 출산율",""],["c","연령별 출산율",""],["d","대체 출산율",""],["e","총재생산율",""],["f","순재생산율",""]],"ex":"","cat":"인구지리","rel":["조출생률","합계 출산율","","대체 출산율","총재생산율",""]},{"id":"2014A-기입형08","y":2014,"link":[],"text":"( a ) : 습한 공기가 사면을 타고 상승할 때 단열 냉각이 발생하여 형성되는 안개 ( b ) : 야간의 복사냉각으로 지표면에 접한 공기의 기온이 하강하여 형성되는 안개 ( c ) : 전선상에서 두 기단의 온도 차이로 인해 증발이 발생하여 형성되는 안개 ( d ) : 온난습윤한 공기가 차가운 지표면이나 수면을 지날 때 형성되는 안개 ( e ) : 차가운 공기가 따뜻한 수면을 지날 때 형성되는 안개 → ( f ) 효과","bl":[["a","활강무",""],["b","복사무",""],["c","전선무",""],["d","이류무",""],["e","증발무",""],["f","바다 또는 호수",""]],"ex":"","cat":"기후학","rel":["","","전선무","","",""]},{"id":"2014B-기입형13","y":2014,"link":[],"text":"*절대 연대 측정 방법 ( a ) : 유기물 내에 존재하는 동위 원소인 14C와 14N의 비율로 연대를 측정하는 것 ( b ) : 빛이나 열 에너지를 흡수하여 여기 상태가 된 전자가 빛이나 열을 더 이상 흡수하지 못 하면 기저 상태로 되돌아가면서 광자를 방출하는 현상 ( b ) 측정은 대상 시료에 ( 빛 / 열 )을 가하여 방출되는 ( b )을/를 이용한 OSL과 ( 빛 / 열 ) 을 가하여 방출되는 열 ( b )이/가 있다.","bl":[["a","방사성 탄소 연대 측정",""],["b","루미네센스","빛, 열"]],"ex":"","cat":"지형학","rel":["","루미네센스"]},{"id":"2014A-서술형03","y":2014,"link":[],"text":"( a )은/는 넓은 범위에 걸쳐 일정한 성질을 갖는 거대한 공기 덩어리이다. ( a )의 형성 조 건은 첫째, 지표면의 상태가 ( 등질적 / 이질적 )이어야 하고 둘째, 공기가 ( 이동 / 정체 )되 어야 한다. 따라서 바람의 영향이 ( 많은 / 적은 ) 지역일수록 기단 형성에 유리하다. 기단의 변질은 기단의 확장 속도가 ( 느릴수록 / 빠를수록 ) 활발하다. 대표적인 사례로 ( b ) 효과는 한랭한 공기가 상대적으로 온난한 해양을 지날 때 수면으로부터 대기 하층에 열에 너지가 전달되고 응결에 의해 잠열이 방출됨에 따라 대기가 불안정해져 구름이 형성되고 강 설이 발생하는 현상이다.","bl":[["a","기단","등질적, 정체, 적은, 느릴수록"],["b","바다",""]],"ex":"","cat":"기후학","rel":["기단",""]},{"id":"2014B-서술형02","y":2014,"link":[],"text":"피아제의 공간인지발달단계 중 자기중심적으로 입지를 파악하며, 형태의 이해가 입지에 대한 이해보다 앞서 발달하는 단계는 ( a ) 단계에 해당한다. 자신이 알고 있는 사물을 기준으로 입 지를 파악하는 단계는 ( b ) 단계이다. 캐틀링의 공간인지발달단계 중 투영적 단계에서는 좌표체계가 ( 자기 / 타자 )중심적이고, 축척 이 ( 정확 / 부정확 )하며, 기호를 ( 구체적 / 추상적 )으로 나타낸다. 또한 기하학적 단계에서는 조망을 ( 입체 / 평면 )적으로 할 수 있게 된다.","bl":[["a","형상적",""],["b","투영적","타자, 부정확, 구체적, 평면"]],"ex":"","cat":"지도학·GIS","rel":["",""]},{"id":"2014B-논술형01","y":2014,"link":[],"text":"( a )은/는 도심 쇠퇴 지역의 현재 지대와 도심재생에 따른 잠재적 시장 지대 간의 차이이다. ( a )이/가 클 경우 도심 재개발 및 ( b )이/가 발생할 수 있다. ( b )은/는 중산층 전문가와 같은 상대적으로 부유한 사회집단의 유입을 통해 쇠퇴하는 도심 환경의 개조 및 재생이 발생하는 것 으로, 빈곤층 원주민의 퇴거를 야기한다. 젠트리피케이션은 교외의 자본 이동이 도시로 회귀한 것으로, 닐 스미스는 이것을 사회 기득권층이 1960년대 사회 개혁 이후 나타난 도시적 삶의 도 덕적·경제적 후퇴에 대하여 ( c )하는 것으로 간주한다. 이러한 맥락에서 ( c )주의 도시라는 용어가 생겨났다.","bl":[["a","지대격차(지대차)",""],["b","젠트리피케이션",""],["c","보복",""]],"ex":"","cat":"도시지리","rel":["","젠트리피케이션",""]},{"id":"2012(1)-21","y":2012,"link":[],"text":"( a ) : 두 지괴가 단층면을 경계로 서로 다른 방향으로 평행하게 이동하는 현상 ( b ) : 단층에 의해 양쪽의 지괴가 어긋나는 면 ( c ) : 단층면이 지표와 만나는 선 ( d ) : 여러 열의 단층선이 밀집되어 나타나는 지대 ( e ) : 단층면 또는 단층선에서 단층 작용에 의해 암석이 부수어진 지대 ( f ) : 마찰에 의해 연마를 받아 단층면이 매끄러워진 부분","bl":[["a","단층",""],["b","단층면",""],["c","단층선",""],["d","단층대",""],["e","단층파쇄대",""],["f","단층경면",""]],"ex":"","cat":"지형학","rel":["","","단층선","","단층파쇄대","단층경면(단층활면)"]},{"id":"2012(1)-25","y":2012,"link":[],"text":"( a ) : 대기 중의 수증기가 액체로 변하는 과정 *( a ) 결과로 형성되는 것들 : 지상에는 ( b )와 ( c ), 지표면에는 ( d )와 ( e ) ( b ) : 공기가 상승하는 과정에서 단열 팽창에 의한 기온 하강으로 ( f ) 온도에 도달한 공기에 서 수증기가 ( a )하여 형성되는 것 ( c ) : 지표면과 접한 대기에 떠 있는 수적이나 빙정의 집합체 → 지표면에서의 ( b ) ( d ) : 공기 중의 수증기가 지면이나 물체 표면에 ( a )하여 생긴 물방울 ( e ) : 기온이 어는점 아래로 내려가 수증기가 지면이나 물체에 얼음 결정으로 부착된 것","bl":[["a","유동성 운동",""],["b","활동성 운동",""],["c","포행",""],["d","유동",""],["e","이류",""],["f","솔리플럭션",""]],"ex":"g-산사태","cat":"지형학","rel":["","","포행","","","솔리플럭션"]},{"id":"2012(1)-26","y":2012,"link":[],"text":"튀넨은 현실 세계를 단순화한 고립국 모델을 통해 그의 이론을 연역적으로 전개하여 나갔다. 그의 모델에서는 중심도시 주위에 ( a ), ( b ), ( c ). ( d ), ( e ), ( f ) 순으로 6개의 농업지대 가 ( g ) 형태로 연속적으로 배열되어 있다. 한편 ( h )의 원리에 따르면 높은 지대를 지불하는 토지일수록 보다 집약적으로 이용되며, 수확체감 법칙에 따라 어느 시점부터 한계생산성이 감 소하므로 순소득 증가분이 ( i ) 증가분보다 큰 지점까지 작물을 재배하게 된다.","bl":[["a","응결",""],["b","구름",""],["c","안개",""],["d","이슬",""],["e","서리",""],["f","이슬점",""]],"ex":"","cat":"기후학","rel":["","","","","","이슬점"]},{"id":"2012(1)-28","y":2012,"link":[],"text":"( a ) : 기업들이 생산 규모를 확대하여 비용을 절감함으로써 얻는 경제적 효과 ( b ) : 공간적으로 여러 기업이 인접함으로써 발생하는 ( a ) 효과 ( c ) : 업종이 같거나 연계성이 높은 산업이 국지적으로 집적하여 얻는 경제적 이익 ( d ) : 대도시에 대체로 상이한 업종의 기업이 집적하여 얻는 경제적 이익 +) ( e ) : 다양한 종류의 상품을 개별적으로 만들지 않고 일정한 범위에 걸쳐 생산할 때 생산 비용을 줄이는 요인 *도시사회지리학 382p 마샬은 산업지구를 특정 장소에 유사한 성격을 가진 중소기업들이 집적하여 ( a / c / d )을/를 이루는 지구로 정의하였다. 기업들은 기업 내부에서 수행하던 기능을 다른 기업으로 외부화하 여 역동적인 수직적 분리를 시도함에 따라 ( f ) 분업이 촉진된다. 한편 베버는 ( a / c / d )을/ 를 인정하지 않았다.","bl":[["a","자유식 농업",""],["b","임업",""],["c","윤재식 농업",""],["d","곡초식 농업",""],["e","삼포식 농업",""],["f","방목",""]],"ex":"g-동심원, h-동심원, i-운송비","cat":"도시지리","rel":["","","","","",""]},{"id":"2012(1)-30","y":2012,"link":[],"text":"1990년대 이후 지역발전이론의 주요 동향은 지식기반경제의 확산과 더불어 기존 지역발전전략 의 한계가 인식되면서 ( a )을/를 강조하는 이론들이 새로운 패러다임을 형성하게 된 점이다. ( b )론은 로 이러한 새로운 지역발전이론의 하나로서, 세계화 시대에 지역 경쟁력 확보를 위해서 는 그 지역이 ( a )을/를 창출하기 좋은 환경, 즉 좋은 ( b )을/를 갖추는 일이 중요하다는 것이 다. 아민과 스리프트는 지역 차원의 효율적인 제도적 주체와 ( c )의 차별성에 따라 ( b )의 성 과가 달라진다고 주장한다. ( d )은/는 ( b )이/가 지역적으로 구현된 실체라고 할 수 있으며, ( b )이/가 효율적으로 작동할 수 있도록 한다. 따라서 최근 많은 국가들은 지역경제를 진흥시키 는 주요 수단으로 지역 내 ‘산업 ( d )’을/를 육성하는 데 정책적 관심을 기울이고 있다. ( c ) : 특정 지역에 존재하는 다양한 연관 조직과 이들 간 상호 네트워킹을 통해 구축되는 혁 신 거버넌스의 형성 정도 → 스토퍼의 ( e ) 개념과 일맥상통함 *석종희슨배님 자료 a-혁신, b-지역혁신체계, c-제도적 집약, d-클러스터, e-사회적 관습","bl":[["a","규모의 경제",""],["b","집적경제",""],["c","국지화경제",""],["d","도시화경제",""],["e","연결의경제","c"]],"ex":"f-사회적, d","cat":"경제지리","rel":["규모의 경제","집적 경제","국지화 경제","",""]},{"id":"2012(1)-34","y":2012,"link":[],"text":"( a )은/는 이전에는 공공 부문에 의해 분배되고 소유된 재화 및 서비스에 대하여 사적 소유권 과 사적 시장 분배 매커니즘을 도입하는 것이며, 이로 인해 ( b )이/가 나타난다. ( b )은/는 사 적이익이 도시의 공공성을 압도하는 것으로, ( c )에 의해 통제된다. ( c )은/는 물리적 환경과 사회적 태도를 통제하는 계약, 관리, 규약 등에 해당한다. 이러한 ( c )은/는 보통 개발업자에 의해 만들어지며, 이는 근린지구의 경관을 보전하거나 도시 계획의 통일성을 유지할 뿐만 아니 라 거주자들의 주택과 그들의 행동과 태도를 세밀하게 통제한다. 한편 ( d )은/는 도시정부가 민간 자본에 일부 권한을 이양하거나 자율성을 부여하여 사업을 공 동으로 추진하는 것이다. 또한 중앙정부의 ( e )은/는 중앙정부의 책임이 지방정부로 이양되고, 서비스 제공에 대한 민간 부문의 개입이 증가하는 현상이다. a-민영화, b-프라이버토피아, c-구속적 레짐, d-민관 파트너십, e-공동화","bl":[["a","정형성","곡, 작다, 대"],["b","6","일치하지 않는다"],["c","UTM",""]],"ex":"원통, 경선","cat":"도시지리","rel":["","",""]},{"id":"2012(1)-37","y":2012,"link":[],"text":"( a ) : 가항하천에 가옥들이 입지하고 장방형 경지가 나타나는 촌락이다. 시간이 지나면 가항하 천과 평행한 2차 교통로인 ( 육로 / 수로 )가 나타난다. ( b ) : 미국의 개척과정에서 나타나는 ( 집촌 / 열촌 / 산촌 )으로, 기본 단위는 ( c ) 평방마일 ( d ) : 장방형 경지가 나타나는 ( 집촌 / 열촌 )이다. 공동 경작을 위해 울타리가 없는 개방형 경지가 나타난다. 또한 ( e ) 농업을 한다. ( f ) : 연안의 저습지 개간 과정에서 형성된 열촌이다. a-임지촌, 육로, b-타운십, 산촌, c-36, d-게반시스템, 집촌, e-삼포식, f-소택지촌","bl":[["a","민영화",""],["b","프라이버토피아",""],["c","구속적 레짐",""],["d","민관 파트너십",""],["e","공동화",""]],"ex":"","cat":"지형학","rel":["","","","",""]},{"id":"2012(1)-3","y":2012,"link":[],"text":"매스무브먼트는 이동 속도와 내부 구조의 변화에 따라 ( a )와/과 ( b )(으)로 구분한다. ( a )은/ 는 이동 속도가 느리고 내부 구조가 변화하며, ( b )은/는 그 반대이다. ( c ) : 사면 물질이 매우 느리게 변형되면서 아래로 이동하는 현상 → 토양 ( c )은/는 토양의 팽창과 수축 또는 서릿발 작용에 의해 사면 물질이 이동하는 것이고, 암석 ( c )은/는 서릿발 작 용에 의해 사면 위의 암괴가 이동하는 것이다. ( d ) : 암설이나 토양이 내부 구조의 변형을 일으키면서 뒤섞여 흘러내리는 현상이다. 이중 ( e )은/는 이동속도가 가장 빠른 것으로, 점토와 수분 함량이 매우 높은 지표 물질이 곡을 따라서 좁고 길게 흘러 내리는 현상이다. 또한 ( f )은/는 물로 포화된 토양이 자체의 무게로 인해 완만 한 사면 아래로 천천히 흘러 내리는 현상이다. 이동 속도가 매우 느린 ( a )와/과 ( f )을/를 제외한 모든 사면 운반 작용은 ( g )(이)라고 통칭 하기도 한다. a-유동성 운동, b-활동성 운동, c-포행, d-유동, e-이류, f-솔리플럭션, g-산사태","bl":[["a","임지촌","육로"],["b","타운십","산촌"],["c","36",""],["d","게반시스템","집촌"],["e","삼포식",""],["f","소택지촌",""]],"ex":"","cat":"지형학","rel":["","","","","",""]},{"id":"2011(1)-22","y":2011,"link":[],"text":"평수시 소는 여울보다 수심은 ( 깊고 / 얕고 ) 유속은 ( 빠르다 / 느리다). 그러나 홍수시에는 반 대의 현상이 나타난다. 또한 홍수시 소에는 역이 ( 운반 / 퇴적 )되고, 여울에는 역이 ( 운반 / 퇴적 )된다. 이를 유속의 ( a ) 현상이라고 한다.","bl":[["a","역전",""]],"ex":"깊고, 느리다, 운반, 퇴적","cat":"지형학","rel":[""]},{"id":"2011(1)-23","y":2011,"link":[],"text":"( a ) : 해양판과 해양판의 발산 경계에서 얇은 해양 지각을 뚫고 마그마가 솟아올라 분출하여 상대적으로 고도가 높은 대규모 해저 산맥 ( b ) : ( a )의 정상부에 지각이 확장하는 곳에서 단층에 의해 형성된 골짜기 ( c ) : 해저의 섭입 지점에 좁고 깊은 선형의 저지 ( d ) : ( c )로부터 지하로 밀도가 낮은 판 아래로 경사를 이룬 곳 ( e ) : ( c )의 대륙쪽 배후 지역을 따라 형성된 화산섬 ( f ) : 해양판의 표면을 이루는 심해 퇴적물이 밀도가 작아서 가라앉지 못함에 따라 섭입대 표 면의 해저에 누적되는 지역","bl":[["a","해령",""],["b","열곡",""],["c","해구",""],["d","섭입대",""],["e","호상열도(도호)",""],["f","부가대",""]],"ex":"","cat":"지형학","rel":["해령","열곡","해구","섭입대(베니오프대)","",""]},{"id":"2011(1)-24","y":2011,"link":[],"text":"( a )은/는 외부와의 열 교환이 차단된 상태에서 기체가 팽창하거나 수축하여 기온이 변화하는 과정으로, ( b )와/과 ( c )(으)로 구분된다. ( b )은/는 공기가 상승하여 고도가 높아짐에 따라 대 기 밀도가 감소하여 기온이 하강하는 현상이다. 반대로 ( c )은/는 공기가 하강하여 고도가 낮아 짐에 따라 대기 밀도와 압력이 증가하여 기온이 상승하는 현상이다. 대기 안정 상태에서는 건 조단열감률과 습윤단열감률이 환경기온감률보다 ( 크고 / 작고 ), 대기 불안정 상태에서는 건조 단열감률과 습윤단열감률이 환경기온감률보다 ( 크다 / 작다 ).","bl":[["a","단열변화",""],["b","단열팽창",""],["c","단열압축","크고, 작다"]],"ex":"","cat":"기후학","rel":["단열 변화","",""]},{"id":"2011(1)-26","y":2011,"link":[],"text":"( a )은/는 기존에 수입되던 상품을 자체적으로 생산하여 대체하려는 산업정책이다. 신생 ( b ) 산업은 높은 관세장벽을 통해 국제 경재으로부터 보호되며, 이를 통해 해당 국가의 경제가 다 양화되어 해외기술 및 자본에 대한 의존도가 점차 줄어든다. ( b )은/는 ( a )와/과 대비되는 용 어로, 해외시장을 대상으로 재화와 서비스를 생산 및 수출하는 성장 전략이다. ( a )은/는 국가 의 보호와 개입이 높지만, ( b )은/는 전통적인 자유무역과 비교우위론을 근간으로 추진된다. 한 편, ( c ) 합의의 기본 지침에 따라 부채 위기에 처한 남미 국가를 대상으로 구조 조정 프로그 램이 진행되었는데, 이 내용에는 기존의 ( a ) 모델을 포기하도록 강요하는 것이 있었다.","bl":[["a","수입대체형 산업화",""],["b","수출지향형 산업화",""],["c","워싱턴",""]],"ex":"","cat":"경제지리","rel":["","수출 지향형 산업화",""]},{"id":"2011(1)-31","y":2011,"link":[],"text":"렐프가 주장한 ( a )은/는 장소에 대한 비진정한 태도 또는 진정하지 않은 장소 경험이다. 이와 관련하여 ( b )은/는 대중문화가 만든 획일적인 욕구와 취향 또는 그가 반영된 장소로, 그 사례 로 ( c ), ( d ), ( e )이/가 있다. ( c )은/는 세계 곳곳에서 모아온 역사·모험과 상상력으로 조 형하고, 이를 기술공학적인 유토피아와 결합하는 것이다. ( d )은/는 역사적 분위기에 대한 일반 적인 요구를 만족시키면서 역사의 정확성, 진정성은 고려하지 않고 복제하는 것이다. ( e )은/는 새로운 기술과 스타일을 추구함에 따라 시간과 전통에 담긴 장소의 진정성까지 파괴하는 것이 다. 이러한 점에서 렐프는 ( f )주의적 관점에서 장소를 바라보았다고 할 수 있다.","bl":[["a","무장소성",""],["b","타자 지향적 장소",""],["c","디즈니화",""],["d","박물관화",""],["e","미래주의(미래화)",""],["f","구조",""]],"ex":"","cat":"문화·역사·정치지리","rel":["무장소성","타자지향적 장소","디즈니화","박물관화","",""]},{"id":"2011(1)-34","y":2011,"link":[],"text":"1920년대에 시카고학파의 버제스는 5개 지역으로 구성된 ( a ) 모델을 제시하였다. 이 모델은 생태적 프로세스에 기초하는데, ( b )은/는 사회·경제적 지위가 낮은 이주민들이 근린에 이주 하는 것이고, ( c )은/는 근린의 성격이 변화하는 것이다. ( b )와 ( c ) 사이에 발생하는 ( d )은/ 는 생태적 프로세스에 기초한 공간조직 형성에서 가장 중요한 요인이다. 호이트는 미국 142개 도시를 대상으로 선형 모델을 제시하였다. 선형 모델이 동심원 모델과 갖는 차이점은 다음과 같다. 첫째, ( e )(이)라는 구체적인 지표를 사용하였다. 둘째, 연쇄적 이주의 주체가 ( 저 / 고 ) 소득층이다. 주거지 분화의 원인은 ( e )와/과 ( f )이다. 한편, 해리스와 울만의 다핵심 이론에 서 다핵의 형성 요인에는 전문화, 집적 이익과 집적 불이익, ( g )의 차이가 있다. 이후 대도시 를 중심으로 도시의 교외화가 진행되면서 비지적, 비계획적, 무분별한 도시 발달로 특징되는 ( h )이/가 나타났다.","bl":[["a","동심원",""],["b","침입",""],["c","천이",""],["d","경쟁",""],["e","지대","고"],["f","교통망",""],["g","지대지불능력",""],["h","도시스프롤",""]],"ex":"","cat":"도시지리","rel":["","","","","","","",""]},{"id":"2011(1)-36","y":2011,"link":[],"text":"( a ) : 사람들이 일상적으로 반복된 활동을 통해 공간을 물리적으로 생산·지배하는 과정 ( b ) : 이데올로기와 같은 추상적 개념이 현실로 구체화되는 공간 ( c ) : 거주자의 입장에서 바라보는 공간으로서, 거주 자신이 재현의 주체가 됨 읍성의 시설 배치에는 ( d )에 근거한 좌묘우사 원칙과 주역의 오행원리, 풍수지리설 등이 반영 되었다. ( d )에 따르면 4곳의 성곽은 ( e ), 12개의 성문은 ( f )을/를 의미한다.","bl":[["a","공간적 실천",""],["b","공간의 재현",""],["c","재현의 공간",""],["d","주례동관고공기",""],["e","4계절",""],["f","12개월",""]],"ex":"","cat":"경제지리","rel":["","","","","",""]},{"id":"2011(1)-37","y":2011,"link":[],"text":"( a )은/는 ‘흩어진 사람들’이라는 뜻으로, 본토를 떠나 외부에서 그들의 규범과 관습을 유지 하며 살아가는 인족 집단 또는 그들의 거주지이다. ( a )의 대표적인 사례는 다음과 같다. ( b ) 디아스포라는 종교적 갈등으로 인한 1975년부터 1990년까지의 장기간 내전에 의한 것이다. 1975년 소수의 ( c )교가 다수의 ( d )교한테 총격을 가하면서 시작되었으며, ( e ) 위임통치 경 험으로 인해 ( e )로 대규모 이주가 발생하였다. 이뿐만 아니라 시리아 내전, 쿠르드족, 팔레스 타인 분쟁 등이 발생하고 있는 서아시아에서 동지중해 주변 지역을 ( f ) 지역이라고 한다.","bl":[["a","디아스포라",""],["b","레바논",""],["c","크리스트교(기독교)",""],["d","이슬람",""],["e","프랑스",""],["f","레반트",""]],"ex":"","cat":"인구지리","rel":["디아스포라","","","","",""]},{"id":"2011(1)-40","y":2011,"link":[],"text":"수치 지형 데이터의 표본 추출방법에는 2가지가 있다. ( a )적 방법은 표본 지점을 규칙적인 간 격으로 추출하는 것이고, ( b )적 방법은 표본 지점을 선택적인 간격으로 추출하는 것이다. 이렇 게 얻은 데이터는 ( c )와/과 ( d )(으)로 구분하여 표현된다. ( c )은/는 규칙적인 간격으로 표본 지점이 추출된 데이터 모델로, 각 지점 사이는 ( d )을/를 사용하여 근사치를 구한다. ( e )은/는 표본추출된 표고점들을 선택적으로 연결하여 겹치지 않게 하며, 기복이 심한 지형을 표현하는 데에 적합하다.","bl":[["a","계통적",""],["b","적응적",""],["c","DEM(수치표고모델)",""],["d","보간법",""],["e","TIN(부정형 삼각 네트워크)",""]],"ex":"","cat":"지형학","rel":["","","","",""]},{"id":"2010(1)-21","y":2010,"link":[],"text":"( a )은/는 ‘유로의 총길이 / 유역면적’으로 하계의 조밀성을 나타내는 지표이다. 지표유출이 ( 심할수록 / 약할수록 ), 연대가 ( 오래될수록 / 가까울수록 ) 높다. ( b )은/는 어떤 하천의 수 와 이보다 한 계급 높은 차수의 하천 수의 비율이다. 즉, ‘n차 하천 수 / (n+1)차 하천 수’이 며, 하천의 차수가 한 계급 낮아질수록 각 차수 하천의 개수는 일정한 비율로 ( 증가 / 감소 )한 다. 이를 ( c )의 법칙이라고 한다. 한편, 지표유출이 활발할수록 ( d )에 도달하는 시간이 짧아 진다. 일반적으로 하천 유량은 유역면적 크기가 클수록 ( 증가 / 감소 )하지만, 분수계로부터 흘 러나오는 물의 지체시간 때문에 하천 수위는 작은 유역에 비해 큰 유역에서 ( 천천히 / 빨리 ) 상승 및 하강한다.","bl":[["a","하계밀도","심할수록, 오래될수록"],["b","분기율","증가"],["c","하천수",""],["d","첨두수위","증가, 천천히"]],"ex":"","cat":"토양·식생·수문","rel":["","분기율","",""]},{"id":"2010(1)-22","y":2010,"link":[],"text":"Ÿ ( a )에 따라 지표 물질이 하중을 받는 지역에서는 ( 융기 / 침강 ), 하중이 제거된 지역에서 는 ( 융기 / 침강 )이/가 발생한다. Ÿ ( b ) : 약 10도 이하의 경사가 매우 완만한 지역에서 지표가 침식을 받아 노출된 경암층이 비대칭적 사면을 형성한 구릉 또는 산릉 지형으로, 경사사면과 ( c )(으)로 구성된다. ( c )은/ 는 경암층의 단면이 지표에 노출된 급경사면이다. Ÿ ( d ) : 트러스트 또는 오버트러스트 단층이나 횡와 습곡 지역에서 원래 위치보다 약 10km 이상 수평적으로 이동한 지괴 Ÿ ( e ) : ( d )에서 나타나는 고립된 산봉우리 Ÿ 히말라야산맥은 ( 대륙판-대륙판 / 대륙판-해양판 )의 ( 수렴 / 발산 )형 경계이다. 안데스산맥 은 ( 대륙판-대륙판 / 대륙판-해양판 )의 ( 수렴 / 발산 )형 경계이다. 알프스산맥은 ( 대륙판- 대륙판 / 대륙판-해양판 )의 ( 수렴 / 발산 )형 경계이다.","bl":[["a","지각평형 원리","침강, 융기"],["b","케스타",""],["c","에스카프먼트",""],["d","냅프",""],["e","클립프",""]],"ex":"","cat":"지형학","rel":["","","에스카프먼트(급경사면)","",""]},{"id":"2010(1)-23","y":2010,"link":[],"text":"*a~d에 알맞은 기후변화(위기) 협약을 고르시오. ( a ) : 염화불화탄소(CFCs) 사용 규제를 통한 오존층 파괴 방지 협약 ( b ) : 산성비 문제 해결을 위해 국경을 넘어 이동하는 대기 오염물질 감축 및 통제 ( c ) : 지구온난화 방지를 위한 이산화탄소 배출량 규제 (ex. 탄소 배출권 거래제) ( d ) : 선진국뿐만 아니라 개발도상국도 이산화탄소 배출량을 감축해야 함 *밀란코비치 이론에서 자전축의 ( e ) 운동은 약 22,000년 주기로 지구 공전궤도 상에 자전축 방위각을 변화시키는 현상이고, ( f )은/는 공전궤도의 타원형 정도이다.","bl":[["a","몬트리올 의정서",""],["b","제네바 협약",""],["c","교토 의정서",""],["d","파리 협약",""],["e","세차",""],["f","이심률",""]],"ex":"","cat":"기후학","rel":["","","","","",""]},{"id":"2010(1)-26","y":2010,"link":[],"text":"이중환의 택리지에서는 가거지의 4대 조건으로 지리·( a )·인심·산수를 제시하며, 이 조건들 에 따라 전국을 가거적지와 가거부적지로 구분하였다. 기후환경면에서 볼 때 가장 살기 좋은 곳은 ( b ), 가장 나쁜 곳은 ( c )(이)라고 하였는데, ( b )은/는 바람이 적어 아늑하고 볕이 잘 들어 살기 좋은 곳이고, ( c )은/는 바닷바람이 심하여 피부가 검게 타기 쉽고 저습지가 많아 해 충이 서식하기 때문이다. *다음 설명에 알맞은 지역 고르기 (평안도와 함경도, 한양 근/원교, 영동 해안, 남해안 중 하나) 1) 외적의 침입이 잦고, 지형이 험하고 기후가 차서 농업에 부적합하며, 사대부의 환로가 막힘 2) 경승지는 많으나 토지가 메마르며 주민들이 놀기를 좋아하고 고립되어 있음 3) 습하고 더운 땅에 생기는 독한 기운이 있음 4) 토지가 메마르고 백성이 가난하며, 몰락한 사대부가 많음","bl":[["a","생리",""],["b","계거",""],["c","해거","1) 평안도와 함경도, 2) 영동 해안, 3) 남해안, 4) 한양 근/원교"]],"ex":"","cat":"기후학","rel":["","",""]},{"id":"2010(1)-30","y":2010,"link":[],"text":"람베르트 정각 원추도법은 두 개의 ( a )을/를 설정하여 투영한 도법이다. 경선 간격이 표준위선 사이에서는 ( 확대 / 축소 )되고 외곽에서는 ( 확대 / 축소 )된다. 따라서 ( 위선 / 경선 )은 극으 로 수렴하는 등간격의 직선으로 나타나고, ( 경선 / 위선 )은 간격이 다른 동심원의 호로 나타난 다. 즉, 축척이 표준위선에서는 ( 확대 / 왜곡 / 유지), 표준위선 사이에서는 ( 확대 / 축소 / 유 지 ), 외곽에서는 ( 확대 / 축소 / 유지 )된다.","bl":[["a","표준위선","축소, 확대, 경선, 위선, 유지, 축소, 확대"]],"ex":"","cat":"지도학·GIS","rel":[""]},{"id":"2010(1)-32","y":2010,"link":[],"text":"자외선에서 가시광선, 적외선으로 갈수록 파장이 ( 길어진다 / 짧아진다 ). 가시광선은 0.4~0.7㎛ 파장대를 통칭하며, ( a ), ( b ), ( c ) 파장대로 세분화한다. ( a ) 파장대에서 ( c ) 파장대로 갈수록 파장이 ( 길어진다 / 짧아진다 ). 적외선은 근적외선, 중적외선, 원적외선, 열적외선으로 구분할 수 있는데, 이중 식생 분포를 파악하기에 유리한 것은 ( d )(이)고, 물체의 온도에 민감 하여 도시의 열섬 현상을 파악하기에 좋은 것은 ( e )(이)다. ( a )와/과 ( d ) 파장대를 이용하여 식생의 활력도를 측정하는 지수는 ( f )(이)다. +) ( g ) : 평균해수면을 육지까지 연장한 고도 즉, 해발고도 0m이자 지구 중력의 등위면 고도 ( h ) : GPS 수신기에서 관측된 높이 ( i ) : ( h )에서 ( g )을/를 뺀 값","bl":[["a","적색",""],["b","녹색",""],["c","청색","짧아진다"],["d","근적외선",""],["e","열적외선",""],["f","정규식생지수 +)",""],["g","지오이드고",""],["h","타원체고","i-정표고"]],"ex":"길어진다","cat":"지도학·GIS","rel":["","","","","열적외선","","지오이드고",""]},{"id":"2010(1)-34","y":2010,"link":[],"text":"슘페터에 따르면 콘트라티예프 장기파동에서 변화를 추동하는 중요한 요인은 창조적 파괴 즉, ( a )(이)다. 제 ( b )차 파동은 포디즘 대량생산, 제 ( c )차 파동은 포스트포디즘에 해당한다. 이 때 제 ( b )차 파동의 위기를 극복하여 제 ( c )차 파동으로 전환할 수 있던 것은 ( d )기술의 발달 때문이었다. ( d )기술의 발달은 세계를 시공간의 축소와 생산 공정의 공간적 ( 통합 / 분 업 )을 유발하였다. 또한 제 ( c )차 파동으로 전환하면서 글로벌 경제의 중심국이 변화하였는 데, 제 ( b / c )차 파동의 중심국은 일본, 미국, 독일이었고, 제 ( b / c )차 파동의 중심국은 미 국, 독일, 영국이었다. 이와 관련하여 데이비드 하비가 제시한 ( e )은/는 특정 기간에 자본주의 경제의 안정적 팽창을 촉진하는 지리적 장치와 과정을 의미하며, ( f )에 대한 투자는 잉여자본 을 흡수하고 장소 간 치환 기능을 수행하여 과잉생산 문제를 해결하는 ( e ) 수단이 된다.","bl":[["a","기술혁신",""],["b","4",""],["c","5",""],["d","IT","분업"],["e","공간적 조정",""],["f","건조환경",""]],"ex":"","cat":"도시지리","rel":["","","","","공간적 조정","건조환경"]},{"id":"2010(1)-36","y":2010,"link":[],"text":"크리스탈러의 중심지 이론에서 중심지는 ( a ) 형태로 분포하며, 이상적인 배후지 모양은 ( b ) 형태이다. ( b )은/는 ( 최소요구치 / 재화의 도달범위 )에 해당한다. 그러나 한편, ( c ) 원리는 상위 중심지가 하위 중심지를 포함하는 원리를 의미하는데, 이중 ( d ) 원리는 소비자의 이동 거리를 최소화하는 원리이고, ( e ) 원리는 주요 교통로 상에 입지하는 중심지 수가 최대화되는 원리이다.","bl":[["a","삼각격자",""],["b","정육각형","재화의 도달범위"],["c","포섭",""],["d","시장",""],["e","교통",""]],"ex":"","cat":"경제지리","rel":["","","","",""]},{"id":"2010(1)-38","y":2010,"link":[],"text":"Ÿ 5+2 광역 경제권 육성 ☞ 제 ( a )차 국토개발 Ÿ 지방분산형 국토 골격 조성, 8개 광역권 ☞ 제 ( b )차 국토개발 Ÿ 수도권, 부산권 중심의 성장거점개발, 4대권·8중권·17소권 ☞ 제 ( c )차 국토개발 Ÿ 서울과 부산 양대 도시의 성장 억제 ☞ 제 ( d )차 국토개발 Ÿ 혁신도시와 기업도시 조성 ☞ 제 ( e )차 국토개발 Ÿ 28개 지역 생활권 육성 ☞ 제 ( f )차 국토개발","bl":[["a","4",""],["b","3",""],["c","1",""],["d","2",""],["e","4",""],["f","2",""]],"ex":"","cat":"도시지리","rel":["","","","","",""]},{"id":"2009(1)-21","y":2009,"link":[],"text":"( a )은/는 고도가 높아질수록 기온이 상승하거나 변화가 없는 대기층이며, 이것이 발생하는 원 인은 다음과 같다. 첫째, 야간에 지표가 지구복사를 방출하며 급격히 냉각되는 ( b )에 의해 발 생한다. 둘째, 산정의 공기가 야간 복사냉각으로 인해 사면을 따라 흘러내리는 흐름인 ( c )에 의해 발생한다. ( c )로 인한 ( d )을/를 방지하고자 산록에 취락과 농경지가 입지한다. 셋째, 수 평적인 공기 이동인 ( e )에 의해 발생하며, 이때 형성되는 안개를 ( f )(이)라고 한다. 넷째, 대 류로 이동한 공기가 상부에 집적되어 밀도가 높아지면서 하강할 때에도 발생하는데, 이를 ( g ) 이라고 한다. 이는 아열대 고압대에서 잘 나타난다. +) ( h ) : 대기에 흡수된 에너지 일부가 다시 지표면으로 되돌아오는 현상","bl":[["a","역전층",""],["b","복사냉각",""],["c","냉기류",""],["d","냉해",""],["e","이류",""],["f","이류무",""],["g","침강 역전",""],["h","역복사",""]],"ex":"","cat":"기후학","rel":["","복사냉각","냉기류","","","","","역복사"]},{"id":"2009(1)-22","y":2009,"link":[],"text":"( a )은/는 용암이 분출하여 대기와 접하는 표면에서 급격한 냉각 및 고결에 따라 수축의 중심 점이 형성되면서 형성되는 기둥 모양의 절리이다. 포항 달전리의 ( a )은/는 ( 중생대 / 신생대 ) 에 형성되었고, 광주 무등산의 ( a )은/는 ( 중생대 / 신생대 )에 형성되었다. ( b )은/는 하천의 마식 작용에 의해 하상의 기반암에 파인 원형의 둥근 구멍이다. ( c )은/는 파랑에너지가 약한 섬의 배후 해안에서 발달한 사취가 계속 성장하여 육지와 섬을 연결한 퇴적체이며, ( c )에 의 해 육지와 연결된 섬을 ( d )(이)라고 한다.","bl":[["a","주상절리","신생대, 중생대"],["b","포트홀",""],["c","육계사주",""],["d","육계도",""]],"ex":"","cat":"지형학","rel":["주상 절리","포트홀","","육계도"]},{"id":"2009(1)-23","y":2009,"link":[],"text":"( a )은/는 수평 지층의 퇴적암이 오랜 시간 동안 풍화와 침식을 받아 경암층으로만 이루어진 평탄한 지표면으로, 대부분 고생대 또는 중생대 지층으로 이루어져 있다. ( a )은/는 ( b ) 주변 에 주로 분포하는데, ( b )은/는 선캄브리아기 변성암으로 구성되며, 고생대 이후 지각변동을 받 지 않아 기복이 작다. ( a )와/과 ( b )은/는 부정합면을 이루기도 한다. ( c )은/는 수평지층의 조륙 운동으로 형성되는데, 침식을 덜 받은 경암층 부분은 정상부가 평평한 ( d )이/가 되며, ( c )의 정상부가 더욱 좁아지면 ( e )이/가 된다. 용암대지의 현무암은 최근에 생성된 신선한 암 석이므로 ( c )(으)로 변화한다.","bl":[["a","구조평야(구조평원)",""],["b","순상지",""],["c","대지",""],["d","메사",""],["e","뷰트",""]],"ex":"","cat":"지형학","rel":["","","대지","메사",""]},{"id":"2009(1)-29","y":2009,"link":[],"text":"문화 전파의 유형은 ( a )와/과 ( b )(으)로 구분한다. ( a )은/는 인구 이동이 없는 상태에서 문 하 분포의 공간적 범위가 가까운 곳에서 먼 곳으로 확대되는 유형이다. ( b )은/는 발생원 자체 가 이동함에 따라 문화가 이식되는 유형이다. 한편, 헤거스트란트에 따르면 문화 확산 과정에서 나타나는 공간적인 특징은 ( c )이고, 시간적인 특징은 ( d )이다. 또한 확산의 4단계는 ‘초기 - ( e ) - ( f ) - 포화’이며, 이중 인근효과가 강하게 나타나는 단계는 ( e / f )이다.","bl":[["a","팽창전파",""],["b","재입지전파",""],["c","거리조락 현상",""],["d","로지스틱 곡선",""],["e","전파",""],["f","농축","e"]],"ex":"","cat":"문화·역사·정치지리","rel":["","재입지 전파","","","",""]},{"id":"2009(1)-30","y":2009,"link":[],"text":"( a )은/는 지표상에서 연속적으로 나타나는 지리적 현상의 양적 크기를 표현하는 지도이다. 이 것을 제작할 때 사용되는 ( b )은/는 몇 개의 불연속적인 지점을 표본조사하여 값을 측정하여 미측정 지점의 값을 추정하는 방법이다. ( b )은/는 ( c )와/과 ( d )(으)로 구분한다. ( c )은/는 주변 표면의 경향을 고려하지 않고, ( d )은/는 주변 표면의 경향을 고려한다. 이중 기복이 심한 지형에 적합한 것은 ( c / d )이다. ( b )은/는 조정점의 개수가 ( 많을수록 / 적을수록 ), 조정점 의 간격이 ( 균등 / 불균등 )할수록 정확도가 높아진다.","bl":[["a","등치선도",""],["b","보간법",""],["c","국지적 보간법",""],["d","전역적 보간법","c, 많을수록, 균등"]],"ex":"","cat":"지형학","rel":["","","",""]},{"id":"2009(1)-31","y":2009,"link":[],"text":"*a~e는 디킨슨 3지대론의 중앙지대, 중간지대, 외부지대 중 하나 ( a ) : 보행자 도시의 흔적이 발견되며, 버제스 동심원 모델의 CBD와 점이지대를 포함한다. ( b ) : 주거 밀도가 낮고, 시가지가 면상으로 확대되고 있다. ( c ) : 주거 밀도가 높고, 무질서한 토지이용으로 주거 환경이 열악하다. ( d ) : 수직적으로 확장되고 있다. ( e ) : 산업혁명과 더불어 19세기 공장지대로 시가화된 구역으로, 영세 공장이 산재한다.","bl":[["a","중앙지대",""],["b","외부지대",""],["c","중간지대",""],["d","중앙지대",""],["e","중간지대",""]],"ex":"","cat":"도시지리","rel":["","","","",""]},{"id":"2009(1)-32","y":2009,"link":[],"text":"포터는 경제발전 단계를 ( a )주도형 단계 → ( b )주도형 단계 → ( c )주도형 단계 → ( d )주 도형 단계로 구분한다. 이중 클러스터가 형성되는 단계는 ( b / c / d )주도형 단계이다. ( e )은 /는 지역 내 혁신환경을 구축하여 지역 발전을 도모하려는 것이다. ( e )의 구성요소 중 ( f )은/ 는 조직과 제도의 문화, 분위기, 규범이고, ( g )은/는 대학, 연구소, 금융기관 등이다. 한편, ( h )이/가 지역적으로 구현된 실체이다.","bl":[["a","요소",""],["b","투자",""],["c","혁신",""],["d","부",""],["e","지역혁신체계",""],["f","상부구조",""],["g","사회적 하부구조",""],["h","클러스터",""]],"ex":"","cat":"경제지리","rel":["","","","","지역 혁신 체계","","","클러스터"]},{"id":"2009(1)-35","y":2009,"link":[],"text":"경제 통합 단계는 자유무역협정, ( a ), ( b ), 완전경제통합으로 구분하며, 완전경제통합으로 갈 수록 통합의 정도가 강하다. 역내 관세를 철폐하게 되는 단계는 ( 자유무역협정 / a / b )이고, 이와 더불어 역외 공동 관세를 부과하게 되는 단계는 ( a / b )이다. 자유무역협정부터 완전경 제통합까지를 각각 1~4단계로 구분할 때, 유럽연합의 발전 과정 중에 있는 유럽경제공동체는 ( c )단계에 해당하며, 유럽연합은 ( d )단계에 해당한다. USMCA는 ( e )단계, MERCOSUR는 ( f ) 단계에 해당한다. 한편, 2010년 이후에는 인구 및 경제 규모가 확대된 경제 블록이 등장하였는 데, 역내 포괄적 경제 동반자 협정(RCEP)에서는 ( g ), 인도·태평양 경제 프레임 워크는 ( h ) 이/가 경제규모가 가장 크다.","bl":[["a","관세동맹",""],["b","공동시장","자유무역협정, a"],["c","3",""],["d","4",""],["e","1",""],["f","2",""],["g","중국",""],["h","미국",""]],"ex":"","cat":"인구지리","rel":["","","","","","","",""]},{"id":"2009(1)-24","y":2009,"link":[],"text":"삼각주는 하천에 의한 토사 공급량이 파랑과 조석에 의한 토사 제거량보다 ( 많은 / 적은 ) 지 역에서 발달한다. 파랑과 하천의 작용이 비슷하거나 하천이 약간 더 우세한 곳에서는 ( a )상 삼각주가 형성되고, 파랑과 하천의 작용이 비슷하거나 파랑이 약간 더 우세한 곳에서는 ( b )상 삼각주가 형성된다. 하천이 우세한 곳에서는 ( c )상 삼각주가 형성된다. 조석이 우세한 곳에서 는 ( d )상 삼각주가 형성되는데, 이는 ( e )라고도 불리며 바다를 향해 나팔 모양으로 열려 있 는 형태이다. 미시시피 강에서는 ( a / b / c / d )상 삼각주, 압록강에서는 ( a / b / c / d )상 삼각주가 형성된다.","bl":[["a","호(원호)",""],["b","첨",""],["c","조족",""],["d","만입",""],["e","하구역(삼각강)","c, d"]],"ex":"많은","cat":"지형학","rel":["","","","",""]},{"id":"2009(1)-40","y":2009,"link":[],"text":"( a ) : 도시 간 인구 이동에 의해 도시화가 차별적으로 진행되는 것 ( b ) : 도시 인구와 기능의 교외 유출 ( c ) : 도시인구가 비도시 지역으로 이동하는 현상 ( d ) : 전체 인구 중 도시인구의 비율이 감소하는 것 ( e ) : 제3세계에서 외국인 직접 투자로 인해 일어나는 도시화, 종속적 도시화","bl":[["a","차별적 도시화",""],["b","교외화",""],["c","탈도시화",""],["d","역도시화",""],["e","엑소얼바니제이션(외생적 도시화)",""]],"ex":"","cat":"도시지리","rel":["","교외화","","역도시화",""]},{"id":"2008-01","y":2008,"link":[],"text":"슐만은 교사가 갖추어야 할 지식 7가지를 제시하였다. 그중 ( a )은/는 교사의 전문성을 뚜렷하 게 구분하는 중요한 개념으로, ( b )와/과 교수법을 합친 것이라고 말할 수 있다. ( b )은/는 특 정 교과에 대한 지식이고, ( c )은/는 교실 수업의 조직과 관리를 안내하기 위해 설계되는 폭넓 은 원칙과 전략이다. 쉐바야르는 학문적 지식을 가르칠 지식으로 변환하는 것을 ( d )(이)라고 하였다. 지리교육 연구자와 교과서 저자에 의해 학문적 지식으로서의 지리 지식이 교육과정과 교과서로 변환되는 것을 ( e )(이)라고 하며, 이렇게 변환된 지식을 교사가 학생의 지리로 적절 하게 변환하는 것을 ( f )(이)라고 한다.","bl":[["a","교수내용지식",""],["b","교과내용지식",""],["c","일반교수지식",""],["d","교수학적 변한",""],["e","1차 교수학적 변환",""],["f","2차 교수학적 변환",""]],"ex":"","cat":"지리교육론","rel":["교수 내용 지식","","","","",""]},{"id":"2008-03","y":2008,"link":[],"text":"직소Ⅰ 모형은 ( 과제 / 보상 )의 상호의존성은 높지만, ( 과제 / 보상 ) 의존성은 낮다는 단점을 지닌다. 이에 직소Ⅱ 모형에서는 ( a )의 보상방식을 활용하여 모둠원들의 개별책무성을 강화한 다. ( a )의 보상방식은 지난번 개인점수와 비교한 개인점수를 비교하여 개선점수를 부여하는 것이다. 직소Ⅲ 모형은 직소Ⅱ에 ( b )을/를 추가하였다. 한편, ( c )은/는 학습능력이 높은 학생 들이 소집단을 장악하는 것이고, ( d )은/는 자신의 노력이 다른 학습자에게로 돌아간다고 인식 하면서 학습에 능동적으로 참여하지 않는 현상이다.","bl":[["a","성취과제분담학습(STAD)",""],["b","퀴즈 전 학습 시간",""],["c","빈익빈 부익부",""],["d","봉효과",""]],"ex":"과제, 보상","cat":"지리교육론","rel":["","","","봉 효과"]},{"id":"2008-05","y":2008,"link":[],"text":"( a )은/는 우리나라 근대 학교에서 사용된 최초의 지리교과용 도서로, ( 한글 / 영어 )로 집필되 었다. 유길준의 ( b )은/는 후쿠자와 유키치의 ‘서양사정’의 영향을 받은 것으로, 일본, 미국, 유럽, 동남아 지역을 여행하면서 수집한 자료와 유학 경험을 바탕으로 저술되었다. 한편, 최한 기는 ( c ), 오횡묵은 ( d )을/를 집필하였는데, ( d )에는 6대주 51개국과 한국지지가 삽입되어 있다.","bl":[["a","사민필지",""],["b","서유견문",""],["c","지구전요",""],["d","여재촬요",""]],"ex":"","cat":"지역지리","rel":["사민필지","","",""]},{"id":"2008-06","y":2008,"link":["2016A-02, 2014A-03"],"text":"( a )은/는 장소의 이미지를 반영하는 지리학적 언어이다. 한자 문화권에 속하는 한국에서는 우 리말로 된 고유 ( a )을/를 사용하였는데, 한자의 뜻을 빌려 표현하는 ( b )법에 따라 삼개를 ( c )(이)라고 표현한 사례가 있다. 한편, 아일랜드와 오스트레일리아의 지명에는 ( d )(이)라는 공통 된 특성이 반영되어 있고, 아이슬란드와 부에노스아이레스의 지명에는 ( e )(이)라는 공통된 특 성이 반영되어 있다. 아프리카 코트디부아르의 해안은 ( f ) 해안으로 불리는데, 이는 유럽인들 이 ( f )을/를 얻기 위해 모여들었기 때문이다. 이 지역의 중심지는 아비장이다.","bl":[["a","지명",""],["b","훈차",""],["c","마포",""],["d","방위",""],["e","기후",""],["f","상아",""]],"ex":"","cat":"지형학","rel":["","","","","",""]},{"id":"2008-07","y":2008,"link":[],"text":"( a )은/는 하천에서 범람한 퇴적물이 쌓여 형성된 곡저에 발달한 평탄한 지형으로, 우리나라의 낙동강 유역 대산평야가 이에 해당한다. 한편, ( b )은/는 하천이 침식기준면에 도달하면서 유속 이 급격하게 감소하여 운반하던 퇴적물을 하구와 그 주변에 집중적으로 쌓아 형성된 충적 지형 이다. 낙동강 유역의 ( b )은/는 하도가 크게 2개로 분류한 후에 지속적으로 분류를 진행하면서 수많은 ( c )을/를 형성하였다. ( b )의 상부는 주로 ( 하천 / 파랑 )에 의해 공급된 퇴적물이 ( c )을/를 이루고, 하부는 주로 ( 하천 / 파랑 )에 의해 공급된 퇴적물이 ( d )을/를 형성한다. ( d ) 의 배후 지역은 파랑의 영향이 감소함에 따라 미립물질의 퇴적이 줄어들어 간석지로 변화한다. 한편, ( d )와/과 간석지는 ( 서 / 동 )쪽으로 점차 이동한다.","bl":[["a","범람원",""],["b","삼각주",""],["c","하중도","하천, 파랑"],["d","연안사주","서"]],"ex":"","cat":"지형학","rel":["범람원","삼각주","",""]},{"id":"2008-08","y":2008,"link":["2024B-05"],"text":"순위규모법칙은 도시 체계를 구성하는 도시의 ( a )와/과 ( b )에 대해 일반화한 것이다. 공식에 서 q의 값이 1보다 크면 ( c ) 분포이고, q의 값이 1보다 작으면 ( d ) 분포이다. ( c ) 분포일 때의 수위도시는 ( c ) 도시라고 말할 수 있다. ( c ) 지수는 인구 측면에서 2위 도시 인구에 대 한 1위 도시 인구의 비율을 의미한다. 한편, ( e ) 이론은 도시화 단계를 도시군 간 인구 이동으 로 설명하는 것으로, 도시화 단계별로 도시화를 이끄는 그룹이 다르다.","bl":[["a","수",""],["b","규모",""],["c","종주",""],["d","과두",""],["e","차별 도시화",""]],"ex":"","cat":"도시지리","rel":["","","","",""]},{"id":"2008-10","y":2008,"link":["2015B-04"],"text":"냉전시대 소련과 미국의 대립을 결정론적 입장에서 예견한 맥킨더의 정치지리 고전이론의 대립 축은 ( a )와/과 ( b )이다. 매킨더는 ( a )을/를 해상 세력이 접근할 수 없는 천혜의 요새로 보 았다. 특히 “( c )을/를 지배하는 자는 ( a )을/를 지배하고, ( a )을/를 통제하는 자는 세계의 섬을 지배하고, 세계의 섬을 지배하는 자는 세계를 지배한다.”라고 말하면서 ( c ) 지역을 장악 하는 것이 중요함을 밝혔다. 한편, 러시아가 ( d )(으)로 해양 진출 운동을 전개하는 이유는 ( e )을/를 확보하기 위함이다.","bl":[["a","심장지역",""],["b","주변지역",""],["c","동유럽",""],["d","내측 초승달 지역",""],["e","부동항",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","","","",""]},{"id":"2008-11","y":2008,"link":[],"text":"( a )은/는 ( b ) 100 미만이 나타내는 통근 형태로, 일자리의 교외화가 주거 이동보다 더 많이 이루어진 상황이다. ( b )은/는 {상주인구 + (통근 유입인구 – 통근 유출인구)} / 상주인구 × 100 으로 나타낸다. ( a )을/를 감소시키기 위해서는 ( c ) 교외화와 ( d ) 교외화의 균형이 이루어져 야 한다. 즉, 이를 충족시키는 도시 유형에는 ( e )(이)가 있다. ( c / d ) 교외화가 외곽에서 중 심도시로 이루어지는 일반적인 통근을 보여준다면, ( c / d ) 교외화는 ( a )을/를 보여준다. 또 한 ( c )와 ( d ) 중 직주 분리 현상을 잘 보여주는 것은 ( c / d )(이)다.","bl":[["a","역통근",""],["b","주간통근인구지수",""],["c","거주",""],["d","고용",""],["e","에지시티/교외도심","c, d, c"]],"ex":"","cat":"도시지리","rel":["","","","",""]},{"id":"2008-13,","y":2008,"link":[],"text":"베버의 공업입지론 중 운송비지향론에 따르면 보편적 원료는 어디에서나 얻을 수 있는 원료이 고, ( a )은/는 특정 지역에 편재된 원료이다. ( a ) 중에서도 ( b )은/는 제조 과정에서 중량 손 실이 발생하지 않고, ( c )은/는 중량 손실이 발생한다. ( d )은/는 ‘사용된 ( a )의 무게 / 최종 생산물의 무게’로 구하며, ( e )은/는 ‘( d ) + 1’이다. ( d )이/가 1보다 크면 ( 원료 / 시장 ) 지향성 공업이고, 1보다 작으면 ( 원료 / 시장 )지향성 공업이다. 한편, 노동비지향론에 따르면 ( f )은/는 ‘사용된 노동비 / 최종 생산물의 무게’이고, ( g )은/는 ‘( f ) / ( e )’이다.","bl":[["a","국지적 원료",""],["b","순수원료",""],["c","중량감손원료",""],["d","원료지수",""],["e","입지중량","원료, 시장"],["f","노동비지 수",""],["g","노동계수",""]],"ex":"","cat":"경제지리","rel":["","","","원료 지수","","노동비 지수",""]},{"id":"2008-20","y":2008,"link":[],"text":"습곡산지의 개석 과정에서는 ( a )이/가 나타난다. ( a )은/는 두부침식을 통해 ( b )이/가 필종하 의 유역을 빼앗는 현상이다. 이는 ( b / 필종하 )은/는 연암층을 흐르고, ( b / 필종하 )은/는 경 암층을 흐르기 때문이다. ( c )은/는 쥐라식 기복일 때 배사산릉 양쪽에서 흘러내리는 지류이고, ( d )은/는 능선이 끊긴 협곡이다. ( d )은/는 ( a )(으)로 인해 형성된 ( 수극 / 풍극 )이다.","bl":[["a","하천쟁탈",""],["b","적종하","b, 필종하"],["c","뤼즈",""],["d","클뤼즈","수극"]],"ex":"","cat":"지형학","rel":["하천 쟁탈","","",""]},{"id":"2007-01","y":2007,"link":[],"text":"신생대 제( 3 / 4 )기에는 태평양판과 유라시아판의 충돌로 섭입이 발생해 일본 열도가 만들어 졌다. 이때 섭입대 하부에서 녹은 지각이 다시 상승하며 거대한 ( a ) 작용이 발생해 동해가 만 들어졌고, 이때 발생한 힘은 유라시아판에 ( 장력 / 횡압력 )으로 작용해 ( b )이/가 발생하였다. 이 지각변동은 한반도 동부의 융기로 1차 산맥과 융기 지형들을 형성하였다. 융기 지형 중 ( c )은/는 오랜 풍화와 침식으로 평탄해진 지형이 ( b )(으)로 융기한 이후에도 평탄한 기복을 유지 하는 것이다. 이곳에서는 ( d ) 농업이 이루어진다.","bl":[["a","단층","횡압력"],["b","경동성 요곡 운동",""],["c","고위평탄면",""],["d","고랭지농업",""]],"ex":"3","cat":"지역지리","rel":["","경동성 요곡 운동","고위 평탄면","고랭지 농업"]},{"id":"2007-03","y":2007,"link":[],"text":"( a )은/는 환경 속의 대상을 지각하고 관련짓는 능력 ( b ) : 특정한 범위 안에서 정확한 방향을 파악할 수 있는 능력 ( c ) : 주어진 공간적 패턴을 찾아내고 가시화하는 능력 +) 킬러 문제? ( d ) : 공간을 점유하고 있는 사물에 대한 공간 정보를 부호화하고, 공간적 이미지들을 표상하 고 변환하며, 공간적 관계를 추론하고 의사결정을 내리는 일련의 정신적 활동","bl":[["a","조망 능력",""],["b","정향 능력",""],["c","공간적 가시화 능력",""],["d","공간적 사고",""]],"ex":"","cat":"지리교육론","rel":["조망능력","","공간적 가시화 능력",""]},{"id":"2007-05","y":2007,"link":[],"text":"실증주의 인간주의 구조주의 ( a ) 관심 ( b ) 관심 ( d ) 관심 하버마스 경험분석적 지식 ( c ) 지식 비판적 지식 자유주의적 ( e ) 아이즈너 ( f ) 전통 재건주의 전통 인문주의 전통 전통 존스톤 ( ｇ )(으)로서의 지리 ( h )(으)로서의 지리 해방으로서의 지리","bl":[["a","기술적",""],["b","실천적",""],["c","해석학적",""],["d","해방적",""],["e","실용주의",""],["f","아동중심",""],["h","상호적",""]],"ex":"g-기술적 통제","cat":"문화·역사·정치지리","rel":["","","","","","",""]},{"id":"2007-08","y":2007,"link":[],"text":"시카고학파에 따르면 도시의 공간은 ( a ) → ( b ) → ( c )의 과정으로 형성된다. 이로 인해 형 성되는 ( d )은/는 ( b )(으)로 인해 형성되는 동질적인 지역이다. 이러한 고전생태학을 비판하면 서 신고전생태학이 등장하였고, 이후 ( e )이/가 등장하였다. ( e )은/는 도시 내 주거공간구조를 분석하기 위해 사회문화적 인자에 관심을 가진다. 쉐브키와 벨은 ( f )을/를 사용하여 주거지 분 화의 원인을 연역적으로 규명하여 주거지 분화의 3가지 요인을 추출하였다. 이 3가지 요인을 물리적 공간과 중첩시키면 ( g )을/를 파악할 수 있다.","bl":[["a","침입",""],["b","경쟁",""],["c","천이",""],["d","자연지역",""],["e","사회지역분석",""],["f","인구 세선스",""],["g","사회지역",""]],"ex":"","cat":"도시지리","rel":["","","","","사회 지역 분석","",""]},{"id":"2007-09","y":2007,"link":["2018A-12"],"text":"크리스탈러 이론의 주요 개념 중 ( a )은/는 정상이윤이 발생하지만, 초과이윤은 없는 범위이다. ( b )은/는 상권이며 총수익이 최대가 되는 범위이다. ( c )은/는 중심지 계층의 순위를 결정짓는 그 순위의 최고차 재화이다. ( d )은/는 중요도의 잉여라고 할 수 있다. ( a )이/가 ( b )보다 클 때 ( e )이/가 성립한다. 그러나 ( a )이/가 ( b )보다 작을 때에는 ( f )을/를 형성하게 된다.","bl":[["a","최소요구치",""],["b","재화의 도달범위",""],["c","계층한계재화",""],["d","중심성",""],["e","중심지",""],["f","정기시",""]],"ex":"","cat":"도시지리","rel":["최소 요구치","재화의 도달 범위","계층 한계 재화","중심성","중심지",""]},{"id":"2007-11","y":2007,"link":[],"text":"인구이동의 의사결정과정을 단계적으로 나타내면 ‘이동 ( a ) → 이동 ( b ) → 이동 ( c )’의 순서로 고려한다고 볼 수 있다. 이동 ( a )은는 인구 이동에 대한 성향에 관한 것이고, 이동 ( b )은/는 특정 지역으로 이동함에 따라 수반되는 비용과 그 지역으로 이동할 경우 예상되는 수익 을 고려하는 것이다. 이때 비용에는 ( d ) 비용, ( e ) 비용, ( f ) 비용이 있다. 이동 ( c )은/는 최종적으로 의사결정을 하는 것이다. 한편 이동 ( a ) 중 지역사회 이동연계망은 ( g )와/과 관 련이 있는데, 이는 동일한 이동경로를 가지는 인구 집단이 계속하여 이주하는 것이다.","bl":[["a","조건",""],["b","동기",""],["c","결정",""],["d","직접",""],["e","간접",""],["f","심리적",""],["g","연쇄 이주",""]],"ex":"","cat":"인구지리","rel":["","","","","","","연쇄이주"]},{"id":"2007-16","y":2007,"link":["2022A-11"],"text":"( a )은/는 특정 도시의 특정 산업의 특화도를 보여주는 지표이다. ‘지역 총고용에서 X 산업의 비율 / 국내 총고용에서 X 산업의 비율’로 계산하며, 이 값이 1보다 ( 크면 / 작으면 ) 특화되 었다고 말할 수 있다. ( b ) 산업은 도시 외부에 판매하여 도시의 소득을 증가시키는 산업으로, ( 기반 / 비기반 ) 활동에 해당한다. ( b ) 산업은 ( a )이/가 1보다 ( 큰 / 작은 ) 산업이다. 한 편, ( c )은/는 ‘비기반활동 고용 / 기반활동 고용 + 1’로 계산하여 구한다.","bl":[["a","입지계수(특화계수)","크면"],["b","수출","기반, 큰"],["c","승수효과",""]],"ex":"","cat":"도시지리","rel":["","",""]},{"id":"2007-17","y":2007,"link":[],"text":"( a ) : 해빈 침식을 방지하기 위해 해안에서 바다 쪽으로 설치한 둑 모양의 구조물 ( b ) : 연안의 모래를 침식이 발생하는 해빈 위로 퍼 올려 쌓는 방법 서해안 사빈 동해안 사빈 입경 ( 조립질 / 미립질 ) ( 조립질 / 미립질 ) 파랑의 힘 스워시 ( ＞ / ≒ / ＜ ) 백워시 스워시 ( ＞ / ≒ / ＜ ) 백워시 경사 ( 급함 / 완만함 ) ( 급함 / 완만함 ) 사빈침식 ( 큼 / 작음 ) ( 큼 / 작음 )","bl":[["a","그로인(돌제)",""],["b","양빈",""]],"ex":"","cat":"지형학","rel":["",""]},{"id":"2007-19","y":2007,"link":[],"text":"해안사구는 ( a )에 의해 운반된 사빈의 모래가 배후 지역에 쌓여 형성된 모래 언덕이다. 기후 적으로 사빈의 모래를 내륙 방향으로 운반할 수 있는 ( b )이/가 존재하는 곳에 잘 발달한다. 또한 ( c )이/가 있는 곳은 모래가 지표에 잘 고정되므로 해안사구가 발달하기에 유리하다. ( d )은/는 대체로 해안선에 평행하게 능선을 이루며 발달하는 사구로, ( a )와/과 ( e )의 영향을 동 시에 받아 형성된다. ( f )은/는 ( a )의 영향만을 받아 형성된 것이다. 사구 내의 풍식에 의해 움푹 파인 와지를 ( g )(이)라고 한다.","bl":[["a","바람",""],["b","탁월풍",""],["c","식생",""],["d","전사구",""],["e","파랑",""],["f","포물선사구",""],["g","취식와지",""]],"ex":"","cat":"지형학","rel":["","","","전사구","","",""]},{"id":"2006-02","y":2006,"link":[],"text":"( a )은/는 오수벨의 ( b )을/를 촉진하기 위해 학습 전에 제공되는 자료이다. 주의집중 또는 새 로 학습하는 개념들의 정교화 및 조직화에 도움을 준다. ( a )의 유형에는 ( c )와/과 ( d )이/가 있다. ( b )은/는 학습자의 선행지식과 새로운 학습과제 간에 유사성이 없을 때, ( c )은/는 상당 한 유사성이 있을 때 제시한다. 한편, ( d )은/는 새로운 학습과제를 학습자의 인지구조 속으로 병합시키는 과정이다. ( e )은/는 기존에 가지고 있떤 개념을 확장·수정·정교화하는 것이고, ( f )은/는 기존에 가지고 있던 개념과 대등한 수준의 학습과제를 학습할 때 발생하는 것이다. 삼 각형에는 직각삼각형과 둔각삼각형 등이 있다는 사실을 학습하는 것은 ( g )에 해당한다.","bl":[["a","선행조직자",""],["b","유의미하습",""],["c","설명조직자",""],["d","비교조직자",""],["e","상관적 포섭",""],["f","병렬적 포섭","g-"]],"ex":"","cat":"지리교육론","rel":["선행 조직자","","설명조직자","비교조직자","",""]},{"id":"2006-03","y":2006,"link":[],"text":"잡은 야외조사를 통한 교수학습의 유형을 교사주도-학생주도, 인지적 접근-정의적 접근에 따라 현지 수학여행, ( a ), ( b )(으)로 분류하였다. 로버츠는 교수학습 스타일에 따라 ( c ) 스타일, ( d ) 스타일, ( e ) 스타일로 구분하였다. 패널리와 웰치는 학생들에게 경험을 제공하는 유형에 따라 ( f )과 참여, 의존과 ( g )에 따른 연속체로 간주하여 4개의 유형으로 구분하였다.","bl":[["a","탐구식 야외조사",""],["b","발견식 야외조사",""],["c","폐쇄적",""],["d","구조화된",""],["e","협상적",""],["f","관찰",""],["g","자율",""]],"ex":"","cat":"지리교육론","rel":["","","","","","",""]},{"id":"2006-11","y":2006,"link":[],"text":"*버논의 제품수명주기모델 초기 성장 성숙 과학기술, 정보수집, 생산요소 ( a ) ( b ) 사회간접자본 등 최적입지 ( c ) ( d ) ( e ) 노동의 공간 분업이 나타나는 단계는 ( 초기 / 성장 / 성숙 ) 단계이고, 이 단계의 투자모국에서 는 ( f ) 현상이 나타난다.","bl":[["a","자본과 경영",""],["b","저렴한 노동력과 자본",""],["c","대도시",""],["d","대도시 근교",""],["e","저임금 지역","성숙, f-"]],"ex":"","cat":"경제지리","rel":["","","","",""]},{"id":"2006-13","y":2006,"link":["2024A-09"],"text":"반 덴 베르그 등의 도시발달단계론은 두 하부 지역과 도시 전체의 인구 변화(증감) 추세를 비교 하여 대도시지역의 발달 단계를 ‘( a ) → ( b ) → ( c ) → ( d )’의 4단계로 구분하였다. 도 시 인구 집중에 의한 인구 성장이 나타나는 단계는 ( a~b 중 2개 선택 )이고, 도시 인구 분산에 의한 인구 감소가 나타나는 단계는 ( a~b 중 2개 선택 )이다. 한편, ( d ) 단계에서 나타나는 ( e )은/는 쇠락한 도심 지역이 중산층 자본의 유입으로 인해 고급 주거지와 상업지로 변모하는 현 상이다. ( f )은/는 ( e )을/를 발생시키면서 이주해오는 사회 집단이다.","bl":[["a","도시화",""],["b","교외화",""],["c","역도시화 또는 재도시화",""],["d","재도시화","a와 b, c와 d"],["e","젠트리피케이 션",""],["f","젠트리파이어",""]],"ex":"","cat":"도시지리","rel":["","교외화","","재도시화","젠트리피케이션",""]},{"id":"2006-15","y":2006,"link":["2010(1"],"text":"하트숀의 발생론적 국경 분류에 따라 다음의 사례에 적합한 국경 유형을 쓰시오. Ÿ ( a )적 경계 : 파푸아뉴기니-인도네시아 Ÿ ( d )적 경계 : 인도네시아-말레이시아 Ÿ ( b )적 경계 : 중국-베트남 Ÿ ( e )적 경계 : 월맹-월남 Ÿ ( c )적 경계 : 미국-캐나다 Ÿ ( f )적 경계 : 유럽 대부분 국경선","bl":[["a","전횡",""],["b","종행",""],["c","선행",""],["d","선행",""],["e","잔존",""],["f","종행",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","","","","",""]},{"id":"2006-19","y":2006,"link":["2020A-06"],"text":"쾨펜의 기후구분에서 ( a ) 기후는 중위도 대륙 서안에 발달하는 대표적인 기후형으로 남·북위 40~65도 사이에 분포한다. 이 기후지역은 ( b )와/과 ( c )의 영향으로 같은 위도대의 다른 지역 에 비하여 기온의 연교차와 일교차가 작다. 또한 강수 강도가 강하지 않지만 강수 빈도는 높아 서 연중 습윤하다. 하지만 연 강수량은 북서유럽과 북아메리카에서 다르게 나타나는데, 이는 지 리적 기후 인자 중 ( d ) 때문이다. 한편, 해류 측면에서 ( c )은/는 등온선을 ( 극 / 적도 ) 방향 으로 휘게 한다. +) 밑줄 친 현상이 발생하는 이유는?","bl":[["a","서안 해양성",""],["b","편서풍",""],["c","난류",""],["d","지형","극 +) 운량이 많아 지표에 유입되는 태양복사에너지를 차단하고 지구복사에너지는 흡수하기 때문"]],"ex":"","cat":"기후학","rel":["","편서풍","난류",""]},{"id":"2006-20","y":2006,"link":[],"text":"1) 점토의 침식 유속이 빠른 이유는? 2) 퇴적 유속은 입자 크기에 비례하므로 ( a )와/과 ( b )이/가 나타난다. ( a )이/가 나타나는 양 상은 홍수 때 퇴적 유속이 ( 증가 / 감소 )함에 따라 ( 조립질 / 미립질 )이 퇴적되고, 평수 때 퇴적 유속이 ( 증가 / 감소 )함에 따라 ( 조립질 / 미립질 )이 퇴적되는 것이다. 한편, ( c )은/는 하천이 운반할 수 있는 입자의 최대 크기이고, ( d )은/는 하천이 운반할 수 있는 전체 퇴적량이다.","bl":[["a","층리",""],["b","분급","증가, 조립질, 감소, 미립질"],["c","운반능",""],["d","운반량",""]],"ex":"1) 점토의 응집력이 크고, 모래보다 매끈하여 유수의 교란운동을 낮추기 때문 2)","cat":"지형학","rel":["","","",""]},{"id":"2006-21","y":2006,"link":["2006-17"],"text":"( a )은/는 석회암의 ( b ) 작용으로 ( c )이/가 제거되고 비가용성 불순물이 잔류하는 토양이다. 최근에는 열대 습윤 기후의 영향을 받은 ( d ) 토양으로 보고 있다. ( a )은/는 ( e ) 작용이 일 어나므로 붉은색이며, 토양이 ( 비옥 / 척박 )한 편이다. ( f )은/는 기반암이 거의 ( a )(으)로 덮 인 카르스트 지형이고, ( g )은/는 ( a )의 유실로 인해 기반암이 지표에 노출된 카르스트 지형 이다. +) ( d ) 토양의 형성에 영향을 주는 토양 생성 인자 2가지는?","bl":[["a","테라로사",""],["b","용식",""],["c","탄산칼슘",""],["d","성대",""],["e","산화","비옥"],["f","피복 카르스트",""],["g","나출 카르스트 +) 기후와 식생",""]],"ex":"","cat":"토양·식생·수문","rel":["테라로사","용식","","","","",""]},{"id":"2006-25","y":2006,"link":[],"text":"( a )은/는 각종 지리적 현상들을 추상화하여 지도로 표현하는 과정이다. 이는 ( b ), ( c ), ( d ), 기호화 단계로 이루어진다. ( b )은/는 지도상으로 표현할 공간의 범위와 지도의 축척 밑 투 영법 등을 고려하면서 지도의 목적에 맞는 자료와 변수를 정하는 것이다. ( c )은/는 유사하거나 같은 자료들을 집단으로 분류하여 이미지의 복잡성을 줄이는 것이다. ( d )은/는 세부적인 불규 칙성을 제거하여 단순하게 만드는 것이다. 기호화는 ( e )와/과 자료의 유형을 고려하여 공간상 의 대상물을 기호로 표현하는 것이다. 기호화의 유형에는 그림으로 표현하는 ( f )적 기호화, 언 어로 표현하는 ( g )적 기호화, 범례를 사용하는 ( h ) 기호화가 있다.","bl":[["a","지도학적 추상화(일반화)",""],["b","분류",""],["c","단순화",""],["d","기호화",""],["e","축척",""],["f","형상",""],["g","언어",""],["h","추상",""]],"ex":"","cat":"지도학·GIS","rel":["","","","","","","",""]},{"id":"2005-07,","y":2005,"link":[],"text":"( a )은/는 학생이 과제를 수행하여 성취하기를 바라는 지식, 기능, 태도 등에 대해 진술하고 수 행 수준에서 성취기준을 명세화한 것이다. 이는 수행평가의 ( b )을/를 높이는 방안으로 활용될 수 있다. 루브릭의 포함 요소 4가지는 ( c ), ( d ), ( e ), ( f )이다. 한편, 수행평가 자료의 기록 법 중 ( g )은/는 주어진 문항들을 일정한 연속상의 한 점이나 몇 개의 범주 가운데 하나에 위 치시키는 방법이고, ( h )은/는 관찰하려는 행동 단위를 자세히 분류하여 나타날 때마다 표시하 는 방법이다.","bl":[["a","루브릭(채점기준표)",""],["b","신뢰도",""],["c","과제 진술",""],["d","평가 기준 및 차원",""],["e","평가 척도/단계 설정",""],["f","수행수준 기술",""],["g","평정법",""],["h","체크리스트",""]],"ex":"","cat":"지리교육론","rel":["","","","","","","",""]},{"id":"2005-09","y":2005,"link":[],"text":"삼각주는 하천이 ( a )에 도달하면서 유속이 급격하게 ( 증가 / 감소 )하여 운반하던 퇴적물을 ( b )와 그 주변에 집중적으로 쌓은 충적 지형이다. 형태에 따른 분류에 의하면 우리나라의 압록 강 삼각주는 ( c ) 삼각주, 나일강 삼각주는 ( d ) 삼각주, 미시시피강 삼각주는 ( e ) 삼각주에 해당한다. 한강과 템즈강에는 삼각주가 잘 발달하지 않지만, 황해로 유입하는 압록강과 ( f )(으) 로 유입하는 라인강에는 삼각주가 발달한다. 이는 조차가 ( 큰 / 작은 ) 것의 영향보다 토사 유 출량이 많은 정도가 더 영향이 크기 때문이다. 따라서 한강과 템즈강에는 삼각주가 발달하지 않지만, ( g )이/가 발달한다.","bl":[["a","침식기준면","감소"],["b","하구",""],["c","하구역(만입상)",""],["d","원호상",""],["e","조족상",""],["f","북해","큰"],["g","하구역(삼",""]],"ex":"","cat":"지형학","rel":["침식 기준면","","","","","",""]},{"id":"2005-11","y":2005,"link":["2019B-06"],"text":"( a )은/는 노암의 단애에서 분리된 암괴나 암설이 낙하하여 그 밑에 쌓여 만들어진 지형이다. ( b )은/는 ( a )의 구성물질이 사면 상부의 단애와 가까울수록 작아지고 멀어질수록 커지는 현상 이다. ( c )은/는 거력으로 이루어진 다량의 암괴가 골짜기를 따라 좁고 길게 쌓여 있는 지형이 다. 이는 영구동토층에서 나타나는 얼음과 토양이 혼합되면서 천천히 흘러내리는 현상인 ( d ) 에 의해 형성된다. 이 지형은 상부에서 하부로 사면의 경사가 ( 증가 / 감소 )한다. 우리나라의 애추와 암괴류는 현재 기후 환경과는 다른 과거의 기후 환경에서 형성되어 지금까지 남아 있는 지형인 ( e )에 해당한다. +) 애추와 암괴원이 ( d )인 증거 1가지를 쓰시오.","bl":[["a","애추",""],["b","낙하분급",""],["c","암괴류",""],["d","젤리플럭션",""],["e","화석지형 +) 표면에 이끼가 껴있고 암괴나 암설 사이에 식생이 자라고 있다.",""]],"ex":"","cat":"지형학","rel":["애추","낙하 분급","암괴류","",""]},{"id":"2005-12","y":2005,"link":[],"text":"*우리나라의 서해안과 동해안 해안사구 비교 서해안 동해안 형성 영력 ( a ) 북동풍 또는 해풍 규모 ( 작음 / 큼 ) ( 작음 / 큼 ) 간조시 드러난 완경사 해빈 모래 공급원 연안의 기반암 풍화물질 ( c ) 플라이스토세의 고사구 안정성 ( 안정 / 불안정 ) ( 안정 / 불안정 )","bl":[["a","북서계절풍","작음, 안정 // 동해안 :"],["c","사빈","불안정"]],"ex":"서해안 :, b-북동기류, 큼","cat":"지형학","rel":["","사빈"]},{"id":"2005-13","y":2005,"link":[],"text":"지중해성 기후는 여름철에는 ( a )의 영향을 받아 고온건조하며 겨울철에는 ( b )의 영향을 받 아 온난습윤하다. 해안이나 고위도에 있으면 ( c, 쾨펜의 기후구분 3차 유형까지 쓰기) 기후가 나타난다. 식생은 ( d )림이 발달한다. 또한 여름철에는 ( e ) 농업이 발달하고 겨울철에는 ( f ) 농업이 발달한다. 가축은 ( g )을/를 통해 기르는데, 이는 수직적 목축업으로 ( 여름 / 겨울 )에 는 산지로, ( 여름 / 겨울 )에는 저지대로 이동하는 것이다.","bl":[["a","아열대 고기압",""],["b","한대전선대(온대 저기압)",""],["d","경엽수",""],["e","수목",""],["f","곡물",""],["g","이목","여름"]],"ex":"c-Csb","cat":"기후학","rel":["","","","","",""]},{"id":"2005-18,19","y":2005,"link":["2012(1"],"text":"영국의 쿠크는 ( a )을/를 ‘제품과 생산 공정, 지식의 상업화에 기여하는 기업과 제도 간의 네 트워크’라 하였다. 이것의 구성요소는 지역의 조직과 문화, 분위기, 규범 등의 ( b )와/과 도로, 공항, 통신망 등의 ( c ), 대학, 연구소, 금융기관, 교육 훈련 기관, 지방정부와 같은 ( d )(으)로 이루어진다. 포터는 ( d )을/를 기업과 관련 기관이 서로 관계를 맺고 지리적으로 집중하는 것이 라고 하였다. ( a )은/는 ( d )이/가 지역적으로 구현된 실체이다. 또한 ( a )에서는 경제주체들 간의 ( e ) 절감을 위한 네트워킹이 중시된다.","bl":[["a","지역혁신체계",""],["b","상부구조",""],["c","물리적 하부구조",""],["d","사회적 하부구조",""],["e","거래비용",""]],"ex":"","cat":"경제지리","rel":["지역 혁신 체계","","","",""]},{"id":"2005-23","y":2005,"link":[],"text":"( a )은/는 육상, 해운 또는 항공교통의 주요 결절에 위치하여 한 지역과 다른 지역을 연결해주 는 도시이다. 이는 중심지 체계와 다음과 같은 차이를 나타낸다. 중심지 체계 ( a ) 배후지의 사각형, 육각형, 원형 ( b ) 물리적 형태 입지 배후지의 ( 중앙 / 한쪽 끝 ) 배후지의 ( 중앙 / 한쪽 끝 ) 교통 특성 지역 ( 내 / 간 ) 단거리 운송 지역 ( 내 / 간 ) 장거리 운송 배후지 특성 ( 등질적 / 이질적 ) ( 등질적 / 이질적 )","bl":[["a","관문도시 // 중심지 체계 : 중앙","내, 등질적 // 관문도시 :"],["b","선형(부채꼴)","한쪽 끝, 간, 이"]],"ex":"","cat":"도시지리","rel":["",""]},{"id":"2005-24","y":2005,"link":[],"text":"중심지 체계 네트워크 도시체계 서열 지표 ( a ) ( b ) 재화의 흐름 ( c ) ( d ) 비용 요소 ( e ) ( f ) +) 킬러 문제 : 카스텔에 따르면 네트워크 사회 이전의 공간은 ( g )의 공간으로 구성되어 있었 지만, 네트워크 사회에서의 공간은 ( h )의 공간이다.","bl":[["a","중심성",""],["b","결절성",""],["c","일방적 흐름",""],["d","쌍방적 흐름",""],["e","교통비용",""],["f","정보비용",""],["g","장소",""],["h","흐름",""]],"ex":"","cat":"도시지리","rel":["중심성","결절성","","","","","장소",""]},{"id":"2005-25,26","y":2005,"link":[],"text":"개발도상국 도시 구조에서는 상류층이 ( 중심부 / 주변부 )에 거주하고, 저소득층이 ( 중심부 / 주변부 )에 거주하는 ( a ) 형태가 나타난다. 또한 ( b ) 부문이 발달하고, 불량주택지대가 나타 나타난다. 라틴아메리카의 슬럼에 관한 용어로는 바리아다 또는 ( c )이/가 있다. 동남아시아는 ( d )을/를 중심으로 도시 구조가 발달한 것이 큰 특징이다. 도시 주변부에는 불량주택지대인 ( e )(이)라는 슬럼이 있다. 또한 가장 외곽에는 ( f )이/가 있다. 또한 CBD의 발달 정도가 ( 강하 다 / 약하다 ).","bl":[["a","역전된 동심원",""],["b","비공식",""],["c","파벨라",""],["d","항구",""],["e","캄풍",""],["f","산업지구","약하다"]],"ex":"중심부, 주변부","cat":"경제지리","rel":["","","","","","산업 지구"]},{"id":"2005-29","y":2005,"link":[],"text":"( a ) 작용은 건조지역에서 가용성 염류가 토양에 집적되는 현상이다. 배수시설이 ( 있는 / 없는 ) 농경지에서 잘 발생한다. ( b ) 농업으로 인해 지하수위가 ( 상승 / 하강 )함에 따라 증발이 발 생하여 염류가 집적된다. 이는 오스트레일리아에서도 발생하는데, 땅을 깊이 파서 지하수면까지 관을 연결하여 지하수를 뽑아 올리는 우물을 설치하는 ( c )에 의해 양 사육을 함에 따라 ( a ) 가 심각해지고 있다. 한편, 나일강은 국가 간의 국경을 이루거나 여러 나라의 영토를 거쳐 흐르 는 ( d ) 하천으로, 상류의 ( e )와/과 하류의 ( f ) 간 갈등이 발생하고 있다. *e, f는 국가 이름","bl":[["a","염류화","없는"],["b","관개","상승"],["c","찬정",""],["d","국제",""],["e","수단",""],["f","이집트",""]],"ex":"","cat":"토양·식생·수문","rel":["염류화","","","","",""]},{"id":"2004-03","y":2004,"link":[],"text":"다음 설명에 부합하는 지리 교육과정의 내용조직 방법을 쓰시오. ( a ) : 특정 지역을 종합적으로 다루며, 지역이 내용조직을 위한 제목이 되어 내용조직에 용이 ( b ) : 지식의 구조를 중심으로 한 ( c ) 교육과정과 가장 잘 부합 ( d ) : 현대사회에서 전 지구적으로 발생하는 시사적 내용을 통해 흥미 유발 ( e ) : 세계화와 지역화가 동시에 진행되는 시점에서 다중스케일적 접근의 중요성으로 등장","bl":[["a","지역적 방법",""],["b","계통적 방법",""],["c","나선형",""],["d","쟁점 또는 문제중심 방법",""],["e","탄력적 환경확대법",""]],"ex":"","cat":"지리교육론","rel":["전통적 대륙 중심 방법","","","","탄력적 환경확대법"]},{"id":"2004-07","y":2004,"link":["2025B-10"],"text":"남극대륙은 일사량이 적은 고위도에 위치하고, 얼음과 눈으로 덮여 있어 ( a )이/가 대부분 반사 된다. 특히, ( b )이/가 활발히 일어나는 계절에는 하층 대기에서 지표층으로 갈수록 기온이 낮 아지는 ( c ) 현상이 나타난다. 남극대륙과 북극해 지역은 모두 고위도 지역에 속하지만 빙상의 ( d )에 의한 기온 하강의 영향으로 남극대륙의 최한월 평균 기온은 북극해 지역에 비해 낮다. 남극 대륙의 내륙 지역에서는 한랭건조한 공기 덩어리가 모여 ( 저 / 고 )기압 시스템을 형성한 후, 대륙 외곽으로 ( 편서 / 편동 )풍 형태로 불어나간다. 이때 찬 기류가 대륙 빙상 가장자리에 도달하면 사면을 따라 강한 ( e )이/가 나타난다. 남극 지역에서 ( 편서 / 편동 )풍이 저위도 방 향으로 불어나가 중위도의 항상풍과 만나면 ( f )이/가 형성된다. 남극 대륙 주변 해상에 형성된 ( f )을/를 따라 아극 저기압 시스템이 발달하는데, 이를 ( g )(이)라고 한다.","bl":[["a","태양복사에너지",""],["b","복사냉각",""],["c","기온역전",""],["d","해발고도","고, 편동"],["e","활강풍(사면하강풍)","편 동"],["f","한대전선대",""],["g","온대저기압",""]],"ex":"","cat":"기후학","rel":["","복사냉각","기온 역전","","","한대 전선대","온대 저기압"]},{"id":"2004-09","y":2004,"link":[],"text":"( a )은/는 특정 장소의 장소정체성을 찾아 매력적인 상품으로 만드는 것이다. ( b )을/를 적극적 으로 활용하면 지역 경제를 활성화하고, 새로운 장소정체성을 형성할 수 있다. ( b )은/는 인기 있는 장소를 의미한다. ( c )은/는 지역의 상품과 서비스 등을 브랜드로 인식시켜 긍정적인 지역 이미지를 만들고 지역 경제를 활성화하는 것이다. ( d )은/는 지역 특산물이 그 지역의 지리적 특성과 밀접한 관계가 있을 때 생산지를 상표에 사용하는 제도이다. 이처럼 지역성을 강화하는 과정에서 지역의 영향력과 가치가 높아지는 현상을 ( e )(이)라고 한다.","bl":[["a","장소마케팅",""],["b","핫플레이스",""],["c","지역 브랜드화",""],["d","지리적 표시제",""],["e","지역화",""]],"ex":"","cat":"경제지리","rel":["","","","",""]},{"id":"2004-13","y":2004,"link":[],"text":"다음 설명에 부합하는 촌락의 유형을 쓰시오. ( a ) : 하나의 도로를 중심으로 양쪽 농가들이 서로 인접하여 열을 지어 있는 형태 ( b ) : 중앙에 공동 소유의 녹지가 있고, 도로의 양쪽으로 가옥이 밀집하는 형태 ( c ) : 도로, 하천, 인공 수로의 한쪽으로 농가들이 일정한 간격으로 하나의 열을 지은 형태 ( d ) : 하천변을 따라 가옥들이 입지하며, 시간이 지나면서 2차 교통로인 육로가 개설되는 형태 ( e ) : 집촌과 달리 소수의 농가가 듬성듬성 무리를 지어 있는 형태 ( a )은/는 괴촌보다 농가의 형태가 ( 규칙적 / 불규칙적 )이고 가옥의 밀집도가 ( 높다 / 낮다 ).","bl":[["a","가촌",""],["b","녹지촌(광장촌)",""],["c","열촌",""],["d","랭 시스템",""],["e","소촌","규칙적, 낮다"]],"ex":"","cat":"문화·역사·정치지리","rel":["","","열촌","",""]},{"id":"2004-14","y":2004,"link":[],"text":"프리드먼은 세계도시를 ( a )으로 정의하였다. 그에 따르면 세계도시는 ( b )을/를 통해 기능의 입지가 분리되고 그 과정에서 중추 기능은 대도시로, 일상적이고 반복적인 기능은 주변 지역으 로 입지함에 따라 세계도시가 등장하였다. 세계의 주요 도시를 7가지 준거에 따라 점수화하였 으며, ( c )와/과 ( d )(으)로 구분하고, 이들을 각각 1차와 2차로 구분하였다. 이것은 월러스타인 의 ( e )을/를 선별적으로 도입한 것이다.","bl":[["a","국제 자본의 중심 기지점",""],["b","노동의 공간적 분업(신국제분업)",""],["c","중심부",""],["d","반주변부",""],["e","세",""]],"ex":"","cat":"경제지리","rel":["","","","반주변부",""]},{"id":"2004-15","y":2004,"link":[],"text":"맬서스에 따르면 인구 위기는 식량은 ( a )적으로 증가하는 반면에 인구는 ( b )적으로 증가하 기 때문에 발생한다. 즉, ( c )의 법칙 때문에 식량 증가 속도가 인구 증가 속도보다 느려서 인 구 위기가 발생한다는 것이다. 이를 자세히 살펴보면, ‘인구 증가 → 식량 수요 증가 → 식량 가격 상승 → ( d ) 감소 → 혼인율 감소, 사망률 증가 → 인구 감소’의 매커니즘으로 설명된 다. 더불어 과잉 인구의 대책으로 ( e ) 억제책과 ( f ) 억제책을 제시한다. ( e )은/는 전쟁, 질 병, 기근 등을 통해 사망률을 높이는 것이고, ( f )은/는 만혼, 금욕과 같은 개인의 의지에 따른 도덕적 억제를 통해 출생률을 낮추는 것이다. 한편, 마르크스는 자본주의 체제는 최저 임금을 유지하기 위한 ( g )을/를 조장하고 있다고 주장하며 맬서스를 비판한다.","bl":[["a","산술급수",""],["b","기하급수",""],["c","수확체감",""],["d","실질소득",""],["e","적극적",""],["f","예방적",""],["g","상대적 잉여 인구",""]],"ex":"","cat":"인구지리","rel":["","","","","","",""]},{"id":"2004-16","y":2004,"link":[],"text":"( e )은/는 특정 행정구역의 일부가 다른 행정구역에 의해 분리되어 고립된 상태인 지역이고, ( f )은/는 둘러싸는 국가로부터 자치를 추구하거나 정치적 독립을 지향한다. 엑스클레이브는 ( e / f )와/과 같은 의미이고, 엔클레이브는 ( e / f )와/과 같은 의미이다. 아래의 왼쪽 그림에서 C 는 B의 ( e / f )이고, A의 ( e / f )이다. 그러나 오른쪽 그림에서 C는 B의 ( e / f )이지만, A의 ( e / f )은/는 아니다.","bl":[["e","월경지",""],["f","위요지","e, f, e, f, e, f"]],"ex":"","cat":"문화·역사·정치지리","rel":["",""]},{"id":"2004-17","y":2004,"link":[],"text":"( a )은/는 서양의 기독교적 세계관으로 동양을 보는 관점이다. 이는 서양인이 만든 고정된 ( b )에 의해 동양을 정의하는 것이라고도 할 수 있다. 이에 따라 비유럽사회에 대한 ( c )이/가 발 생하여 ( d )의 지리가 사실의 지리로 변모한다. 사이드는 ( a )에 대해 동양을 ( c )하여 백인 중심주의 식민 지배를 정당화한다는 점에서 비판하였다. 또한 정작 그 자신도 유럽의 모든 지 역을 서양으로 단순화하는 ( e )이/가 나타났다는 비판도 있다.","bl":[["a","오리엔탈리즘",""],["b","텍스트(담론)",""],["c","타자화",""],["d","상상",""],["e","옥시덴탈리즘",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","","","",""]},{"id":"2004-18","y":2004,"link":[],"text":"( a ) : 태양과 달의 인력 차이인 ( b )에 의해 발생하는 규칙적인 해수의 승강 운동 ( c ) : 육지로 밀려들어 오는 밀물에 의해 해수면이 높아진 상태 ( d ) : 바다로 쓸려나가는 썰물에 의해 해수면이 낮아진 상태 ( e ) : ( c )와/과 ( d )의 차이 → ( f )은/는 ( e )이/가 큰 시기, ( g )은/는 작은 시기 ( h ) : ( c )와/과 ( d )이/가 매일 2회 발생하는 것 평균대조차 : ( f / g ) 시의 평균 ( c )와/과 평균 ( d ) 사이의 고도차","bl":[["a","조석",""],["b","기조력",""],["c","고조(만조)",""],["d","저조(간조)",""],["e","조차",""],["f","대조(사리)",""],["g","소조(조금)",""],["h","반일주조",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","","","","","","",""]},{"id":"2004-21","y":2004,"link":["2020B-08, 2018A-05, 2016B-03"],"text":"( a )은/는 객체들의 공간관계를 정의하는 것으로 ( b )와/과 ( c ), ( d )을/를 포함한다. ( b ) ( c ) ( d ) ( e )은/는 많은 기준을 동시에 만족시키는 장소를 찾기 위해 다양한 자료원을 통합하는 분석 방법으로, ( 벡터 / 래스터 ) 데이터 자료를 사용할 시에는 반드시 ( a )을/를 구축해야 한다. 한 편, 지형분석은 ( f )을/를 이용하여 지형의 형태, 경사도, 주향, 기복 등을 분석하는 것이다. 도 로망 자료 활용 분야에서 이용되는 네트워크 분석 기능 2가지에는 ( g )와/과 ( h )(이)가 있다. *g와 h는 대표적인 사례고 순서 무관 (답 쓰기가 좀 애매해서 죄송합니당..)","bl":[["a","위상구조(위상관계)",""],["b","인접성",""],["c","연결성",""],["d","포함성",""],["e","중첩","벡터"],["f","수치표고자료(표고값)",""],["g","최단경로 분석",""],["h","최소비용 경로 분석",""]],"ex":"","cat":"지형학","rel":["","","","","","","",""]},{"id":"2003-03","y":2003,"link":[],"text":"지리 교수·학습 방법 중 ( a )은/는 학습자가 스스로 노력하여 핵심적인 원리를 파악하는 것이 다. 이 중 ( b )은/는 학생들이 스스로 많은 작업을 하고, ( c )은/는 교사가 비계를 제공한다. 마 시알라스는 이를 수정하여 ( d )을/를 제시하였다. ( d )에서 가장 중요한 것은 ( e )이며, 슬레 이터는 ( d )의 과정을 단순화하여 ( e ) → 자료의 처리와 해석 → 일반화로 진행되는 과정을 제시하였다.","bl":[["a","발견학습",""],["b","순수한 발견학습",""],["c","안내된 발견학습",""],["d","탐구학습",""],["e","질문",""]],"ex":"","cat":"지리교육론","rel":["","","","",""]},{"id":"2003-04","y":2003,"link":[],"text":"아이즈너의 ( a )은/는 학생이 무엇을 배우게 되는지 정확하게 처방할 수는 없으나 학생들이 문 제를 갖고 진면하게 되는 ‘교육적 만남’을 기술하는 것이다. 또한 ( b )은/는 교사가 교육적 현상을 관찰·해석하고 가치를 판단하는 일련의 행위에서 요구되는 능력을 말한다. ( c )은/는 단순히 교실 상황을 기술하는 것을 넘어서 의미를 해석하고 가치를 판단하는 행위이다. 한편, 슬레이터는 아이즈너의 교육적 이데올로기에 기반하여 지리교육의 패러다임을 제시하였다. 아 이즈너의 실용주의 전통을 ( d ) 패러다임, 자유주의적 인문주의 전통과 아동중심 전통을 ( e ) 패러다임, 재건주의 전통을 ( f ) 패러다임으로 각각 연계하였다.","bl":[["a","표현적 목표",""],["b","교육적 감식안",""],["c","교육비평",""],["d","과학적(실증주의)",""],["e","인간주의",""],["f","진보적/급진",""]],"ex":"","cat":"지리교육론","rel":["표현적 목표","","","","인간주의",""]},{"id":"2003-05","y":2003,"link":["2006-21"],"text":"1) 테라로사에 염산을 부었더니 부글부글 반응이 없는 이유는? 2) 테라로사의 색이 붉은 이유는? 3) 카르스트 지형이 잘 발달하는 지형 조건 : ( a )이/가 낮아서 통기대가 넓게 존재하는 지역 4) 용식 지형이 하안단구와 고위평탄면에 잘 발달하는 이유 2가지는?","bl":[["a","용식기준면",""]],"ex":"1) 석회암의 용식 작용으로 탄산칼슘이 제거되어 비가용성 불순물만 잔류하기 때문 3)","cat":"지형학","rel":[""]},{"id":"2003-06","y":2003,"link":[],"text":"우리나라 하천의 중·상류에는 ( a )이/가 널리 분포하는데, 이는 한반도가 삭박작용을 받아 낮 아졌다가 신생대 제3기 ( b )에 의해 융기하였다는 증거로 제시되기도 한다. ( a )은/는 ( c )와/ 과 ( d )(으)로 구분한다. ( c )은/는 자유곡류천을 계승한 것으로, 융기속도가 ( 빠른 / 느린 ) 경 우에 형성된다. ( d )은/는 융기속도가 ( 빨라 / 느려 )서 ( e )와/과 ( f )이/가 함께 진행됨에 따 라 곡류하도가 측방확대된다. 유로변동을 수반하므로 공격사면에는 산지, 활주사면에는 ( g )이/ 가 형성된다.","bl":[["a","감입곡류천"
