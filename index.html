"],["b","버퍼",""],["c","수치표고(고도)자료",""],["d","표고",""],["d","지형분석",""],["e","중첩",""]],"ex":"","cat":"지리교육론","rel":["","","","","",""]},{"id":"2002-01","y":2002,"link":[],"text":"( a )은/는 영역을 아우르면서 해당 영역의 학습을 통해 일반화할 수 있는 내용을 핵심적으로 진술한 것이다. 지리 관련 영역의 ( a )은/는 지리 현상을 인식하고 ( b )와/과 ( c )이/가 인간 생활에 미치는 영향과 상호 작용을 파악하며 ( d )을/를 위해 협력하고 실천하는 시민의 자질을 함양하도록 구성되었다. 한편, ( e )은/는 교과의 성격에 따라 기반 학문의 하위 영역이나 학습 내용을 구성하는 일차 조직자이다. ( f )은/는 교과에서 배워야 할 필수 학습 내용이다. ( g )은/ 는 영역별 ( f )을/를 학습한 결과 학생이 궁극적으로 할 수 있거나 할 수 있기를 기대하는 도 달점이다.","bl":[["a","핵심 아이디어",""],["b","자연환경",""],["c","인문환경",""],["d","지속가능한 세계",""],["e","영역",""],["f","내용요소",""],["g","성취기",""]],"ex":"","cat":"지리교육론","rel":["핵심 아이디어","","","","","내용 요소",""]},{"id":"2002-02","y":2002,"link":[],"text":"창의성은 가능한 많은 아이디어와 가능성을 찾아내는 ( a )적 사고를 특징으로 한다. 이를 기르 는 대표적인 방법인 ( b )은/는 제한시간 동안 최대한 많은 생각을 해보는 기법이다. 이 기법에 는 4가지 기본 원리가 있는데, 이는 ( c ) 금지, 자유분방, 양산, 결합 및 개선이다. 또한 ( d )은 /는 비유와 유추를 활용하여 ( a )적 사고를 촉진하는 기법이다. 한편, ( e )은/는 수렴적 사고 기법 중 하나로, 긍정적인 면과 부정적인 면, 주목할 만한 가치가 있지만 중립적인 측면을 생각 해보도록 하는 것이다.","bl":[["a","확산(발산)",""],["b","브레인스토밍",""],["c","비판",""],["d","시네틱스 교수법",""],["e","PMI",""]],"ex":"","cat":"지리교육론","rel":["","브레인 스토밍","","",""]},{"id":"2002-03","y":2002,"link":[],"text":"발친은 지리적 의사소통 능력 중 도해력을 ( a ) 의사소통, 구두표현력을 ( b ) 의사소통이라고 하였다. ( c )은/는 이미지 또는 시각자료를 단지 지리수업에 활용하는 수준을 넘어 이미지 또는 시각자료에 재현된 지리적 현사을 분석 및 해석하는 능력이다. 이를 기르기 위한 ( d )은/는 하 나의 이미지를 세부적으로 관찰하고 숙고할 수 있는 구조의 활동이다.","bl":[["a","그래픽",""],["b","구술적",""],["c","비주얼 리터러시",""],["d","비전프레임",""]],"ex":"","cat":"지리교육론","rel":["","","",""]},{"id":"2002-04","y":2002,"link":["2025A-07"],"text":"( a )은/는 영국을 구성하고 있지만, 민족은 ( b )이고 언어는 ( c )을/를 사용함에 따라 분리 독 립을 요구하고 있다. 또한 1990년대부터 유고슬라비아의 국가들이 독립하는 과정에서 ( d )교 신자가 많은 보스니아-헤르체고비나가 독립을 선언하면서 내전이 발생하기도 했다. 한편 ( e ) 지역에서는 1947년 영국으로부터 인도와 파키스탄이 분리 독립한 이후에 인도의 ( f )교도와 파 키스탄의 ( g )교도 간 갈등이 계속되고 있다. ( i )은/는 필리핀 술루 제도, 팔라완섬, 민다나오 섬 등에 분포하는 이슬람교도이며, 크리스트교 신자가 많은 필리핀에서 이들의 분리주의 운동 이 지속되고 있다.","bl":[["a","스코틀랜드",""],["b","켈트족",""],["c","게일어",""],["d","이슬람",""],["e","카슈미르",""],["f","힌두",""],["g","이슬람","i-모로족"]],"ex":"","cat":"지역지리","rel":["스코틀랜드","","","","","",""]},{"id":"2002-05","y":2002,"link":[],"text":"( a )은/는 신생대 제3기 ( b )(으)로 인해 한반도가 융기하면서 과거의 평탄면이 부분적으로 남 아 있는 지형이다. 이곳에는 ( b ) 농업이 발달하였고, 넓고 평탄한 지형과 서늘한 기후에 적합 한 목장이 들어섰다. 그러나 토지 개간으로 인해 ( c )이/가 심각하게 나타나고 있다. 또한 이곳 은 같은 위도의 저지대보다 연평균 기온이 ( 높고 / 낮고 ) ( d ) 강수로 인해 강수량이 대체로 많은 편이며, ( e ) 발전에 유리하다.","bl":[["a","고위평탄면",""],["b","고랭지",""],["c","토양 침식","낮고"],["d","지형성",""],["e","풍력",""]],"ex":"","cat":"지형학","rel":["고위 평탄면","","","",""]},{"id":"2002-06","y":2002,"link":[],"text":"( a )은/는 차별침식과 차별풍화로 인해 주변이 산지로 둘러싸인 평지이다. 주로 변성암이나 퇴 적암으로 이루어진 산지가 풍화와 침식에 약한 ( b ) 지대를 둘러싼 지역에서 형성된다. 특히 하천이 합류하는 지점에서 잘 나타난다. 또한 ( a )에서는 산지에서 흘러내린 ( c )(으)로 인해 ( d ) 현상이 발생함에 따라 복사무가 잘 형성된다.","bl":[["a","침식분지",""],["b","화강암",""],["c","냉기류",""],["d","기온역전",""]],"ex":"","cat":"기후학","rel":["침식 분지","","냉기류","기온 역전"]},{"id":"2002-10","y":2002,"link":[],"text":"우리나라는 남북으로 길기 때문에 ( a )에 따라 달라지는 태양복사에너지의 양과 낮 길이의 차 이로 인해 동서보다 남북 간 기온 차이가 ( 크다 / 작다 ). 비슷한 위도라면 ( b )(이)가 높은 곳 이 평균 기온이 낮다. 또한 태백산맥의 지형의 ( c ) 효과로 인해 영동 지역과 영서 지역의 기 후 차이가 크다. 겨울에 한랭한 ( d ) 계절풍이 탁월할 때는 영서 지역이 영동 지역보다 기온이 더 ( 높다 / 낮다 ). 특히 ( e ) 기류가 동해를 지나 태백산맥에 의해 강제 상승하면 영동 지역 에 많은 눈이 내리기도 한다. 내륙과 해안 지역의 기후 차이, 난류와 한류에 따른 해류 주변 지 역의 기후 차이도 나타난다. ( f )은/는 대륙과 해양의 비열 차이로 발생하는데, 겨울에는 한랭 건조한 바람이 불어오고 여름철에는 북태평양의 영향으로 고온다습한 바람이 불어온다.","bl":[["a","위도","크다"],["b","해발고도",""],["c","장벽",""],["d","북서","낮다"],["e","북동",""],["f","계절풍",""]],"ex":"","cat":"기후학","rel":["","","","","",""]},{"id":"2002-12","y":2002,"link":[],"text":"기존의 ( a )은/는 경관의 가시적이고 물질적인 측면만 연구하고 경관 속애 내재된 상징적, 문화 적 의미를 파악하지 못했다는 점을 비판하면서 ( b )이/가 등장하였다. ( b )은/는 지리적 사물을 직관과 통찰을 통해 그대로 보는 것에 그치지 않고 ‘나타나 있는 사물’자체 내에 담겨있는 의미와 본질을 밝혀내는 접근 방법이다. 대표적인 연구 방법으로 ( c )(으)로서의 경관과 ( d ) (으)로서의 경관이 있다. ( c )(으)로서의 경관은 제작자의 관점에서 보는 것이고, ( d )(으)로서의 경관은 ( e )을/를 바탕으로 다의성을 인정하는 해석자의 관점이다. ( e )은/는 사회나 시대적 맥 락에 따라 사회 현상을 해석하는 다양한 방식들을 의미한다.","bl":[["a","구문화지리학",""],["b","신문화지리학","보는 방식"],["d","텍스트",""],["e","담론",""]],"ex":"","cat":"문화·역사·정치지리","rel":["","신문화지리학","",""]},{"id":"2002-13","y":2002,"link":[],"text":"( a )은/는 고용형태, 노동시간, 아웃소싱 등 노동 투입량을 유연하게 조절하는 것이다. 이중 ( b )은/는 고용주가 노동자를 고용 및 해고하는 능력이고, ( c )은/는 노동자의 임금과 비임금 보수 를 낮추는 능력이다. ( d )은/는 노동자의 업무 배치를 유연하게 변화시키는 것이고, ( e )은/는 피고용인의 근무시간을 통제할 수 있는 능력이다. 유연적 노동시장에서 핵심 노동력은 ( b / c / d / e )을/를 추구하지만, 주변 노동력은 ( b / c / d → 2개 고르기)을/를 추구한다.","bl":[["a","노동시장의 유연화",""],["b","수적 유연성",""],["c","금전적 유연성",""],["d","기능적 유연성",""],["e","시간적 유연성",""]],"ex":"","cat":"경제지리","rel":["","","","기능적 유연성",""]},{"id":"2006-16","y":2006,"link":[],"text":"( a )은/는 장기간 가뭄 또는 과도한 방목 및 개간 등에 의해 발생한다. ( b )에서는 과도한 목 화 관개 농업과 수자원 남용으로 ( a )이/가 심각한 상황이며, ( c )에서도 관개로 인한 인위적 요인과 ( d ) 지대에 위치한 자연적 요인으로 인해 ( a )이/가 심각한 상황이다. ( d ) 지대는 사 하라 사막 남쪽의 건조 및 반건조 지역이다. 식생 제거로 인해 지표의 ( e )이/가 높아짐에 따 라 아열대 고압대가 확장하게 되어 ( a )이/가 더욱 심각해지고 있다. 한편, ( f ) 작용은 염류가 토양에 집적되는 현상이다. 농경지에 관개 용수를 공급함에 따라 지하수위가 ( 상승 / 하강 )하 면 증발이 활발해져 염류가 집적되는 것이다. ( g ) 협약에서는 국제적 노력을 통해 ( a )을/를 방지하고, ( a )을/를 겪고 있는 개발도상국에 대한 재정적·기술적 지원을 말하고 있다.","bl":[["a","사막화",""],["b","아랄해",""],["c","차드호",""],["d","사헬",""],["e","알베도",""],["f","염류화","상승"],["g","사막화 방지",""]],"ex":"","cat":"기후학","rel":["","","","","알베도","염류화",""]}],"w16":[{"w":1,"q":"동결-융해에 의한 물리적 풍화 작용과 주빙하성 사면운반 작용에 의해 기반암의 국지적인 요철들이 모두 사라져 주빙하 지역의 지형 기복이 단순해지고 평탄화되는 현상을 (㉠ )이라고 한다.","a":"㉠크라이오플래네이션 (이미지 지형학 p.420, 온리원 p.35,46)","cat":"지형학"},{"w":1,"q":"해안에서 해수의 영향과 관련하여 나타나는 풍화 작용을 (㉡ )라고 부르기도 한다. ㉡은 해수의 영향을 받는 해안의 기반암이 염류와 수분에 의한 물리적 풍화작용과 광물이 용해되는 화학적 풍화작용을 받아 해수면과 접하는 부분을 따라 암석의 파괴와 분해가 발생하여, 암석에 와지나 평지가 형성되는 과정이다.","a":"㉡수면층 풍화(water layer weathering) (이미지 지형학 p.57)","cat":"지형학"},{"w":1,"q":"지리산과 금강산의 토양층 두께를 비교하고, 그러한 차이가 나타나는 이유를 기반암 특성과 가수분해의 관계 측면에서 서술하시오.","a":"[화학적 풍화 - 토산과 석산] 지리산(토산)의 기반암은 주로 편마암으로 이루어져 가수분해가 활발하게 진행되어 토양층이 두껍고, 금강산(석산)의 기반암은 주로 화강암으로 이루어져 가수분해에 대한 저항력이 큰 석영의 비중이 높아 입상붕괴가 활발하여 토양층의 두께가 불규칙하고 암석 노출이 많다(또는 토양층이 얇다). (온리원 p.31)","cat":"지형학"},{"w":1,"q":"최종 빙기에 하천 상류부에서는 (A: 침식/퇴적) 작용이, 하천 하류부에서는 (B: 침식/퇴적) 작용이 활발하다. 그 이유를 간단히 설명하시오.","a":"A: 퇴적, B: 침식 최종 빙기에는 식생이 빈약하였으며, 암석의 물리적 풍화가 활발하였다. 하천 상류부는 물리적 풍화로 인한 풍화 산물의 공급은 많아졌지만 강수량이 적어 퇴적물을 운반할 수 있는 유량이 충분하지 않아 하곡에서 퇴적 작용이 우세하게 나타났다. 반면에, 하천 하류부는 해수면이 하강하면서 하천의 침식력이 강해져 깊은 골짜기가 형성되었다. (2024 수능특강 한국지리 p.24)","cat":"지형학"},{"w":1,"q":"환원작용에 의한 토양의 변화를 의미하는 용어를 쓰고, 이러한 변화가 활발하게 이루어지는 지형적 조건을 서술하시오.","a":"글레이화, 습지와 같이 산소가 거의 없는 혐기성의 수중에서 잘 발달한다. (이미지 지형학 p.59, 온리원 p.30) (‘혐기성=산소가 없는’이라고 이해하면 되는 듯)","cat":"지형학"},{"w":1,"q":"(1) 풍화층에서 주로 화학적 풍화를 받아 광물이 변질되어 연약해진 부분을 (㉢ )라고 한다. ㉢은 썩은 바위, 석비레, 마사(massa)라고도 불리며, 우리나라의 고도와 경사가 낮은 산지나 구릉지에서 쉽게 발견할 수 있다. ㉢층에서도 풍화 작용이 덜한 하부에 위치하여 풍화를 받지 않은 신선한 암석이 절반 이상을 차지하는 부분은 (㉣ )으로 불린다. (2) 심층풍화가 잘 발달하는 조건을 절리의 특성 측면에서 설명하고, 우리나라의 ㉢층이 형성된 시기를 서술하시오.","a":"(1) ㉢새프롤라이트, ㉣새프록 (이미지 지형학 p.64~65) (2) 심층풍화는 기반암에 수직 절리의 밀도와 연속성이 높을수록 수분과 공기의 침투가 용이하여 활발하다. 우리나라의 심층풍화층(새프롤라이트층)은 최후간빙기에 형성된 것이다. (온리원 p.34 참고)","cat":"지형학"},{"w":1,"q":"사바나형 토르와 주빙하형 토르를 풍화의 위치(?)와 암괴의 원마도 측면에서 비교하시오. 1. 암석과 지형 형성 작용","a":"사바나형 토르는 화학적 풍화 작용이 우세한 온난한 지역에서 심층풍화나 지중풍화를 거쳐 형성되어 원마도가 높고, 주빙하형 토르는 한랭한 지역에서 지표에 노출된 기반암이 얼음의 쐐기작용과 같은 동결에 의한 물리적 풍화작용을 받아 지표 또는 지상풍화에 의해 형성되어 암괴가 각진 형태로 나타난다(원마도가 낮다). (이미지 지형학 p.81~83, 온리원 p.35)","cat":"지형학"},{"w":2,"q":"하천의 상류에서 하류로 갈수록 유속이 증가하는 이유를 수리반경의 측면에서 설명하시오. (단, 수리반경을 구성하는 두 변수의 증가율을 언급할 것)","a":"하천의 상류에서 하류로 갈수록 접수길이의 증가율보다 단면적의 증가율이 더 크기 때문에 수리반경이 커지므로 유속이 빨라진다. (온리원 p.52, 관련 기출 [2012년 13번])","cat":"지형학"},{"w":2,"q":"하계밀도가 높은 하천의 특징을 유역분지의 기반암 강도와 암석의 투수율 측면에서 서술하시오.","a":"하계밀도는 유역분지의 기반암이 풍화 및 침식에 대한 저항력이 작은 연암 지역일수록, 암석의 투수율이 낮을수록 높다. (이미지 지형학 p.184, 관련 기출 [2010년 21번])","cat":"지형학"},{"w":2,"q":"증수하천과 감수하천을 하상과 지하수면의 고도 측면에서 비교하시오.","a":"증수하천은 지하수면이 하상보다 고도가 높아 기저유출에 의해 유량이 유지되지만, 감수하천은 지하수면이 하상보다 고도가 낮아 하천수가 지하수면 아래로 침투되어 일정한 유량을 유지하기 어렵다. (이미지 지형학 p.191, 온리원 p.51~52 습윤지역과 건조지역의 지하수면)","cat":"지형학"},{"w":2,"q":"정규미앤더와 변형미앤더의 차이를 범람원의 구성물질과 곡류대 측면에서 서술하시오.","a":"정규미앤더는 범람원의 구성물질이 동질적이고 곡류대가 규칙적인 반면 변형미앤더는 범람원의 구성물질이 동질적이지 않아 곡류대가 불규칙하게 나타난다. (온리원 p.68, 인터넷 자료 참고하였음 ㅠㅠ)","cat":"지형학"},{"w":2,"q":"(A )설의 기초 개념은 길버트에 의해 처음 제시되었다. 그는 “모든 하천은 평형 상태를 향해 작동하며 흐르는 물의 순 효과가 하상의 침식 또는 운반 물질의 퇴적을 일으키지 않아, 경관이 힘과 저항력 사이의 균형을 반영할 때 (A )의 상태를 이룬다”고 하였다.","a":"A: 동적 평형 (온리원 p.57, 이미지 지형학 p.555) 2023년 사면 발달 이론이 출제된 만큼, ‘동적평형설’ 정도는 기입형으로 나올 수 있지 않을까 싶음. “현대 지형학에서 지형의 형성과 변화를 설명하는 핵심적인 이론은 동적 평형설이다.”라는 서술이 있으므로 침식윤회설에 대한 비판과 함께 출제되거나, ‘평형하천’과 연계해서 출제 가능성 있어 보임. 이미지로 이해하는 지형학 553쪽부터 평형에 대한 설명이 상세하므로 참고하면 좋을 듯!","cat":"지형학"},{"w":2,"q":"하천 쟁탈과 곡류 절단의 과정을 하천의 침식 방향의 측면에서 비교하시오.","a":"하천 쟁탈은 하천의 두부침식에 의해 발생하고, 곡류 절단은 하천의 측방침식에 의해 발생한다. (온리원 p.59, 71)","cat":"지형학"},{"w":2,"q":"직류 하도와 망류 하도를 하천 퇴적물의 입경 크기 측면에서 비교하시오.","a":"직류 하도는 대체로 하천 퇴적물에서 부유하중의 비율이 높고, 망류 하도는 대체로 하상하중의 비율이 높다. 따라서 망류 하천이 발달하는 지역은 조립물질의 퇴적이 활발하다. (온리원 p.75)","cat":"지형학"},{"w":2,"q":"해수면 상승 속도가 퇴적 속도보다 빠르면 (B )이 발생하여 익곡이 생기고 해성층이 형성된다. 반면에, 해수면 상승 속도보다 퇴적 속도가 빠르면 (C )가 발생하고 육성층이 형성된다.","a":"B: 해진, C: 해퇴 (온리원 p.94) 5. 건조 지형","cat":"지형학"},{"w":3,"q":"사구 유형의 모형에 근거하면, 대체로 한 방향에서만 바람이 불면, 모래 공급량이 적을 경우에 (㉠ )이/가 형성되고 그 외에는 (㉡ )이/가 발달한다. 그리고 풍향이 3개 이상의 여러 방향이면, 대체로 모래양이 적을 경우에는 (㉢ )이/가 형성되고 모래양이 많을 경우에는 (㉣ )이/가 발달한다.","a":"㉠바르한 ㉡횡사구 ㉢망사구 ㉣성사구 (이미지 지형학 p.445)","cat":"지형학"},{"w":3,"q":"고정 사구는 형성 원인과 지리적 조건에 따라 분류된다. (A )는 해안 평야와 같은 평지에서 바람이 불어오는 방향에 U자 혹은 V자의 형태로 열려 있는 모양의 사구이다. 취식 와지로부터 불려 올라간 모래가 바람을 따라 풍하에 해당하는 배후 지역으로 날려가 퇴적되어 형성되며, 사구의 능선부는 대체로 식생에 의해 고정된다.","a":"A: 포물선 사구 (이미지 지형학 p.445)","cat":"지형학"},{"w":3,"q":"뢰스와 사구의 부유 임계 풍속을 비교하고, 그러한 차이가 나타나는 이유를 설명하시오.","a":"뢰스가 사구보다 더 큰 부유 임계 풍속을 가진다. 점토와 실트 입자에 해당하는 뢰스 퇴적물은 입자간 응집력이 존재하여 입경이 작아질수록 오히려 부유 임계 풍속이 증가하기 때문이다. (이미지 지형학 p.434, 온리원 p.99)","cat":"지형학"},{"w":3,"q":"중앙아시아의 카스피 해와 아랄 해가 형성된 시기와 과정을 서술하시오.","a":"[다우호의 형성 과정] 중앙아시아의 카스피 해와 아랄 해는 다우호로, 최후빙기에 기온이 하강하여 제트류가 남하하고 이로 인해 중앙아시아 지역이 한대전선의 영향을 받아 강수량이 증발하여 형성되었다. (실제로 출제된다면 서술 조건에 맞게 ①빙기에 기후 한랭화로 증발량 감소, ②대륙빙하로부터 융빙수 유입 추가서술 가능) (온리원 p.97)","cat":"지형학"},{"w":3,"q":"대륙빙하의 영향을 받은 지역은 빙하에 의한 마식작용과 동결·융해와 같은 풍화작용으로 암분이 형성되며, 이 물질들은 (㉠ )에 의해 대륙빙하 밖으로 이동한다. 그리고 대륙빙하로부터 불어오는 (㉡ )에 의해 암분이 대륙빙하 주변에 퇴적되어 뢰스를 형성한다.","a":"㉠융빙수 ㉡사면하강풍(중력풍) (온리원 p.103)","cat":"지형학"},{"w":3,"q":"카르스트 지형이 발달하기 위해서는 절리에 침투한 물에 이산화탄소가 용해될 수 있는 공간인 지표와 지하수면 사이의 (B )이/가 넓게 존재하여야 한다.","a":"B: 통기대 (이미지 지형학 p.342) = 지하수면(용식기준면)이 낮을수록 용식작용 활발","cat":"지형학"},{"w":3,"q":"카르스트 지역을 흐르는 하천이 대체로 좁고 깊은 협곡을 형성하게 되는 이유를 설명하시오.","a":"카르스트 지역을 흐르는 하천에서는 하천의 곡벽에서 나타나는 사면운반작용보다 하천의 용식에 의한 하각이 우세하기 때문이다. (이미지 지형학 p.357) (일반적 사항 확인)","cat":"지형학"},{"w":3,"q":"테라로사는 토양의 신분류체계에서 (C )로 분류된다. 5. 건조 지형","a":"C: 울티졸 (온리원 p.113) 7. 빙하 지형","cat":"지형학"},{"w":4,"q":"(㉠ ) 과 (㉡ )이 같은 지점을 연결한 선을 설선이라고 한다. 따라서 빙하는 설선보다 기온이 낮은 지역, 즉 설선보다 고도가 높거나 위도가 높은 지역에서 발달한다. 지난 최종 빙기와 현재의 홀로세의 설선 고도를 비교하고, 동위도의 유럽에 비해 아시아에서 빙하의 발달이 미약했던 이유를 설명하시오.","a":"㉠강설량, ㉡융설량 지난 빙기에 비해 현재의 설선 고도가 더 높다. 동위도 유럽에 비해 아시아 지역에서 강수량(강설량)이 매우 적었기 때문이다. (이미지 지형학 p.368~369)","cat":"지형학"},{"w":4,"q":"일부 지역에서는 빙하가 사면을 거슬러 이동하는 경우도 발생한다. 이러한 현상이 나타나게 되는 이유를 빙하의 이동 방향과 관련하여 설명하시오.","a":"빙하는 대체로 빙하 표면의 경사를 따라 나타나기 때문에 빙하의 표면 고도가 높은 곳에서 낮은 곳을 향해 이동하게 된다. 따라서 빙하 표면과 기반암의 경사가 반대인 경우에 빙하는 지표 고도가 낮은 곳에서 높은 곳으로 사면을 거슬러 이동하는 경우도 발생한다. (이미지 지형학 p.375)","cat":"지형학"},{"w":4,"q":"양배암의 상류와 하류의 표면 거칠기와 경사 측면에서 비교하고, 그러한 차이가 나타나는 이유를 침식의 유형을 들어 설명하시오.","a":"양배암의 빙하 맞이사면인 상류는 빙하 마식에 의해 표면이 매끈하고 완경사의 형태를 띠며, 빙하 의지사면인 하류는 빙하 굴식에 의해 가파르고 불규칙하다. (온리원 p.127)","cat":"지형학"},{"w":4,"q":"모레인과 에스커를 원마도와 분급 상태의 측면에서 비교하시오.","a":"모레인은 빙하에 의해 운반 및 퇴적되어 원마도가 낮고 분급이 불량하며, 에스커는 융빙수에 의해 운반 및 퇴적되어 상대적으로 원마도가 높고 분급이 양호하다. (온리원 p.127, 129, 이미지 지형학 p.383)","cat":"지형학"},{"w":4,"q":"주빙하 기후 지역에서 넓은 호소와 큰 하천 밑에는 냉각이 효과적으로 이루어지지 않아 얼지 않은 비동토층인 (A )이/가 발달할 수 있다.","a":"A: 탈리크 (이미지 지형학 p.404)","cat":"지형학"},{"w":4,"q":"영구동토 연속대가 분포하는 지역은 대체로 (㉠ ) 지역과 거의 일치하는 경향이 있고, 영구동토 불연속대의 분포 범위는 (㉡ ) 지역과 대체로 일치한다.","a":"㉠툰드라, ㉡타이가 (이미지 지형학 p.404~405)","cat":"지형학"},{"w":4,"q":"동결 교란 작용(cryoturbation)의 과정을 설명하고, 동결 교란 작용의 결과로 나타나는 주빙하 지역의 토양층 구조를 서술하시오. 7. 빙하 지형","a":"겨울철 활동층에서 지표로부터 시작되는 동결 작용에 의해 지중의 토층이 이동하고 변형되는 과정을 동결 교란 작용이라 하고, 이로 인해 토양층은 인볼루션으로 불리는 복잡한 물결 모양의 층 구조를 갖게 된다. (이미지 지형학 p.403)","cat":"지형학"},{"w":5,"q":"우리나라 동해안이 서해안보다 비치리즈가 더 잘 발달하는 이유를 2가지 측면에서 설명하시오.","a":"동해안은 서해안에 비해 모래 공급량이 풍부하여 사구가 안정적이고, 조차가 작아 해수의 정선이 일정하기 때문이다. 반대로 서해안은 공급되는 모래의 양이 적고 조차가 커서 해수의 정선이 항상 이동하기 때문에 비치리즈의 발달이 미약하다. (온리원 p.163) (이 두 가지 요인을 ‘~~ 측면에서’라고 문제화할 때 뭐라 해야 깔끔할까..)","cat":"지형학"},{"w":5,"q":"우리나라 동해안과 서해안에 나타나는 2차 사구의 기원을 각각 서술하고, 이러한 2차 사구가 전사구와 배후사구 중 어느 것에 해당하는지 각각 비교하시오.","a":"동해안의 2차 사구는 비치리즈에서 기원한 유형으로, 범과 같은 모래 퇴적체가 성장하여 해안선이 바다 쪽을 향해 전진하면서 형성되어 2차 사구가 전사구에 해당한다. 반면 서해안의 2차 사구는 1차 사구에서 바람에 날린 모래가 퇴적되어 형성되어 배후사구에 해당한다. (온리원 p.159, 163) (사실 저도 잘 모르겠습니다 ㅜㅜ)","cat":"지형학"},{"w":5,"q":"아래 표의 빈 칸을 채우시오. 해안선 변화 해안 유형 우세한 작용 해수면 하강 ( ) 지반 융기 (육지 확대) 해안 퇴적 작용 해수면 상승 ( ) 지반 침강 (바다 확대) 해안 침식 작용","a":"해안선 변화 해안 유형 우세한 작용 이수 해안 해수면 하강 해퇴 융기 해안 지반 융기 (육지 확대) 전진 해안 해안 퇴적 작용 침수 해안 해수면 상승 해진 침강 해안 지반 침강 (바다 확대) 후퇴 해안 해안 침식 작용","cat":"지형학"},{"w":5,"q":"지난 최종 빙기에 빙하의 주변에 위치하였던 지역은 빙하 중심부에서 전파되는 지각의 요곡과 맨틀의 이동으로 지반 (㉠ )이/가 발생하지만, 빙하가 소멸된 현재에는 보상 또는 반발 (㉡ )이/가 발생한다. 따라서 빙하 주변 지역은 현재 보상 (㉡ )에 의한 급격한 해수면 (㉢ )을/를 경험할 가능성이 크다.","a":"㉠융기 ㉡침강 ㉢상승 (이미지 지형학 p.284)","cat":"지형학"},{"w":5,"q":"해수면 상승에 따라 나타나는 변화를 사구열의 규모, 석호의 면적, 산호초의 규모 측면에서 설명하시오.","a":"해수면 상승에 따라 파랑의 침식 작용이 우세해져 모래 해안이 후퇴하면서 사구열의 규모는 축소된다. 사주와 사취의 배후에 위치한 석호는 면적이 넓어지고 수심은 깊어진다. 산호초는 현재 상대적으로 완만한 해수면 상승을 경험하면서 오히려 성장이 촉진되고 있다. (그러나 해수면 상승률이 더 높게 유지된다면 침수됨) (이미지 지형학 333~334) 10. 화산 지형","cat":"지형학"},{"w":6,"q":"분석구와 마르를 형태의 측면에서 화산체의 깊이(높이) 대비 면적(너비)를 비교하고, 그러한 차이가 나타나는 이유를 설명하시오.","a":"분석구는 상대적으로 화산체의 깊이 대비 면적이 좁고, 마르는 화산체의 깊이 대비 면적이 넓다. 화산체는 폭발식 분화의 강도가 강할수록 화산체의 깊이가 낮고, 면적(기저 직경)이 넓기 때문이다. (온리원 p.180, 이미지 지형학 p.515)","cat":"지형학"},{"w":6,"q":"칼데라의 사면 물질이 공동을 메우면서 칼데라 바닥에 형성된 넓고 평평한 지표면을 (㉠ )(이)라 하며, 칼데라 내부에서 마그마가 다시 분출하여 형성된 소규모의 화산체를 (㉡ )(이)라고 한다.","a":"㉠화구원, ㉡중앙화구구 (온리원 p.182)","cat":"지형학"},{"w":6,"q":"화산쇄설류를 이동시키는 힘과 이동 속도를 설명하고, 화쇄류의 일종인 열운을 동반하는 화산 분화의 유형의 이름과 그러한 분화에서 분출되는 용암의 특징을 온도와 점성 측면에서 설명하시오.","a":"화산쇄설류는 화산쇄설물이 중력에 의해 빠른 속도로 흘러내리며 이동하는 현상이다. 열운을 동반하는 화산 분화의 유형은 펠레식 분화이며, 온도가 낮고 점성이 높은 유문암질 또는 안산암질 용암이 분출된다. (이미지 지형학 p.508, 510)","cat":"지형학"},{"w":6,"q":"해양판의 표면을 이루는 심해 퇴적물은 밀도가 (A: 커서/작아서) 해양판과 함께 섭입대를 통해서 맨틀로 가라앉지 못하기 때문에, 이러한 해양판 주변부의 심해 퇴적물이 섭입대 표면의 해저에 누적되는 지역이 나타나는데, 이를 (㉢ )(이)라고 한다. 이러한 ( ㉢) )은/는 어떤 판의 경계에서 잘 발달하는지 서술하시오.","a":"A: 작아서, ㉢부가대, 부가대는 해양판과 대륙판의 수렴 경계에서 잘 발달한다. (이미지 지형학 p.482)","cat":"지형학"},{"w":6,"q":"샌안드레아스 단층대는 판의 경계 중 어떤 유형이며, 그러한 경계가 잘 나타나는 단층 경계는 무엇인지 서술하시오. 5-1. 변환 단층과 주향이동단층의 차이를 단층의 발생 위치 측면에서 설명하시오. 10. 화산 지형","a":"샌안드레아스 단층대는 판의 보존형 경계에 해당한다. 보존형 경계는 해령의 변환단층에서 잘 나타난다. (온리원 p.219, 변환 단층은 해령을 중심으로 해양 지각이 좌우로 이동하기 때문에 해령이 부분적으로 끊어져서 생기는 단층이다. → ‘해령’도 같이 알아둬야 할 듯!) 5-1. 변환 단층은 판과 판의 경계에서, 주향이동단층은 지괴의 경계에서 발생한다는 차이가 있다. (온리원 p.219) 문화지리 1. 구문화지리학 3. 다양한 문화경관","cat":"지형학"},{"w":7,"q":"(㉠ )(이)란 이민 이전부터 민족 집단에 내재되어 있는 생존 능력이다. 한편, 이주자들이 과거의 관습에 집착한 나머지 적합하지 않은 정착지를 선택하는 현상을 (㉡ )(이)라고 한다.","a":"㉠사전 적응, ㉡문화적 부적응 (세계문화지리 p.53~55)","cat":"문화·역사·정치지리"},{"w":7,"q":"코스그로브는 (㉢ )이/가 세계를 구성하는 것이며, 세계를 보는 방식이라고 간략하게 정의한다. 즉, (㉢)은/는 외부의 물질세계를 주관적인 인간 경험을 통해 이해하는 방식이다. 그러한 점에서 (㉢)은/는 객관적인 이해를 강조하는 지역(area/region)과 같은 지리학의 다른 개념과 구분된다.","a":"㉢경관 (인문지리학개론 p.305)","cat":"문화·역사·정치지리"},{"w":7,"q":"투안은 (㉣ )은/는 안전에, (㉤ )은/는 자유에 각각 비유할 수 있다고 말했다. 즉, (㉣)은/는 의미와 가치가 부여된 (㉤)(이)라고 할 수 있다.","a":"㉣장소, ㉤공간 (인문지리학개론 p.308)","cat":"문화·역사·정치지리"},{"w":7,"q":"1990년대 이후 문화지리학은 안정성과 고유성, 차이 등을 강조하는 장소개념을 넘어 관계성과 일시성, 변화를 강조하는 새로운 포스트구조주의적 장소 개념을 제안하기 시작했다. 이와 관련하여 매시(Massey)가 강조한 개념이 무엇인지 서술하시오.","a":"매시는 장소를 상호관계의 망의 일부라고 하면서, 다중정체성으로서 ‘세계적 장소감(global sense of place)’을 강조한다. (문제: 인문지리학개론 p.310, 답안: 지리교육학(조철기) p.622) (지구적 장소감, 세계적 지역감 등으로도 표현) (기존 장소감 개념에 대한 비판 내지는 대안적 개념 정도로 이해하면 될 것 같아서 가져옴, 박대훈 문화지리 p.17 참고)","cat":"문화·역사·정치지리"},{"w":7,"q":"비재현지리학의 관점에서 기존의 신문화지리학을 비판하며 새롭게 강조한 개념이 무엇인지 서술하시오.","a":"비재현지리학은 경관을 재현보다는 ‘수행’ 또는 ‘실천’의 관점에서 이해한다. (박대훈T 교재 p,19) (더 어렵게는 못 낼 것 같고 이 정도만 알아두면 좋을 것 같음)","cat":"문화·역사·정치지리"},{"w":7,"q":"집촌과 산촌을 농가와 경지 간의 거리 측면에서 비교하시오.","a":"산촌이 집촌보다 농가에서 경지로 이동하는 데 소요되는 시간이 짧아 경제적 효율성이 높다. (세계문화지리 p.220)","cat":"문화·역사·정치지리"},{"w":7,"q":"고대 그리스의 도시는 신성한 장소인 (㉥ )과/와 세속적인 장소인 (㉦ )(이)라는 두 개의 기능 지대로 분화되어 있었다. 로마의 도시에서는 이 두 개의 기능이 합쳐진 장소를 무엇이라 하는가?","a":"㉥아크로폴리스, ㉦아고라, 로마의 포룸은 그리스의 아크로폴리스와 아고라의 기능이 합쳐진 장소이다. (온리원 p.501, 세계문화지리 p.260)","cat":"문화·역사·정치지리"},{"w":7,"q":"센카쿠 열도, 난사군도, 시사군도 분쟁의 공통된 당사국을 모두 쓰시오. 문화지리 1. 구문화지리학 3. 다양한 문화 경관","a":"중국, 타이완 인구지리, 지도학, GIS 1. 지도학","cat":"문화·역사·정치지리"},{"w":9,"q":"대체출산율의 의미를 서술하고, 개발도상국이 선진국보다 대체출산율이 높은 이유를 설명하시오.","a":"대체출산율은 한 국가가 인구가 감소하지 않고 유지되는 데 필요한 수준의 출산율이다. 개발도상국은 영아사망률이 높기 때문에 선진국에 비해 대체출산율이 높다. (온리원 p.459)","cat":"인구지리"},{"w":9,"q":"인구 규모와 식량 생산 간의 관계를 멜서스와 보저럽의 관점에서 각각 서술하시오.","a":"멜서스는 인구는 기하급수적으로 증가하고 식량은 산술급수적으로 증가하기 때문에 과잉인구가 발생하고 결과적으로 인구 규모가 감소한다고 본 반면, 보저럽은 인구가 증가하면 집약적인 토지 이용과 농업기술의 발달로 식량증산이 이뤄진다고 보았다. (온리원 p.458)","cat":"인구지리"},{"w":9,"q":"메르카토르 도법과 Alberts의 정적 원추 도법에서 고위도 또는 표준위선 외곽으로 갈수록 나타나는 경선 간격의 변화와 그에 따른 위선 간격의 조정 방법을 각각 서술하시오.","a":"메르카토르 도법은 고위도로 갈수록 경선의 간격이 확대됨에 따라 위선 간격을 확대시킨다. 정적 원추 도법은 표준 위선의 외곽부에서는 경선 간격이 확대됨에 따라 위선 간격을 축소한다.","cat":"인구지리"},{"w":9,"q":"UTM 좌표체계에서는 지구를 경도 (㉠ )도 간격의 세로 격자로 나누어 (㉡ ) 도법으로 그린 뒤, 위도 (㉢ )도 간격으로 총 60x20개의 격자로 나눈다.","a":"㉠6, ㉡횡축 메르카토르, ㉢8 (온리원 p.539) (횡축 메르카토르라서 가로 격자가 위도 8도 간격이고 세로 격자가 경도 6도 간격인 거에 유의해야 할 듯)","cat":"인구지리"},{"w":9,"q":"메르카토르 도법에 반영된 이데올로기를 간단히 설명하고, 이를 비판하기 위해 등장한 도법의 이름과 그러한 도법이 만족하는 공간적 특성을 서술하시오.","a":"메르카토르 도법은 중위도 지역의 면적을 과장하여 유럽 제국주의 열강의 우월성을 드러낸다. 이러한 특징을 비판하며 대안으로서 페터스 지도가 등장했는데, 이 지도는 정적성을 만족한다. (온리원 p.535)","cat":"인구지리"},{"w":9,"q":"오늘날 대부분의 첨단 원격탐사 위성들은 (㉣ ) 위성이라고 부른다. 이러한 (㉣) 위서 시스템은 동시에 여러 개의 전자기파 파장대를 이용하여 지표상의 대상체나 대상 지역의 지표면에 흡수, 반사, 발산하는 다양한 에너지를 수집한다. 문화지리 3. 지도학","a":"㉣다중분광(또는 다중밴드) (맥나이트 자연지리학 p.45) 지리교육론 1. 지리교육의 목적과 평가","cat":"인구지리"},{"w":10,"q":"(1) 브루너는 인간의 두 가지 사고 양식을 ‘패러다임적 사고’와 ‘내러티브적 사고’로 구분하였다. 이 두 가지 사고 양식은 지리교육의 어떤 패러다임과 조응하는지 각각 서술하시오. (2) 맥파틀랜드는 내러티브가 ( ㉠ )의 발달에 기여한다고 보았다. (㉠)이란 장소와 그곳에 거주하는 사람들의 이미지를 정확하게 구성하거나 재구성하는 능력이다.","a":"(1) 패러다임적 사고는 실증주의 지리학과, 내러티브적 사고는 인간주의 지리학과 조응한다. (2) ㉠지리적 상상력 (지리교육학 p.30/온리원 p.564))","cat":"지리교육론"},{"w":10,"q":"다음은 2022 개정 교육과정 중학교 <사회>의 내용이다. 교육과정 내용 구성에 반영된 내용구성방법 2가지를 설명하시오. 중학교 1~3학년 지리 영역 (1) 세계화 시대, 지리의 힘 (7) 대한민국, 우리가 살아가는 곳 (2) 아시아 (8) 우리나라의 자연환경과 인간생활 (3) 유럽 (9) 중부 지역 (4) 아프리카 (10) 남부 지역 (5) 아메리카 (11) 북부 지역 (6) 오세아니아와 극지방 (12) 지속가능한 세계와 글로컬 시민","a":"지역적 방법, 지평확대 역전 방법이 반영되었다. (중학교 사회가 기존 15개정의 계통적 방법에서 22개정의 지역적 방법으로 변화한 것이 중학교 사회의 큰 이슈라서 출제 가능성 있다고 봄! 지평확대 역전 방법(세계지리→한국지리)은 △)","cat":"지리교육론"},{"w":10,"q":"최근 세계화와 지역화가 동시에 일어나고 있는 시점에서, 지역을 ( ㉡ )(으)로 파악하던 관점에서 시스템, 나아가 네트워크로 바라보아야 한다는 주장이 설득력을 얻고 있다. 이러한 맥락에서 기존의 지평확대법은 비판을 받게 되었으며, 이에 따라 ( ㉢ )이/가 대안적인 내용구성방법으로 제시되었다. 즉, 세계화와 지역화가 동시에 진행되는 시점에서 ( ㉣ )적 접근의 중요성이 떠오르고 있기 때문이다.","a":"㉡모자이크, ㉢탄력적 환경확대법, ㉣다중스케일 (지리교육학 p.95-96)","cat":"지리교육론"},{"w":10,"q":"다음은 블룸의 교육목표분류학에 따른 인지적 영역과 지리적 사례이다. 빈 칸에 들어갈 용어를 쓰시오. 분류 지리적 사례 위선 66.5°N의 이름은 북극권이라고 명명하고, 12월에 인도의 마드라스 지방으로 (A: ) 불어오는 바름은 북동계절풍임을 알고 있다. (B: ) 버려진 채석장에 위락공원의 개발을 위한 계획을 세우는 것이다.","a":"A: 지식, B:종합 (지리교육학 p.55) (안 내고 싶었는데 박대훈이 자꾸 강조하길래 개론서에 있는 지리적 사례 가져와봤습니다..)","cat":"지리교육론"},{"w":10,"q":"전지구적 환경 문제의 확산이라는 현시대적 상황은 공간적 영역이 제한된 전통적인 시민성에서 탈피하여 Ⓐ새로운 유형의 시민성에 대한 논의를 요구하고 있다. Ⓐ는 무엇인지 서술하시오. 지리교육론 1. 지리교육의 목적과 평가","a":"Ⓐ생태 시민성 (지리교육학 p.51) 지리교육론 3. 지리교육의 교수-학습 방법","cat":"지리교육론"},{"w":11,"q":"다음은 개념학습의 수업 모형인 속성모형과 원형 모형의 절차이다. 빈 칸에 들어갈 용어를 쓰시오. - 속성모형: 문제 제기→(㉠ )→개념의 결정적 속성 검토→개념의 (㉡ ) 제시→개념의 이해도 검증 - 원형모형: 문제 제기→(㉢ )→개념의 (㉣ ) 제시→개념의 속성 검토→개념의 이해도 검증","a":"㉠개념의 정의, ㉡실례와 비실례, ㉢개념의 원형(대표적 사례) 제시, ㉣비실례 (온리원 p.612)","cat":"지리교육론"},{"w":11,"q":"브루너는 교실에서 하는 학습은 구체적인 사례를 사용해서 일반적 원리를 도출해 내는 (㉤ )을/를 통해 이루어져야 한다고 주장하였다. 이러한 (㉤)을 통해 학생들이 함양할 수 있는 사고 방식은 무엇인지 서술하시오.","a":"㉤귀납적 추리(귀납적 일반화) (온리원 p.610) 발견학습의 귀납적 일반화 과정을 통해 학생들은 직관적 사고를 키울 수 있다. (박대훈 p.141)","cat":"지리교육론"},{"w":11,"q":"논쟁문제 수업모형에 있어서 바람직한 교사의 역할이 무엇인지 켈리(Kelley)의 구분과 하우드(Havood)의 구분에서 사용된 용어로 각각 서술하시오.","a":"논쟁문제에서 바람직한 교사의 역할을 켈리는 다양한 시각의 논쟁문제를 학습하되 교사가 바람직하다고 생각하는 방향에서 지도하는 ‘신념을 가진 공정성’이라고 하였고, 하우드는 다양한 관점에 대해 토론하되 교사의 의견을 말하지 않는 ‘공정한 의장형’이라고 하였다. (지리교육학 p.457, 온리원 p.623)","cat":"지리교육론"},{"w":11,"q":"(가), (나)는 지리적 질문의 예시이다. (가)와 비교하여 (나)의 상대적인 특징을 학생에 대한 인지적 요구의 정도, 질문의 개방성 정도 측면에서 서술하시오. (가) ‘이들 3개의 사이트 중 어느 곳이 슈퍼마켓을 위해 사용되어야 하는가?’ (나) ‘이러한 평균기온 수치가 어떤 면에서 완전한 설명을 제공하지 못하는가?’","a":"(나)는 (가)에 비해 학생에 대한 인지적 요구의 정도가 낮고, 질문의 개방성 정도가 높다. (지리교육학 p.388) (로버츠의 ‘질문하기의 두 차원’인데, (가)는 폐쇄적 질문 중 ‘평가’ 차원이고, (나)는 개방적 질문의 ‘자료의 이해’ 차원임. 이런 식으로 예시 질문 제시하고 각각 어느 차원인지, 질문의 성격은 어떠한지 묻는 문제가 나올 수 있을 것 같음! 박대훈이 강조.)","cat":"지리교육론"},{"w":11,"q":"브루너의 내러티브 사고와 조응하는 지리교육의 패러다임이 무엇인지 쓰고, 내러티브 텍스트가 갖는 교육적 가치와 관련된 지리교육의 내재적 목적을 서술하시오.","a":"내러티브 사고는 인간주의 지리교육과 조응한다. 내러티브 텍스트를 통해 지리교육의 내재적 목적인 지리적 상상력을 기를 수 있다. (온리원 p.645~646)","cat":"지리교육론"},{"w":11,"q":"(A )은/는 학생의 행동이나 대답이 사실은 평범한 단서나 의미로 야기된 것임에도 불구하고, 교사가 어떤 지식이 형성되었음을 보여 주었다고 인정해버리는 상황을 의미한다. (B )은/는 탈개인화된 형식적 지식을 체계적으로 해설하게 하며, 이를 반복적으로 연습하게 하는 상황을 의미한다. 지리교육론 3. 지리교육의 교수-학습 방법","a":"A: 조르단 효과, B: 형식적 고착 (온리원 p.638) 도시지리 1. 도시화와 도시체계 3. 기타 도시 구조 이론","cat":"지리교육론"},{"w":12,"q":"선진국과 비교되는 개발도상국의 도시화 및 도시구조의 특징을 각각 1가지 서술하시오.","a":"개발도상국은 국가의 경제발전이나 기술혁신 등을 수반하지 못한 채(산업화를 수반하지 못한 채) 도시화가 이뤄지는 가도시화의 특징이 나타나며, 교외에 상류층 주거지가 형성되는 선진국과 달리 도심부에 상류층 주거지가 형성되고 도시 내부에 슬럼이 산재한다는 도시구조적 특징이 나타난다. (온리원 p.393, 424)","cat":"도시지리"},{"w":12,"q":"프리드먼(Friedmann)은 세계도시체계가 형성된 원인이 무엇이라고 하였는지 서술하고, 프리드먼이 월러스타인의 세계체제론을 선별적으로 도입하여 분류한 세계도시의 유형을 쓰시오.","a":"프리드먼은 구상 기능과 실행 기능이 선진국과 개발도상국으로 분리되어 입지하는 신국제분업이 발생하면서 세계도시가 형성되었다고 보았으며, 세계도시를 중심부(핵심부)와 반주변부로 분류하였다. (온리원 396-397)","cat":"도시지리"},{"w":12,"q":"테일러(Taylor)의 이론은 프리드먼의 세계도시계층에 관한 사고와 세계 경제에 대한 (㉠ )의 중요성에 대한 사센(Sassen)의 통찰력에 바탕을 두고 있으나, 그들의 연구에는 한계가 있다고 지적하였다. 이에 따라 테일러가 사센의 연구를 계승하되 세계도시를 연구하는 데 있어 주목한 것은 무엇인지 서술하시오.","a":"㉠생산자 서비스, 테일러는 생산자 서비스 부문에 속한 기업이 공간상에서 다른 곳에 위치한 지사와 맺고 있는 연계의 강도에 집중하였다. / 세계도시 간 네트워크의 정도를 파악하였다. (온리원 p.398, 박대훈 p.110)","cat":"도시지리"},{"w":12,"q":"버제스의 이론은 임대료가 가장 비싼 토지는 최고의 이익을 얻을 수 있는 경제활동이 점유한다는 (㉡ )의 개념을 포함한다.","a":"㉡입찰지대(bid rent) (도시지리학개론 p.146)","cat":"도시지리"},{"w":12,"q":"버제스와 화이트(White)는 각각 도시 내 점이지대가 어떻게 변화할 것이라 예상하였는지 서술하시오. (단, 화이트의 이론에서 점이지대를 지칭하는 용어를 포함할 것.)","a":"버제스는 점이지대로 투자를 확대하여 CBD가 외연적으로 확장될 것이라고 예상한 반면, 화이트는 점이지대를 정체지대로 설명하며 정체지대가 외연적으로 확장되기 보다는 수직적으로 확대되고 고층화될 것이라고 주장하였다. (온리원 p.428)","cat":"도시지리"},{"w":12,"q":"가족생애주기 모델에서 출산 전 단계, 자녀양육 단계에서 선호하는 주택의 위치와 그 이유를 각각 서술하시오.","a":"출산 전 단계에는 직장과의 접근성이 중요하기 때문에 도심 근처를 선호한다. 자녀 양육 단계에서는 넓은 공간에 대한 요구가 늘어나기 때문에 도시 외곽 또는 교외를 선호한다. (온리원 p.445)","cat":"도시지리"},{"w":12,"q":"메가시티의 지역 내 연계 강도와 글로벌 스케일의 연계 강도를 비교하시오.","a":"메가시티는 지역 내 연계에 비해 글로벌 스케일의 연계가 강하게 나타난다. (내부적으로는 기능적인 필요성이 없는 지역과는 연결되지 않는다.) (온리원 p.451)","cat":"도시지리"},{"w":12,"q":"(㉢ )은/는 포스트식민 이론의 핵심 개념 중 하나로서, 모든 문화는 혼합물이라는 관점에 입각하여 어떤 문화가 다른 문화보다 우월하다는 주장을 반박한다. 포스트식민 연구는 (㉣ )(이)라는 개념을 문제시함으로써 근원적이고 순수한 문화가 있다는 생각을 거부한다. 도시지리 1. 도시화와 도시체계 3. 기타 도시 구조 이론","a":"㉢혼성성, ㉣진정성 (도시사회지리학 p.51) 경제지리","cat":"도시지리"},{"w":13,"q":"동일 업종이 집적되어 발생하는 국지화경제의 이점을 두 가지 이상 서술하시오.","a":"원료를 대량으로 구입하거나 제품을 함께 운송할 수 있기 때문에 원료나 제품 운송비를 절감할 수 있다. 전문화하여 상권을 형성하기 때문에 소비자를 유인하여 판매량을 늘릴 수 있다. 필요한 관련 서비스를 저렴하게 공급받을 수 있다. (온리원 p.321)","cat":"경제지리"},{"w":13,"q":"행태주의적 관점을 도입한 스미스(Smith)의 (㉢ ) 이론에 따르면 공장은 어디에 입지하게 되는지 설명하고, 그러한 입지에서의 총비용과 총수입을 비교하시오.","a":"㉢준최적, 준최적 이론에 따르면 공장은 이윤의 공간적 한계 내에 입지하게 되고, 이윤의 공간적 한계 내에서는 총수입이 총비용보다 크다. (온리원 p.324, 325 그래프 활용)","cat":"경제지리"},{"w":13,"q":"행태주의 이론에 따른 경제행위에 대한 인간의 행태 유형을 모두 쓰시오.","a":"제한된 합리적 행태, 비경제적 목적을 추구하는 합리적 행태, 우연적 행태 (온리원 p.326)","cat":"경제지리"},{"w":13,"q":"뢰쉬의 중심지 이론에서 k값 체계가 비고정적인 이유를 설명하시오.","a":"뢰쉬가 비고정 모형을 제시한 이유는 중심지가 보유한 중심재화의 종류와 중심지 계층이 비례하지 않기 때문이다. (온리원 p.334) (크리스탈러는 계층한계재화 인정, 뢰쉬는 인정하지 않음 / 뢰쉬의 중심지 이론에서 저차 중심지가 보유한 기능이 고차 중심지에는 없을 수 있다는 것과 같은 맥락)","cat":"경제지리"},{"w":13,"q":"동일 계층 중심지라 하더라도 고소득층 주거지역의 중심지의 재화의 도달범위가 더 넓게 나타나는 이유를 서술하시오. 그리고 아이자드의 중심지 이론에서 최소요구치 범위의 차이를 가져오는 요인이 무엇인지 서술하시오.. 경제지리","a":"고소득층의 교통비 지불능력이 더 높기 때문이다. 아이자드의 이론에서는 인구밀도가 최소요구치 범위의 차이를 가져오며, 인구밀도가 높은 핵심지역일수록 도시경제 효과로 인해 최소요구치의 범위가 작게 나타난다. (온리원 p.330, 335) (크리스탈러의 중심지 이론에서는 인구가 균등하게 분포하며 등질적 평면이라고 가정한 것과 달리, 아이자드의 이론에서는 불균등한 인구 분포(인구밀도)를 가정하고 그에 따른 집적경제로 인해 도시경제 효과가 나타남) 경제지리 2. 경제의 세계화와 다국적기업의 등장","cat":"경제지리"},{"w":14,"q":"다음은 제레피(Gereffi)의 글로벌 가치 사슬의 거버넌스 유형을 나타낸 것이다. (1) A~D의 명칭을 쓰시오. (2) A와 B를 제품의 표준화 정도 측면에서 비교하고, B와 C를 공급기업의 역량 측면에서 비교하시오.","a":"(1) A: 시장형, B: 관계형, C: 전속형, D: 위계형 (기출 2019A13 참고) (2) 시장형은 관계형에 비해 제품의 표준화 정도가 낮고, 관계형은 전속형에 비해 공급기업의 역량이 강하다. (온리원 p.349)","cat":"경제지리"},{"w":14,"q":"조절양식이란 축적체제를 유지시키는 제도를 의미한다. 조절양식은 (㉠ ) 조절양식과 (㉡ ) 조절양식으로 구분된다. (㉠) 조절양식에서는 상품과 노동력 수급이 시장에 의해서 조절되며, (㉢ ) 축적체제와 조응된다. 반면에 (㉡) 조절양식에서는 상품과 노동력 수급이 정부에 의해서 조절되며, (㉣ ) 축적체제와 조응된다.","a":"㉠경쟁적, ㉡독점적, ㉢외연적, ㉣내포적 (온리원 p.355)","cat":"경제지리"},{"w":14,"q":"(㉤ )(이)란 다양한 연관조직(기업, 대학, 지방정부 등)과 이들 간 상호 네트워킹을 통해 구축되는 통제 구조의 형성정도를 말한다. (㉤)의 공식적 측면과 비공식적 측면에는 무엇이 해당하는지 각각 서술하시오.","a":"㉤제도적 집약(제도적 밀집), 공식적 제도에는 규칙, 법, 조직 등과 같은 것이 있고, 비공식적 제도에는 사회적 규범이나 가치, 집단의 문화와 같은 사회적 자본이 포함된다. (온리원 p.364)","cat":"경제지리"},{"w":14,"q":"사벨과 피오레(Sable&Piore)가 제시한 ‘제2의 산업분수령’이 나타내는 생산체계의 변화를 설명하고, 제3이탈리아에서 나타나는 산업지구 유형의 명칭과 역내·외 연줄망의 특성을 서술하시오.","a":"제2의 산업분수령은 대량생산에서 다품종 소량생산의 체계로 전환됨을 의미하고, 제3이탈리아에서는 마셜형 산업지구가 나타나며 국지적 연줄망은 강하고 역외 연계는 약하다. (온리원 p.367-369)","cat":"경제지리"},{"w":14,"q":"(1) 지역혁신체계의 구성요소 중 상부구조는 무엇을 의미하는지 설명하시오. (2) 지역혁신체계가 지역적으로 구현된 실체를 (㉥ )(이)라고 한다. (㉥)이/가 형성되는 경제발전단계의 경쟁우위의 원천을 서술하시오.","a":"(1) 상부구조는 조직과 제도의 문화, 분위기, 규범 등을 의미한다. (온리원 p.384) (2) ㉥클러스터 (기출), 혁신주도형 단계에서는 진보된 기술과 높은 숙련기술수준에 의한 생산성에 의해서 경쟁우위가 결정된다. (온리원 p.375)","cat":"경제지리"},{"w":14,"q":"허쉬만은 일시적으로 (㉦ )이/가 나타나 지역격차가 커지나, 궁극적으로 (㉧ )이/가 극화효과를 극복하여 지역격차가 완화된다고 보았다. 경제지리 2. 경제의 세계화와 다국적기업의 등장","a":"㉦역류효과, ㉧적하효과 (온리원 p.380) 기후학 1. 대기와 토양","cat":"경제지리"},{"w":15,"q":"(1) 성층권에서 기온역전층이 나타나는 이유를 서술하고, 중간권에서 대류현상의 여부와 기상현상이 나타나지 않는 이유를 설명하시오. (2) 열권에서는 태양에서 방출되는 플라스마 입자가 대기권 상층에서 자기장과 마찰하여 (㉠ )이/가 발생한다. 이러한 (㉠)이 유럽 쪽보다 캐나다에서 상대적으로 저위도에서 관찰되는 이유는 무엇인지 서술하시오.","a":"(1) 성층권에 분포하는 오존이 자외선(태양복사에너지)을 흡수하면서 가열되기 때문에 기온역전층이 나타난다. 중간권에서는 대류현상이 일어나지만 공기의 밀도가 적고 수증기가 희박하여 기상현상이 나타나지 않는다. (온리원 p.226) (2) ㉠극광(오로라), 자북(magnetic north)이 유럽보다 캐나다 쪽으로 치우쳐 있기 때문이다. (이승호 기후학 p.57) (아직 중간권, 열권 문제는 안 나와서, 출제 가능성은 낮지만 꼼꼼히 살펴보는 의미에서 가져옴)","cat":"기후학"},{"w":15,"q":"프레리나 스텝의 토양이 흑색을 띠는 이유와 라테라이트토가 적색을 띠는 이유를 각각 서술하시오. 그리고 라테라이트토의 집적층 발달 여부와 그 이유를 설명하시오.","a":"프레리나 스텝의 토양(체르노젬)이 흑색을 띠는 것은 부식이 많기 때문이고, 라테라이트토가 적색을 띠는 것은 산화철이 잔류하기 때문이다. 라테라이트토는 강수량이 풍부하기 때문에 지속적으로 용탈이 발생하여 집적층이 형성되지 않는다. (온리원 p.231, 233)","cat":"기후학"},{"w":15,"q":"(㉡ )은/는 영구동토층이 나타나는 한대기후의 토양을 의미한다. (㉢ )은/는 포드졸 토양에 해당된다.","a":"㉡겔리졸, ㉢스포도졸 (온리원 p.236) (필수로 외워야 할 토양: 겔리졸, 안디졸(화산), 스포도졸, 몰리졸(건조, 체르노젬), 울티졸(ex.테라로사), 옥시졸","cat":"기후학"},{"w":15,"q":"대륙 동안을 따라 극지방으로 흐르는 난류는 대륙 서안을 따라 적도 쪽으로 흐르는 한류보다 빠르다. 이러한 현상을 (㉣ ) 현상이라고 한다. (㉣) 현상은 (㉤ )의 차이 때문에 발생한다.","a":"㉣서안 강화, ㉤전향력 (온리원 p.242)","cat":"기후학"},{"w":15,"q":"(1) 열적 요인에 의해 발원하는 기단의 종류를 모두 쓰고, 각각에 해당하는 기단의 명칭을 1가지씩 쓰시오. (2) 이동성 고기압의 발달 과정을 설명하고, 규모와 이동 속도의 측면에서 정체성 고기압과 비교하시오,","a":"(1) 대륙성 한대기단(cP): 시베리아 기단, 해양성 한대기단(mP): 오호츠크해 기단 (온리원 p.248) (2) 이동성 고기압은 열적으로 발달한 고기압이 지표면에서부터 점차 가열되어 가장자리에서 분리되면서 발달한다. 이동성고기압은 정체성 고기압에 비해 규모가 작고 비교적 빠르게 이동한다. (이승호 기후학 p.117~118)","cat":"기후학"},{"w":15,"q":"열대성 저기압이 적도 부근에서 발생하지 않는 이유는 무엇인가?","a":"적도 부근에서는 전향력이 너무 작아서 파동이 형성되기 힘들기 때문이다. (온리원 p.253)","cat":"기후학"},{"w":15,"q":"저기압으로 발달하기 전 단계를 (㉥ )(이)라고 한다. 한랭전선과 온난전선의 (㉥) 강도 차이를 비교하고, 그러한 이유를 설명하시오.","a":"㉥기압골, 한랭전선에서 두 기단 사이의 온도 차이가 크기 때문에 한랭전선을 따라 발달하는 기압골이 온난전선에서 발달하는 기압골보다 더 강하다. (이승호 기후학 p.156)","cat":"기후학"},{"w":15,"q":"응결고도가 (A: 높을수록/낮을수록), 수증기 함량이 (B: 많을수록/적을수록) 푄의 강도가 강하다. 기후학 3. 대기와 토양","a":"A: 낮을수록, B: 많을수록 (온리원 p.245) 기후학 3. 기후요소","cat":"기후학"},{"w":16,"q":"아조레스 고기압의 세력 범위와 기압의 측면에서 1월과 7월을 비교하시오.","a":"아조레스 고기압은 북반구가 여름인 7월에 북대서양 전역으로 세력이 확대되고, 기압이 높아진다. 반면 1월에는 적도수렴대가 남하함에 따라 아조레스 고기압도 세력이 약화되고 기압이 낮아진다. (온리원 p.260)","cat":"기후학"},{"w":16,"q":"지균풍의 정의를 서술하고, 여름철과 겨울철의 지균풍의 풍속 차이와 그 이유를 설명하시오.","a":"지균풍은 기압경도력과 전향력이 균형을 이룰 때 등압선에 평행하게 부는 바람이다. 지균풍은 여름철보다 겨울철에 풍속이 더 빠른데, 겨울철에 저위도와 고위도 간의 기온 차이가 크기 때문이다. (온리원 p.264) +) 기온의 차이가 크다 = 기압경도력이 크다 (?)","cat":"기후학"},{"w":16,"q":"연평균 기온이 가장 높은 지점을 연결한 선을 (㉠ )(이)라고 한다. (㉠)은/는 대체로 북위 6.5°에 위치하는데, 그 이유를 설명하시오.","a":"㉠열적도, 육지의 면적이 넓은 북반구가 남반구보다 평균 기온이 높기 때문에 대체로 북위 6.5°에 위치한다. (온리원 p.271, 원리로 이해하는 기후학)","cat":"기후학"},{"w":16,"q":"(1) 공전 궤도의 이심률이 현재보다 커지면, 북반구의 연교차는 현재보다 (㉡: 커진다/작아진다). (2) 지구 자전축의 기울기가 더 커지면, 북반구의 연교차는 현재보다 (㉢: 커진다/작아진다).","a":"(1) ㉡작아진다 (이심률이 커지면 북반구 여름철에 태양으로부터 거리가 더 멀어지므로 여름 기온 감소) (2) ㉢커진다 (온리원 p.304)","cat":"기후학"},{"w":16,"q":"북극 진동은 (㉣ )과/와 (㉤ ) 간의 기압 차의 변화를 말한다.","a":"㉣중위도 고기압, ㉤극 저기압 (온리원 p.307) (이 때 극 저기압 = 극 소용돌이)","cat":"기후학"},{"w":16,"q":"건조단열감률에 비해 습윤단열감률이 작은 이유는 무엇인가?","a":"응결과정에서 대기 중으로 방출되는 잠열이 습윤단열 과정에서 기온감률을 상쇄시키기 때문이다. (온리원 p.273)","cat":"기후학"},{"w":16,"q":"아열대고기압대와 극지방의 비습과 상대습도를 비교하시오.","a":"아열대고기압대는 극지방의 대기보다 수분을 많이 포함하고 있어 비습은 아열대고기압대에서 더 높지만, 상대습도는 극지방에서 더 높게 나타난다. (아열대고기압대는 기온이 높아 포화수증기압이 높기 때문에 상대습도가 낮음) (온리원 p.274)","cat":"기후학"},{"w":16,"q":"지형과 해발고도도 기온 분포에 중요한 영향을 미치지만 세계 등온선도에서는 (㉥ )한 값을 사용하므로 그 영향이 반영되지 않는다. 기후학 3. 기후요소","a":"㉥해면경정 (온리원 p.271)","cat":"기후학"}]}</script>
<script type="application/json" id="s2d">{"lec":"<h1>서울교육정책 특강 (2027학년도 2차 심층면접 대비)<\/h1>\n<p>작성일: 2026-10-21 (KST). 각 항목에는 출처와 날짜를 달았습니다. ⚠는 원문으로 재확인하지 못한 내용입니다. 카드형 정리는 policy_cards.json에 있습니다.<\/p>\n<h2>0. 한 문장 암기<\/h2>\n<p><strong>\"모두를 위한 기본교육, 행복한 협력교육\"<\/strong>은 2기 비전입니다. 교육지표는 <strong>\"시작은 촘촘하게, 기본은 탄탄하게, 성장은 다양하게\"<\/strong>입니다.\n출처: 핀포인트뉴스 2026-09-07 (공약추진위 백서), 느린인뉴스 2026-07-22 (비전 선포)<\/p>\n<ul>\n<li>취임사(2026-07-01, 연합뉴스): \"기본은 깊게, 협력은 넓게, 행복은 가까이\" / \"말보다 실천, 성과보다 신뢰, 정책보다 아이들의 성장\"<\/li>\n<li>⚠ 시점 주의: 2026 「서울교육 주요업무」(2월 발간)는 1기 체계를 따릅니다. 1기 5대 방향은 검색 요약으로만 확인했습니다. 면접에서는 <strong>2기 비전과 5대 방향을 앞세우고<\/strong>, 사업명은 2026 신년회견에서 확인된 것만 쓰는 것이 안전합니다.<\/li>\n<\/ul>\n<h2>1. 5대 정책방향 → 대표 사업 → 지리교사·담임 적용<\/h2>\n<table>\n<thead>\n<tr>\n<th>정책방향(2기)<\/th>\n<th>대표 사업(출처)<\/th>\n<th>지리 수업<\/th>\n<th>담임<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>창의와 공감의 미래형 전인교육<\/td>\n<td>AI·디지털 리터러시 진단 1만→3만 명, AI 활용 가이드라인, SEN스쿨, AI 에듀테크 선도교사 1,300명, 독서 중점학교·인문학 실천학교, 개념기반탐구독서 (신년회견 2026-01-28)<\/td>\n<td>AI가 만든 지도와 통계를 검증하는 활동, 개념기반 탐구(스케일·장소·상호연결성)<\/td>\n<td>AI 윤리 학급 약속, 학급 독서<\/td>\n<\/tr>\n<tr>\n<td>모두의 배움을 보장하는 책임교육<\/td>\n<td>서울학습진단성장센터(11개 지원청 → '1자치구 1센터'), 기초학력 전문교원 (2026-01-28, 2026-07-22)<\/td>\n<td>출구카드로 최소 성취를 확인하고 단계형 학습지 제공. 고교는 최소 성취수준 보장지도<\/td>\n<td>관찰 결과를 바탕으로 센터에 연계<\/td>\n<\/tr>\n<tr>\n<td>지속가능한 민주시민교육<\/td>\n<td>민주시민교육 종합계획, 역지사지 공존형 토론수업, 체험 기반 역사·평화교육 (2026-01-28, 2026-07-22)<\/td>\n<td>개발 쟁점 역할극에서 상대 입장을 요약한 뒤 접점을 찾음. 커뮤니티 매핑<\/td>\n<td>학급회의(상향식)<\/td>\n<\/tr>\n<tr>\n<td>함께 누리는 교육복지<\/td>\n<td>학생맞춤통합지원, 학맞통 원스톱 콜센터, 이주배경 AI 통·번역, 제2서울다문화교육지원센터, 특수학교·특수학급 확대, 유아 무상교육 단계 추진<\/td>\n<td>이주배경 학생의 강점을 살린 역할 배정, 다국어 핵심어 카드<\/td>\n<td>학맞통 절차: 관찰 → 진단 → 지원 → 사후관리<\/td>\n<\/tr>\n<tr>\n<td>안전하고 평화로운 교육공동체<\/td>\n<td>마음회복학교(2기 1호), 전문상담인력·또래마음지킴이, 관계회복 숙려제⚠, 교육활동 보호(100인 변호인단⚠)<\/td>\n<td>안전하고 존중하는 수업 규칙<\/td>\n<td>위기 징후 발견 시 상담 연계, 관계회복 대화<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. 2026 신년 '3대 전환' (2026-01-28 기자회견문 원문, seouleducation.sen.go.kr)<\/h2>\n<ol>\n<li><strong>지식이해 중심에서 역량기반으로.<\/strong> 개념기반 교육과정을 운영하고, 배움의 전이를 이끌어냅니다.<\/li>\n<li>지리 적용: 한 사례에서 개념을 일반화한 뒤 새 지역에 적용합니다.<\/li>\n<li><strong>하향식에서 상향식(바텀업)으로.<\/strong> 현장에서 검증된 정책을 공유합니다.<\/li>\n<li>교사 적용: 교사학습공동체 활동을 합니다.<\/li>\n<li><strong>동반자적 거버넌스로.<\/strong> 주요 정책은 공론화를 거칩니다.<\/li>\n<li>교사 적용: 학생·학부모 참여를 늘립니다.<\/li>\n<\/ol>\n<p><strong>3대 약속<\/strong>: ① 단단한 책임교육 ② 생각하는 힘을 기르는 미래역량 교육 ③ 안전한 성장의 교육 울타리 (뉴시스 2026-01-28)<\/p>\n<h2>3. 국가 정책 연결고리 (면접관이 자주 엮는 것)<\/h2>\n<ul>\n<li><strong>학생맞춤통합지원법<\/strong>: 2026-03-01 시행 (교육부 2026-02-12)<\/li>\n<li>지원 대상: 기초학력 부족, 경제·심리·정서 어려움, 학교폭력, 경계선 지능, 아동학대<\/li>\n<li>운영: 학교장이 총괄하고 교감이 조정하며, 기존 위원회를 통합해 활용합니다. 교육(지원)청 센터와 지역사회가 함께 지원합니다.<\/li>\n<li>서울: 교육지원청 학생맞춤협력과, 학맞통 Sen콜 1688-3651 (서울 계획 2026-02)<\/li>\n<li><strong>고교학점제<\/strong>: 2025년 고1부터 시행<\/li>\n<li>공통과목은 성취율 40%와 출석률 2/3를 넘어야 이수합니다. 미도달 학생은 최소 성취수준 보장지도를 받습니다.<\/li>\n<li>졸업 기준은 192학점입니다. (경기 학교 안내자료 2026-04)<\/li>\n<li><strong>AI디지털교과서<\/strong>: 2025-08-04 법 개정으로 '교육자료'가 됐습니다. 2026년 1학기 활용률은 5.2%입니다. (교육부 2025-08-04, EBS 2026-09-22)<\/li>\n<li>답변에서는 \"AI는 보조 도구이며 교사가 목적에 맞게 선택한다\"는 입장으로 말합니다.<\/li>\n<li><strong>2026 교육부 업무계획<\/strong> (2025-12-16)<\/li>\n<li>K교육 AI, 질문중심 수업과 서·논술형 평가 확대<\/li>\n<li>기초학력지원센터 17개, 1교실 2교사<\/li>\n<li>교권: 민원 일원화, 마음돌봄휴가 최대 10일<\/li>\n<li>사회정서교육 17차시<\/li>\n<li>온동네 초등돌봄·교육, 초3 방과후 이용권 50만 원 (늘봄)<\/li>\n<li><strong>이주배경학생<\/strong>: 밀집학교에 교원을 추가 배치하고, 지원을 중·고교로 넓히며, 지원 법률 제정을 추진합니다. (교육부 2025-02-11)<\/li>\n<li><strong>2022 개정 교육과정<\/strong>: 역량·탐구·디지털 소양을 강조합니다. 지리 성취기준은 research.md 5절을 참고하세요.<\/li>\n<\/ul>\n<h2>4. 답변 공식 (구상형 6분 안에 2문항)<\/h2>\n<ol>\n<li>결론 한 줄<\/li>\n<li>방안 3가지. 각 방안은 '정책명 + 지리 수업 또는 학급 실천' 한 문장으로 구성합니다.<\/li>\n<li>마무리: 2기 비전이나 5대 방향 중 하나로 수렴합니다.<\/li>\n<li>예: \"…이는 '모두를 위한 기본교육'을 교실에서 실현하는 길이라 생각합니다.\"<\/li>\n<li>사업명은 확실한 것만 씁니다. 모르면 '서울교육청의 학생맞춤통합지원 체계처럼' 수준으로 일반화합니다.<\/li>\n<\/ol>\n<h2>5. 공백과 확인 필요<\/h2>\n<ul>\n<li>2026 「서울교육 주요업무」 PDF 본문은 열지 못했습니다(sen.go.kr 연결 시간 초과). 정책과제 번호 체계는 학맞통 계획에 인용된 「1-2-2. 학생맞춤통합지원 체계 구축」만 확인했습니다.<\/li>\n<li>백서의 15개 약속과 50개 세부과제는 개별 명칭을 확인하지 못했습니다.<\/li>\n<li>2027 주요업무는 보통 2월에 발간되므로 면접(1/21) 전에는 나오지 않을 가능성이 큽니다. 12~1월 사이 교육청 보도자료를 다시 확인해야 합니다.<\/li>\n<li>⚠ 표시 수치(상담교사 증원, 변호인단 확대, 통학비 시행 일정)는 원문으로 재확인해야 합니다.<\/li>\n<\/ul>","cards":[{"term":"모두를 위한 기본교육, 행복한 협력교육","scope":"서울","purpose":"교육격차가 가장 큰 도시 서울에서 단 한 명도 배움·성장·안전에서 소외되지 않게","practice_geo":"모든 수업에 최소 성취 확인(출구카드)과 보충 경로를 둔 '기본은 탄탄하게' 수업 설계","practice_homeroom":"학기초 학생 실태 파악→소외 학생 없는 학급 운영 계획","keywords":["기본교육","협력교육","교육격차"],"source":["https://www.pinpointnews.co.kr/news/articleView.html?idxno=484564","https://www.slowlearnernews.org/news/articleView.html?idxno=3778"],"date":"2026-07-22 / 2026-09-07","verified":true,"def":"2기(2026.7~) 서울교육 비전. '기본교육'=헌법상 교육받을 권리를 생애 전 단계로 확대해 모든 학생의 기본 역량을 국가·교육청이 책임진다는 개념"},{"term":"교육지표: 시작은 촘촘하게, 기본은 탄탄하게, 성장은 다양하게","scope":"서울","purpose":"출발선 지원·기초 역량·다양한 진로 성장의 3단 구조","practice_geo":"도입(진단)-전개(핵심개념)-심화(선택 탐구 과제) 3단 수업에 그대로 대응","practice_homeroom":"","keywords":["교육지표"],"source":["https://www.pinpointnews.co.kr/news/articleView.html?idxno=484564"],"date":"2026-09-07","verified":true,"def":"백서를 바탕으로 교육감이 확정한 서울교육 지표"},{"term":"5대 정책방향(2기)","scope":"서울","purpose":"비전 실현의 정책 축","practice_geo":"답변 결론에서 해당 방향 1개를 명시적으로 연결","practice_homeroom":"","keywords":["5대 정책방향"],"source":["https://www.pinpointnews.co.kr/news/articleView.html?idxno=484564","https://www.slowlearnernews.org/news/articleView.html?idxno=3778"],"date":"2026-09-07","verified":true,"def":"창의와 공감의 미래형 전인교육 / 모두의 배움을 보장하는 책임교육 / 지속가능한 민주시민교육 / 함께 누리는 교육복지 / 안전하고 평화로운 교육공동체"},{"term":"기본은 깊게, 협력은 넓게, 행복은 가까이","scope":"서울","purpose":"새것을 더하기보다 교육 본질을 단단히","practice_geo":"","practice_homeroom":"","keywords":["취임사"],"source":["https://www.yna.co.kr/view/AKR20260630159751530"],"date":"2026-07-01","verified":true,"def":"2기 취임사에서 밝힌 4년 방향"},{"term":"5대 핵심공약","scope":"서울","purpose":"공약추진위 '배움이 행복한 서울교육위원회'(위원장 김재형)가 5대 영역·15개 약속·50개 세부과제로 구체화","practice_geo":"","practice_homeroom":"","keywords":["공약","독서서울" 됨(실연과 연결)"]},"recalled_structure":{"source":"https://m.cafe.daum.net/kimkoohistory/TpE7/442?svc=TOPRANK","status":"복원(역사 2025, 정성적)","items":["번호 매긴 항목(1~3) 단위로 내용·활동을 쓰는 구조","항목별로 내용 요소(예: 배경)와 교수학습 조건(예: 맥락화, 서술형 평가)을 지정"]},"extra_reference":{"title":"경남교육청 지도안 작성 문제지 양식(타 시도 참고)","source":"https://www.gne.go.kr/component/file/ND_fileDownload.do?q_fileId=cd7a762a-634f-4d89-a0a0-fb112bacc734&q_fileSn=181563265","note":"서울 양식 아님, 미열람(검색 요약만)"},"practice_frame_NOT_exam":["단원/성취기준 코드","학습 목표(행동 동사)","도입: 동기유발 발문·전시 확인·목표 제시","전개 1~3: 항목별 조건 이행(활동·자료·발문·예상 반응·피드백)","정리: 형성평가·차시 예고","평가 계획: 방법·기준(루브릭)","유의점: 맞춤 지원·안전·디지털 윤리"]},"std":[{"u":"01","name":"다양한 세계, 다양한 지역","go":"• 지리 영역 학습의 도입 단원으로서 지리를 왜 배워야 하는지, 특히 학생들이 세계 지역에 대한 상을 형성하고 세계화 시대에 지리적 인식과 관점을 갖추는 것이 왜 필요하고 중요한지를 이해하도록 하는 데 중점을 둔다. 세계 각 지역의 다양성을파악하고, 세계화 시대에 지리적으로 생각하고 세상을 바라보는 것의 중요성을 학습자가 인식하는 데 중점을 둔다. • 특정 지역의 위치와 자연·인문환경의 특성들을 단순히 암기하기보다는, 각 지역이 가지는 지역성을 추론하기 위한 도구로지리적 지식을 활용하여 학습자의 사고력을 기르는 데 중점을 둔다. 이러한 지리적 사고력과 관점은 세계와 우리나라 각지역을 학습하는 데 토대가 된다. 초등학교에서 이루어진 세계 및 우리나라 지역의 위치와 자연·인문환경 특성에 대한 학습자의 이해 정도를 파악한 후 학습을 진행할 필요가 있다. • 공간적 상호 작용의 사례(항공 네트워크, 인터넷 네트워크 등 교통과 통신 시스템, 글로벌생산, 유통, 소비 체계 등)를 조사하고, 이를 통해 네트워크로 연결된 장소의 공간적 상호작용을 이해하는 데 주안점을 둔다. • 세계화 시대 지리적 안목의 필요성을 인식하고 지리 학습에 대한 흥미를 높일 수 있도록 학습자들이 일상생활에서 경험할수 있는 지리적 현상과 시사적 이슈를 토대로 세계화가 세계 각 지역의 변화와 주민 생활에 미치는 영향을 파악하도록 한다. 지역 간 등질화 경향에 대한 이해와 함께, 세계화에 따른 영향이 지역마다 다르게 나타나는 사례나 특정 지역에서 발생한 변화가 세계적 차원의 변화를 가져온 사례 등을 구체적으로 살펴봄으로써 글로벌- 로컬 관계에서 지역의 힘, 더 나아가글로컬 시민의 실천의 힘에 대해 지리적 상상력을 펼칠 수 있도록 한다. • 이후 세계와 우리나라의 지역을 학습하는 과정에서 각 지역에 대한 지식과 이해의 폭을 확장하는 것에 그치지 않고 학습자의 지리적 문해력, 공간적 문제 해결력과 의사 결정력, 글로컬 시민성, 지속가능성을 위한 생태 감수성 등을 기르는 데 중점을 둘 필요가 있다. 지리적문해력이란 지역, 국가, 세계 규모에서 발생하는 지리적·공간적 문제를 합리적으로 해결하기위해서 지리적·공간적 정보를 수집하여 지리적 사고력과 판단력을 통해 분석 또는 해석하고, 지리정보기술을 활용해 도표화 또는 지도화하여 제시할 수 있는 능력을 말한다. 공간적 문제 해결력과 의사 결정력이란 지역, 국가, 세계 규모에서 발생하는 다양한 지리적 쟁점 및 문제를 다중 스케일적 관점에서 인식하고 그 원인과 현상을 파악하여 합리적인 해결 방안들을 모색하며 가장 나은 의견을 선택하는 능력을 말한다. 글로컬 시민성이란 지역, 국가, 세계 공동체의 구성원에게 다중 스케일 차원에서 요구되는 가치와 태도(예: 공간적·문화적 다양성에 대한 이해와 공감)를 가지고 자신과 공동체의 웰빙과발전을 위해 적극적으로 참여하는 능력을 말한다. 지속가능성을 위한 생태 감수성이란 지구와 인류의 지속가능한 발전에 기여하기 위해 인간과 자연의 유기적·생태적 관계를 자각하고 이를 위해 실천할 수 있는 능력을 말한다.","stds":[{"code":"[9사(지리)01-01]","text":"세계 여러 지역의 특성을 해당 지역의 위치와 자연·인문환경을 고려하여 추론한다.","hae":"• 세계 대지형이나 기후 지역 등 대표적인 사례 지역들을 통해 절대적, 상대적 위치에 따라 나타나는 자연환경적 특성 및 이로 인한 인문환경적 특성을 고려하여 세계 여러 지역의 특성을 추론할 수 있도록 설정된 것이다. 이를 통해 ‘모자이크로서의 세계’에 대한 이해를 바탕으로 세계 여러 지역의 차이와 다양성을 인식하는 데 중점을 둔다. 다양한 지역의 사례를 통해세계시민으로서 지역의 다양성에 대한 인식과 열린 태도의 중요성을 파악한다."},{"code":"[9사(지리)01-02]","text":"다양한 스케일에서 지역이 서로 연계되어 있음을 공간적 상호 작용의 사례를 통해 파악한다.","hae":"• 국지적 수준에서부터 전 지구적 수준에 이르기까지 다양한 공간 스케일에서 지역이 서로 연결되어 있음을 공간적 상호 작용의 사례를 통하여 파악할 수 있도록 설정된 것이다. 이를 통해 ‘네트워크로서의 세계’에 대한 이해를 바탕으로 세계 여러지역의 상호연계성과 상호의존성을 인식하는 데 중점을 둔다. 한 지역을 이해하기 위해서는 다른 지역과의 접근성과 관계성, 네트워크상의 위치성이나 연결성, 기능에 대한 이해가 필요하며, 세계화 시대에 지역에 대한 이러한 지리 인식이 왜 중요한지 다양한 사례를 통해 파악하도록 한다."},{"code":"[9사(지리)01-03]","text":"세계의 변화가 지역에 영향을 미치고 지역의 변화가 세계에 영향을 미치는 사례를 조사한다.","hae":"• 문화 및 경제의 세계화로 인해 세계가 등질화된 모습을 보이며 통합적으로 바뀌는 한편, 지역의 자율성이 강화되고 지역의변화가 세계에 미치는 영향도 커지고 있음을 사례 조사를 통해 파악할 수 있도록 설정된 것이다. 이를 통해 세계 여러 지역의 역동성을 인식하는 데 중점을 둔다."}]},{"u":"02","name":"아시아","go":"• 학생들의 학업 성취수준, 흥미 등을 고려하여 아시아의 자연환경 특성을 다양하고 창의적인 방법을 활용하여 지도로 표현하도록 한다. 지도 위에 지리적 특성을 기술하거나 색칠, 스케치, 이미지 부착 등을 통해 다양한 형태의 지도를 만들 수 있다.지역에 대한 학습을 전개하는 과정에서 인문환경의 특성도 계속 중첩하여 지도화함으로써 해당 지역의 종합적 모습을 지리적으로 인식하도록 지도하는 것을 고려한다. • 종교와 관련된 아시아의 다양한 문화경관 및 생활양식, 문화 공존 지역과 갈등 지역에 대해 종교별, 지역별로 학습 주제를나누어 조사하고 발표함으로써 협력적인 학습이 이루어지도록 한다. • 종교와 관련한 아시아 각 지역의 문화에 대한 이해를 토대로, 학생들이 문화 다양성에 대한 이해를 높이고, 공감 능력과 다문화 감수성 및 수용성을 기를 수 있도록 지도한다. 또한, 다양한 문화적 배경을 가진 학생들의 입장을 고려하여 학습 내용과 평가 과정을 구성한다. • 아시아의 산업 특징을 특정 스케일이 아닌 다양한 스케일에서 조망할 수 있도록 지도한다. 또한 학생들이 아시아의 산업변화가 우리나라의 산업에 미치는 영향을 탐색할 때 미래의 일자리 변화를 예측하면서 진로 탐색 역량이 강화되도록 지도한다.","stds":[{"code":"[9사(지리)02-01]","text":"다양한 지리 정보와 매체를 활용하여 아시아의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다.","hae":"• 다양한 지리 정보 및 매체에 표현된 아시아(동아시아·동남아시아·남부아시아·서남아시아·중앙아시아)의 국가와 주요도시의 위치를 파악하고, 자연환경의 특성을 지도화하면서 공간적 인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다"},{"code":"[9사(지리)02-02]","text":"종교와 관련된 아시아의 다양한 문화경관과 생활양식을 파악하고, 세계시민으로서 문화 다양성에 대한 이해와 수용성을 높인다.","hae":"• 종교(불교, 힌두교, 이슬람교, 크리스트교 등)와 관련된 아시아의 다양한 문화경관 및 생활양식을 구체적인 사례를 통해 파악한다. 또한 다양한 종교의 공존과 갈등을 이해함으로써 문화 다양성의 중요성을 인식하고 다양한 문화를 존중하고 수용할줄 아는 세계시민의 자질을 기르는 데 중점을 둔다."},{"code":"[9사(지리)02-03]","text":"아시아의 인구 특징을 파악하고 지역별 인구 구조 변화를 비교하여 지역 발전의 가능성 및 변화 모습을 추론한다성취기준 해설• 인구 지표(총 인구수, 연령별 인구수, 이민자 수 등)를 통하여 아시아 지역의 인구 특징(저출산·고령화, 인구 증가 등)을","hae":"• 인구 지표(총 인구수, 연령별 인구수, 이민자 수 등)를 통하여 아시아 지역의 인구 특징(저출산·고령화, 인구 증가 등)을파악할 수 있는 기회를 제공한다. 또한 각 지역의 인구 구조를 비교해 봄으로써 지역의 성장 잠재력을 인식하고 앞으로의변화 모습을 추론해 보는 기회를 제공한다."},{"code":"[9사(지리)02-04]","text":"글로컬 관점에서 아시아의 산업 특징과 변화를 파악하고, 이것이 우리나라 산업에 미치는 영향을 탐색한다.","hae":"• 지역적, 국가적, 세계적 스케일의 상호 작용 측면에서 아시아의 산업 특징(천연자원 생산, 노동 집약적인 제조업, 고부가가치의 첨단·문화 산업 등) 및 변화를 파악하고, 이러한 변화가 우리나라의 산업에 미치는 영향을 다각도로 탐색할 수 있도록 초점을 둔다."}]},{"u":"03","name":"유럽","go":"• 학생들의 학업 성취수준, 흥미 등을 고려하여 유럽의 자연환경 특성을 다양하고 창의적인 방법을 활용하여 지도로 표현하도록 한다. 지도 위에 지리적 특성을 기술하거나 색칠, 스케치, 이미지 부착 등을 통해 다양한 형태의 지도를 만들 수 있다.지역에 대한 학습을 전개하는 과정에서 인문환경의 특성도 계속 중첩하여 지도화함으로써 해당 지역의 종합적 모습을지리적으로 인식하도록 지도하는 것을 고려한다. • 유럽의 도시 탐색을 통해 다른 지역에 대한 호기심을 가질 수 있도록 지도하고, 다양한 삶의 공간이 만들어지고 계속 변화하는 사례를 통해 내가 사는 지역이나 우리나라의 도시의 변화를 상상해 볼 수 있도록 한다. 또한 최근 기후위기 대응을위한 유럽의 친환경 도시, 생태도시 등 지속가능한 도시의 사례들이 우리나라 도시 개발에 주는 시사점을 학습하도록 하여생태전환 교육이 이루어질 수 있도록 한다. • 유럽 연합 가입을 희망하는 국가와 분리·독립하려는 국가의 사례를 탐구하면서 유럽 내 역학관계를 큰 틀에서 살펴볼 수있도록 안내한다.","stds":[{"code":"[9사(지리)03-01]","text":"다양한 지리 정보와 매체를 활용하여 유럽의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로표현한다.","hae":"• 다양한 지리 정보 및 매체에 표현된 유럽의 국가와 주요 도시의 위치를파악하고, 자연환경의 특성을 지도화하면서 공간적인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다."},{"code":"[9사(지리)03-02]","text":"다양한 유형의 유럽 도시를 탐색하고, 기후위기에 대응하여 지속가능한 도시를 만들기 위한 노력을 조사한다.","hae":"• 다양한 기능과 특징을 가진 유럽의 도시를 살펴봄으로써 생활공간으로서 도시의 다양성과 역동성을 인식한다. 특히 탄소중립 등 기후위기에 대처하는 유럽의 친환경 정책이 지속가능한 삶을 위해 생활공간과 일상생활을 어떠한 방식으로 변화시키고 있는지 관심을 가지게 함으로써 기후위기에 대응하는 방법에 대한 사고의 폭을 넓히기 위해 설정된 것이다."},{"code":"[9사(지리)03-03]","text":"지역 간 역학관계에 따른 유럽의 통합과 분리의 움직임이 유럽연합의 변화와 주민 생활에 미치는 영향을 탐색한다.","hae":"• 유럽연합을 통해 유럽의 국가들이 정치·경제적으로 하나의 유럽으로 통합되는 흐름 속에서 고유한 문화권을 중심으로 하는 지역·국가의 분리 움직임이 유럽연합 및 주민 생활에 미치는 영향을 탐색하기 위하여 설정된 것이다."}]},{"u":"04","name":"아프리카","go":"• 학생들의 학업 성취수준, 흥미 등을 고려하여 아프리카의 자연환경 특성을 다양하고 창의적인 방법을 활용하여 지도로 표현하도록 한다. 지도 위에 지리적 특성을 기술하거나 색칠, 스케치, 이미지 부착 등을 통해 다양한 형태의 지도를 만들 수 있다. 지역에 대한 학습을 전개하는 과정에서 인문환경의 특성도 계속 중첩하여 지도화함으로써 해당 지역의 종합적 모습을지리적으로 인식하도록 지도하는 것을 고려한다. • 학생들이 아프리카의 문화적 특징을 획일적으로 이해하지 않고 아프리카 각 지역의 지리적 특성에 기반한 문화 다양성을인식할 수 있도록 지도한다. 특히 아프리카 각 지역의 문화 그 자체에 대한 학습에서 벗어나 우리가 현재 향유하고 있는문화에 영향을 미치고 있다는 것을 인식할 수 있도록 지도한다. • 아프리카의 현재 모습과 발전 가능성을 학습한 후, 학습 이전에 가지고 있었던 아프리카에 대한 자신의 인식과 비교하여그 변화를 스스로 성찰해 볼 수 있도록 지도한다. • 아프리카의 최근 변화상을 각종 통계 및 뉴스 자료 등 객관적 근거를통해 파악하도록 한다.","stds":[{"code":"[9사(지리)04-01]","text":"다양한 지리 정보와 매체를 활용하여 아프리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다.","hae":"• 다양한 지리 정보 및 매체에 표현된 아프리카의 국가와 주요 도시의 위치를 파악하고, 자연환경의 특성을 지도화하면서 공간적 인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다."},{"code":"[9사(지리)04-02]","text":"아프리카의 지리적 특성에 기반한 다양한 문화와 지역 잠재력을 탐구하고, 아프리카에 대한 자신의 인식을 성찰한다.","hae":"• 아프리카의 다양한 문화 및 지역의 잠재력을 탐구하는 활동을 통하여 아프리카에 대한 지금까지의 인식을 스스로 생각해볼 수 있는 기회를 제공하는 데 초점을 둔다."},{"code":"[9사(지리)04-03]","text":"지속가능한 발전을 위한 아프리카 각 지역의 노력과 세계 다양한 주체들의 협력 사례를 조사하고, 세계시민으로서 우리가 참여할 수 있는 방안을 모색한다.","hae":"• 지속가능한 발전을 위한 아프리카의 주체적 노력 및 협력 사례를 조사함으로써 아프리카를 교류와 협력의 동반자로 인식하고, 더 공정하고 지속가능한 세계를 만드는 과정에 동참하는 태도를 기르도록 설정되었다.사회 1 Ⅴ. 아메리카"}]},{"u":"05","name":"아메리카","go":"• 학생들의 학업 성취수준, 흥미 등을 고려하여 아메리카의 자연환경 특성을 다양하고 창의적인 방법을 활용하여 지도로 표현하도록 한다. 지도 위에 지리적 특성을 기술하거나 색칠, 스케치, 이미지 부착 등을 통해 다양한 형태의 지도를 만들 수 있다. 지역에 대한 학습을 전개하는 과정에서 인문환경의 특성도 계속 중첩하여 지도화함으로써 해당 지역의 종합적 모습을지리적으로 인식하도록 지도하는 것을 고려한다. • 문화 혼종성의 개념 자체에 대한 학습보다는 아메리카의 문화적 특징을 설명할 수 있는 하나의 인식 틀로서 세계를 바라볼수 있는 기회를 제공할 수 있도록 한다. • 아메리카의 인구 특징을 분석할 때 통계 자료뿐 아니라 뉴스나 동영상, 사진, 문학 작품, 그림, 영화 등 생동감 있는 자료를적극적으로 활용한다. • 학생들에게 익숙한 다양한 분야(농업, 공업, 서비스업 등)의 초국적 기업 및 상품의 사례를 활용하여 아메리카 지역 내 초국적 기업의 입지를 분석하도록 한다. 이때 아메리카 지역에 입지한 초국적 기업의 본사뿐만 아니라 자회사, 생산 공장, 농장 등 다양한 기능의 공간적 분업을 학습할 수 있도록 한다. • 초국적 기업은 하나의 본사에 모든 의사 결정 권한이 집중되어 있는 것이 아니라 여러 국가에서 다양한 기능을 수행하는자회사가 비교적 동등한 지위를 가지고 상호의존적이며 수평적으로 연결되는 특성이 있다. 따라서 초국적 기업에서는 핵심부와 주변부의 구분이 약해지며, 기업의 본사와 해외 자회사는 전문화된 핵심 자산을 각자 보유하고 있다. 이를 고려하여초국적 기업의 활동이 아메리카 지역에만 국한되어 있지 않고 전 세계적으로 수평적 네트워크형 조직 구조를 바탕으로 광범위하게 이루어지고 있다는 것을 인식할 수 있도록 지도한다.","stds":[{"code":"[9사(지리)05-01]","text":"다양한 지리 정보와 매체를 활용하여 아메리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다.","hae":"• 다양한 지리 정보 및 매체에 표현된 아메리카의 국가와 주요 도시의 위치를 파악하고, 자연환경의 특성을 지도화하면서 공간적 인식 능력과 지리적 표현력을 기르고 지리적 산출물을 만드는 기회를 제공하는 데 중점을 둔다."},{"code":"[9사(지리)05-02]","text":"다양한 민족(인종)으로 구성된 아메리카의 인구 특징을 살펴보고, 사례를 들어 아메리카의 문화 혼종성을 설명한다.","hae":"• 민족(인종)의 관점에서 아메리카의 인구 구성 특징을 알아보고, 아메리카 국가들의 문화적 특징을 다양한 문화와 시간들의공존과 교차의 결과로 이해할 수 있도록 설정된 것이다"},{"code":"[9사(지리)05-03]","text":"초국적 기업의 글로벌 생산체제에 대한 이해를 바탕으로, 초국적 기업의 아메리카 지역 내 입지와 해외 이전의 이유, 그에 따른 해당 지역의 변화를 분석한다.","hae":"• 아메리카 지역을 사례로 초국적 기업의 생산체제가 지역에 미치는 영향을 분석하기 위해 설정된 것이다. 초국적 기업의 입지 및 해외 이전에 따른 지역의 변화를 분석함으로써 ‘어디에?’, ‘그곳에 왜?’라는 지리적 질문을 제기하고 해결하는 사고과정을 유도한다.사회 1 Ⅵ. 오세아니아와 극지방"}]},{"u":"06","name":"오세아니아와 극지방","go":"• 오세아니아의 지리적 위치와 최근의 정책 변화 등을 통해 주변 지역과의 연계성이 강화되는 과정을 탐색한다. 오세아니아에서 수출되는 자원의 종류와 규모를 나열하고 학습하기보다는 자원을 소재로 오세아니아와 다른 지역의 상호 교류 현황을파악하는 데 초점을 맞춘다. • 태평양 지역의 환경 문제 해결에 참여하는 방안을 제안하는 과정에서 발표, 토의·토론, 동영상 제작, 캠페인, 관련 기관 방문 및 체험 등의 다양한 방법을 활용하여 생태전환 교육의 기회를 제공한다. • 극지방의 지역 개발을 둘러싼 다양한 이해관계를 살펴보고, 시뮬레이션, 역할극, 모의재판, 토의·토론 학습을 통해 학생 자신 및 상대방의 의견을 비판적으로 검토할 수 있는 기회를 제공한다.","stds":[{"code":"[9사(지리)06-01]","text":"다양한 지리 정보와 매체를 활용하여 오세아니아의 국가와 주요 도시의 위치, 자연환경의 특성을 파악하고,자원 수출을 중심으로 세계 다른 지역과의 상호연계성을 탐색한다.","hae":"• 다양한 지리 정보 및 매체에 표현된 오세아니아의 국가와 주요 도시의 위치, 자연환경의 특성을 파악할 수 있도록 설정되었으며, 오세아니아와 세계 다른 지역 간의 연계 및 공간적 상호 작용을 자원 수출의 측면에서 탐구하는 데 중점을 둔다."},{"code":"[9사(지리)06-02]","text":"태평양 지역이 겪고 있는 환경 문제를 조사하고 그 해결에 참여할 수 있는 방안을 제안한다.","hae":"• 태평양 지역이 겪고 있는 환경 문제(해양 쓰레기, 해수면 상승 등)를 조사함으로써 우리의 삶이 다른 지역의 삶에 영향을미칠 수 있음을 인식하고 지구적 관점에서 행동할 수 있는 세계시민의 자질을 기르는 데 중점을 둔다."},{"code":"[9사(지리)06-03]","text":"극지방의 지리적 중요성과 지역 개발을 둘러싼 다양한 이해관계를 살펴보고, 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다.","hae":"• 극지방의 중요성과 지역 개발을 둘러싼 다양한 이해관계를 살펴봄으로써 지역의 지리적 이슈를 여러 측면에서 평가하고 논리적으로 자신의 의견을 정리하여 소통할 수 있는 능력을 기르는 데 중점을 둔다.사회 2 Ⅶ. 대한민국, 우리가 살아가는 곳"}]},{"u":"07","name":"세계 속의 우리나라","go":"• 최신의 시사 정보 등 구체적 사례를 통하여 우리나라의 위치를 지정학적 관점뿐만 아니라 세계화 시대 지경학적 관점에서파악하도록 지도한다. 특히 위치는 다른 여러 국가들과 정치적·경제적·지리적으로 연결되어 있으며 고정된 의미가 아니라상황에 따라 가변성을 가지므로, 위치의 의미를 종합적으로 파악할 수 있도록 지도한다. 이를 통해 우리나라 위치의 의미와중요성을 인식할 수 있는 기회를 제공한다. • 독도를 포함한 우리나라의 영역을 지도에서 확인하거나 그리는 활동을 통하여 독도가 우리나라 영토임을 확인하고 이를 통해 학생들이 우리나라의 영역감을 가질 수 있도록 지도한다. • 행정구역의 단순 암기는 지양하고, 지역의 규모, 상호 작용, 변화와 같은 추상적인 개념을 지역 학습에 적용하는 데 있어서,행정구역이 중요한 공간 인식 틀이자 지역 범위의 경계로 인식되도록 학습이 이루어져야 한다. 이를 통해 학습자들의 객관적인 공간 인지 발달을 도와줄 수 있다. 자신이 살고 있는 곳에 대한 장소성·장소감의 학습 시 학습자에게 자신의 생활공간에 대해 가지고 있던 주관적인 의미를 표현하고 장소감을 나누는 기회를 제공하며 거주공간에서 나타나는 현상을 이해하고 지리적 관점을 가질 수 있도록 지도한다. • 우리가 사는 지역의 지리적 문제를 선정하고, 문제의 내용을 효과적으로 전달할 수 있도록 시각화하는 학습은 지역의 지리적 문제에 대한 학습자의 관심을 불러일으키는 효과가 있다. 학습자가 주도적으로 우리가 사는 지역의 지리적 문제를 표현하는 방법에는 카드 뉴스 및 동영상 제작 애플리케이션, 커뮤니티매핑 서비스, 국가공간정보포털 지도 서비스 등이 있다.또한 단순히 지리적 문제의 확인 및 시각화로 학습이 끝나는 것이 아니라 우리 지역을 더 나은 삶터로 만들기 위한 방안을모색하여 실천으로 연결할 수 있도록 지도한다.","stds":[{"code":"[9사(지리)07-01]","text":"우리 국토의 위치와 영역에 대한 이해를 바탕으로 세계 속에서 우리나라의 위치를 지정학, 지경학적 측면에서 탐색한다.","hae":"• 우리 국토의 위치와 영역에 대한 기본적 지식과 개념 이해를 바탕으로 국토의 공간적 범위를 명확하게 인지하도록 하는 데초점을 둔다. 그리고 우리나라의 위치를 다른 국가와의 관계 속에서 바라본 지정학적 위치뿐만 아니라 글로벌 경제 속에서바라본 • 지경학적 위치 측면에서 조망할 기회를 제공한다."},{"code":"[9사(지리)07-02]","text":"우리나라 행정구역과 주요 도시의 위치를 파악하고, 자신이 살고 있는 곳의 장소성과 장소감을 표현한다.","hae":"• 우리나라를 구성하는 지역의 절대적 위치 및 상대적 위치를 파악하기 위한 공간의 인식 틀로서 다양한 수준의 행정구역을파악할 수 있도록 설정하였다. 많은 사람이 모여 살고 다양한 기능이 집중하는 생활공간으로서 우리나라 주요 도시의 위치를 파악하도록 한다. 자신이 살고 있는 장소에 관심을 갖고 장소가 지니는 의미와 특성을 살펴보는 과정에서 장소감과 장소애를 가질 수 있도록 하는 데 중점을 둔다."},{"code":"[9사(지리)07-03]","text":"다양한 지리 정보와 매체를 활용하여 우리 지역의 문제를 선정하고 지리적으로 시각화한다.","hae":"• 우리가 살고 있는 지역의 지리적 문제를 발견하고 발견한 문제의 내용을 효과적으로 시각화할 수 있는 매체를 사용하여 지리적으로 표현해 봄으로써, 지리적 시각화 방법을 학습하고 우리 지역에 대한 관심을 높일 수 있는 경험을 제공한다.사회 2 Ⅷ. 우리나라의 자연환경과 인간생활"}]},{"u":"08","name":"우리나라의 자연환경","go":"• 우리나라 주요 산지·하천·해안 지형의 특성 및 형성 과정에 대한 세세한 지식, 개념, 이론에만 집중되는 것을 지양한다.우리나라의 매력적인 지형 경관에 대한 방송, 인터넷 매체, 다양한 출판물에서 제공하는 여행 관련 정보의 탐색을 통해 학습자가 우리나라 지형 경관의 아름다움과 생태적 가치를 느끼고 표현할 수 있도록 지도한다. 이를 통해 학습자가 우리나라 지형에 대해 자연스럽게 호기심을 가지고 지형의 특징 및 형성 과정을 탐색할 수있도록 교수·학습 과정을 구성한다. • 우리나라 기후 특성에 영향을 미치는 기후 요소의 구체적인 개념과 원리를 단편적으로 파악하기보다는 계절별, 지역별 기후특성을 중심으로 파악하도록 지도한다. 또한 최근 기후변화에 따른 우리나라의 지역 변화 사례 및 대응 노력을 조사하여 표현할 수 있는 기회를 제공한다. 이를 통해 기후변화의 원인, 과정 및 결과, 영향, 해결 노력 등에 대해 학생 스스로 체계화할 수 있도록 교수·학습 방법을 모색한다. • 자연재해의 지리적 특성을 지도와 다양한 매체를 통해 파악하고, 특정 지역에서 자연재해의 피해가 크게 발생하는 이유를인문환경 및 자연환경과 연결하여 분석할 수 있도록 지도한다. 또한 일상생활에서 발생할 수 있는 자연재해에 대처하는 방안을 교수·학습 및 평가로 설계하여 학습자가 이를 자연스럽게 받아들이고 실천에 옮길 수 있도록 구성한다.","stds":[{"code":"[9사(지리)08-01]","text":"우리나라 주요 산지·하천·해안 지형의 위치와 특성을 파악하고, 매력적인 지형 경관을 탐색하여 우리 국토의 아름다움을 느낀다.","hae":"• 우리나라 주요 산지·하천·해안 지형의 위치와 특성을 파악함으로써 우리나라의 지역 구분과 주민 생활에 영향을 주는 주요 지형에 대한 기초적인 지식을 갖추는 데 중점을 둔다. 우리나라의 매력적인 지형 경관을 다양한 매체를 통해 탐색함으로써, 우리 국토에 대한 호기심과 아름다움을 느끼고 이를 소중하게 여기는 태도를 가지도록 한다."},{"code":"[9사(지리)08-02]","text":"우리나라의 계절별, 지역별 기후 특성 및 변화 양상을 파악하고, 기후변화에 대한 지역별 대응 노력을 조사한다.","hae":"• 우리나라의 기후 특성을 다양한 기후 요소를 통해 계절별, 지역별로 파악함으로써 주민 생활의 모습을 이해하기 위한 기초적인 지식을 갖추는 데 초점을 둔다. 또한 최근 전 세계적인 기후변화가 우리나라 각 지역 주민들의 일상에 영향을 주고 있음을 파악하고, 우리나라의 기후변화 양상 및 지역별 대응 노력을 다양한 매체를 통해 조사하도록 한다."},{"code":"[9사(지리)08-03]","text":"우리나라 자연재해의 지리적 특성과 피해 최소화를 위한 노력을 파악하고, 일상생활 속 다양한 상황에서 자연재해 발생 시 자신의 대처 방안을 탐색한다.","hae":"• 우리나라에서 빈번하게 발생하는 자연재해의 지리적 특성을 파악하고, 자연재해의 피해를 최소화하기 위한 노력뿐만 아니라일상생활 속에서 발생할 수 있는 다양한 자연재해 상황에서 학생 자신이 안전하게 대처할 수 있도록 하는 데 초점을 맞춘다.사회 2 Ⅸ. 중부지역"}]},{"u":"09","name":"중부 지역","go":"• 중부 지역의 매력적인 여행 장소를 탐색하는 과정에서, 지도뿐만 아니라 다양한 시각화 매체와 지리 정보를 활용하여 탐색함으로써 여행지 및 여행 경로에 대한 정보를 수집하는 기능과 여행 계획 수립 능력이 향상될 수 있도록 지도한다. 이를통해 중부 지역에 대한 학생들의 흥미를 높이고 학습의 과정과 결과가 학생의 삶과 연계될 수 있도록 교수·학습 및 평가방법을 모색한다. • 수도권의 공간 구조 특성 및 변화를 이해하기 위해서는 인구·문화·경제와 같은 계통지리적인 학습도 중요하지만, 무엇보다 수도권의 변화 과정에서 형성된 지역성을 이해하고 우리의 삶에 끼친 영향을 추론하고 파악할 수 있도록 지도한다. 특히 수도권은 급격한 변화가 나타나는 지역이 많으므로, 변화 전·후를 비교할 수 있는 다양한 자료를 활용하여 인구·문화·경제 측면의 변화 양상을 종합적으로 파악할 수 있도록 설계한다. • 강원·충청 지역의 변화 모습을 공간적 상호 작용에 중점을 두고 교통 및 도시 발달, 산업 변화를 파악하도록 지도한다. 이지역의 산업 구조 변화가 주민 생활에 미친 영향을 이해하고, 다양한 매체에서 강원·충청 지역 경제 활성화를 위한 노력들을 조사하여 지역의 변화 과정을 학생 스스로 체계화할 수 있도록 교수·학습 및 평가를 구성한다. • 국가공간정보포털 지도 서비스 등을 활용하여 수도권과 비수도권 간의 지역 불균형 문제를 학습자가 창의적이고 다양한 방식의 지도로 표현해 봄으로써, 우리나라의 당면 과제로서 수도권 집중과 지역 소멸 문제에 관심을 갖도록 안내한다. 그리고지역 불균형 문제가 학습자의 삶과 연계되어 있다는 것을 인식하고, 학습자의 수준에서 문제 해결 방안을 모색할 수 있도록 지도한다. • 지역 불균형 문제를 완화하기 위한 방안을 모색하는 과정에서 수도권과 비수도권 모두 지역 불균형으로 인해 서로 다른 다양한 문제가 발생하므로, 이를 해결하기 위한 노력이 필요함을 지도한다.","stds":[{"code":"[9사(지리)09-01]","text":"다양한 지리 정보와 매체를 활용하여 중부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다.","hae":"• 중부 지역의 지리적 특성 및 매력이 드러나는 여행 장소를 선정하고, 이를 바탕으로 중부 지역의 매력적인 자연환경 및 문화에 대한 이해와 관심을 높이도록 설정되었다."},{"code":"[9사(지리)09-02]","text":"수도권의 공간 구조를 파악하고, 인구·문화·경제적 측면을 중심으로 수도권의 변화 양상을 탐색한다.","hae":""},{"code":"[9사(지리)09-03]","text":"강원·충청 지역의 변화를 교통 발달과 수도권과의 관계를 중심으로 파악하고, 강원·충청 지역의 산업 변화와 지역경제 활성화를 위한 노력을 조사한다.","hae":"• 장소 간 연계를 강화시켜주는 교통의 발달 및 공간적 상호 작용의 측면에서 강원·충청 지역의 변화를 파악하도록 하였다.또한 산업 변화와 지역 경제 활성화 측면에서 해당 지역의 노력을 이해하는 데 중점을 두었다."},{"code":"[9사(지리)09-04]","text":"수도권과 비수도권 간의 지역 불균형 실태를 지도로 표현하고, 지역 불균형을 완화하기 위한 방안들을 제안한다.","hae":"• 다양한 시사 문제와 지리 정보를 기반으로 수도권과 비수도권 간의 지역 불균형 문제를 다양한 형태의 지도로 표현하고,학습자가 지역 불균형 문제를 완화하기 위한 방안을 제안할 수 있는 기회를 제공하는 데 초점을 맞추었다.사회 2 Ⅹ. 남부 지역"}]},{"u":"10","name":"남부 지역","go":"• 남부 지역의 매력적인 여행 장소를 탐색하는 과정에서, 지도뿐만 아니라 다양한 시각화 매체와 지리 정보를 활용함으로써여행지 및 여행 경로에 대한 정보를 수집하는 기능과 여행 계획 수립 능력이 향상될 수 있도록 지도한다. 이를 통해 남부지역에 대한 학생들의 흥미를 높이고 학습의 과정과 결과가 학생의 삶과 연계될 수 있도록 교수·학습 및 평가 방법을 모색한다. • 영·호남 공업 지역의 분포 및 특정 산업의 입지를 나열하고 지식 암기 위주로 수업하거나 평가하는 것을 지양하며, 공업지역의 형성과 최근의 변화를 사례 중심으로 조사하도록 한다. • 역할극, 토의·토론 학습을 통해 제주도의 지역 변화를 둘러싼 다양한 가치를 학습자가 확인하게 하고 자신 및 상대방의의견을 비판적으로 검토할 수 있는 기회를 제공한다. 특히, 논쟁적인 지리적 이슈를 다룰 때, 다양한 가치 및 관점을 이해하고 존중하며 열린 마음으로 접근할 수 있도록 한다. 지리적 이슈에 대해 자신의 의견을 타당한 근거를 들어 표현할 수있는가를 평가에 반영할 수 있으며, 근거의 타당성, 내용 전개의 논리성 등을 평가기준에 포함시킬 수 있다.","stds":[{"code":"[9사(지리)10-01]","text":"다양한 지리 정보와 매체를 활용하여 남부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다.","hae":"• 남부 지역의 지리적 특성 및 매력이 드러나는 여행 장소를 선정하고, 이를 바탕으로 남부 지역의 매력적인 자연환경 및 문화에 대한 이해와 관심을 높이도록 설정되었다."},{"code":"[9사(지리)10-02]","text":"글로벌 경제와 우리나라 산업에서 영·호남 공업 지역의 위상을 파악하고, 영·호남 지역의 산업 변화와 당면 과제를 조사한다.","hae":"• 영·호남 공업 지역이 글로벌 경제와 우리나라 산업에서 차지하는 위상 및 영향력을 다양한 매체 및 자료를 활용하여 파악하고, 글로벌 경제의 흐름에 대응하여 경쟁력을 갖추기 위한 영·호남 지역의 산업 구조(농업, 공업, 서비스업 등)의 변화모습과 앞으로의 당면 과제를 조사할 수 있도록 의도하였다."},{"code":"[9사(지리)10-03]","text":"제주도의 지역 변화와 이를 둘러싼 다양한 가치를 살펴보고 이에 대한 자신과 상대방의 의견을 비판적으로검토한다.","hae":"• 독특하고 아름다운 자연환경과 문화로 세계적인 관광지로 성장한 제주도의 최근 변화 모습을 탐색하도록 의도하였다. 관광산업, 지구 온난화 등으로 인해 변화하고있는 제주도 지역의 모습을 다양한 매체 및 자료를 활용하여 파악하고, 이를 둘러싼 다양한 가치를 살펴본 후 자신과 상대방의 의견을 비판적으로 검토할 수 있는 기회를 제공하는 데 중점을 두었다.사회 2 Ⅺ. 북부 지역"}]},{"u":"11","name":"북한과 통일 국토","go":"• 우리나라의 접경지역을 남·북한 접경지역에 한정하기보다는 중국, 러시아와의 접경지역까지넓혀 학습할 필요가 있다. 또한접경지역의 속성은 고정된 것이 아니라 지정학적, 지경학적 변화에 따라 변화하는 공간임을 이해할 수 있도록 지도한다. •한반도 평화의 중요성에 대해 토의하고 발표하도록 하며, 한반도 평화와 통일 환경 속에서 국토 공간과 생활의 변화에 대해 글과 그림으로 표현할 수 있도록 지도한다. • 세계시민적 시각에서 다른 나라의 화해, 통일 과정이 담긴 사례 탐구를 통해 남북 분단 문제의 평화적 해결에 시사점을 도출할 수 있도록 한다. 또한 학습자가 ‘다양한 갈등과 분쟁의평화적 해결 방법은 무엇인가’라는 질문에 대한 답을 찾아가는과정을 경험할 수 있도록 기회를 제공한다. • 통일 국토의 미래 구상 시, 통일 후 예상되는 경제적 효과에만 주목하기보다, 자신의 일상 및 진로, 직업과 연계하여 나타날 변화 모습 등과 연결하여 상상할 수 있도록 한다.","stds":[{"code":"[9사(지리)11-01]","text":"다양한 지리 정보와 매체를 활용하여 북한의 자연환경과 인문환경의 특징을 탐색한다.","hae":"• 국토의 한 부분을 이루는 북한 지역의 자연 및 인문 지리적 특성을 다양한 지리 정보와 매체를 활용하여 파악함으로써 북한 지역의 주민 생활 모습을 탐색할 수 있도록 의도하였다."},{"code":"[9사(지리)11-02]","text":"분단이 우리의 일상생활에 미친 영향을 살펴보고, 분리와 연결의 공간으로서 접경지역의 다양한 모습을 세계여러 지역의 사례를 통해 비교한다.","hae":"• 분단이 우리의 일상생활에 미친 영향을 살펴보는 과정을 통해 자신의 삶과 연계하여 평화 감수성을 함양할 수 있도록 의도하였다. 또한 분리 또는 연결의 공간으로서 접경지역의 특성이 지역마다 다양하게 나타나며, 특히 국가 간의 지정학적, 지경학적 측면의 역동적 관계에 따라 접경지역이 단절의 공간에서 개방의 공간으로 또는 그 반대로 바뀔 수 있다는 것을 우리나라와 세계 여러 지역의 사례를 통해 비교해 봄으로써 한반도 접경지역에 대해 상상하고 의미를 재구성해 보도록 설정된 것이다."},{"code":"[9사(지리)11-03]","text":"세계시민의 관점에서 한반도 평화의 중요성을 논의하고, 한반도 평화와 통일 환경속에서 우리의 삶과 국토의미래를 구상한다.","hae":"• 한반도, 동아시아, 글로벌 스케일에서 한반도 평화의 중요성을 다각적으로 논의하고, 평화 감수성을 기반으로 남북 갈등을평화적으로 해결하기 위한 태도를 기를수 있도록 설정된 것이다. 나아가 지리적 상상력을 바탕으로 미래 통일 환경 속에서펼쳐질 우리 삶의 변화와 국토의 모습을 구체적으로 그려볼 수 있도록 의도하였다.사회 2 Ⅻ. 지속 가능한 세계와 글로컬 시민"}]},{"u":"12","name":"지속가능한 세계·지역","go":"• 지속가능한 자원 확보 방안, 환경 이슈, 지역문제 해결 등 글로컬 시민으로서 우리가 당면한 지리적 이슈를 해결하기 위해삶과 연계하여 실천할 수 있는 자세를 가지도록 한다. • 생태 감수성을 가지고 글로컬 환경 이슈와 연관된 다양한 주체들의 입장을 파악하도록 한다. 이를 위해 역할극, 토의·토론, 논술 등을 활용하여 지속가능한 발전 방향에 관한 다양한 생각을 비판적으로 검토할 수 있는 기회를 제공하는 수업 및평가를 설계할 수 있도록 한다. • 개인과 사회의 지속가능한 삶을 구현하기 위해 자신의 일상생활에서부터 문제 개선을 위해 실천하는 태도를 내면화하는 데초점을 둔다. 삶과 연계한 프로젝트 학습 등을 설계하여 환경 이슈에 대한 원인 및 실태를 파악하고 더 나아가 일상생활속에서 문제 해결을 위한 지속적인 실천을 할 수 있는 기회를 제공한다. • 더 나은 지역을 만들고자 노력하는 사람들에 대한 국내외 사례 조사 과정에서, 지역문제를 해결하는 전문가의 실천들도 간접적으로 파악할 수 있도록 기회를 제공한다. 이를 통해 자신의 흥미와 적성을 파악하고 고등학교의 진로와 연계하여 탐색할 수 있도록 한다. 지역문제 해결에 있어 야외 조사의 일환으로 해당 분야의 전문가 인터뷰, 사회적 기업 및 공공 기관의방문 등 실질적인 학습 경험을 제공한다. • 우리가 사는 지역의 문제 해결 및 지속가능한 발전을 위해 참여하고 실천하는 태도를 가질 수 있도록 한다.","stds":[{"code":"[9사(지리)12-01]","text":"우리나라 주요 식량 자원 및 에너지 자원의 소비 현황과 수입국 현황을 분석하여 이와 관련된 문제를 파악하고, 자원의 지속가능한 확보 방안을 모색한다.","hae":"• 지구적 차원에서 생산 및 소비되는 식량 자원, 에너지 자원의 소비 현황과 주요 수입국 현황을 다양한 매체 및 자료를 기반으로 분석하도록 설정된 것이다. 이를 통해 자원의 생산과 이동이 우리의 삶과 다른 지역 주민의 삶이 긴밀하게 연결되어 있음을 인식할 수 있도록 의도하였다. 국가적 관점에서뿐만 아니라 전 지구적 관점에서 경제와 환경이 균형 있게 성장하는 포괄적이고 총체적인 방향으로 지속가능한 자원 개발 및 확보가 이루어져야 한다는 것에 초점을 두고 지속가능한 자원 확보 방안을 모색하는 데 중점을 둔다."},{"code":"[9사(지리)12-02]","text":"지역 개발과 환경 보존을 둘러싼 글로컬 환경 이슈에 관심을 가지고 자신의 웰빙 및 공동체의 지속가능한발전을 위해 참여하고 실천한다.","hae":"• 다양한 스케일에서 일어나는 글로컬 환경 이슈에 학생들이 관심을 가지도록 하고, 환경과 인간의 공존을 추구하며 자신과타인 및 지구촌 구성원 전체의 웰빙을 기반으로 한 지속가능한 발전을 위해 참여하고 실천하는 기회를 제공하는 데 초점을둔다."},{"code":"[9사(지리)12-03]","text":"더 나은 지역을 만들어 가는 사람들의 노력을 국내외 사례를 통해 살펴보고, 자신이 사는 지역의 문제를 해결하기 위한 방안을 모색하고 이를 실천한다.","hae":"• 더 나은 지역을 만드는 사람들의 노력을 알아보고, [9사(지리)07-03]에서발견한 우리 지역의 문제를 해결하기 위한 방안을모색하고 실천하도록 설정된 것이다"}]}],"check":[["도입","관리번호만 말하고 교탁 정위치 → 인사·출석 대신 바로 수업 시작(20분)"],["도입","전시 학습 확인 발문 1개"],["도입","조건이 지정한 자료로 동기 유발 → 학생 생각 자유 발표(정답 없음 안내)"],["도입","학습 목표를 판서하고 함께 읽기(인지·정의 목표)"],["전개","발문 후 3초 기다리기 / 가상의 학생 이름 부르기 / 예상 반응 되받기"],["전개","자료 분석 3단계: 무엇이 보이나요 → 왜 그렇게 생각했나요 → 어떤 차이가 있나요"],["전개","그래프·통계지도는 범례·수치 확인부터"],["전개","조건의 \"일정량 판서\" 이행: 제목-핵심어-구조화(화살표·표)"],["전개","모둠·짝 활동 안내(규칙·시간·역할) + 순회 지도 중 오개념 발견·피드백"],["전개","맞춤 지원: 배움이 느린 학생(배움짝·쉬운 어휘), 다문화 학생(이중언어 자료), 속진 학생(심화 과제)"],["전개","과열·소극 상황 대처: 토킹스틱, 발언권·경청권, 내성적 학생 역할(기록·PD)"],["전개","디지털 도구 사용 시 권권권(초상권·저작권·개인정보) 안내"],["평가","자기평가(참여·이해·태도) 또는 동료평가(체계성·적절성·적극성) 1회"],["정리","핵심 질문으로 돌아가 학생 언어로 정리 + 형성평가(출구카드)"],["정리","실생활·지역과 연결(전이) + 차시 예고"],["정리","20분 안에 \"이상입니다\"로 종료, 판서 지우기"]],"refq":["수업을 통해 학생들이 어떤 점에서 가장 많이 성장했는지 성찰한 결과는 무엇인가요?","학생들이 수업 중 학습을 효과적으로 성찰할 수 있도록 어떤 기회를 제공했나요? 그 결과 학생들의 학습 태도나 성과에 어떤변화가 있었나요?","수업 계획, 실행, 평가 과정에서 스스로 성찰한 후 개선한 부분이 있다면 무엇인가요? 이 과정이 수업에 어떤 영향을 주었나요?","학생들에게서 수업에서 배운 내용을 실생활에 적용할 수 있는 기회를 제공했나요? 이를 통해 학생들이 어떤 문제 해결 능력을발휘했는지 설명해주세요.","수업에서 학생들이 깊이 있는 학습 경험을 할 수 있도록 어떤 전략을 사용했으며, 그 전략이 학생들의 역량 향상에 어떻게 기여했나요?","이 수업의 핵심 목표는 무엇이었고, 이를 달성하기 위해 선택한 핵심 질문은 무엇인가요?","수업 중 학생들이 다루었던 핵심 질문이 학습 목표와 어떻게 연결되었는지 설명해 주세요. 학생들은 그 질문을 통해 어떤 의미있는 탐구와 성장을 이루었나요?","학생들이 배운 내용을 다른 교과나 실생활에서 적용할 수 있는 지식 전이가 잘 이루어졌나요? 그렇지 않았다면, 이를 개선할방안은 무엇인가요?","학생들이 수업을 통해 배운 내용을 성찰하고, 스스로 개선할 수 있는 기회를 어떻게 제공했는지 구체적으로 설명해 주세요.","수업 설계에서 학생들의 참여와 탐구를 촉진한 방법은 무엇이었나요?","학생들이 흥미를 느끼고 참여할 수 있도록 수업의 어떤 부분에서 관심을 유도했나요? 그 방법이 어떻게 효과적이었나요?","수업에서 학생들이 핵심 아이디어를 탐구하고 문제를 해결할 수 있도록 학습 내용을 어떻게 조직했나요?","실제 수업 중 학생들의 탐구와 문제 해결을 어떻게 도왔나요?","학생들의 사고를 확장하고 융합적 사고를 기르기 위한 활동을 제공했나요? 제공했다면, 그 활동이 수업 목표와 어떻게 연결되었는지 설명해 주세요.","수업 중 학생들이 배운 내용을 다른 문제나 새로운 상황에 적용할 수 있도록 어떻게 설계했나요? 그 결과 학생들이 문제를 해결하는 과정에서 어떤 성과가 있었나요?","수업 중 시간 관리를 어떻게 했고, 학생들이 충분히 학습 목표를 달성할 수 있는 시간을 제공했나요? 시간 관리에서 어려움이있었다면, 이를 어떻게 개선할 계획인가요?","학생들이 개별적으로 성찰할 수 있도록 어떤 피드백을 제공했나요? 그 피드백이 학생들의 학습에 어떤 영향을 주었나요?"],"tpl":[{"model":"직소 Ⅱ","steps":["모집단 형성·전체 읽기","전문가 집단 학습","모집단에서 가르치기","퀴즈·향상점수·집단 보상"],"tips":["전문가 선정 갈등: 이유 설명 후 투표","학습이 느린 전문가: 배움짝, 원모둠 격려"]},{"model":"역할극","steps":["역할 정하기","역할 분배","자료 조사","대본 초안","리허설","발표·해결방안 정리"],"tips":["역할: 정부/주민/관광객/환경단체/기업/PD(내성적 학생)","역할 갈등은 이유 설명 <script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const BASE=JSON.parse($('#terms').textContent),MCQ0=JSON.parse($('#mcqs').textContent);
MCQ0.forEach((q,i)=>q.id='q'+i);
const GROUPS={'자연지리':['지형학','기후학','토양·식생·수문','지도학·GIS'],'인문지리':['인구지리','도시지리','경제지리','문화·역사·정치지리'],'지리교육론':['지리교육론'],'지역지리 및 기타':['지역지리']};
const GC={'자연지리':'#12b886','인문지리':'#7048e8','지리교육론':'#f59f00','지역지리 및 기타':'#1c7ed6'};
const grpOf=c=>Object.keys(GROUPS).find(g=>GROUPS[g].includes(c))||'지역지리 및 기타';
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let user=LS.get('gv_user',[]),marks=LS.get('gv_marks',{}),srs=LS.get('gv_srs',{}),hist=LS.get('gv_hist',{}),acc=LS.get('gv_acc',{}),wrong=LS.get('gv_wrong',{}),wrongq=LS.get('gv_wrongq',{}),mocks=LS.get('gv_mocks',[]);
let S=Object.assign({newPerDay:15,goal:40,fs:17,haptic:true,tts:false,rate:1,examDate:'',last:'review'},LS.get('gv_set',{}));
const saveAll=()=>{LS.set('gv_marks',marks);LS.set('gv_srs',srs);LS.set('gv_hist',hist);LS.set('gv_acc',acc);LS.set('gv_wrong',wrong);LS.set('gv_wrongq',wrongq);LS.set('gv_mocks',mocks);LS.set('gv_set',S);pushDueToSW()};
const save=saveAll;
function all(){const m=new Map();BASE.concat(user).forEach(t=>m.set(t.term.replace(/\s/g,''),t));return [...m.values()]}
let T=all(),TM=new Map(T.map(t=>[t.term,t]));
let deck=LS.get('gv_deck','core');if(typeof deck!=='string')deck='core';
let cat='전체',sub='전체',mode='home',idx=0,order=null,listView=false;
// ---- time: study day rolls over at 4am local
const DAY=864e5;const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4-4*36e5)/DAY);
const dayStr=d=>{const x=new Date((d)*DAY+4*36e5+new Date().getTimezoneOffset()*6e4);return (x.getMonth()+1)+'/'+x.getDate()};
const H=()=>{const d=today();return hist[d]||(hist[d]={rev:0,nw:0,c:0,n:0,t:0})};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const exTag=t=>(t.exam&&t.exam.length)?'기출 '+t.exam.slice(0,3).join(', ')+(t.exam.length>3?' 외':''):'';
const inDeck=t=>deck=='all'||t.core;
const mk=t=>marks[t.term]=='ok'?'✅ 외웠어요':marks[t.term]=='bad'?'🤔 헷갈려요':'';
const buzz=(p=12)=>{if(S.haptic&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
let toastT;function toast(msg,act,fn,ms=2600){const el=$('#toast');el.innerHTML=esc(msg)+(act?` <button>${esc(act)}</button>`:'');el.classList.remove('hide');if(act)el.querySelector('button').onclick=()=>{el.classList.add('hide');fn()};clearTimeout(toastT);toastT=setTimeout(()=>el.classList.add('hide'),ms)}
// ---- accuracy tracking
function record(term,ok,src){const a=acc[term]||(acc[term]={c:0,n:0,s:0});a.n++;if(ok){a.c++;a.s++}else a.s=0;const h=H();h.n++;if(ok)h.c++;
 if(!ok){const w=wrong[term]||(wrong[term]={n:0});w.n++;w.at=Date.now();w.src=src;w.ok=0}else if(wrong[term]){wrong[term].ok=(wrong[term].ok||0)+1;if(wrong[term].ok>=2){delete wrong[term];toast('오답노트에서 졸업했어요 🎓 '+term)}}}
// ---- SRS (SM-2 variant with 4 grades)
const NOW=()=>Date.now();
function sched(c,g){c=Object.assign({e:2.5,i:0,r:0,l:0},c||{});const n={...c};
 if(g==1){n.l++;n.r=0;n.e=Math.max(1.3,c.e-.2);n.i=0;n.due=NOW()+10*6e4}
 else{ if(c.r==0&&c.i==0){n.i=g==2?1:g==3?1:4}
  else if(c.i==0){n.i=g==2?1:g==3?2:4}
  else{n.i=g==2?Math.max(1,c.i*1.2):g==3?c.i*c.e:c.i*c.e*1.3}
  if(g==2)n.e=Math.max(1.3,c.e-.15);if(g==4)n.e=c.e+.15;
  n.i=Math.min(365,Math.round(n.i*10)/10);n.r=c.r+1;n.due=(today()+Math.max(1,Math.round(n.i)))*DAY+4*36e5+new Date().getTimezoneOffset()*6e4}
 n.last=NOW();return n}
const ivlTxt=c=>{if(!c.i)return '10분';const d=Math.max(1,Math.round(c.i));return d<30?d+'일':d<365?Math.round(d/30)+'개월':'1년'};
const isDue=t=>{const c=srs[t.term];return c&&c.due<=NOW()+ (today()+1)*0 ? c.due<=endOfToday():false};
function endOfToday(){return (today()+1)*DAY+4*36e5+new Date().getTimezoneOffset()*6e4}
const stage=t=>{const c=srs[t.term];if(!c)return 'new';if(!c.i||c.i<1)return 'learn';return c.i>=21?'mature':'young'};
function scopeAll(){return T.filter(t=>inDeck(t)&&(cat=='전체'||grpOf(t.cat)==cat)&&(sub=='전체'||t.cat==sub))}
function dueList(scope){return (scope||T.filter(inDeck)).filter(t=>srs[t.term]&&srs[t.term].due<endOfToday()).sort((a,b)=>srs[a.term].due-srs[b.term].due)}
function newLeft(){return Math.max(0,S.newPerDay-(H().nw||0))}
function newList(scope){const s=(scope||T.filter(inDeck)).filter(t=>!srs[t.term]);
 // exam-tested & 헷갈려요 first, then original order
 return s.sort((a,b)=>((marks[b.term]=='bad')-(marks[a.term]=='bad'))||((b.exam&&b.exam.length?1:0)-(a.exam&&a.exam.length?1:0)))}
function streak(){let d=today(),n=0;if(!(hist[d]&&hist[d].n+hist[d].rev>0))d--;while(hist[d]&&(hist[d].n+hist[d].rev)>0){n++;d--}return n}

async function toCode(obj){const txt=JSON.stringify(obj);try{if(window.CompressionStream){const s=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(s).arrayBuffer());let b='';buf.forEach(x=>b+=String.fromCharCode(x));return 'GVZ1.'+btoa(b)}}catch(e){}return 'GVJ1.'+btoa(unescape(encodeURIComponent(txt)))}
async function fromCode(code){code=code.trim();if(code.startsWith('{'))return JSON.parse(code);const [h,b]=code.split('.');const bin=atob(b.replace(/\s/g,''));if(h=='GVZ1'){const u=Uint8Array.from(bin,c=>c.charCodeAt(0));const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(s).text())}return JSON.parse(decodeURIComponent(escape(bin)))}
